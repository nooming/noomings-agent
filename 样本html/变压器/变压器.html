<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工地 · 变压器台架</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family:var(--font-sans); background: #f5f7fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
    .card { max-width: 780px; width: 100%; background: white; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); padding: 24px 28px; }
    h1 { font-size: 1.6rem; font-weight: 600; margin-bottom: 4px; letter-spacing: -0.01em; }
    .sub { color: #4a5568; font-size: 0.95rem; margin-bottom: 20px; border-left: 3px solid #3182ce; padding-left: 12px; }
    .canvas-wrap { background: #eef2f6; border-radius: 16px; padding: 12px; margin-bottom: 20px; }
    canvas { display: block; width: 100%; height: auto; background: white; border-radius: 12px; box-shadow: inset 0 1px 4px rgba(0,0,0,0.04); }
    .control-grid { display: flex; flex-wrap: wrap; gap: 18px 24px; margin: 18px 0 12px; }
    .slider-group { flex: 1 1 160px; min-width: 130px; }
    .slider-group label { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 500; color: #1a202c; margin-bottom: 4px; }
    .slider-group input { width: 100%; accent-color: #2b6cb0; cursor: pointer; }
    .slider-group .value-badge { background: #edf2f7; padding: 0 8px; border-radius: 20px; font-size: 0.8rem; }
    .action-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin: 8px 0 16px; }
    button { background: #2b6cb0; border: none; color: white; font-weight: 500; padding: 8px 24px; border-radius: 40px; font-size: 0.95rem; cursor: pointer; transition: background 0.15s; box-shadow: 0 2px 6px rgba(43,108,176,0.2); }
    button:hover { background: #1a4f8b; }
    button:active { transform: scale(0.97); }
    .observe-box { background: #f0f4fe; border-radius: 14px; padding: 14px 18px; margin: 12px 0 8px; border-left: 4px solid #2b6cb0; }
    .observe-box .reading { font-size: 1.5rem; font-weight: 600; color: #1a202c; }
    .observe-box .reading small { font-weight: 400; font-size: 0.9rem; color: #4a5568; margin-left: 6px; }
    .feedback { min-height: 2.2rem; font-size: 0.9rem; padding: 6px 0; color: #2d3748; line-height: 1.45; max-width: 100%; overflow-wrap: anywhere; word-break: break-word; white-space: normal; }
    .feedback .pass { color: #276749; font-weight: 500; }
    .feedback .fail { color: #9b2c2c; display: block; overflow-wrap: anywhere; }
    #feedbackMsg { max-width: 100%; overflow-wrap: anywhere; word-break: break-word; }
    .irrelevant-zone { margin-top: 14px; padding-top: 12px; border-top: 1px dashed #cbd5e0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .irrelevant-zone span { font-size: 0.8rem; color: #718096; }
    #I1 { background: #a0aec0; box-shadow: none; font-size: 0.75rem; padding: 4px 14px; }
    #I1:hover { background: #718096; }
    .win-badge { background: #38a169; color: white; padding: 4px 16px; border-radius: 40px; font-weight: 500; display: inline-block; font-size: 0.85rem; }
    .mt-1 { margin-top: 6px; }
  
/* === essence-sidebar-shell (auto) === */
html, body { width:100%; height:100%; margin:0; padding:0 !important; overflow:hidden; }
body { display:block !important; align-items:stretch !important; justify-content:stretch !important; min-height:0 !important; }
#essence-app {
  display:flex; flex-direction:row; width:100%; height:100%; min-height:0;
  background:inherit;
}
#essence-stage {
  position:relative; flex:1; min-width:0; min-height:0;
  display:flex; flex-direction:column; background:#0f172a;
}
#essence-stage canvas {
  display:block; width:100% !important; height:100% !important; max-width:none !important;
  margin:0 !important; border-radius:0 !important; flex:1; min-height:0;
}
#essence-hud {
  position:absolute; top:10px; left:10px; right:10px; z-index:5; pointer-events:none;
  display:flex; flex-direction:column; gap:4px; max-width:min(420px, calc(100% - 20px));
}
#essence-hud .essence-title {
  pointer-events:none; padding:8px 12px; border-radius:12px;
  background:rgba(15,23,42,0.88); color:#e2e8f0; font-size:14px; font-weight:600;
  border:1px solid rgba(148,163,184,0.35);
}
#essence-hud .essence-sub {
  pointer-events:none; padding:6px 12px; border-radius:10px;
  background:rgba(15,23,42,0.75); color:#94a3b8; font-size:12px;
  border:1px solid rgba(148,163,184,0.25);
}
#essence-bench {
  width:clamp(280px, 28vw, 340px); flex-shrink:0; min-height:0;
  display:flex; flex-direction:column;
  background:#fff; border-left:1px solid #e2e8f0;
  color:#1a202c;
}
#essence-bench .essence-scroll {
  flex:1; overflow-y:auto; padding:14px 16px 8px; min-height:0;
  -webkit-overflow-scrolling:touch;
}
#essence-bench .essence-ft {
  padding:10px 16px 14px; border-top:1px solid #e2e8f0; flex-shrink:0;
  display:flex; flex-direction:column; gap:8px;
}
#essence-bench .slider-group input[type=range],
#essence-bench input[type=range] {
  width:100%; height:28px; margin:0;
}
@media (max-width:720px) {
  #essence-app { flex-direction:column; }
  #essence-stage { flex:1 1 0; min-height:48vh; }
  #essence-bench { width:100%; max-height:min(42vh,360px); border-left:none; border-top:1px solid #e2e8f0; }
}

#essence-stage .canvas-wrap,
#essence-stage .canvas-area,
#essence-stage > div:not(#essence-hud):not(#dual-mode-hud) {
  flex:1; min-height:0; width:100%; height:100%;
  margin:0 !important; padding:0 !important; border-radius:0 !important;
  background:transparent !important; display:flex; align-items:stretch;
}

/* dual-mode HUD 不得吃到舞台 flex 拉伸规则 */
#essence-stage > #dual-mode-hud {
  position:absolute !important; top:10px !important; left:10px !important; right:10px !important;
  width:auto !important; height:auto !important; max-width:none !important;
  flex:none !important; margin:0 !important; padding:0 !important;
  background:transparent !important; align-items:flex-start !important;
  justify-content:flex-start !important; z-index:9; pointer-events:none !important;
}
#essence-stage > #dual-mode-hud .dual-chip,
#essence-stage > #dual-mode-hud #challengeStats {
  height:auto !important; align-self:flex-start !important; flex:none !important;
  pointer-events:auto !important;
}
#essence-bench .essence-scroll > .app,
#essence-bench .essence-scroll > .card,
#essence-bench .essence-scroll > .container,
#essence-bench .essence-scroll > .game {
  display:contents;
}

/* hide original card chrome when wrapped */
.essence-legacy-hide-outer > .app,
.essence-legacy-hide-outer > .card,
.essence-legacy-hide-outer > .container,
.essence-legacy-hide-outer > .game,
.essence-legacy-hide-outer > #app { display:contents; }


/* === dual-mode-shell (auto) === */
#dual-mode-hud {
  position:absolute; top:10px; left:10px; right:10px; z-index:8;
  display:flex; justify-content:space-between; align-items:flex-start;
  gap:8px; pointer-events:none;
}
#dual-mode-hud .dual-chip {
  pointer-events:auto; display:inline-flex; align-items:center; gap:10px;
  padding:8px 14px; border-radius:999px;
  background:rgba(255,255,255,0.92); border:1px solid rgba(148,163,184,0.45);
  box-shadow:0 4px 12px rgba(15,23,42,0.12); color:#1e293b; font-size:13px;
}
#dual-mode-hud #modeLabel { font-weight:700; color:#2563eb; }
#dual-mode-hud #timerDisplay { font-family:var(--font-mono); font-weight:600; color:#334155; }
#challengeStats {
  pointer-events:auto; display:none; align-items:center; gap:8px;
  padding:8px 14px; border-radius:999px;
  background:rgba(255,255,255,0.92); border:1px solid rgba(248,113,113,0.45);
  box-shadow:0 4px 12px rgba(15,23,42,0.12); color:#1e293b; font-size:13px;
}
#challengeStats.is-visible { display:inline-flex; }
#attemptsDisplay { font-weight:700; color:#dc2626; font-size:16px; }
#essence-bench-hd, .dual-bench-hd {
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:12px 16px; border-bottom:1px solid #e2e8f0; background:#fff; flex-shrink:0;
}
#essence-bench-hd h1, .dual-bench-hd h1 {
  margin:0; font-size:15px; font-weight:700; color:#1e293b; line-height:1.3;
}
#modeSelect {
  border:1px solid #93c5fd; border-radius:999px; padding:4px 10px;
  font-size:12px; font-weight:600; color:#1d4ed8; background:#eff6ff; cursor:pointer;
}
#essence-bench.dual-mode-ready { display:flex; flex-direction:column; }
button.dual-disabled, .dual-disabled { opacity:0.45; pointer-events:none; cursor:not-allowed; }


/* === craft-gold-shell === */
:root{--font-sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;--font-mono:ui-monospace,"Cascadia Code",Consolas,monospace;--font-display:var(--font-sans);--font-formula:"Cambria Math","Times New Roman",serif;--craft-accent:#c4783a;--craft-bg:#14110e;--craft-panel:#241c16;--craft-text:#efe6d8;--craft-muted:#9a8a78;}
html,body{width:100%!important;height:100%!important;margin:0!important;padding:0!important;overflow:hidden!important;
  font-family:var(--font-sans)!important;background:var(--craft-bg)!important;color:var(--craft-text)!important;}
#essence-app,#app{background:var(--craft-bg)!important;}
#essence-stage,#stage{background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.04),transparent 55%),var(--craft-bg)!important;}
#essence-bench,.control-panel,#controls-area,#bench{background:linear-gradient(180deg,color-mix(in srgb,var(--craft-panel) 92%,#fff),var(--craft-panel))!important;border-left:1px solid color-mix(in srgb,var(--craft-accent) 35%,transparent)!important;color:var(--craft-text)!important;}
#essence-bench-hd,.dual-bench-hd,.bench-hd,.ctrl-hd{background:rgba(0,0,0,.25)!important;border-bottom:1px solid color-mix(in srgb,var(--craft-accent) 30%,transparent)!important;}
#essence-bench-hd h1,.bench-hd-title,.ctrl-hd{color:var(--craft-accent)!important;}
#essence-bench .essence-scroll,#essence-bench .essence-ft,.bench-scroll,.ctrl-scroll,.ctrl-ft{background:transparent!important;color:var(--craft-text)!important;}
#essence-bench label,.slider-group label,.slabel{color:var(--craft-muted)!important;}
#essence-bench .btn,button.btn,.pixel-btn,#btnLaunch{background:var(--craft-accent)!important;border:none!important;color:#0b1020!important;font-weight:700!important;border-radius:12px!important;}
#craft-intro,#craft-win{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.72);backdrop-filter:blur(8px);
}
#craft-intro[hidden],#craft-win[hidden]{display:none!important;}
.craft-card{
  width:min(440px,92vw);background:var(--craft-panel);border:1px solid color-mix(in srgb,var(--craft-accent) 45%,transparent);
  border-radius:18px;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.craft-card h2{margin:0 0 10px;font-size:1.25rem;color:var(--craft-accent);letter-spacing:1px;}
.craft-card p{margin:0 0 12px;line-height:1.65;color:var(--craft-text);font-size:.95rem;}
.craft-card .formula{font-family:var(--font-formula);font-size:1.05rem;color:#fff;background:rgba(0,0,0,.28);
  border-left:3px solid var(--craft-accent);padding:10px 12px;border-radius:8px;margin:10px 0 16px;}
.craft-card button{width:100%;padding:12px;border:none;border-radius:12px;background:var(--craft-accent);color:#0b1020;font-weight:700;cursor:pointer;font-size:1rem;}
#craft-gauge{display:none!important;}
#craft-gauge strong{color:var(--craft-accent);font-family:var(--font-mono);font-size:16px;display:block;margin-top:2px;}
#craft-cv{font-size:12px;color:var(--craft-muted);border:1px dashed color-mix(in srgb,var(--craft-accent) 35%,transparent);
  border-radius:10px;padding:8px 10px;margin:8px 0;}
.app,.card,.container{background:transparent!important;box-shadow:none!important;color:inherit!important;}
.sub,.hint{color:var(--craft-text)!important;border-left-color:var(--craft-accent)!important;}
/* HUD 避让 + observe 浅底残留 */
#essence-stage > #dual-mode-hud,#dual-mode-hud{
  right:auto!important;width:auto!important;max-width:min(420px,calc(100% - 24px))!important;
  justify-content:flex-start!important;
}
#essence-hud{top:10px!important;right:12px!important;left:auto!important;max-width:min(240px,calc(100% - 24px))!important;align-items:flex-end!important;}
#essence-hud .essence-title{color:var(--craft-text)!important;}
#essence-hud .essence-sub{color:var(--craft-muted)!important;}
#essence-bench .observe-box,.observe-box{
  background:rgba(0,0,0,.32)!important;border-color:color-mix(in srgb,var(--craft-accent) 40%,transparent)!important;
  color:var(--craft-text)!important;
}
#essence-bench .observe-box .val,.observe-box .val,.observe-box .reading,.observe-item strong,.observe-box .reading small{
  color:var(--craft-accent)!important;
}
#essence-bench .observe-box,.observe-box,#observePanel{color:var(--craft-text)!important;}


/* === craft-sidebar-contrast === */
.sub,.hint{color:var(--craft-text)!important;border-left-color:var(--craft-accent)!important;}
#essence-bench .hint,
#essence-bench .hint-msg,
#essence-bench .hint-area,
#essence-bench #hintMessage,
#essence-bench #hintMsg,
#essence-bench #observeText,
#essence-bench #feedbackArea,
#essence-bench .hint-bar,
#essence-bench #hintBar,
#proj-side .hint,
#controls-area .hint-msg,
#bench .hint,
#bench .hint-msg{
  background:rgba(0,0,0,.35)!important;
  border:1px solid color-mix(in srgb,var(--craft-accent) 50%,transparent)!important;
  color:var(--craft-text)!important;
}
#essence-bench .confound-note,
#controls-area .confound-note,
#bench .confound-note{
  background:rgba(0,0,0,.28)!important;
  border:1px solid color-mix(in srgb,var(--craft-accent) 40%,transparent)!important;
  color:var(--craft-text)!important;
}
#essence-bench .hint-msg.win-msg,
#essence-bench .hint.win-msg{
  background:rgba(34,197,94,.22)!important;color:#bbf7d0!important;
  border-color:rgba(34,197,94,.45)!important;
}
#essence-bench .hint-msg.fail-msg,
#essence-bench .hint.fail-msg{
  background:rgba(248,113,113,.22)!important;color:#fecaca!important;
  border-color:rgba(248,113,113,.45)!important;
}
#sideGoal,p#sideGoal,#essence-bench #sideGoal,#proj-side #sideGoal{
  color:var(--craft-text)!important;
}
#essence-bench .footer,
#essence-bench .footer span,
#essence-bench .text-sm,
#essence-bench .observe-unit,
#essence-bench .unit,
#essence-bench .note{
  color:var(--craft-muted)!important;
}


/* === craft-scene-tokens (transformer-turns) === */
:root{
  --craft-accent:#c4783a;--craft-bg:#14110e;--craft-panel:#241c16;
  --craft-text:#efe6d8;--craft-muted:#9a8a78;
  --scene-ink:#14110e;--scene-mid:#3a2e22;--scene-hi:#e8b070;
  --scene-glow:#e09040;--scene-metal:#6a7068;--scene-ok:#7dba8c;
}
#essence-app,#app{background:var(--scene-ink)!important;}
#essence-stage,#stage{
  background:
    radial-gradient(ellipse at 18% 12%,color-mix(in srgb,var(--scene-glow) 18%,transparent),transparent 42%),
    radial-gradient(ellipse at 78% 8%,rgba(255,255,255,.04),transparent 38%),
    linear-gradient(180deg,color-mix(in srgb,var(--scene-mid) 55%,var(--scene-ink)),var(--scene-ink))!important;
}
#essence-bench,.control-panel,#controls-area,#bench{
  background:linear-gradient(180deg,color-mix(in srgb,var(--scene-mid) 85%,#fff),var(--craft-panel) 45%,color-mix(in srgb,var(--scene-ink) 70%,var(--craft-panel)))!important;
  border-left:1px solid color-mix(in srgb,var(--craft-accent) 45%,transparent)!important;
  box-shadow:-8px 0 28px rgba(0,0,0,.35)!important;
  color:var(--craft-text)!important;
}
#essence-bench-hd,.dual-bench-hd,.bench-hd,.ctrl-hd{
  background:rgba(0,0,0,.28)!important;
  border-bottom:1px solid color-mix(in srgb,var(--craft-accent) 35%,transparent)!important;
}
#essence-bench-hd h1,.bench-hd-title,.ctrl-hd,.essence-title{color:var(--scene-hi)!important;}
#essence-hud .essence-title{
  background:rgba(0,0,0,.55)!important;border:1px solid color-mix(in srgb,var(--craft-accent) 40%,transparent)!important;
  color:var(--scene-hi)!important;letter-spacing:2px;
}
#essence-hud .essence-sub{
  background:rgba(0,0,0,.42)!important;border:1px solid color-mix(in srgb,var(--craft-accent) 22%,transparent)!important;
  color:var(--craft-muted)!important;
}
#essence-bench label,.slider-group label,.slabel{color:var(--craft-muted)!important;}
#essence-bench .value-tag,.slider-value,.sval{color:var(--scene-hi)!important;}
#essence-bench input[type=range],.slider-group input[type=range],input[type=range]{
  accent-color:var(--craft-accent);
}
#essence-bench input[type=range]::-webkit-slider-runnable-track,
.slider-group input[type=range]::-webkit-slider-runnable-track{
  height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--scene-ink),var(--scene-mid));
  box-shadow:inset 0 1px 2px rgba(0,0,0,.65);
}
#essence-bench input[type=range]::-webkit-slider-thumb,
.slider-group input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--scene-hi),var(--craft-accent) 55%,color-mix(in srgb,var(--craft-accent) 50%,#000));
  border:1px solid color-mix(in srgb,var(--craft-accent) 40%,#000);
  box-shadow:0 2px 5px rgba(0,0,0,.55);
}
#essence-bench .btn,button.btn,.pixel-btn,#btnLaunch,#btn-test,#btn-fire,#btnFire{
  background:linear-gradient(180deg,var(--scene-hi),var(--craft-accent) 60%,color-mix(in srgb,var(--craft-accent) 70%,#000))!important;
  border:1px solid color-mix(in srgb,var(--craft-accent) 50%,#000)!important;
  color:#1a1208!important;font-weight:700!important;border-radius:6px!important;
  box-shadow:0 3px 10px color-mix(in srgb,var(--craft-accent) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.35)!important;
}
.craft-card{
  background:linear-gradient(170deg,var(--scene-mid),var(--craft-panel))!important;
  border:1px solid color-mix(in srgb,var(--craft-accent) 50%,transparent)!important;
  border-radius:8px!important;
  box-shadow:0 24px 70px rgba(0,0,0,.5),inset 0 1px 0 color-mix(in srgb,var(--scene-hi) 25%,transparent)!important;
}
.craft-card h2{color:var(--scene-hi)!important;letter-spacing:3px;}
.craft-card .formula{border-left-color:var(--craft-accent)!important;}
.craft-card button{
  background:linear-gradient(180deg,var(--scene-hi),var(--craft-accent) 60%,color-mix(in srgb,var(--craft-accent) 70%,#000))!important;
  color:#1a1208!important;border-radius:6px!important;
}
#essence-bench .observe-box,.observe-box{
  background:rgba(0,0,0,.38)!important;
  border:1px solid color-mix(in srgb,var(--craft-accent) 40%,transparent)!important;
  border-left:3px solid var(--craft-accent)!important;
  border-radius:6px!important;
}
#essence-bench .observe-box .val,.observe-box .val{color:var(--scene-hi)!important;}
#dual-mode-hud .dual-chip,#challengeStats{
  background:rgba(0,0,0,.55)!important;
  border:1px solid color-mix(in srgb,var(--craft-accent) 40%,transparent)!important;
  color:var(--craft-text)!important;border-radius:8px!important;
}
#dual-mode-hud #modeLabel{color:var(--scene-hi)!important;}
#modeSelect{
  background:rgba(0,0,0,.45)!important;border:1px solid color-mix(in srgb,var(--craft-accent) 45%,transparent)!important;
  color:var(--scene-hi)!important;border-radius:6px!important;
}
/* === craft-hud-safezone: TL dual / TR essence / playfield y≥120 === */
#essence-stage > #dual-mode-hud,
#stage > #dual-mode-hud,
#dual-mode-hud{
  position:absolute!important;
  top:10px!important;
  left:10px!important;
  right:auto!important;
  width:auto!important;
  max-width:min(360px,calc(100% - 24px))!important;
  justify-content:flex-start!important;
  align-items:flex-start!important;
  z-index:12!important;
}
#essence-hud{
  position:absolute!important;
  top:10px!important;
  right:12px!important;
  left:auto!important;
  max-width:min(240px,calc(100% - 24px))!important;
  z-index:11!important;
  align-items:flex-end!important;
}

/* === craft-bench-unify === */
/* HUD: TL dual-mode only · TR essence / legacy gauge */
#essence-stage > #dual-mode-hud,
#stage > #dual-mode-hud,
#dual-mode-hud{
  position:absolute!important;
  top:10px!important;
  left:10px!important;
  right:auto!important;
  width:auto!important;
  max-width:min(360px,calc(100% - 24px))!important;
  justify-content:flex-start!important;
  align-items:flex-start!important;
  flex-wrap:wrap!important;
  z-index:12!important;
  pointer-events:none!important;
}
#dual-mode-hud .dual-chip,
#dual-mode-hud #challengeStats,
#challengeStats{pointer-events:auto!important;}
#essence-hud{
  position:absolute!important;
  top:10px!important;

<script>
(function(){
  function emit(type, payload) {
    try {
      if (window.PlatformTraceAdapter) {
        window.PlatformTraceAdapter.record(type, payload || {});
        return;
      }
    } catch (e) {}
    try {
      if (window.parent && window.parent !== window && window.parent.PlatformTraceAdapter) {
        window.parent.PlatformTraceAdapter.record(type, payload || {});
      }
    } catch (e) {}
  }

  function snapControls() {
    var o = {};
    document.querySelectorAll('input[type="range"], input[type="number"]').forEach(function(el) {
      var id = el.id || el.name; if (id) o[id] = el.value;
    });
    return o;
  }

  document.addEventListener('DOMContentLoaded', function() {
    // puzzle_open
    emit('puzzle_open', {});

    // 所有滑条 tuning (统一绑定)
    document.querySelectorAll('input[type="range"]').forEach(function(el) {
      el.addEventListener('change', function() {
        if (window.__platformTraceControlsBound) return;
        emit('tuning', { control: el.id, value: el.value });
      });
    });

    // 无关控件 I1 点击 → irrelevant_touch
    var i1 = document.getElementById('I1');
    if (i1) {
      i1.addEventListener('click', function() {
        emit('irrelevant_touch', { control: 'I1' });
      });
    }
  });
})();
</script>
<script>
// ---------- 物理模拟 & UI 更新 (共用同一函数) ----------
(function() {
  const canvas = document.getElementById('transformerCanvas');
  const ctx = canvas.getContext('2d');

  // DOM 元素
  const sN1 = document.getElementById('s-n1');
  const sN2 = document.getElementById('s-n2');
  const sU1 = document.getElementById('s-U1');
  const sTw = document.getElementById('s-winding-temp');
  const valN1 = document.getElementById('val-n1');
  const valN2 = document.getElementById('val-n2');
  const valU1 = document.getElementById('val-U1');
  const valTw = document.getElementById('val-Tw');
  const observeU2 = document.getElementById('observeU2');
  const feedback = document.getElementById('feedbackMsg');
  const winIndicator = document.getElementById('winIndicator');
  const btnTest = document.getElementById('btn-test');

  // 辅助更新显示值
  function updateLabels() {
    valN1.textContent = sN1.value;
    valN2.textContent = sN2.value;
    valU1.textContent = parseFloat(sU1.value).toFixed(1);
    if (valTw && sTw) valTw.textContent = parseFloat(sTw.value).toFixed(0);
  }

  // 核心物理公式：U2 = U1 * n2 / n1   (共用)
  function computeU2(n1, n2, U1) {
    if (n1 === 0) return 0; // 防除零
    return U1 * n2 / n1;
  }

  const wrap = canvas.parentElement;
  let W = 600, H = 360, dpr = 1, spark = 0, lastFrameTs = 0;
  /** 事件动画 FSM：idle | windup | peak | settle；点击时冻结 drivers */
  let eventAnim = null;
  let U2_LO = 8.0, U2_HI = 12.0;
  let playMode = 'explore';
  let lockedBand = null;
  let challengeWon = false;
  const targetU2Display = document.getElementById('targetU2Display');

  const MODE_GOALS = {
    explore: {
      hud: '调匝比与 U₁，观察 U₂',
      side: '调原副匝数和 U₁，看 U₂ 怎么变。'
    },
    challenge: {
      hud: '限次把 U₂ 打进本局电压带（打偏不换带）',
      side: '限次把 U₂ 打进本局电压带（打偏不换带）。'
    }
  };
  function syncTargetUI() {
    if (targetU2Display) targetU2Display.textContent = U2_LO.toFixed(1) + '–' + U2_HI.toFixed(1) + ' V';
    const g = MODE_GOALS[playMode] || MODE_GOALS.explore;
    const mission = document.getElementById('goalMission');
    const side = document.getElementById('sideGoal');
    if (playMode === 'challenge' && lockedBand) {
      if (mission) mission.textContent = '急单电压带：' + U2_LO.toFixed(1) + '–' + U2_HI.toFixed(1) + ' V · 本局固定';
      if (side) side.textContent = '竞赛急单：限次把 U₂ 调进 ' + U2_LO.toFixed(1) + '–' + U2_HI.toFixed(1) + ' V（本局固定，打偏不换带）。';
    } else {
      if (mission) mission.textContent = g.hud;
      if (side) side.textContent = g.side;
    }
  }
  /** FixedChallenge：仅进入竞赛时锁定一次电压带（带宽明显窄于探究 8–12） */
  function lockChallengeBand() {
    const mid = 6 + Math.random() * 8; // 6–14
    const half = 0.55 + Math.random() * 0.45; // 带宽约 1.1–2.0，窄于探究 4.0
    U2_LO = Math.round((mid - half) * 10) / 10;
    U2_HI = Math.round((mid + half) * 10) / 10;
    lockedBand = { lo: U2_LO, hi: U2_HI };
    challengeWon = false;
    sN1.value = '800';
    sN2.value = '200';
    sU1.value = '5';
    syncTargetUI();
    updateAll();
    feedback.textContent = '急单已锁定电压带（本局不变）';
  }
  function applyExploreBand() {
    lockedBand = null;
    U2_LO = 8.0; U2_HI = 12.0;
    challengeWon = false;
    sN1.value = '500';
    sN2.value = '500';
    sU1.value = '5';
    syncTargetUI();
    updateAll();
    feedback.textContent = '调匝比与输入，读 U₂';
  }
  window.__xfmrApplyMode = function(mode) {
    playMode = mode === 'challenge' ? 'challenge' : 'explore';
    if (playMode === 'challenge') lockChallengeBand();
    else applyExploreBand();
  };
  document.addEventListener('dual-mode-change', function(ev) {
    var m = ev && ev.detail && ev.detail.mode;
    if (typeof window.__xfmrApplyMode === 'function') window.__xfmrApplyMode(m);
  });
  /* BATCH5-FIXED-20260724 FixedChallenge */
  function classifyBand(U2) {
    if (!isFinite(U2)) return null;
    if (U2 < U2_LO) return 'low';
    if (U2 > U2_HI) return 'high';
    return 'ok';
  }
  function buildDrivers(n1, n2, U1, U2) {
    const ratio = n1 > 0 ? n2 / n1 : 1;
    return {
      n1: n1, n2: n2, U1: U1, U2: U2, ratio: ratio,
      band: classifyBand(U2),
      surgeAmp: Math.min(1, Math.abs(U2) / 12)
    };
  }
  function mapU2ToDur(absU2) {
    const u = Math.max(0.1, Math.min(20, Math.abs(absU2) || 0.1));
    return 0.5 + (u / 20) * 0.8;
  }
  function stepEventAnim(dt) {
    if (!eventAnim) return;
    eventAnim.t += dt;
    const d = eventAnim.drivers;
    const windupDur = d.windupDur;
    const peakDur = 0.12;
    const settleDur = Math.max(0.18, d.totalDur - windupDur - peakDur);
    if (eventAnim.phase === 'windup') {
      if (eventAnim.t >= windupDur) { eventAnim.phase = 'peak'; eventAnim.t = 0; }
    } else if (eventAnim.phase === 'peak') {
      if (eventAnim.t >= peakDur) { eventAnim.phase = 'settle'; eventAnim.t = 0; }
    } else if (eventAnim.phase === 'settle') {
      if (eventAnim.t >= settleDur) eventAnim = null;
    }
  }
  function getEventSurge() {
    if (!eventAnim) return 0;
    const d = eventAnim.drivers;
    const t = eventAnim.t;
    if (eventAnim.phase === 'windup') {
      return Math.min(1, t / Math.max(0.05, d.windupDur)) * d.surgeAmp;
    }
    if (eventAnim.phase === 'peak') return d.surgeAmp;
    return d.surgeAmp * Math.exp(-t * 3);
  }
  function getBandFlash() {
    if (!eventAnim) return 0;
    const t = eventAnim.t;
    if (eventAnim.phase === 'peak') return 1 - t / 0.12;
    if (eventAnim.phase === 'settle') return Math.max(0, 0.45 - t * 0.55);
    return 0;
  }
  function resizeCanvas() {
    const rect = wrap.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    W = Math.max(320, rect.width);
    H = Math.max(240, rect.height);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function drawTransformer(n1, n2, U1, U2shown, U2live) {
    ctx.clearRect(0, 0, W, H);
    const INK = '#14110e', MID = '#3a2e22', HI = '#e8b070', GLOW = '#e09040';
    const METAL = '#6a7068', PANEL = '#241c16', ACCENT = '#c4783a', OK = '#7dba8c';
    const frozen = eventAnim ? eventAnim.drivers : null;
    const n1d = frozen ? frozen.n1 : n1;
    const n2d = frozen ? frozen.n2 : n2;
    const U1d = frozen ? frozen.U1 : U1;
    const ratio = frozen ? frozen.ratio : (n1d > 0 ? n2d / n1d : 1);
    const preview = !isFinite(U2shown) && isFinite(U2live);
    const U2 = frozen ? frozen.U2 : (isFinite(U2shown) ? U2shown : (isFinite(U2live) ? U2live : NaN));
    const band = frozen ? frozen.band : classifyBand(U2);
    const surge = getEventSurge();
    const bandFlash = getBandFlash();
    const previewScale = preview ? 0.72 : 1;
    const loadLevel = isFinite(U2) ? Math.min(1, Math.max(0, Math.abs(U2) / 12)) * previewScale : 0;
    const midBand = (U2_LO + U2_HI) / 2;
    const halfBand = Math.max(0.5, (U2_HI - U2_LO) / 2);
    const bandProx = isFinite(U2) ? Math.max(0, 1 - Math.abs(U2 - midBand) / (halfBand * 2.5)) * previewScale : 0;
    let wireR, wireG, wireB;
    if (band === 'ok') {
      wireR = 125; wireG = 186; wireB = 140;
    } else if (band === 'low') {
      wireR = 255; wireG = 110; wireB = 55;
    } else if (band === 'high') {
      wireR = 240; wireG = 85; wireB = 45;
    } else {
      const faultHot = isFinite(U2) && !preview && bandProx < 0.25 && U2 > midBand + halfBand;
      wireR = bandProx > 0.45 ? 125 : (faultHot ? 240 : 224);
      wireG = bandProx > 0.45 ? 186 : (faultHot ? 90 : 144);
      wireB = bandProx > 0.45 ? 140 : (faultHot ? 50 : 64);
    }
    if (bandFlash > 0) {
      if (band === 'ok') {
        wireR = Math.round(wireR + (125 - wireR) * bandFlash * 0.55);
        wireG = Math.round(wireG + (210 - wireG) * bandFlash * 0.55);
        wireB = Math.round(wireB + (150 - wireB) * bandFlash * 0.55);
      } else {
        wireR = Math.round(wireR + (255 - wireR) * bandFlash * 0.65);
        wireG = Math.round(wireG + (130 - wireG) * bandFlash * 0.5);
        wireB = Math.round(wireB + (60 - wireB) * bandFlash * 0.4);
      }
    }
    const topLampA = 0.12 + loadLevel * 0.28 + bandProx * 0.08 + surge * 0.22 + bandFlash * 0.12;
    const topLampR = band === 'ok' ? 125 : (band === 'low' ? 255 : (band === 'high' ? 240 : (bandProx > 0.45 ? 125 : 224)));
    const topLampG = band === 'ok' ? 186 : (band === 'low' ? 120 : (band === 'high' ? 90 : (bandProx > 0.45 ? 186 : 144)));
    const topLampB = band === 'ok' ? 140 : (band === 'low' ? 60 : (band === 'high' ? 50 : (bandProx > 0.45 ? 140 : 64)));

    // 车间墙面 + 顶光
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#1a1510');
    bg.addColorStop(0.45, MID);
    bg.addColorStop(1, INK);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // FAR: 天花板线槽 + 侧墙货架剪影 + 工厂窗格（y≥118 避 HUD）
    ctx.strokeStyle = 'rgba(40,36,32,0.55)';
    ctx.lineWidth = 3;
    for (let p = 0; p < 3; p++) {
      const py = 10 + p * 11;
      ctx.beginPath();
      ctx.moveTo(W * 0.22, py);
      ctx.lineTo(W * 0.92, py);
      ctx.stroke();
      for (let d = 0; d < 4; d++) {
        const dx = W * 0.3 + d * W * 0.17;
        ctx.beginPath();
        ctx.moveTo(dx, py);
        ctx.lineTo(dx, py + 7 + p * 2);
        ctx.stroke();
      }
    }
    ctx.fillStyle = 'rgba(18,14,10,0.72)';
    ctx.fillRect(6, 118, 58, 78);
    ctx.fillRect(W - 64, 118, 58, 78);
    ctx.strokeStyle = 'rgba(106,112,104,0.32)';
    ctx.lineWidth = 1;
    for (let r = 0; r < 4; r++) {
      ctx.fillRect(12, 128 + r * 16, 46, 5);
      ctx.fillRect(W - 58, 128 + r * 16, 46, 5);
    }
    ctx.strokeStyle = 'rgba(196,120,58,0.11)';
    for (let wx = W * 0.34; wx < W * 0.66; wx += 22) {
      for (let wy = 120; wy < 168; wy += 18) {
        ctx.strokeRect(wx, wy, 16, 12);
      }
    }

    const lamp = ctx.createRadialGradient(W * 0.5, H * 0.06, 10, W * 0.5, H * 0.12, W * 0.7);
    lamp.addColorStop(0, 'rgba(' + topLampR + ',' + topLampG + ',' + topLampB + ',' + topLampA + ')');
    lamp.addColorStop(1, 'rgba(' + topLampR + ',' + topLampG + ',' + topLampB + ',0)');
    ctx.fillStyle = lamp;
    ctx.fillRect(0, 0, W, H);

    // 顶吊灯排（吃上空，避开 TL HUD；亮度随 U₂）
    for (let L = 0; L < 4; L++) {
      const lx = W * 0.28 + L * W * 0.16;
      ctx.strokeStyle = 'rgba(106,112,104,0.55)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(lx, 8);
      ctx.lineTo(lx, 42);
      ctx.stroke();
      const bulbBright = 0.35 + loadLevel * 0.65;
      ctx.fillStyle = L % 2
        ? 'rgba(196,120,58,' + bulbBright + ')'
        : 'rgba(232,176,112,' + bulbBright + ')';
      ctx.beginPath();
      ctx.moveTo(lx - 12, 42);
      ctx.lineTo(lx + 12, 42);
      ctx.lineTo(lx + 7, 56);
      ctx.lineTo(lx - 7, 56);
      ctx.closePath();
      ctx.fill();
    }

    // 挂板 / 侧柜（y≥120）
    ctx.fillStyle = '#2a2218';
    ctx.fillRect(14, 128, 72, 110);
    ctx.strokeStyle = 'rgba(196,120,58,0.4)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(14, 128, 72, 110);
    ctx.fillStyle = HI;
    ctx.font = 'bold 10px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
    ctx.fillText('匝比卡', 28, 146);
    ctx.fillStyle = METAL;
    for (let i = 0; i < 4; i++) ctx.fillRect(24, 158 + i * 18, 52, 6);
    // 右侧工具柜
    ctx.fillStyle = '#221a12';
    ctx.fillRect(W - 78, 128, 64, 96);
    ctx.strokeStyle = 'rgba(196,120,58,0.3)';
    ctx.strokeRect(W - 78, 128, 64, 96);
    ctx.fillStyle = ACCENT;
    ctx.fillRect(W - 66, 148, 40, 8);
    ctx.fillRect(W - 66, 168, 40, 8);
    ctx.fillRect(W - 66, 188, 28, 8);

    // 木台架（纵深）
    const benchY = H - 52;
    ctx.fillStyle = '#1a1208';
    ctx.fillRect(0, benchY + 6, W, 52);
    ctx.fillStyle = '#2e2014';
    ctx.fillRect(0, benchY, W, 52);
    ctx.fillStyle = '#4a3524';
    ctx.fillRect(0, benchY, W, 12);
    for (let gx = 0; gx < W; gx += 28) {
      ctx.strokeStyle = 'rgba(0,0,0,0.12)';
      ctx.beginPath();
      ctx.moveTo(gx, benchY + 12);
      ctx.lineTo(gx + 14, H);
      ctx.stroke();
    }
    ctx.fillStyle = '#3a2a1c';
    ctx.fillRect(W * 0.08, benchY + 12, 12, H - benchY - 12);
    ctx.fillRect(W * 0.88, benchY + 12, 12, H - benchY - 12);

    // 铁芯英雄尺寸：~45–55%H / ~40%W
    const coreW = Math.min(W * 0.42, Math.max(180, W * 0.38));
    const coreH = Math.min(H * 0.52, Math.max(160, H * 0.48));
    const cx = W * 0.48;
    const cy = Math.max(148 + coreH * 0.42, benchY - coreH * 0.55);
    const legW = coreW * 0.26, barH = coreH * 0.16;

    function drawLaminations(x, y, w, h) {
      const n = Math.max(8, Math.floor(h / 3.5));
      for (let i = 0; i < n; i++) {
        ctx.strokeStyle = i % 2 ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.moveTo(x, y + (i + 0.5) * (h / n));
        ctx.lineTo(x + w, y + (i + 0.5) * (h / n));
        ctx.stroke();
      }
    }
    function fillCoreBlock(x, y, w, h) {
      const g = ctx.createLinearGradient(x, y, x + w, y + h);
      g.addColorStop(0, '#8a9088');
      g.addColorStop(0.5, METAL);
      g.addColorStop(1, '#3a4038');
      ctx.fillStyle = g;
      ctx.fillRect(x, y, w, h);
      drawLaminations(x, y, w, h);
      ctx.strokeStyle = '#2a3028';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x, y, w, h);
    }
    const cLeft = cx - coreW / 2, cTop = cy - coreH / 2;
    fillCoreBlock(cLeft, cTop, coreW, barH);
    fillCoreBlock(cLeft, cy + coreH / 2 - barH, coreW, barH);
    fillCoreBlock(cx - legW / 2, cTop + barH, legW, coreH - barH * 2);
    // 两侧柱脚加厚（更像 E 芯）
    fillCoreBlock(cLeft, cTop + barH, legW * 0.55, coreH - barH * 2);
    fillCoreBlock(cLeft + coreW - legW * 0.55, cTop + barH, legW * 0.55, coreH - barH * 2);
    ctx.fillStyle = 'rgba(224,144,64,0.1)';
    ctx.fillRect(cLeft + 2, cTop + 2, coreW - 4, barH - 3);

    // 左：交流电源箱
    const srcX = 18, srcY = cy - 48, srcW = 78, srcH = 96;
    ctx.fillStyle = '#1e1812';
    ctx.fillRect(srcX, srcY, srcW, srcH);
    ctx.strokeStyle = ACCENT;
    ctx.lineWidth = 2;
    ctx.strokeRect(srcX, srcY, srcW, srcH);
    ctx.fillStyle = PANEL;
    ctx.fillRect(srcX + 8, srcY + 10, srcW - 16, 28);
    ctx.fillStyle = GLOW;
    ctx.font = 'bold 11px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
    ctx.fillText('AC 源', srcX + 18, srcY + 28);
    ctx.fillStyle = HI;
    ctx.font = '10px ui-monospace,monospace';
    ctx.fillText(U1d.toFixed(1) + 'V', srcX + 16, srcY + 52);
    ctx.fillStyle = '#c04040';
    ctx.beginPath(); ctx.arc(srcX + 22, srcY + 72, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3040c0';
    ctx.beginPath(); ctx.arc(srcX + 52, srcY + 72, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#efe6d8';
    ctx.font = '9px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
    ctx.fillText('+', srcX + 18, srcY + 76);
    ctx.fillText('−', srcX + 48, srcY + 76);

    // 右：负载灯/电阻
    const loadX = W - 96, loadY = cy - 40, loadW = 72, loadH = 88;
    ctx.fillStyle = '#1e1812';
    ctx.fillRect(loadX, loadY, loadW, loadH);
    ctx.strokeStyle = HI;
    ctx.lineWidth = 2;
    ctx.strokeRect(loadX, loadY, loadW, loadH);
    const bulbOn = isFinite(U2) && U2 > 1;
    const bulbCore = 0.45 + loadLevel * 0.55;
    const bulbHalo = 0.08 + loadLevel * 0.35 + bandProx * 0.12;
    const bulbG = ctx.createRadialGradient(loadX + 36, loadY + 36, 2, loadX + 36, loadY + 36, 28 + loadLevel * 12);
    bulbG.addColorStop(0, bulbOn ? 'rgba(255,200,80,' + bulbCore + ')' : 'rgba(120,100,80,0.35)');
    bulbG.addColorStop(1, bulbOn ? 'rgba(' + topLampR + ',' + topLampG + ',' + topLampB + ',' + bulbHalo + ')' : 'rgba(40,30,20,0)');
    ctx.fillStyle = bulbG;
    ctx.beginPath(); ctx.arc(loadX + 36, loadY + 36, 22, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = bulbOn ? GLOW : METAL;
    ctx.lineWidth = 2;
    if (preview) ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.arc(loadX + 36, loadY + 36, 16, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = METAL;
    ctx.fillRect(loadX + 28, loadY + 54, 16, 18);
    ctx.fillStyle = HI;
    ctx.font = '10px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
    ctx.fillText('负载', loadX + 22, loadY + 82);

    // 铜绕组：每档匝数都改环数；螺距/线宽 ∝ n，并突出原/副相对密度
    const n1c = Math.max(100, Math.min(1000, n1d));
    const n2c = Math.max(100, Math.min(1000, n2d));
    const turns1 = 3 + Math.round((n1c - 100) / 100); // 100→3 … 1000→12
    const turns2 = 3 + Math.round((n2c - 100) / 100);
    const dens1 = n1c / 1000, dens2 = n2c / 1000;
    const coilRx1 = Math.min(34, coreW * 0.15 + dens1 * 10);
    const coilRx2 = Math.min(36, coreW * 0.15 + dens2 * 12);
    const coilRy1 = 5.2 + dens1 * 5.5;
    const coilRy2 = 5.2 + dens2 * 5.5;
    const coilSpan = coreH - barH * 2 - 10;
    // 相对密度：匝多一侧占满柱高，匝少一侧压缩螺距带（一眼辨升降压）
    const densMax = Math.max(dens1, dens2, 0.1);
    const span1 = coilSpan * (0.55 + 0.45 * (dens1 / densMax));
    const span2 = coilSpan * (0.55 + 0.45 * (dens2 / densMax));
    const off1 = (coilSpan - span1) * 0.5;
    const off2 = (coilSpan - span2) * 0.5;
    for (let i = 0; i < turns1; i++) {
      const t = turns1 > 1 ? i / (turns1 - 1) : 0.5;
      const yy = cTop + barH + 5 + off1 + t * span1;
      const g = ctx.createLinearGradient(cx - legW - coilRx1, yy, cx - legW + coilRx1, yy);
      g.addColorStop(0, '#8b5a2b');
      g.addColorStop(0.45, ACCENT);
      g.addColorStop(1, '#6a4020');
      ctx.strokeStyle = g;
      ctx.lineWidth = 2.2 + dens1 * 2.8;
      ctx.beginPath();
      ctx.ellipse(cx - legW * 0.9, yy, coilRx1, coilRy1, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    for (let i = 0; i < turns2; i++) {
      const t = turns2 > 1 ? i / (turns2 - 1) : 0.5;
      const yy = cTop + barH + 5 + off2 + t * span2;
      const g = ctx.createLinearGradient(cx + legW - coilRx2, yy, cx + legW + coilRx2, yy);
      g.addColorStop(0, '#a06830');
      g.addColorStop(0.45, HI);
      g.addColorStop(1, '#7a5028');
      ctx.strokeStyle = g;
      ctx.globalAlpha = 0.55 + loadLevel * 0.45;
      ctx.lineWidth = 2.2 + dens2 * 2.8 + loadLevel * 1.5;
      ctx.beginPath();
      ctx.ellipse(cx + legW * 0.9, yy, coilRx2, coilRy2, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = ACCENT;
    ctx.font = '12px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
    ctx.fillText('原边 n₁=' + n1d, cLeft - 4, cTop - 8);
    ctx.fillStyle = HI;
    ctx.fillText('副边 n₂=' + n2d, cx + legW * 0.2, cTop - 8);

    // 黄铜电压表（数值仅 measured；预览时虚线框 + 待测）
    const on = isFinite(U2shown) && U2shown >= U2_LO && U2shown <= U2_HI;
    const faultHot = isFinite(U2shown) && U2shown > U2_HI;
    const mx = W - 178, my = Math.max(118, cTop - 8), mw = 148, mh = 82;
    ctx.fillStyle = '#8a6830';
    ctx.fillRect(mx - 4, my - 4, mw + 8, mh + 8);
    ctx.fillStyle = '#c9a040';
    ctx.fillRect(mx - 2, my - 2, mw + 4, mh + 4);
    ctx.fillStyle = PANEL;
    ctx.fillRect(mx, my, mw, mh);
    let meterStroke = isFinite(U2shown) ? (on ? OK : (faultHot ? '#e86040' : GLOW)) : 'rgba(232,176,112,0.55)';
    if (bandFlash > 0) {
      meterStroke = band === 'ok'
        ? 'rgba(' + Math.round(125 + 80 * bandFlash) + ',' + Math.round(186 + 40 * bandFlash) + ',' + Math.round(140 + 30 * bandFlash) + ',1)'
        : 'rgba(' + Math.round(240 + 15 * bandFlash) + ',' + Math.round(90 + 40 * bandFlash) + ',' + Math.round(45 + 20 * bandFlash) + ',1)';
    }
    ctx.strokeStyle = meterStroke;
    ctx.lineWidth = 2;
    if (preview) ctx.setLineDash([5, 4]);
    ctx.strokeRect(mx, my, mw, mh);
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(224,144,64,0.12)';
    ctx.fillRect(mx + 6, my + 6, mw - 12, 22);
    ctx.fillStyle = HI;
    ctx.font = '10px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
    ctx.fillText('副边电压表', mx + 10, my + 20);
    ctx.fillStyle = isFinite(U2shown) ? (on ? OK : '#e8a060') : '#9a8a78';
    ctx.font = 'bold 18px ui-monospace,monospace';
    if (isFinite(U2shown)) {
      ctx.fillText(U2shown.toFixed(2) + ' V', mx + 10, my + 50);
      ctx.fillStyle = on ? '#a8d4b0' : '#e8b090';
      ctx.font = '12px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
      ctx.fillText(playMode === 'challenge' ? (on ? '急单区间内' : '偏离急单') : (on ? '参考带内' : '参考带外'), mx + 10, my + 70);
    } else {
      ctx.fillText('— V', mx + 10, my + 50);
      ctx.fillStyle = '#9a8a78';
      ctx.font = '12px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
      ctx.fillText(preview ? 'U₂ 待测 · 预览中' : 'U₂ 待测', mx + 10, my + 70);
    }

    // 连线：源→原边→铁芯→副边→表/负载
    const p1x = srcX + srcW, p1y = srcY + 72;
    const coilLx = cx - legW * 0.9 - coilRx1;
    const coilRxPos = cx + legW * 0.9 + coilRx2;
    ctx.strokeStyle = 'rgba(' + wireR + ',' + wireG + ',' + wireB + ',' + (0.4 + loadLevel * 0.35) + ')';
    ctx.lineWidth = 2.5;
    ctx.shadowColor = 'rgba(' + wireR + ',' + wireG + ',' + wireB + ',0.5)';
    ctx.shadowBlur = 2 + loadLevel * 6;
    ctx.beginPath();
    ctx.moveTo(p1x, p1y);
    ctx.lineTo(coilLx - 8, p1y);
    ctx.lineTo(coilLx - 8, cy);
    ctx.lineTo(coilLx, cy);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(coilRxPos, cy);
    ctx.lineTo(coilRxPos + 10, cy);
    ctx.lineTo(coilRxPos + 10, my + mh * 0.55);
    ctx.lineTo(mx, my + mh * 0.55);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(coilRxPos + 10, cy + 18);
    ctx.lineTo(loadX, loadY + 40);
    ctx.stroke();
    ctx.shadowBlur = 0;
    // 回线（底）
    ctx.strokeStyle = 'rgba(106,112,104,0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(srcX + 22, srcY + srcH);
    ctx.lineTo(srcX + 22, benchY - 8);
    ctx.lineTo(loadX + 36, benchY - 8);
    ctx.lineTo(loadX + 36, loadY + loadH);
    ctx.stroke();

    // 台铭牌
    ctx.fillStyle = 'rgba(36,28,22,0.9)';
    ctx.fillRect(18, benchY - 34, 140, 26);
    ctx.strokeStyle = 'rgba(196,120,58,0.5)';
    ctx.strokeRect(18, benchY - 34, 140, 26);
    ctx.fillStyle = '#efe6d8';
    ctx.font = '12px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
    ctx.fillText('变压器台架 · U₁ ' + U1d.toFixed(1) + ' V', 26, benchY - 16);

    // 电流流光（spark 仅由 rAF 推进；事件期 surge ∝ |U₂|/12）
    const priWeight = ratio < 1 ? 1.25 : 0.7;
    const secWeight = ratio > 1 ? 1.25 : 0.7;
    const flowBase = eventAnim ? (1.2 + surge * 3.5) : (0.32 + loadLevel * 0.28);
    const dotBoost = 1 + surge * (frozen ? frozen.surgeAmp : loadLevel) * 1.8;
    function flowDot(x0, y0, x1, y1, t, col, scale) {
      const x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t;
      const dotR = (2.2 + (0.5 + loadLevel) * 2.2) * (scale || 1) * dotBoost;
      ctx.fillStyle = col;
      ctx.shadowColor = col;
      ctx.shadowBlur = 4 + (0.5 + loadLevel + surge) * 8;
      ctx.beginPath();
      ctx.arc(x, y, dotR, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    const flowT = (spark * flowBase) % 1;
    flowDot(p1x, p1y, coilLx, cy, (flowT * priWeight) % 1, GLOW, priWeight);
    flowDot(coilLx, cy, coilRxPos, cy, (flowT * 0.5 + 0.33 * secWeight) % 1, HI, secWeight);
    flowDot(coilRxPos, cy, mx, my + mh * 0.55, (flowT * secWeight + 0.66) % 1, GLOW, secWeight);
    if (surge > 0.15 || loadLevel > 0.55) {
      const extra = eventAnim ? Math.round(1 + surge * 4) : (loadLevel > 0.7 ? 2 : 1);
      for (let i = 0; i < extra; i++) {
        const off = (i + 1) / (extra + 1);
        flowDot(coilRxPos, cy, loadX + 36, loadY + 40, (flowT * secWeight + off) % 1, HI, 0.75 + secWeight * 0.2);
      }
    }
    if (bandFlash > 0.2 && band !== 'ok') {
      ctx.fillStyle = 'rgba(255,120,60,' + (bandFlash * 0.08) + ')';
      ctx.fillRect(0, 0, W, H);
    } else if (bandFlash > 0.2 && band === 'ok') {
      ctx.fillStyle = 'rgba(125,186,140,' + (bandFlash * 0.07) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  /** 仅测试后揭示 U₂ */
  let measuredU2 = null;

  // 更新所有UI + canvas + 过关判定 (共用)
  function updateAll(emitSnapshot = false, isTest = false) {
    const n1 = parseInt(sN1.value, 10);
    const n2 = parseInt(sN2.value, 10);
    const U1 = parseFloat(sU1.value);
    const U2 = computeU2(n1, n2, U1);
    const U2rounded = Math.round(U2 * 100) / 100;

    if (isTest) measuredU2 = U2rounded;

    const inBand = U2rounded >= U2_LO && U2rounded <= U2_HI;
    let winOk = false;
    let hintKey = 'retry';

    if (!isTest) {
      if (winIndicator) winIndicator.style.display = 'none';
      feedback.textContent = measuredU2 != null
        ? ('上次 U₂=' + measuredU2.toFixed(2) + ' V · 改参后需再测')
        : (playMode === 'challenge'
          ? ('读数待测 · 急单 ' + U2_LO.toFixed(1) + '–' + U2_HI.toFixed(1) + ' V')
          : '读数待测 · 调匝比后点测试');
      hintKey = 'pending';
    } else if (playMode === 'explore') {
      if (winIndicator) winIndicator.style.display = 'none';
      feedback.textContent = '本次 U₂=' + U2rounded.toFixed(2) + ' V · 对照匝比与输入再看';
      hintKey = 'explore_observe';
    } else if (inBand) {
      winOk = true;
      hintKey = 'win';
      if (winIndicator) winIndicator.style.display = 'inline-block';
      feedback.textContent = '急单完成！U₂ 落入锁定区间 ' + U2_LO.toFixed(1) + '–' + U2_HI.toFixed(1) + ' V';
    } else {
      if (winIndicator) winIndicator.style.display = 'none';
      hintKey = U2rounded < U2_LO ? 'u2_low' : 'u2_high';
      feedback.innerHTML = U2rounded < U2_LO
        ? ('<strong>输出偏低</strong><br><span style="font-size:0.82em;opacity:.92">急单 ' + U2_LO.toFixed(1) + '–' + U2_HI.toFixed(1) + ' V</span>')
        : ('<strong>输出偏高</strong><br><span style="font-size:0.82em;opacity:.92">急单 ' + U2_LO.toFixed(1) + '–' + U2_HI.toFixed(1) + ' V</span>');
    }

    if (isTest) {
      const band = inBand ? 'ok' : (U2rounded < U2_LO ? 'low' : 'high');
      const totalDur = mapU2ToDur(Math.abs(U2rounded));
      const drivers = buildDrivers(n1, n2, U1, U2rounded);
      drivers.band = band;
      drivers.totalDur = totalDur;
      drivers.windupDur = totalDur * 0.55;
      eventAnim = { phase: 'windup', t: 0, bandFlash: 0, drivers: drivers };
    }

    // 更新读数
    observeU2.textContent = measuredU2 != null ? (measuredU2.toFixed(2) + ' V') : '—';
    updateLabels();

    if (!isTest) {
      drawTransformer(n1, n2, U1, measuredU2 != null ? measuredU2 : NaN, U2rounded);
    }

    // 如果是测试按钮触发，立即 snapshot / win（不延迟 emit）
    if (isTest) {
      const controlsSnapshot = {
        's-n1': n1,
        's-n2': n2,
        's-U1': U1
      };
      try {
        if (window.emit) {
          window.emit('snapshot', { controls: controlsSnapshot, winOk: winOk, hintKey: hintKey });
        } else {
          const evt = new CustomEvent('snapshot', { detail: { controls: controlsSnapshot, winOk, hintKey } });
          document.dispatchEvent(evt);
        }
      } catch (e) {}

      if (winOk) {
        try {
          if (window.emit) {
            window.emit('win', { winOk: true });
          } else {
            const evt = new CustomEvent('win', { detail: { winOk: true } });
            document.dispatchEvent(evt);
          }
        } catch (e) {}
        if (!challengeWon && typeof window.__craftShowWin === 'function') {
          challengeWon = true;
          window.__craftShowWin('急单电压带本局锁定。理想变压器近似满足 U₁/U₂ ≈ N₁/N₂。');
        }
      }
    }
  }

  // 绑定滑条事件（事件动画期间忽略，避免劫持冻结 drivers）
  sN1.addEventListener('input', function() {
    if (eventAnim) return;
    measuredU2 = null;
    updateAll(false, false);
  });
  sN2.addEventListener('input', function() {
    if (eventAnim) return;
    measuredU2 = null;
    updateAll(false, false);
  });
  sU1.addEventListener('input', function() {
    if (eventAnim) return;
    measuredU2 = null;
    updateAll(false, false);
  });
  if (sTw) sTw.addEventListener('input', function() {
    updateLabels();
  });

  // 测试按钮：立即 emit + 启动事件动画
  btnTest.addEventListener('click', function() {
    if (eventAnim) return;
    updateAll(true, true);
  });

  window.addEventListener('resize', function(){ resizeCanvas(); if (!eventAnim) updateAll(false,false); });
  if (typeof ResizeObserver !== 'undefined' && wrap) new ResizeObserver(function(){ resizeCanvas(); if (!eventAnim) updateAll(false,false); }).observe(wrap);
  resizeCanvas();
  updateAll(false, false);
  (function loop(ts) {
    const dt = lastFrameTs ? Math.min(0.05, (ts - lastFrameTs) / 1000) : 0.016;
    lastFrameTs = ts;
    stepEventAnim(dt);
    const surge = getEventSurge();
    if (eventAnim) {
      spark = (spark + 0.02 * (1.1 + surge * 4)) % 1;
    } else {
      const n1l = parseInt(sN1.value, 10), n2l = parseInt(sN2.value, 10), U1l = parseFloat(sU1.value);
      const u2a = Math.abs(computeU2(n1l, n2l, U1l));
      spark = (spark + 0.02 * (0.3 + Math.min(1, u2a / 12) * 0.45)) % 1;
    }
    const n1 = eventAnim ? eventAnim.drivers.n1 : parseInt(sN1.value, 10);
    const n2 = eventAnim ? eventAnim.drivers.n2 : parseInt(sN2.value, 10);
    const U1 = eventAnim ? eventAnim.drivers.U1 : parseFloat(sU1.value);
    const u2p = eventAnim ? eventAnim.drivers.U2 : Math.round(computeU2(n1, n2, U1) * 100) / 100;
    drawTransformer(n1, n2, U1, measuredU2 != null ? measuredU2 : NaN, u2p);
    requestAnimationFrame(loop);
  })(0);

  // 暴露 emit 给埋点脚本 (如果未定义)
  if (typeof window.emit === 'undefined') {
    window.emit = function(type, payload) {
      try {
        if (window.PlatformTraceAdapter) {
          window.PlatformTraceAdapter.record(type, payload || {});
          return;
        }
      } catch (e) {}
      try {
        if (window.parent && window.parent !== window && window.parent.PlatformTraceAdapter) {
          window.parent.PlatformTraceAdapter.record(type, payload || {});
        }
      } catch (e) {}
    };
  }

  // 额外：确保 snapshot 和 win 通过埋点 (适配)
  // 监听自定义事件 (备援)
  document.addEventListener('snapshot', function(e) {
    if (window.emit) window.emit('snapshot', e.detail);
  });
  document.addEventListener('win', function(e) {
    if (window.emit) window.emit('win', e.detail);
  });
})();
</script>
<script>
(function(){
  function emitWin(hintKey) {
    if (window.__legacyWinEmitted) return;
    window.__legacyWinEmitted = true;
    var emit = window.__emit;
    if (!emit) return;
    var controls = window.__snapControls ? window.__snapControls() : {};
    emit('snapshot', { controls: controls, winOk: true, hintKey: hintKey || 'legacy_win' });
    emit('win', { winOk: true });
  }
  var WIN_TEXT = [/完美命中/, /游戏胜利/, /过关！/, /命中目标！/, /🎯\s*命中目标/, /🏆\s*过关/];
  function scanWinText() {
    var text = document.body ? document.body.innerText : '';
    for (var i = 0; i < WIN_TEXT.length; i++) {
      if (WIN_TEXT[i].test(text)) {
        emitWin('text_' + i);
        return true;
      }
    }
    return false;
  }
  document.addEventListener('DOMContentLoaded', function() {
    var obs = new MutationObserver(function() { scanWinText(); });
    if (document.body) obs.observe(document.body, { subtree: true, childList: true, characterData: true });
    setInterval(scanWinText, 800);
  });
})();
</script>


<script>
(function(){
  if (window.__essenceStageResize) return;
  window.__essenceStageResize = true;
  function fit(){
    var stage = document.getElementById('essence-stage');
    var cvs = stage && stage.querySelector('canvas');
    if (!stage || !cvs) return;
    var w = stage.clientWidth, h = stage.clientHeight;
    if (w < 2 || h < 2) return;
    var dw = Number(cvs.getAttribute('width')) || cvs.width || 600;
    var dh = Number(cvs.getAttribute('height')) || cvs.height || 400;
    // keep design buffer; CSS scales visually
    if (!cvs._essenceDesign) cvs._essenceDesign = { dw: dw, dh: dh };
  }
  window.addEventListener('resize', fit);
  if (typeof ResizeObserver !== 'undefined') {
    var st = document.getElementById('essence-stage');
    if (st) new ResizeObserver(fit).observe(st);
  }
  fit();
})();
</script>

<script>
/* === dual-mode-shell runtime (auto) === */
(function(){
  if (window.__dualModeShell) return;
  window.__dualModeShell = true;

  var MAX_ATTEMPTS = 5;
  var EXPLORE_SECONDS = 10 * 60;
  var state = {
    mode: 'explore',
    attempts: MAX_ATTEMPTS,
    timeLeft: EXPLORE_SECONDS,
    timerId: null
  };

  function $(id){ return document.getElementById(id); }

  function setPhase(phase){
    try {
      if (typeof window.__platformTraceSetPhase === 'function') {
        window.__platformTraceSetPhase(phase);
      } else if (window.PlatformTraceAdapter && typeof window.PlatformTraceAdapter.setPhase === 'function') {
        window.PlatformTraceAdapter.setPhase(phase);
      }
    } catch (e) { /* offline */ }
  }

  function fmt(sec){
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function renderAttempts(){
    var el = $('attemptsDisplay');
    if (el) el.textContent = String(state.attempts);
  }

  function primaryButtons(){
    return Array.prototype.slice.call(document.querySelectorAll(
      '#essence-bench .essence-ft button, #essence-bench button.btn, #essence-bench button[id^="btn"]'
    ));
  }

  function gateActions(){
    var disable = state.mode === 'challenge' && state.attempts <= 0;
    primaryButtons().forEach(function(btn){
      if (/reset|清除|重置|再来/i.test(btn.textContent || '') || /reset|clear/i.test(btn.id || '')) return;
      btn.classList.toggle('dual-disabled', disable);
      if (disable) btn.setAttribute('disabled', 'disabled');
      else btn.removeAttribute('disabled');
    });
  }

  function stopTimer(){
    if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
  }

  function startExploreTimer(){
    stopTimer();
    state.timeLeft = EXPLORE_SECONDS;
    var td = $('timerDisplay');
    if (td) td.textContent = fmt(state.timeLeft);
    state.timerId = setInterval(function(){
      if (state.mode !== 'explore') return;
      state.timeLeft -= 1;
      if (td) td.textContent = fmt(Math.max(0, state.timeLeft));
      if (state.timeLeft <= 0) {
        stopTimer();
        var sel = $('modeSelect');
        if (sel) {
          sel.value = 'challenge';
          sel.dispatchEvent(new Event('change', { bubbles: true }));
        }
      }
    }, 1000);
  }

  function applyMode(mode){
    state.mode = mode === 'challenge' ? 'challenge' : 'explore';
    var label = $('modeLabel');
    var stats = $('challengeStats');
    var timerChip = $('dual-timer-chip');
    if (label) label.textContent = state.mode === 'explore' ? '探究模式' : '竞赛模式';
    if (stats) {
      if (state.mode === 'challenge') stats.classList.add('is-visible');
      else stats.classList.remove('is-visible');
    }
    if (timerChip) timerChip.style.display = state.mode === 'explore' ? 'inline-flex' : 'none';
    if (state.mode === 'challenge') {
      stopTimer();
      state.attempts = MAX_ATTEMPTS;
      renderAttempts();
    } else {
      startExploreTimer();
    }
    setPhase(state.mode);
    gateActions();
    try {
      if (typeof window.__xfmrApplyMode === 'function') window.__xfmrApplyMode(state.mode);
    } catch (e) {}
    document.dispatchEvent(new CustomEvent('dual-mode-change', { detail: { mode: state.mode, attempts: state.attempts } }));
  }

  function onPrimaryClick(e){
    if (state.mode !== 'challenge') return;
    var t = e.target.closest('button');
    if (!t) return;
    if (/reset|清除|重置|再来/i.test(t.textContent || '') || /reset|clear/i.test(t.id || '')) return;
    if (state.attempts <= 0) {
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    state.attempts -= 1;
    renderAttempts();
    gateActions();
  }

  function ensureUi(){
    var stage = $('essence-stage') || document.querySelector('#proj-stage, #stage, #canvasContainer, .canvas-wrap')?.parentElement;
    var bench = $('essence-bench');
    if (!stage) return false;

    if (!$('dual-mode-hud')) {
      var hud = document.createElement('div');
      hud.id = 'dual-mode-hud';
      hud.innerHTML =
        '<div id="dual-timer-chip" class="dual-chip">' +
          '<span id="modeLabel">探究模式</span><span style="width:1px;height:14px;background:#cbd5e1"></span>' +
          '<span id="timerDisplay">10:00</span>' +
        '</div>' +
        '<div id="challengeStats"><span>剩余机会</span><span id="attemptsDisplay">5</span></div>';
      stage.style.position = stage.style.position || 'relative';
      stage.appendChild(hud);
    }

    if (bench && !$('modeSelect')) {
      bench.classList.add('dual-mode-ready');
      var hd = document.createElement('div');
      hd.id = 'essence-bench-hd';
      hd.className = 'dual-bench-hd';
      var title = '环境控制台';
      var tEl = stage.querySelector('.essence-title, h1');
      if (tEl) title = (tEl.textContent || title).trim() || title;
      hd.innerHTML =
        '<h1>' + title.replace(/</g,'&lt;') + '</h1>' +
        '<select id="modeSelect" aria-label="探究阶段">' +
          '<option value="explore">自由探究</option>' +
          '<option value="challenge">竞赛挑战</option>' +
        '</select>';
      bench.insertBefore(hd, bench.firstChild);
    } else if (!$('modeSelect')) {
      // Fallback: floating select in hud
      var chip = $('dual-timer-chip');
      if (chip && !$('modeSelect')) {
        var sel = document.createElement('select');
        sel.id = 'modeSelect';
        sel.innerHTML = '<option value="explore">自由探究</option><option value="challenge">竞赛挑战</option>';
        chip.appendChild(sel);
      }
    }
    return !!$('modeSelect');
  }

  function boot(){
    if (!ensureUi()) return;
    var sel = $('modeSelect');
    sel.addEventListener('change', function(){ applyMode(sel.value); });
    var ft = document.querySelector('#essence-bench .essence-ft') || $('essence-bench') || document.body;
    ft.addEventListener('click', onPrimaryClick, true);
    applyMode(sel.value || 'explore');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>


<script>
/* === craft-gold-runtime === */
(function(){
  if (window.__craftGold) return; window.__craftGold = true;
  var intro = document.getElementById('craft-intro');
  var win = document.getElementById('craft-win');
  var btn = document.getElementById('craftIntroBtn');
  var wbtn = document.getElementById('craftWinBtn');
  if (btn) btn.addEventListener('click', function(){ if(intro) intro.hidden = true; });
  function replayLevel(){
    if (typeof window.__craftReplay === 'function') {
      try { window.__craftReplay(); return; } catch (e) {}
    }
    var rbtn = document.getElementById('btn-reset')
      || document.querySelector('#btnReset, button.btn-reset, [data-action="reset"]');
    if (rbtn) { try { rbtn.click(); } catch (e) {} }
  }
  if (wbtn) wbtn.addEventListener('click', function(){
    window.__craftWinDismissed = true;
    if (win) win.hidden = true;
    replayLevel();
  });

  // gauge into hud
  var hud = document.getElementById('essence-hud') || document.getElementById('dual-mode-hud') || document.getElementById('hud');
  if (hud && !document.getElementById('craft-gauge')) {
    var g = document.createElement('div');
    g.id = 'craft-gauge';
    g.innerHTML = '<span>目标仪表</span><strong id="craftGaugeVal">待测</strong>';
    hud.appendChild(g);
  }
function showWin(extra){
    if (win) {
      window.__craftWinDismissed = false;
      win.hidden = false;
      var t = document.getElementById('craftWinText');
      if (t && extra) t.textContent = extra;
    }
  }
  window.__craftShowWin = showWin;

  // Hook common win paths
  var _emit = window.__emit;
  window.__emit = function(type, payload){
    if (typeof _emit === 'function') _emit(type, payload);
    if (type === 'win') showWin();
  };
  // Observe win banners
  var obs = new MutationObserver(function(){
    if (window.__craftWinDismissed) return;
    var el = document.querySelector('.win-banner,.win-badge,#winBanner,[data-win="1"]');
    if (el && el.offsetParent !== null) showWin();
  });
  obs.observe(document.body, {childList:true, subtree:true, attributes:true, attributeFilter:['class','style','hidden']});

  // Live gauge from first range readout if possible
  function tick(){
    var val = document.querySelector('#essence-bench .value-badge, #essence-bench .value, .observe-box .state, .observe-value, #craftGaugeVal');
    var src = document.querySelector('.observe-box .state, .observe-value, #hud-dist, #g-T, .gauge .gval');
    var gval = document.getElementById('craftGaugeVal');
    if (gval && src && src !== gval) gval.textContent = (src.textContent || '').trim() || '观测中';
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
