<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热传导 · Agent A 预览</title>
<script src="../vendor/mermaid.min.js"></script>
<script>
  window.__D3_SRC__ = "../vendor/d3.v7.min.js";
  window.__MERMAID_SRC__ = "../vendor/mermaid.min.js";
  window.__MATHJAX_SRC__ = "../vendor/tex-mml-svg.js";
</script>
<style>
:root{--font-ui:'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;--font-formula:'Noto Serif SC','Songti SC','SimSun',serif;}
:root {
  --font-ui: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-formula: 'Cambria Math', 'Noto Serif SC', 'Times New Roman', serif;
  --bg-body: #f4f7fb;
  --bg-graph: #eef2f8;
  --bg-header: rgba(255,255,255,0.98);
  --bg-panel: #ffffff;
  --text-main: #1a3344;
  --text-muted: #3d6a7a;
  --text-hint: #5a7a8a;
  --accent: #007baa;
  --accent-dim: #3d6a7a;
  --dt-label: #1a3344;
  --dt-label-result: #0d6b4a;
  --dt-label-retry: #9a4a2a;
  --graph-link-dt: rgba(0,90,130,0.55);
  --graph-link-yes: rgba(30,130,80,0.65);
  --graph-link-no: rgba(180,70,50,0.65);
  --graph-node-stroke: #ffffff;
  --graph-dim-opacity: 0.22;
  --graph-link-dim-opacity: 0.12;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg-body);color:var(--text-main);font-family:var(--font-ui);height:100vh;overflow:hidden;display:flex;flex-direction:column;}
#header{background:var(--bg-header);border-bottom:1px solid var(--accent-dim);padding:12px 22px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
#header-left h1{font-family:'Noto Serif SC',STSong,serif;font-size:17px;color:var(--accent);letter-spacing:5px;font-weight:500;}
#header-left p{font-size:9px;color:var(--text-muted);letter-spacing:3px;margin-top:3px;}
#view-toggle{display:flex;gap:6px;align-items:center;}
.vtab{padding:6px 18px;font-size:11px;letter-spacing:3px;cursor:pointer;border:1px solid var(--accent-dim);border-radius:4px;color:var(--text-muted);background:transparent;font-family:inherit;transition:all 0.18s;}
.vtab:hover{border-color:var(--accent);color:var(--accent);}
.vtab.active{border-color:var(--accent);color:var(--accent);background:rgba(0,100,160,0.12);}
.vtab-primary{letter-spacing:2px;font-weight:600;}
.vtab-secondary{font-size:10px;letter-spacing:1px;padding:5px 12px;opacity:0.85;}
.view-struct-wrap{position:relative;}
.struct-menu{position:absolute;top:calc(100% + 4px);right:0;min-width:132px;padding:4px;background:var(--bg-panel);border:1px solid var(--accent-dim);border-radius:6px;box-shadow:0 8px 24px rgba(15,40,60,0.12);z-index:40;display:flex;flex-direction:column;gap:2px;}
.struct-menu.hidden{display:none;}
.struct-menu .struct-item{width:100%;text-align:left;letter-spacing:2px;border-radius:4px;}
#legend-items .priority-legend{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--accent-dim);}
#legend-items .prio-lr{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px;color:var(--text-muted);}
#legend-items .prio-line{height:0;flex:0 0 28px;border-top:3px solid #0f766e;}
#legend-items .prio-line.mid{border-top-width:2.5px;border-top-color:#0369a1;}
#legend-items .prio-line.low{border-top-width:2px;border-top-color:#64748b;}
#legend-items .prio-line.trap{border-top:2px dashed #dc2626;}
#legend-items .prio-line.confound{border-top:2px dashed #a16207;}
#legend-items .route-btn .route-score{float:right;opacity:0.75;font-variant-numeric:tabular-nums;}
#legend-items .route-btn.prio-1{border-left:3px solid #0f766e;}
#legend-items .route-btn.prio-2{border-left:3px solid #0369a1;}
#legend-items .route-btn.prio-3{border-left:3px solid #64748b;}
#strategy-mermaid svg path.prio-edge-high{stroke:#0f766e!important;stroke-width:4.2px!important;}
#strategy-mermaid svg path.prio-edge-mid{stroke:#0369a1!important;stroke-width:3px!important;}
#strategy-mermaid svg path.prio-edge-low{stroke:#64748b!important;stroke-width:2.2px!important;}
#strategy-mermaid svg path.prio-edge-trap{stroke:#dc2626!important;stroke-width:1.5px!important;stroke-dasharray:7 5;}
#strategy-mermaid svg path.prio-edge-confound{stroke:#a16207!important;stroke-width:1.3px!important;stroke-dasharray:7 5;}
#tabs{background:var(--bg-header);border-bottom:1px solid var(--accent-dim);display:flex;flex-wrap:wrap;gap:2px;padding:7px 16px;flex-shrink:0;}
.tab{padding:4px 12px;font-size:11px;letter-spacing:2px;cursor:pointer;border:1px solid var(--accent-dim);border-radius:3px;color:var(--text-muted);background:transparent;transition:all 0.16s;max-width:11em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tab:hover,.tab.active{border-color:var(--accent);color:var(--accent);}
.tab.active{background:rgba(0,100,160,0.12);}
#main{display:flex;flex:1;min-height:0;}
#graph{flex:1;position:relative;overflow:hidden;background:var(--bg-graph);}
#svg{width:100%;height:100%;display:block;}
#svg.hidden{display:none;}
#strategy-panel{position:absolute;inset:0;overflow:hidden;padding:0;background:var(--bg-graph);display:none;}
#strategy-panel.visible{display:block;}
#graph.strategy-active{overflow:hidden;}
#strategy-viewport{width:100%;height:100%;overflow:hidden;cursor:grab;touch-action:none;}
#strategy-viewport:active{cursor:grabbing;}
#strategy-mermaid{display:inline-block;width:auto;max-width:100%;min-width:0;min-height:0;padding:0;background:transparent;border:none;border-radius:0;box-shadow:none;will-change:transform;}
#strategy-mermaid svg{width:auto;max-width:none;height:auto;display:block;}
#strategy-mermaid svg .strategy-dim{opacity:0.22;}
#strategy-mermaid svg .strategy-hl{opacity:1!important;}
#strategy-mermaid svg .strategy-hl rect,#strategy-mermaid svg .strategy-hl polygon,#strategy-mermaid svg .strategy-hl circle{stroke-width:3px!important;}
#strategy-mermaid svg .labelBkg rect,
#strategy-mermaid svg .edgeLabel rect.labelBkg{fill:var(--bg-graph)!important;}
#strategy-mermaid span.edgeLabel,
#strategy-mermaid .edgeLabel span{background:var(--bg-graph)!important;}
#strategy-mermaid .edgeLabel foreignObject,
#strategy-mermaid .edgeLabel foreignObject>div{background:var(--bg-graph)!important;}
#strategy-mermaid svg path.strategy-hl{stroke:var(--accent)!important;stroke-width:2.5px!important;opacity:1!important;}
#strategy-mermaid svg path.strategy-dim{opacity:0.12;}
#strategy-mermaid svg g.edgeLabel.strategy-hl{opacity:1!important;}
#strategy-mermaid svg g.edgeLabel.strategy-dim{opacity:0.22;}
#legend-items .route-btn.active{border-color:var(--accent);color:var(--accent);}
#legend-items .route-btn.warn.active{border-color:#dc2626;color:#991b1b;}
.gctrl .gbtn.graph-only{display:inline-block;}
.gctrl.strategy-mode .gbtn.graph-only{display:none;}
#strategy-empty,.strategy-loading{font-size:13px;color:var(--text-hint);text-align:center;margin-top:40px;}

.gctrl.hidden{display:none;}

#info .route-kg-btn:hover{background:rgba(0,100,160,0.15);}

#info .route-teach-sec p:last-child{margin-bottom:0;}

#info .route-badge-trap{background:#dc2626;}

#info .route-teach-kg summary::-webkit-details-marker{display:none;}

#info .route-kg-list{margin:8px 0 0;padding-left:1.1em;font-size:11px;line-height:1.7;color:var(--text-muted);font-family:var(--font-ui);}

#legend-items .route-btn.hidden,#legend-items .route-btn-extra.hidden{display:none;}
#legend-items .route-more-btn{display:block;width:100%;margin-top:4px;padding:4px 8px;font-size:10px;cursor:pointer;border:1px dashed var(--accent-dim);border-radius:4px;color:var(--text-muted);background:transparent;font-family:inherit;}
#legend-items .route-more-btn:hover{border-color:var(--accent);color:var(--accent);}
.gctrl{position:absolute;bottom:14px;left:14px;display:flex;gap:7px;flex-wrap:wrap;}
.gbtn{background:var(--bg-panel);border:1px solid var(--accent-dim);border-radius:4px;padding:5px 13px;font-size:11px;letter-spacing:2px;color:var(--text-muted);cursor:pointer;font-family:inherit;}
.gbtn:hover{color:var(--accent);border-color:var(--accent);}
#panel{width:310px;background:var(--bg-panel);border-left:1px solid var(--accent-dim);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
#panel-hd{padding:16px 18px 12px;border-bottom:1px solid var(--accent-dim);flex-shrink:0;}
#panel-hd h2{font-size:13px;color:var(--accent);letter-spacing:3px;}

#legend{padding:10px 18px;border-bottom:1px solid var(--accent-dim);flex-shrink:0;}
#legend .ltitle{font-size:9px;letter-spacing:3px;color:var(--text-muted);margin-bottom:7px;}
#legend-title.hidden{display:none;}
.legend-section+.legend-section{margin-top:10px;padding-top:8px;border-top:1px solid var(--accent-dim);}
.legend-section:first-child{border-top:none;padding-top:0;}
.legend-subsection{margin-top:7px;}
.legend-subsection:first-child{margin-top:0;}

.legend-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;}
.legend-grid .lr{margin-bottom:0;font-size:10px;gap:5px;}
.legend-grid .ld,.legend-grid .ll{flex-shrink:0;width:12px;}
.legend-grid .ld.dashed,.legend-grid .ld.hollow{width:11px;height:11px;}

.legend-hint.hidden{display:none;}
.node.teach-node circle{stroke-dasharray:4,3;}
.node.irrelevant-node circle{fill:#f4f4f4;stroke:#888888;stroke-width:2.5px;stroke-dasharray:3,2;}
.i-badge.layer-play{background:#0d9488;}
.i-badge.layer-teach{background:#556677;}
.i-badges{margin-bottom:9px;display:flex;flex-wrap:wrap;gap:5px;}
#info{flex:1;overflow-y:auto;padding:14px 18px;}
.info-empty{font-size:12px;color:var(--text-hint);line-height:2.2;text-align:center;margin-top:22px;font-family:var(--font-ui);}
.i-title{font-size:14px;color:var(--text-main);margin-bottom:8px;}
.i-badge{display:inline-block;font-size:10px;padding:2px 9px;border-radius:10px;color:#fff;margin-bottom:9px;}

.i-rel-lbl{font-size:9px;letter-spacing:2px;color:var(--text-muted);margin:10px 0 4px;}

.node circle,.node path.diamond-shape{cursor:pointer;stroke:var(--graph-node-stroke);stroke-width:2px;}

.link{fill:none;stroke-opacity:0.52;stroke-width:1.8px;}
.link.premise{stroke:#6688aa;}.link.method{stroke:#3388dd;}.link.core{stroke:#8855cc;}.link.result{stroke:#33aa66;}.link.verify{stroke:#dd66aa;stroke-dasharray:6,4;}

body{height:100vh;overflow:hidden;font-family:var(--font-ui);}

<body>
<div id="header">
  <div id="header-left">
    <h1>热传导</h1>
    <p>AGENT A · 探究策略图（优先级可视）</p>
  </div>
  <div id="view-toggle" class="view-toggle-strategy-first">
    <div class="vtab active vtab-primary" id="vt-strategy">探究策略图</div>
    <div class="view-struct-wrap">
      <button type="button" class="vtab vtab-secondary" id="btn-struct-toggle" aria-expanded="false">结构数据 ▾</button>
      <div id="struct-menu" class="struct-menu hidden" role="menu">
        <div class="vtab struct-item" id="vt-dt" role="menuitem">决策树</div>
        <div class="vtab struct-item" id="vt-kg" role="menuitem">事理图谱</div>
      </div>
    </div>
  </div>
</div>
<div id="tabs"></div>
<div id="main">
  <div id="graph">
    <svg id="svg" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="strategy-panel"><div id="strategy-viewport"><div id="strategy-mermaid"></div></div></div>
    <div class="gctrl" id="gctrl">
      <button class="gbtn" id="btn-zoom">重置视图</button>
      <button class="gbtn graph-only" id="btn-hl">清除高亮</button>
    </div>
  </div>
  <div id="panel">
    <div id="panel-hd">
      <h2 id="p-title">—</h2>
      <div class="psub" id="p-sub">点击节点查看细节</div>
    </div>
    <div id="legend">
      <div class="ltitle" id="legend-title">调节优先级</div>
      <div id="legend-items"></div>
      <div id="kg-filter" class="hidden">
        <button type="button" class="fbtn active" data-kg-filter="all">全部</button>
        <button type="button" class="fbtn" data-kg-filter="play">仅游玩</button>
        <button type="button" class="fbtn" data-kg-filter="teach">仅教案</button>
      </div>
      <div id="legend-hint" class="legend-hint hidden">实心 = 游玩子图 · 实心+虚线描边 = 教案子图 · 空心 = 无关变量</div>
    </div>
    <div id="info"><div class="i-desc" style="text-align:center;margin-top:20px">← 点击节点查看细节</div></div>
  </div>
</div>
<script>
/**
 * Shared Mermaid classDef for strategy panorama (appended at end of diagram by viewer.js).
 * Palette aligned with teacher reference flowchart (start/cond/core/invalid/success).
 */
const STRATEGY_MERMAID_CLASS_DEFS = [
  'classDef stratStart fill:#e2e8f0,stroke:#475569,stroke-width:2px',
  'classDef stratCond fill:#eff6ff,stroke:#1d4ed8,stroke-width:2px',
  'classDef stratToggle fill:#eff6ff,stroke:#1d4ed8,stroke-width:2px',
  'classDef stratCore fill:#fff7ed,stroke:#ea580c,stroke-width:2px',
  'classDef stratAction fill:#fff7ed,stroke:#ea580c,stroke-width:2px',
  'classDef stratTeach fill:#fff7ed,stroke:#ea580c,stroke-width:2px',
  'classDef stratOp fill:#fff7ed,stroke:#ea580c,stroke-width:2px',
  'classDef stratSuccess fill:#f0fdf4,stroke:#16a34a,stroke-width:2px,font-weight:bold',
  'classDef stratResult fill:#f0fdf4,stroke:#16a34a,stroke-width:2px,font-weight:bold',
  'classDef stratEnd fill:#f0fdf4,stroke:#16a34a,stroke-width:2px,font-weight:bold',
  'classDef stratRetry fill:#fff7ed,stroke:#ea580c,stroke-width:2px',
  'classDef stratTrap fill:#fef2f2,stroke:#dc2626,stroke-width:2px,color:#991b1b',
  'classDef stratInvalid fill:#fef2f2,stroke:#dc2626,stroke-width:2px,color:#991b1b',
].join('\n');

if (typeof window !== 'undefined') window.STRATEGY_MERMAID_CLASS_DEFS = STRATEGY_MERMAID_CLASS_DEFS;
else if (typeof globalThis !== 'undefined') globalThis.STRATEGY_MERMAID_CLASS_DEFS = STRATEGY_MERMAID_CLASS_DEFS;

/**
 * Shared Mermaid strategy edge parser (browser + Node validate).
 * Avoids HTML-breaking arrow sequences in regex when inlined in graph.html script.
 */
(function (root) {
  const ARROW_SOLID = '--' + '>';
  const MERMAID_EDGE_SPLIT = new RegExp('(-\\.->|' + ARROW_SOLID + ')');

  function extractMermaidNodeId(seg) {
    const s = seg.trim().replace(/:::strat\w+/g, '');
    const m = s.match(/\b([A-Za-z][A-Za-z0-9_]*)\s*(?:$|\(|\[|\{|")/) || s.match(/^([A-Za-z][A-Za-z0-9_]*)/);
    return m ? m[1] : null;
  }

  function parseTargetSeg(seg) {
    let s = seg.trim().replace(/:::strat\w+/g, '');
    let label = null;
    const lm = s.match(/^\|([^|]*)\|([\s\S]*)$/);
    if (lm) {
      label = lm[1];
      s = lm[2].trim();
    }
    return { id: extractMermaidNodeId(s), label };
  }

  /** Mermaid dash-label edges: rewrite to pipe form for shared arrow splitter. */
  function normalizeDashLabelEdges(line) {
    return String(line).replace(
      /(\b[A-Za-z][A-Za-z0-9_]*)\s+--\s+([^-\n]+?)\s+-->/g,
      (_, from, label) => `${from} -->|${String(label).trim()}|`
    );
  }

  function parseStrategyMermaidEdges(body) {
    const edges = [];
    const lines = (body || '').replace(/\r\n/g, '\n').split('\n');

    for (const raw of lines) {
      const line = normalizeDashLabelEdges(raw.trim());
      if (!line || /^graph\s|^flowchart\s|^classDef\s|^class\s/i.test(line)) continue;
      const parts = line.split(MERMAID_EDGE_SPLIT);
      if (parts.length < 3) continue;
      let from = extractMermaidNodeId(parts[0]);
      for (let i = 1; i < parts.length; i += 2) {
        const arrow = parts[i];
        if (arrow !== ARROW_SOLID && arrow !== '-.->') continue;
        const { id: to, label } = parseTargetSeg(parts[i + 1] || '');
        if (from && to) {
          edges.push({
            from,
            to,
            dotted: arrow === '-.->',
            label,
            key: `${from}->${to}`,
          });
        }
        from = to;
      }
    }
    return edges;
  }

  function addEdgeKey(keys, from, to) {
    if (from && to) keys.add(`${from}->${to}`);
  }

  function shortestPathEdgeKeys(from, to, edges) {
    if (!from || !to || from === to) return [];
    const adj = new Map();
    edges.forEach(e => {
      if (!adj.has(e.from)) adj.set(e.from, []);
      adj.get(e.from).push({ to: e.to, key: e.key });
    });
    const q = [{ id: from, path: [] }];
    const seen = new Set([from]);
    while (q.length) {
      const { id, path } = q.shift();

    let m;
    while ((m = re.exec(body)) !== null) {
      if (!labels.has(m[1])) labels.set(m[1], m[2] || m[3] || m[4] || '');
    }
    return labels;
  }

  const ADJUST_ID_RE = /^Adjust\w*\d*$/i;
  const ADJUST_PARAM_RE = /^(Decrease|Increase|FineTune|Retune|Calibrate|Analyze)\w*\d*$/i;
  const ADJUST_TEXT_RE = /t|�|�c|e|�'|�|<�|�|Ol|�/i;

  function isAdjustLikeNodeId(id, nodeLabels) {
    const s = String(id || '');
    if (ADJUST_ID_RE.test(s) || ADJUST_PARAM_RE.test(s)) return true;
    if (/^ReAim|^LockAim|^Lock\d*$/i.test(s)) return true;
    const label = nodeLabels instanceof Map ? (nodeLabels.get(s) || '') : '';
    return ADJUST_TEXT_RE.test(`${s}${label}`);
  }

  function extractRetestNodeIds(mermaidBody, edges) {
    const ids = new Set(extractStratRetryNodeIds(mermaidBody));
    for (const e of edges || []) {
      if (/^Continue\d*$/i.test(e.from)) ids.add(e.from);
      if (/^Continue\d*$/i.test(e.to)) ids.add(e.to);
    }
    const body = String(mermaidBody || '');
    const continueRe = /\b(Continue\d*)\(\[|\b(Continue\d*)\[|\b(Continue\d*)\{/gi;
    let m;
    while ((m = continueRe.exec(body)) !== null) {
      ids.add(m[1] || m[2] || m[3]);
    }
    return ids;
  }

  function followAdjustToRetestOp(adjustId, observeSuffix, nodeSet, keySet, edges, nodeLabels, depth = 0) {
    if (depth > 3) return;
    for (const e of edges) {
      if (e.from !== adjustId) continue;
      if (isRetestOperationId(e.to) && retestOpSuffixMatches(`Observe${observeSuffix}`, e.to)) {
        nodeSet.add(e.to);
        keySet.add(e.key);
        continue;
      }
      const chainOk = isAdjustLikeNodeId(e.to, nodeLabels)
        || /^ReAim|^LockAim|^Lock\d*$/i.test(String(e.to));
      if (chainOk && !/^Judge|^CheckGoal|^Observe/i.test(String(e.to))) {
        if (!nodeSet.has(e.to)) {
          nodeSet.add(e.to);
          keySet.add(e.key);
          followAdjustToRetestOp(e.to, observeSuffix, nodeSet, keySet, edges, nodeLabels, depth + 1);
        }
      }
    }
  }

  /** When route spine includes Observe/CheckGoal, light feedback adjust + continue loops. */
  function appendRouteObserveAdjustFireLoop(nodeSet, keySet, edges, mermaidBody, route) {
    if (route?.warn === 'irrelevant') return;
    const resultIds = extractStratResultNodeIds(mermaidBody);
    const retestIds = extractRetestNodeIds(mermaidBody, edges);
    const nodeLabels = extractStrategyNodeLabels(mermaidBody);

    const observeOnRoute = [...nodeSet].filter(id => /^Observe[A-Za-z]*\d*$/i.test(id));
    for (const obsId of observeOnRoute) {
      const obsSuffix = nodeBranchSuffix(obsId, /^Observe([A-Za-z]*\d*)$/i);
      if (obsSuffix === null) continue;
      for (const e of edges) {
        if (e.from !== obsId) continue;
        if (isSuccessBranchEdge(e, resultIds)) continue;
        if (resultIds.has(e.to)) continue;
        if (/^(CheckGoal|Judge|Observe)[A-Za-z]*\d*$/i.test(e.to)) continue;
        const feedbackTarget = isAdjustLikeNodeId(e.to, nodeLabels)
          || /^Continue\d*$/i.test(e.to)
          || /^Retry[A-Za-z]*\d*$/i.test(e.to)
          || /^ReAim|^LockAim|^Lock\d*$/i.test(String(e.to));
        if (!feedbackTarget) continue;
        nodeSet.add(e.to);
        keySet.add(e.key);
        if (isAdjustLikeNodeId(e.to, nodeLabels) || /^ReAim|^Lock/i.test(String(e.to))) {
          followAdjustToRetestOp(e.to, obsSuffix, nodeSet, keySet, edges, nodeLabels);
        } else if (isRetestOperationId(e.to) && retestOpSuffixMatches(obsId, e.to)) {
          nodeSet.add(e.to);
        }
      }
    }

    const checkGoals = [...nodeSet].filter(id => /^CheckGoal[A-Za-z]*\d*$/i.test(id));
    for (const cgId of checkGoals) {
      for (const e of edges) {
        if (e.from !== cgId) continue;
        if (isSuccessBranchEdge(e, resultIds)) continue;
        if (!retestIds.has(e.to) && !/^Continue\d*$/i.test(e.to)) continue;
        if (!branchSuffixesMatch(cgId, e.to)) continue;
        nodeSet.add(e.to);
        keySet.add(e.key);
        for (const e2 of edges) {
          if (e2.from !== e.to) continue;
          if (isRetestOperationId(e2.to) && retestOpSuffixMatches(cgId, e2.to)) {
            nodeSet.add(e2.to);
            keySet.add(e2.key);
          }
        }
      }
    }
  }

  function failureGateRetrySameBranch(gateId, retryId) {
    if (/^Continue\d*$/i.test(retryId)) return branchSuffixesMatch(gateId, retryId);
    if (/^Observe[A-Za-z]*\d*$/i.test(gateId)) return observeRetrySameBranch(gateId, retryId);
    const r = String(retryId).match(/^Retry([A-Za-z]*\d*)$/i);
    if (!r) return false;
    const rSuffix = r[1] || '';
    const gCheck = String(gateId).match(/^CheckGoal([A-Za-z]*\d*)$/i);
    if (gCheck) {
      if (!rSuffix) return true;
      return (gCheck[1] || '') === rSuffix;
    }
    const gJudge = String(gateId).match(/^Judge([A-Za-z]*\d*)$/i);
    if (gJudge) {
      if (!rSuffix) return true;
      return (gJudge[1] || '') === rSuffix;
    }
    return false;
  }

  function isFailureGateNode(id, mermaidBody) {
    if (/^(Observe|CheckGoal|Judge)[A-Za-z]*\d*$/i.test(id)) return true;
    return extractStratCondNodeIds(mermaidBody).has(id);
  }

  function isFailureRetryEdge(edge, retryIds) {
    if (/^Continue\d*$/i.test(edge.to)) {
      const lbl = String(edge.label || '').trim();
      if (lbl && SUCCESS_EDGE_LABEL.test(lbl)) return false;
      return true;
    }
    if (!retryIds.has(edge.to)) return false;
    const lbl = String(edge.label || '').trim();
    if (!lbl) return true;
    if (SUCCESS_EDGE_LABEL.test(lbl)) return false;
    return true;
  }

  function isRetryDeclaredForRoute(route, gateId, retryId) {
    if (route?.highlightFailureBranches === true) return true;
    const hlOrig = new Set(route.highlightNodes || []);
    if (hlOrig.has(retryId)) return true;
    if (hlOrig.has(gateId) && branchSuffixesMatch(gateId, retryId)) return true;
    if (hlOrig.has(gateId) && failureGateRetrySameBranch(gateId, retryId)) return true;
    for (const pair of route.highlightEdges || []) {
      if (!Array.isArray(pair) || pair.length < 2) continue;
      if (pair[0] === gateId && pair[1] === retryId) return true;
    }
    return false;
  }

  function routeShouldAppendFailureOutcomes(route, edges, mermaidBody) {
    if (route?.warn === 'irrelevant') return false;
    if (route?.highlightFailureBranches === true) return true;
    const hlOrig = new Set(route.highlightNodes || []);
    for (const n of hlOrig) {
      if (/^Retry[A-Za-z]*\d*$/i.test(n)) return true;
      if (/^Continue\d*$/i.test(n)) return true;
    }
    for (const pair of route.highlightEdges || []) {
      if (Array.isArray(pair) && pair.length >= 2 && /^Retry[A-Za-z]*\d*$/i.test(pair[1])) return true;
      if (Array.isArray(pair) && pair.length >= 2 && /^Continue\d*$/i.test(pair[1])) return true;
    }
    const retryIds = extractRetestNodeIds(mermaidBody, edges);
    for (const n of hlOrig) {
      if (!isFailureGateNode(n, mermaidBody)) continue;
      if (edges.some(e =>
        e.from === n
        && (branchSuffixesMatch(e.from, e.to) || failureGateRetrySameBranch(e.from, e.to))
        && isFailureRetryEdge(e, retryIds),
      )) return true;
    }
    return false;
  }

  function appendRouteFailureOutcomes(nodeSet, keySet, edges, mermaidBody, route) {
    if (!routeShouldAppendFailureOutcomes(route, edges, mermaidBody)) return;
    const retryIds = extractRetestNodeIds(mermaidBody, edges);
    if (!retryIds.size) return;
    const hlOrig = new Set(route.highlightNodes || []);
    edges.forEach(e => {
      const isRetest = retryIds.has(e.to) || /^Continue\d*$/i.test(e.to);
      if (!isRetest || !nodeSet.has(e.from)) return;
      if (!isFailureGateNode(e.from, mermaidBody)) return;
      if (!branchSuffixesMatch(e.from, e.to) && !failureGateRetrySameBranch(e.from, e.to)) return;
      if (!isFailureRetryEdge(e, retryIds)) return;
      if (!isRetryDeclaredForRoute(route, e.from, e.to) && !/^Continue\d*$/i.test(e.to)) return;
      if (route?.highlightFailureBranches !== true && !hlOrig.has(e.from) && !hlOrig.has(e.to)
        && !/^Continue\d*$/i.test(e.to)) return;
      nodeSet.add(e.to);
      keySet.add(e.key);
    });
  }

  /** When a Retry/Continue node is on the route, include return edge to declared route node. */
  function appendRouteRetryReturnEdges(nodeSet, keySet, edges, route) {
    const hlOrig = new Set(route.highlightNodes || []);
    edges.forEach(e => {
      const fromIsRetest = /^Retry[A-Za-z]*\d*$/i.test(e.from) || /^Continue\d*$/i.test(e.from);
      if (!fromIsRetest) return;
      if (!nodeSet.has(e.from)) return;
      if (!hlOrig.has(e.to) && !nodeSet.has(e.to)) return;
      if (isRetestOperationId(e.to) || hlOrig.has(e.to)) {
        nodeSet.add(e.to);
        keySet.add(e.key);
      }
    });
  }

  /** Retry return + gate�Retry failure edges (topology-driven). */
  function appendFailureAndRetryLoop(nodeSet, keySet, edges, mermaidBody, route) {
    appendRouteFailureOutcomes(nodeSet, keySet, edges, mermaidBody, route);
    appendRouteRetryReturnEdges(nodeSet, keySet, edges, route);
  }

  
  function isConfoundProbeRouteLike(route) {
    return route?.kind === 'confoundProbe'
      || /试探(?:混淆)?[·•.]/.test(String(route?.label || ''));
  }

  function isConfoundVisualNodeId(id) {
    return /^(ProbeCV|ObserveCV|BackFromCV)\d*$/i.test(String(id || ''));
  }

  function stripConfoundBleedFromRoute(nodeSet, keySet, route) {
    if (isConfoundProbeRouteLike(route)) return;
    for (const id of [...nodeSet]) {
      if (isConfoundVisualNodeId(id)) nodeSet.delete(id);
    }
    for (const k of [...keySet]) {
      const i = k.indexOf('->');
      if (i < 0) continue;
      const a = k.slice(0, i);
      const b = k.slice(i + 2);
      if (isConfoundVisualNodeId(a) || isConfoundVisualNodeId(b)) keySet.delete(k);
      if (/试探(?:混淆)?[·•.]/.test(a) || /试探(?:混淆)?[·•.]/.test(b)) keySet.delete(k);
    }
  }

  function normalizeRouteLabelKey(label) {
    return String(label || '')
      .replace(/\s*·\s*优先\d+(?:\s*·\s*[\d.]+)?$/u, '')
      .replace(/\s*·\s*陷阱(?:\s*·\s*[\d.]+)?$/u, '')
      .replace(/\s*·\s*旁路(?:\s*·\s*[\d.]+)?$/u, '')
      .replace(/\s+/g, '')
      .trim();
  }

  function preferSpineNodeScore(id) {
    const s = String(id || '');
    if (/^Adjust/i.test(s)) return 55;
    if (/Route|Strat(?!egySelect)/i.test(s)) return 50;
    if (/^(Fire|Launch|Tune)/i.test(s)) return 45;
    if (/^Observe/i.test(s)) return 35;
    if (/^Check/i.test(s)) return 30;
    if (/^(Win|Continue|Victory)/i.test(s)) return 25;
    if (/^(Retry|Fail|Invalid|ModeOff|Trap)/i.test(s)) return -5;
    return 8;
  }

  function findStrategySelectOutEdge(route, edges) {
    const selectEdges = edges.filter(e => /StrategySelect/i.test(e.from) && e.label);
    if (!selectEdges.length) return null;
    const want = normalizeRouteLabelKey(route && route.label);
    if (want) {
      let hit = selectEdges.find(e => normalizeRouteLabelKey(e.label) === want);
      if (hit) return hit;
      hit = selectEdges.find(e => {
        const k = normalizeRouteLabelKey(e.label);
        return k && want && (k.includes(want) || want.includes(k));
      });
      if (hit) return hit;
    }
    if (/trap|盲调|多参|多滑/i.test(String((route && route.id) || '') + String((route && route.label) || ''))) {
      return selectEdges.find(e => /盲调|多参|trap|多滑/i.test(e.label || '')) || null;
    }
    const idm = String((route && route.id) || '').match(/^main[_-](.+)$/i);
    if (idm) {
      const frag = idm[1].toLowerCase().replace(/[^a-z0-9]/g, '');
      if (frag) {
        const fragShort = frag.replace(/^s/, '');
        for (const e of selectEdges) {
          const q = [e.to];
          const seen = new Set(q);
          while (q.length) {
            const cur = q.shift();
            const curNorm = String(cur).toLowerCase().replace(/[^a-z0-9]/g, '');
            if (preferSpineNodeScore(cur) >= 45 && curNorm.includes(fragShort)) return e;
            if (/^Adjust/i.test(cur) && curNorm.includes(fragShort.slice(0, Math.min(4, fragShort.length)))) {
              return e;
            }
            for (const nx of edges) {
              if (nx.from !== cur || seen.has(nx.to)) continue;
              if (preferSpineNodeScore(nx.to) < 0) continue;
              seen.add(nx.to);
              q.push(nx.to);
            }
          }
        }
      }
    }
    return null;
  }

  function greedySpineFromEntry(entry, edges, forbidden, maxDepth) {
    const nodes = [entry];
    const pairs = [];
    let cur = entry;
    const depth = maxDepth == null ? 14 : maxDepth;
    for (let d = 0; d < depth; d++) {
      const outs = edges.filter(e => e.from === cur && !forbidden.has(e.to));
      if (!outs.length) break;
      // From Observe/Check: prefer Win/success, never dive into Adjust* (feedback loops)
      const ranked = outs
        .map(e => {
          let score = preferSpineNodeScore(e.to);
          if (/^(Observe|Check)/i.test(cur)) {
            if (/^(Win|Victory|Success|Continue)/i.test(e.to)) score = 80;
            else if (/^Adjust/i.test(e.to) || /^Retry/i.test(e.to)) score = -1;
          }
          return { e: e, score: score };
        })
        .filter(x => x.score >= 0)
        .sort((a, b) => b.score - a.score);
      if (!ranked.length) break;
      const best = ranked[0].e;
      pairs.push([best.from, best.to]);
      nodes.push(best.to);
      cur = best.to;
      if (/^(Win|Victory|Success)/i.test(cur)) break;
      if (/^(Observe|Check)/i.test(cur)) {
        // one more hop to Win if present, then stop
        const winEdge = edges.find(e =>
          e.from === cur && !forbidden.has(e.to) && /^(Win|Victory|Success)/i.test(e.to));
        if (winEdge) {
          pairs.push([winEdge.from, winEdge.to]);
          nodes.push(winEdge.to);
        }
        break;
      }
    }
    return { nodes: nodes, pairs: pairs };
  }

  /**
   * Sparse 单变量 routes often only declare Start/StrategySelect/Win.
   * Seed spine from StrategySelect -->|label| entry so expand can light Adjust/Fire/Observe.
   */
  /**
   * When StrategySelect→Trap has no outs but TrapStrat→Adjust* exists (legacy data),
   * walk from alias. New repair must not create TrapStrat — prefer Trap→Fire.
   */
  function resolveSpineWalkEntry(entry, edges, forbidden) {
    const directOuts = edges.filter(e => e.from === entry && !forbidden.has(e.to));
    if (directOuts.length) return { walkFrom: entry, bridgePairs: [] };
    const aliasId = `${entry}Strat`;
    const aliasOuts = edges.filter(e => e.from === aliasId && !forbidden.has(e.to));
    if (aliasOuts.length) {
      return { walkFrom: aliasId, bridgePairs: [[entry, aliasId]] };
    }
    // Trap → AdjustBoth style: any Adjust*/Fire* reachable from a *Strat sibling of entry
    const stratAlias = edges.find(e =>
      /Strat$/i.test(e.from)
      && new RegExp(String(entry).replace(/Strat$/i, ''), 'i').test(e.from)
      && !forbidden.has(e.to)
      && preferSpineNodeScore(e.to) >= 0);
    if (stratAlias) {
      return { walkFrom: stratAlias.from, bridgePairs: [[entry, stratAlias.from]] };
    }
    // Dead-end entry: hop to first non-forbidden Adjust*/Fire*/Tune* sharing label fragment
    const frag = String(entry).toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 6);
    if (frag) {
      const hop = edges.find(e => {
        if (forbidden.has(e.to)) return false;
        const toScore = preferSpineNodeScore(e.to);
        if (toScore < 45) return false;
        const fromNorm = String(e.from).toLowerCase().replace(/[^a-z0-9]/g, '');
        const toNorm = String(e.to).toLowerCase().replace(/[^a-z0-9]/g, '');
        return fromNorm.includes(frag) || toNorm.includes(frag);
      });
      if (hop) {
        return {
          walkFrom: hop.from === entry ? entry : hop.from,
          bridgePairs: hop.from === entry ? [] : [[entry, hop.from]],
        };
      }
    }
    return { walkFrom: entry, bridgePairs: [] };
  }

  function seedSingleVarRouteSpine(route, mermaidBody, edges, startId) {
    const empty = { entry: null, nodes: [], edgePairs: [], keys: [] };
    if (!route || routeIsTrueMisconceptionRoute(route, mermaidBody)) return empty;
    const selectEdge = findStrategySelectOutEdge(route, edges);
    if (!selectEdge) return empty;
    const entry = selectEdge.to;
    const siblings = edges
      .filter(e => /StrategySelect/i.test(e.from))
      .map(e => e.to)
      .filter(id => id && id !== entry);
    const forbidden = new Set(siblings);
    // Prefer path avoiding sibling fan-out; if unreachable (floating StrategySelect),
    // still seed select→entry + greedy walk so sparse AV/trap routes can expand.
    let prefixKeys = startId
      ? shortestPathEdgeKeysAvoiding(startId, entry, edges, forbidden)
      : [];
    if ((!prefixKeys || !prefixKeys.length) && startId && startId !== entry) {
      prefixKeys = shortestPathEdgeKeys(startId, entry, edges);
    }
    const resolved = resolveSpineWalkEntry(entry, edges, forbidden);
    const walk = greedySpineFromEntry(resolved.walkFrom, edges, forbidden);
    const nodes = new Set();
    const edgePairs = [];
    const keys = new Set();
    const ingestKeys = function (pathKeys) {
      (pathKeys || []).forEach(k => {
        keys.add(k);
        const j = k.indexOf('->');
        if (j < 0) return;
        const a = k.slice(0, j);
        const b = k.slice(j + 2);
        nodes.add(a);
        nodes.add(b);
        edgePairs.push([a, b]);
      });
    };
    ingestKeys(prefixKeys);
    nodes.add(entry);
    resolved.bridgePairs.forEach(p => {
      edgePairs.push(p);
      keys.add(p[0] + '->' + p[1]);
      nodes.add(p[0]);
      nodes.add(p[1]);
    });
    walk.nodes.forEach(n => nodes.add(n));
    walk.pairs.forEach(p => {
      edgePairs.push(p);
      keys.add(p[0] + '->' + p[1]);
    });
    keys.add(selectEdge.key);
    edgePairs.push([selectEdge.from, selectEdge.to]);
    nodes.add(selectEdge.from);
    return { entry: entry, nodes: [...nodes], edgePairs: edgePairs, keys: [...keys] };
  }

  function pruneHighlightToSelectEntry(highlightNodes, entry, edges) {
    if (!entry) return highlightNodes || [];
    const siblings = new Set(
      edges.filter(e => /StrategySelect/i.test(e.from)).map(e => e.to).filter(id => id && id !== entry),
    );
    if (!siblings.size) return highlightNodes || [];
    return (highlightNodes || []).filter(id => !siblings.has(id));
  }

  function selectEdgePairMissing(pairs, entry) {
    if (!entry || !Array.isArray(pairs)) return true;
    return !pairs.some(p => Array.isArray(p) && p.length >= 2
      && /StrategySelect/i.test(String(p[0])) && String(p[1]) === String(entry));
  }

  function isBranchEntryNodeId(id) {
    const s = String(id || '');
    if (/StrategySelect/i.test(s)) return false;
    return /^(Adjust|Tune|Single|Route|Trap|Height|Speed|Dist|Mat|Area|Path|Angle|Len)/i.test(s)
      || /Strat$/i.test(s);
  }

  function routeNeedsSpineSeed(route) {
    const edges = route?.highlightEdges || [];
    const nodes = route?.highlightNodes || [];
    if (!(Array.isArray(edges) && edges.length > 0) || nodes.length < 6) return true;
    const hasSelectEdge = edges.some(p => Array.isArray(p) && p.length >= 2 && /StrategySelect/i.test(String(p[0])));
    if (!hasSelectEdge) return true;
    // Only Start→StrategySelect (or similarly skeletal) — treat as needing full seed
    const nonSelectPairs = edges.filter(p => Array.isArray(p) && p.length >= 2
      && !(/^Start$/i.test(p[0]) && /StrategySelect/i.test(p[1])));
    if (nonSelectPairs.length === 0) return true;
    return false;
  }

function expandRouteHighlight(route, mermaidBody, opts) {
    const edges = parseStrategyMermaidEdges(mermaidBody);
    const startId = findStartNode(mermaidBody, edges);
    const spineSeed = seedSingleVarRouteSpine(route, mermaidBody, edges, startId);
    const sparse = routeNeedsSpineSeed(route);
    let effectiveNodes = [...(route.highlightNodes || [])];
    if (spineSeed.entry && sparse) {
      // Full seed only when sparse / missing StrategySelect fan-out — avoids shared-hub
      // Fire→Observe* fan-out picking the wrong numbered Observe for explicit spines.
      effectiveNodes = [...new Set([...effectiveNodes, ...spineSeed.nodes])];
      effectiveNodes = pruneHighlightToSelectEntry(effectiveNodes, spineSeed.entry, edges);
    } else if (spineSeed.entry) {
      // Even with explicit spine, keep select entry + drop sibling StrategySelect targets.
      if (!effectiveNodes.includes(spineSeed.entry)) effectiveNodes.push(spineSeed.entry);
      if (!effectiveNodes.some(id => /StrategySelect/i.test(id))) {
        effectiveNodes.push(spineSeed.keys?.length
          ? (spineSeed.nodes.find(id => /StrategySelect/i.test(id)) || 'StrategySelect')
          : 'StrategySelect');
      }
      effectiveNodes = pruneHighlightToSelectEntry(effectiveNodes, spineSeed.entry, edges);
    }
    if (spineSeed.entry && spineSeed.nodes && spineSeed.nodes.length) {
      const keep = new Set(spineSeed.nodes);
      effectiveNodes = effectiveNodes.filter(id => {
        // Drop other-route branch entries (Adjust*/Tune*/Route*/Single*/…Strat) not on this spine
        if (isBranchEntryNodeId(id)) return keep.has(id) || id === spineSeed.entry;
        return true;
      });
    }
    const siblingEntries = spineSeed.entry
      ? new Set(
        edges.filter(e => /StrategySelect/i.test(e.from)).map(e => e.to).filter(id => id && id !== spineSeed.entry),
      )
      : new Set();
    const rawEdges = sparse && spineSeed.edgePairs.length
      ? spineSeed.edgePairs
      : ((Array.isArray(route.highlightEdges) && route.highlightEdges.length > 0)
        ? route.highlightEdges
        : (spineSeed.edgePairs.length ? spineSeed.edgePairs : (route.highlightEdges || [])));
    const filteredEdges = siblingEntries.size

  const ph = panel.clientHeight - padY * 2;

  const k = Math.min(1, pw / bbox.width, ph / bbox.height);
  const tx = padX + (pw - bbox.width * k) / 2 - bbox.x * k;

    adjustBlock = '<p>本路径会<strong>同时拧多个滑条</strong>，而不是每次只改一个变量。</p>';
  } else if (avHit) {
    const ctrl = (!student && avHit.controlId) ? `（控件 ${escText(avHit.controlId)}）` : '';
    adjustBlock = `<p>本路径主要调节：<strong>${escText(avHit.label || shortLab)}</strong>${ctrl}。建议每次只动这一个量，其它先固定。</p>`;
  } else {
    const name = shortLab || route.label || '该变量';
    adjustBlock = `<p>本路径关注：<strong>${escText(name)}</strong>。尽量单变量调节，便于归因。</p>`;
  }

  // 2) 为何优先 / 得分
  let whyBits = [];
  if (student) {
    if (meta?.confound) {
      whyBits.push('这是对照路径：用来检验某个控件是否真能帮你过关。');
    } else if (meta?.trap) {
      whyBits.push('同时拧多量时现象难归因；可对照「每次只改一项」的路径看看差异。');
    } else {
      whyBits.push('用控制变量法：固定其余，只改一项，观察结果是否跟着变。');
      if (avHit?.monotonicity) {
        const zh = monoToneZh(avHit.monotonicity);
        if (zh) whyBits.push(escText(zh));
      }
    }
  } else if (meta?.confound) {
    whyBits.push(`旁路得分约 <strong>${score ?? '0.15'}</strong>：故意压低，避免把混淆拧法当成「主策略」。`);
    if (cvHit?.reason) whyBits.push(escText(cvHit.reason));
    whyBits.push('教学用途：让学生自己发现「这个量几乎不帮过关」，再回到单变量主路径。');
  } else if (meta?.trap) {
    whyBits.push(`陷阱得分约 <strong>${score ?? '0.20'}</strong>：效率低、难归因，图谱里用虚线警示。`);
    whyBits.push('分数越低越不建议作为常规探究顺序；对比高优实线路径即可。');
  } else {
    if (meta?.rank != null) {
      whyBits.push(`优先序 <strong>${meta.rank}</strong>：数字越小越建议先试（优先 1 通常是最有信息量的单变量）。`);
    }
    if (score != null) {
      whyBits.push(`路径得分 <strong>${score}</strong>：越高表示越符合「先关键、易归因」的探究策略（不是考试分数）。`);
    }
    if (avHit?.monotonicity) {
      const zh = monoToneZh(avHit.monotonicity);
      if (zh) whyBits.push(`响应形态：${escText(zh)}。`);
    }
    if (avHit?.affects?.length) {
      whyBits.push(`主要牵动：${escText(avHit.affects.join('、'))}。`);
    }
    if (avHit?.notes) whyBits.push(escText(avHit.notes));
  }
  const whyBlock = whyBits.length
    ? whyBits.map(t => `<p>${t}</p>`).join('')
    : '<p>按图中线宽与颜色对比即可：粗实线优先，虚线为旁路或陷阱。</p>';

  // 3) 典型误区
  let trapBits = [];
  if (!student && route.warn && route.warn !== 'irrelevant') {
    trapBits.push(escText(route.warn));
  }
  if (meta?.confound) {
    trapBits.push(student
      ? '提示：若拧了很久却几乎看不到过关变化，可以换一个控件再试。'
      : '误区：把混淆量当成「还没拧够的关键参数」反复试，会浪费发射次数、也学不到因果。');
  } else if (meta?.trap) {
    trapBits.push('误区：多滑条一起拧，现象变了却说不清是谁导致的；失败后也难复盘。');
  } else {
    trapBits.push(student
      ? '提示：还没看清这一变量的作用时，先不要同时改很多控件。'
      : '误区：还没看清这一变量的作用，就同时改其它量，或过早去拧外观/装饰类控件。');
  }
  const trapBlock = trapBits.map(t => `<p>${t}</p>`).join('');

  // 4) KG 映射（可折叠）
  const mapped = (route.mapsTo || []).map(id => {
    const n = nodes.find(x => x.id === id);
    if (n) {
      return `<li><span class="route-kg-id">${escText(id)}</span> ${escText(n.label)}${n.desc ? `<span class="route-kg-desc"> — ${escText(n.desc)}</span>` : ''}</li>`;
    }
    return `<li><span class="route-kg-id">${escText(id)}</span></li>`;
  }).join('');
  const kgBlock = student
    ? ''
    : (mapped
      ? `<details class="route-teach-kg"><summary>事理图谱对应（可展开）</summary><ul class="route-kg-list">${mapped}</ul></details>`
      : `<details class="route-teach-kg"><summary>事理图谱对应（可展开）</summary><p class="i-desc">本路径未直接挂 KG 节点（常见于混淆旁路）。</p></details>`);

  let h = `<div class="i-title">${kindTitle}</div><div class="i-badges">${badge}</div>`;
  h += `<section class="route-teach-sec"><h3 class="route-teach-h">1. 本路径调什么</h3>${adjustBlock}</section>`;
  h += `<section class="route-teach-sec"><h3 class="route-teach-h">${student ? '2. 怎么探究' : '2. 为何优先 / 得分含义'}</h3>${whyBlock}</section>`;
  h += `<section class="route-teach-sec"><h3 class="route-teach-h">${student ? '3. 小提示' : '3. 典型误区'}</h3>${trapBlock}</section>`;
  if (kgBlock) h += `<section class="route-teach-sec">${kgBlock}</section>`;
  if ((route.mapsTo || []).length) {
    h += `<button type="button" class="route-kg-btn" id="btn-route-kg">在事理图谱中查看</button>`;
  }
  return h;
}

function edgeKeyFromMermaidSvgId(id) {
  const api = strategyParseApi();
  if (api?.edgeKeyFromMermaidSvgId) return api.edgeKeyFromMermaidSvgId(id);
  if (!id) return null;
  let m = id.match(/edge-label-([^-]+)-([^-]+)/i);
  if (m) return `${m[1]}->${m[2]}`;
  m = id.match(/(?:^|[-])L_([^_]+)_([^_]+)_/);
  return m ? `${m[1]}->${m[2]}` : null;
}

function edgeKeyFromMermaidClassName(className) {
  const api = strategyParseApi();
  if (api?.edgeKeyFromMermaidClassName) return api.edgeKeyFromMermaidClassName(className);
  if (!className) return null;
  const cls = String(className);
  const from = cls.match(/(?:^|\s)LS-([A-Za-z][A-Za-z0-9_]*)\b/);
  const to = cls.match(/(?:^|\s)LE-([A-Za-z][A-Za-z0-9_]*)\b/);
  if (from && to) return `${from[1]}->${to[1]}`;
  return null;
}

function edgeKeyFromSvgElement(el) {
  let cur = el;
  for (let i = 0; i < 6 && cur; i++) {
    const idKey = edgeKeyFromMermaidSvgId(cur.getAttribute?.('id') || '');
    if (idKey) return idKey;
    const clsObj = cur.className;
    const cls = typeof clsObj === 'string' ? clsObj : (clsObj?.baseVal || '');
    const clsKey = edgeKeyFromMermaidClassName(cls);
    if (clsKey) return clsKey;
    cur = cur.parentElement;
  }
  return null;
}

function svgPathEdgeKey(pathEl) {
  return edgeKeyFromSvgElement(pathEl);
}

function edgeKeyFromPathGroup(group) {
  if (!group) return null;
  const fromGroup = edgeKeyFromSvgElement(group);
  if (fromGroup) return fromGroup;
  const path = group.querySelector?.('path');
  if (!path) return null;
  return edgeKeyFromSvgElement(path);
}

function rectCenter(el) {
  if (!el?.getBoundingClientRect) return null;
  const r = el.getBoundingClientRect();
  if (!Number.isFinite(r.left) || !Number.isFinite(r.top)) return null;
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function buildEdgePathGeoEntries(svg) {
  const edgeSel = 'g.edgePaths path, g.edgePath path, path.flowchart-link, .edgePath path';
  return Array.from(svg.querySelectorAll(edgeSel)).map(pathEl => ({
    key: edgeKeyFromSvgElement(pathEl),
    center: rectCenter(pathEl),
  })).filter(x => x.key && x.center);
}

function nearestEdgeKeyForLabel(labelEl, pathGeo) {
  const center = rectCenter(labelEl);
  if (!center || !pathGeo.length) return null;
  let best = null;
  for (const entry of pathGeo) {
    const dx = entry.center.x - center.x;
    const dy = entry.center.y - center.y;
    const dist2 = dx * dx + dy * dy;
    if (!best || dist2 < best.dist2) best = { key: entry.key, dist2 };
  }
  // If nearest path is too far, avoid accidental mis-association.
  return best && best.dist2 <= 240 * 240 ? best.key : null;
}

function clearStrategyRouteHighlightVisual() {
  const svg = document.querySelector('#strategy-mermaid svg');
  if (!svg) return;
  svg.querySelectorAll('.strategy-dim, .strategy-hl').forEach(el => {
    el.classList.remove('strategy-dim', 'strategy-hl');
  });
  patchStrategyEdgeLabelBackground(svg);
}

function afterStrategyRender() {
  const svg = document.querySelector('#strategy-mermaid svg');
  patchStrategyEdgeLabelBackground(svg);
  clearStrategyRouteHighlightVisual();
  applyPriorityEdgeStyles();
  requestAnimationFrame(() => {
    fitStrategyToPanel();
    if (pendingRouteId) {
      activatePendingRoute();
      return;
    }
    const routeId = activeStrategyRouteId
      || document.querySelector('#legend-items .route-btn.active[data-route-id]')?.dataset.routeId;
    if (!routeId) return;
    const routes = metaChapters[currentCh]?.strategy?.routes || [];
    const route = routes.find(r => r.id === routeId);
    if (route) applyStrategyRouteHighlight(route);
  });
}

function applyPriorityEdgeStyles() {
  const svg = document.querySelector('#strategy-mermaid svg');
  const api = priorityApi();
  const meta = metaChapters[currentCh] || {};
  const routes = meta?.strategy?.routes || [];
  const mermaidBody = meta?.strategy?.mermaid || '';
  if (!svg || !api?.strategySelectPriorityStyles || !routes.length) return;
  const styleMap = api.strategySelectPriorityStyles(routes, mermaidBody);
  if (!styleMap.size) return;

  const pathGroups = getStrategyEdgePathGroups(svg);
  pathGroups.forEach(group => {
    const key = edgeKeyFromPathGroup(group);
    const meta = key && styleMap.get(key);
    pathsInEdgeGroup(group).forEach(pathEl => {
      pathEl.classList.remove('prio-edge-high', 'prio-edge-mid', 'prio-edge-low', 'prio-edge-trap', 'prio-edge-confound');
      if (!meta) return;
      let cls = 'prio-edge-low';
      if (meta.confound) cls = 'prio-edge-confound';
      else if (meta.trap) cls = 'prio-edge-trap';
      else if (meta.rank <= 1) cls = 'prio-edge-high';
      else if (meta.rank === 2) cls = 'prio-edge-mid';
      pathEl.classList.add(cls);
      pathEl.style.stroke = meta.stroke;
      pathEl.style.strokeWidth = `${meta.strokeWidth}px`;
      if (meta.trap || meta.confound) pathEl.style.strokeDasharray = '7 5';
      else pathEl.style.strokeDasharray = '';
    });
  });
}

function mermaidNodeIdFromSvgGroup(gEl) {
  const dataId = gEl.getAttribute?.('data-id');
  if (dataId) return dataId;
  const id = gEl.getAttribute('id') || '';
  const m = id.match(/flowchart-([A-Za-z][A-Za-z0-9_]*)-/i);
  return m ? m[1] : null;
}

function clearStrategyRouteHighlight() {
  activeStrategyRouteId = null;
  clearStrategyRouteHighlightVisual();
}

function applyStrategyRouteHighlight(route) {
  const svg = document.querySelector('#strategy-mermaid svg');
  if (!svg || !route) return;
  clearStrategyRouteHighlightVisual();
  activeStrategyRouteId = route.id;
  const mermaidBody = metaChapters[currentCh]?.strategy?.mermaid || '';
  const resultKgIds = new Set(
    (KG_CHAPTERS[currentCh]?.nodes || []).filter(n => n.group === 'result').map(n => n.id),
  );
  const expanded = expandRouteHighlight(route, mermaidBody, { resultKgIds });
  const idSet = new Set(expanded.highlightNodes);
  const edgeKeys = expanded.edgeKeys;
  const parsed = parseStrategyMermaidEdges(mermaidBody);

  svg.querySelectorAll('g.node').forEach(gEl => {
    const nid = mermaidNodeIdFromSvgGroup(gEl);
    if (nid && idSet.has(nid)) gEl.classList.add('strategy-hl');
    else gEl.classList.add('strategy-dim');
  });

  const pathGroups = getStrategyEdgePathGroups(svg);
  const labelGroups = getStrategyEdgeLabelGroups(svg);
  const parsedByIndex = pathGroups.map((group, i) => ({
    group,
    key: edgeKeyFromPathGroup(group),
    fallbackKey: parsed[i]?.key || null,
  }));
  const markedPaths = new Set();
  const markedLabelGroups = new Set();
  parsedByIndex.forEach((entry, i) => {
    const key = entry.key || entry.fallbackKey;
    const hl = key && edgeKeys.has(key);
    pathsInEdgeGroup(entry.group).forEach(pathEl => {
      pathEl.classList.add(hl ? 'strategy-hl' : 'strategy-dim');
      markedPaths.add(pathEl);
    });
    const labelGroup = labelGroups[i];
    if (labelGroup) {
      labelGroup.classList.add(hl ? 'strategy-hl' : 'strategy-dim');
      markedLabelGroups.add(labelGroup);
    }
  });

  const edgeSel = 'g.edgePaths path, g.edgePath path, path.flowchart-link, .edgePath path';
  svg.querySelectorAll(edgeSel).forEach(pathEl => {
    if (markedPaths.has(pathEl)) return;
    const key = edgeKeyFromSvgElement(pathEl);
    pathEl.classList.add(key && edgeKeys.has(key) ? 'strategy-hl' : 'strategy-dim');
  });

  const pathGeo = buildEdgePathGeoEntries(svg);
  svg.querySelectorAll('g.edgeLabel').forEach(gEl => {
    if (markedLabelGroups.has(gEl)) return;
    const key = edgeKeyFromSvgElement(gEl) || nearestEdgeKeyForLabel(gEl, pathGeo);
    gEl.classList.add(key && edgeKeys.has(key) ? 'strategy-hl' : 'strategy-dim');
  });

  patchStrategyEdgeLabelBackground(svg);
  syncGraphHash();
}
