<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>分布台 · 麦克斯韦速率</title>
<link rel="stylesheet" href="../_shared/craft-tokens.css">
<style>
:root{
  --craft-accent:#0a9bb0;
  --craft-bg:#0c1418;
  --craft-panel:#142028;
  --craft-text:#e6eef2;
  --craft-muted:#8a9aa6;
  --craft-radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--craft-bg);color:var(--craft-text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
#essence-app{display:flex;height:100vh;min-height:480px}
#essence-stage{flex:1;position:relative;min-width:0;background:linear-gradient(160deg,#0a1216 0%,#122028 55%,#0e1a22 100%)}
#essence-stage canvas{display:block;width:100%;height:100%}
#essence-hud{position:absolute;left:16px;top:14px;z-index:2;pointer-events:none}
.essence-title{font-size:15px;font-weight:700;letter-spacing:.02em}
.essence-sub,#goalMission{display:none!important}
#essence-bench{width:min(340px,38vw);background:var(--craft-panel);border-left:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column}
.essence-scroll{padding:14px 14px 10px;overflow:auto;flex:1}
.side-goal-cap{font-size:11px;color:var(--craft-muted);text-transform:uppercase;letter-spacing:.06em}
#sideGoal{margin:6px 0 12px;font-size:14px;line-height:1.55;color:var(--craft-text)}
.mode-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
#modeSelect{flex:1;min-height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:#0f1a20;color:var(--craft-text);padding:6px 8px}
.slider-group{margin:10px 0}
.slider-group label{display:flex;justify-content:space-between;font-size:12px;color:var(--craft-muted);margin-bottom:4px}
.slider-group input[type=range]{width:100%}
.row-buttons{display:flex;gap:8px;margin:12px 0}
button{cursor:pointer;border:0;border-radius:8px;padding:8px 12px;font-weight:600;background:var(--craft-accent);color:#041016}
button.secondary{background:rgba(255,255,255,.08);color:var(--craft-text)}
.observe-box{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08)}
.observe-box .val{font-size:20px;font-weight:700}
.observe-box .hint{font-size:12px;color:var(--craft-muted);margin-top:6px;line-height:1.4}
.pass-badge{display:inline-block;margin-top:8px;padding:5px 12px;border-radius:999px;background:#0f9f7a;color:#fff;font-size:12px;font-weight:700}
.attempts{font-size:12px;color:var(--craft-muted);margin-top:8px}
#craft-intro,#craft-win{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(4,10,14,.72);padding:20px}
#craft-intro[hidden],#craft-win[hidden]{display:none!important}
.craft-card{width:min(440px,92vw);background:#14242c;border:1px solid rgba(10,155,176,.35);border-radius:14px;padding:22px 22px 18px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.craft-card h2{margin:0 0 8px;font-size:20px}
.craft-card p{margin:0 0 10px;color:var(--craft-muted);font-size:13px;line-height:1.5}
.craft-card .formula{font-family:ui-monospace,Consolas,monospace;color:#9fe7f0;margin:8px 0 12px}
.craft-actions{display:flex;gap:8px;margin-top:14px}
.craft-btn-secondary{background:rgba(255,255,255,.08);color:var(--craft-text)}
@media (max-width:820px){#essence-app{flex-direction:column}#essence-bench{width:100%;height:46vh}#essence-stage{height:54vh}}
</style>
</head>
<body>

<div id="craft-intro">
  <div class="craft-card">
    <h2>分布台 · 麦克斯韦速率</h2>
    <p>升温或改质量，速率分布曲线怎么挪？读出最概然速率 v_p，再去竞赛打特征区间。</p>
    <p style="font-size:12px;color:var(--craft-muted)">探究与竞赛目标不同；竞赛目标本局锁定，未命中只扣次数。</p>
    <button type="button" id="craftIntroBtn">开始探究</button>
  </div>
</div>
<div id="craft-win" hidden>
  <div class="craft-card">
    <h2>过关 · 本局对照</h2>
    <p id="craftEvidenceLine" class="craft-evidence">本局证据将自动填入</p>
    <div class="formula" id="craftWinFormula">v_p = √(2kT/m)</div>
    <p id="craftWinText">最概然速率随 √(T/m) 变化；升温峰值右移，质量增大峰值左移。</p>
    <div class="craft-actions">
      <button type="button" id="craftWinBtn">再玩一次</button>
      <button type="button" id="craftBackBtn" class="craft-btn-secondary">返回列表</button>
    </div>
  </div>
</div>
<div id="essence-app">
  <div id="essence-stage">
    <canvas id="simCanvas"></canvas>
    <div id="essence-hud">
      <div class="essence-title">麦克斯韦分布</div>
      <div class="essence-sub" id="goalMission">探究：看曲线随 T、m 移动</div>
    </div>
  </div>
  <aside id="essence-bench">
    <div class="essence-scroll" id="controlsPanel">
      <div class="side-goal-cap">当前目标</div>
      <p id="sideGoal">调 T 或 m，点测试读 v_p。</p>
      <div class="mode-row">
        <label for="modeSelect" style="font-size:12px;color:var(--craft-muted)">模式</label>
        <select id="modeSelect">
          <option value="explore">探究</option>
          <option value="challenge">竞赛</option>
        </select>
      </div>
      <div class="slider-group">
        <label for="s-T">温度 T <span id="tVal">300 K</span></label>
        <input type="range" id="s-T" min="120" max="700" step="5" value="300">
      </div>
      <div class="slider-group">
        <label for="s-m">分子质量 m <span id="mVal">1.0</span></label>
        <input type="range" id="s-m" min="0.4" max="3.0" step="0.05" value="1.0">
      </div>
      <div class="slider-group">
        <label for="s-palette">柱描边粗细 <span id="pVal">2</span></label>
        <input type="range" id="s-palette" min="0" max="3" step="1" value="1">
      </div>
      <div class="row-buttons">
        <button type="button" id="btn-test">测试 · 读特征速</button>
        <button type="button" id="btn-reset" class="secondary">重置</button>
      </div>
      <div class="observe-box">
        <div><span class="val" id="vpDisplay">—</span> <span style="font-size:12px;color:var(--craft-muted)">v_p</span></div>
        <div class="hint" id="hintMessage">调参后点测试</div>
        <div id="winIndicator"></div>
      </div>
      <div class="attempts" id="attemptsLine"></div>
    </div>
  </aside>
</div>
<script>
(function(){
  var canvas = document.getElementById('simCanvas');
  var ctx = canvas.getContext('2d');
  var mode = 'explore';
  var attempts = 6;
  var bandLo = 1.2, bandHi = 1.6;
  var palettes = [
    ['#0a9bb0', '#7fd4e0'],
    ['#0a9bb0', '#7fd4e0'],
    ['#0a9bb0', '#7fd4e0'],
    ['#0a9bb0', '#7fd4e0']
  ];
  var strokeW = [1, 1.5, 2.2, 3];

  function stats() {
    var T = +document.getElementById('s-T').value;
    var m = +document.getElementById('s-m').value;
    // relative units: k=1
    var vp = Math.sqrt(2 * T / m) / 10; // scale for readable ~1–3
    var vavg = Math.sqrt(8 * T / (Math.PI * m)) / 10;
    var vrms = Math.sqrt(3 * T / m) / 10;
    return { T: T, m: m, vp: vp, vavg: vavg, vrms: vrms };
  }

  function f(v, T, m) {
    // Maxwell speed pdf relative
    var a = m / (2 * T);
    return v * v * Math.exp(-a * v * v);
  }

  function resize() {
    var r = canvas.parentElement.getBoundingClientRect();
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.max(320, r.width) * dpr;
    canvas.height = Math.max(240, r.height) * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function draw() {
    var rect = canvas.getBoundingClientRect();
    var w = rect.width, h = rect.height;
    var st = stats();
    var palIdx = +document.getElementById('s-palette').value;
    var pal = palettes[palIdx] || palettes[0];
    var lw = strokeW[palIdx] || 1.5;
    ctx.clearRect(0, 0, w, h);
    var left = 48, right = 24, top = 36, bottom = 40;
    var gw = w - left - right, gh = h - top - bottom;
    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    ctx.strokeRect(left, top, gw, gh);

    var vmax = 8;
    var bins = 36;
    var maxY = 0;
    var ys = [];
    for (var i = 0; i < bins; i++) {
      var v = (i + 0.5) / bins * vmax;
      var y = f(v, st.T / 100, st.m); // compress T
      ys.push(y); if (y > maxY) maxY = y;
    }
    for (var j = 0; j < bins; j++) {
      var bh = (ys[j] / maxY) * (gh - 8);
      var bw = gw / bins;
      ctx.fillStyle = pal[0];
      ctx.globalAlpha = 0.55;
      ctx.fillRect(left + j * bw + 1, top + gh - bh, bw - 2, bh);
    }
    ctx.globalAlpha = 1;
    // curve
    ctx.beginPath();
    for (var k = 0; k <= 80; k++) {
      var vv = k / 80 * vmax;
      var yy = f(vv, st.T / 100, st.m);
      var x = left + (vv / vmax) * gw;
      var y = top + gh - (yy / maxY) * (gh - 8);
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = pal[1];
    ctx.lineWidth = lw;
    ctx.stroke();

    // mark vp
    var vpMark = Math.min(vmax * 0.95, Math.max(0.2, Math.sqrt(2 * (st.T / 100) / st.m)));
    var mx = left + (vpMark / vmax) * gw;
    ctx.strokeStyle = '#f0c674';
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(mx, top); ctx.lineTo(mx, top + gh); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#f0c674';
    ctx.font = '12px sans-serif';
    ctx.fillText('v_p', mx + 4, top + 14);

    ctx.fillStyle = '#8a9aa6';
    ctx.font = '11px sans-serif';
    ctx.fillText('速率 →', left + gw - 48, top + gh + 24);
    ctx.fillText('v_p≈' + st.vp.toFixed(2) + '  ⟨v⟩≈' + st.vavg.toFixed(2) + '  v_rms≈' + st.vrms.toFixed(2), left, 22);
  }

  function loop() { draw(); requestAnimationFrame(loop); }

  function syncLabels() {
    document.getElementById('tVal').textContent = document.getElementById('s-T').value + ' K';
    document.getElementById('mVal').textContent = (+document.getElementById('s-m').value).toFixed(2);
    document.getElementById('pVal').textContent = String(strokeW[+document.getElementById('s-palette').value] || 1.5);
  }

  function lockBand() {
    // 从可达 (T,m) 抽样，保证竞赛可打进
    var T = 160 + Math.random() * 420;
    var m = 0.55 + Math.random() * 1.9;
    var mid = Math.sqrt(2 * T / m) / 10;
    var half = 0.11 + Math.random() * 0.07;
    bandLo = mid - half; bandHi = mid + half;
  }

  function refreshGoals() {
    var side = document.getElementById('sideGoal');
    var att = document.getElementById('attemptsLine');
    if (mode === 'explore') {
      side.textContent = '探究：对照升温 / 改质量，点测试读最概然速率 v_p。';
      att.textContent = '';
    } else {
      side.textContent = '竞赛：把 v_p 打进 ' + bandLo.toFixed(2) + ' – ' + bandHi.toFixed(2) + '（本局锁定）';
      att.textContent = '剩余机会 ' + attempts;
    }
  }

  function onMode() {
    var s = document.getElementById('modeSelect');
    var next = s.value === 'challenge' ? 'challenge' : 'explore';
    if (next !== mode) {
      mode = next;
      try {
        if (window.__craftPhaseEmitted !== mode) {
          window.__craftPhaseEmitted = mode;
          if (window.__emit) window.__emit('phase_change', { phase: mode });
        }
      } catch (e) {}
      document.dispatchEvent(new CustomEvent('dual-mode-change', { detail: { mode: mode } }));
      if (mode === 'challenge') { attempts = 6; lockBand(); window.__legacyWinEmitted = false; window.__challengeWon = false; }
      refreshGoals();
    }
  }

  function doTest() {
    syncLabels();
    var st = stats();
    document.getElementById('vpDisplay').textContent = st.vp.toFixed(2);
    var controls = window.__snapControls ? window.__snapControls() : {};
    var hint = document.getElementById('hintMessage');
    var winInd = document.getElementById('winIndicator');
    winInd.innerHTML = '';
    if (mode === 'explore') {
      hint.textContent = 'v_p≈' + st.vp.toFixed(2) + ' · ⟨v⟩≈' + st.vavg.toFixed(2);
      if (window.__emit) {
        window.__emit('snapshot', { controls: controls, winOk: false, hintKey: 'explore_observe' });
        if (window.__noteExploreSuccess) window.__noteExploreSuccess(window.__emit, controls);
      }
      return;
    }
    if (attempts <= 0 || window.__challengeWon) return;
    attempts -= 1; refreshGoals();
    var ok = st.vp >= bandLo && st.vp <= bandHi;
    if (window.__emit) window.__emit('snapshot', { controls: controls, winOk: ok, hintKey: ok ? 'win' : 'miss' });
    if (ok) {
      hint.textContent = '落入特征区间';
      window.__challengeWon = true;
      setTimeout(function() {
        if (mode !== 'challenge' || !window.__challengeWon) return;
        try { window.__legacyWinEmitted = true; } catch (e) {}
        if (window.__emit) window.__emit('win', { winOk: true });
        winInd.innerHTML = '<span class="pass-badge">过关 · v_p 落入特征区间</span>';
        if (typeof window.__craftShowWin === 'function') {
          window.__craftShowWin('本局 v_p≈' + st.vp.toFixed(2) + '，带 ' + bandLo.toFixed(2) + '–' + bandHi.toFixed(2) + '。');
        }
      }, 1000);
    } else {
      var side = st.vp < bandLo ? '偏低' : '偏高';
      hint.innerHTML = '<strong>' + side + '</strong><br>本次 ' + st.vp.toFixed(2) + ' · 带 ' + bandLo.toFixed(2) + '–' + bandHi.toFixed(2);
      if (attempts <= 0 && !window.__challengeWon) {
        try {
          if (window.__emit) {
            window.__emit('attempts_exhausted', { attempts: 0, mode: 'challenge' });
            window.__emit('snapshot', { controls: controls, winOk: false, attemptsExhausted: true, hintKey: 'attempts_exhausted' });
          }
        } catch (eEx) {}
        hint.innerHTML = '<strong>机会用尽</strong><br>可切换探究对照后再开竞赛';
      }
    }
  }

  window.__thermoReset = function() {
    document.getElementById('s-T').value = 300;
    document.getElementById('s-m').value = 1;
    document.getElementById('s-palette').value = 1;
    document.getElementById('vpDisplay').textContent = '—';
    document.getElementById('hintMessage').textContent = '调参后点测试';
    document.getElementById('winIndicator').innerHTML = '';
    attempts = 6; syncLabels(); refreshGoals();
  };

  window.__exploreAvTouched = window.__exploreAvTouched || Object.create(null);
  ['s-T','s-m','s-palette'].forEach(function(id){
    document.getElementById(id).addEventListener('input', function(){
      syncLabels();
      if (id === 's-T' || id === 's-m') window.__exploreAvTouched[id] = 1;
    });
  });
  document.getElementById('modeSelect').addEventListener('change', onMode);
  document.getElementById('btn-test').addEventListener('click', doTest);
  document.getElementById('btn-reset').addEventListener('click', function(){ window.__thermoReset(); });
  window.addEventListener('resize', resize);
  resize(); syncLabels(); lockBand(); refreshGoals();
  requestAnimationFrame(loop);
})();
</script>

<script>
(function(){
  function emit(type, payload) {
    try { if (window.PlatformTraceAdapter) { window.PlatformTraceAdapter.record(type, payload || {}); return; } } catch (e) {}
    try { if (window.parent && window.parent !== window && window.parent.PlatformTraceAdapter) { window.parent.PlatformTraceAdapter.record(type, payload || {}); } } catch (e) {}
  }
  function snapControls() {
    var o = {};
    document.querySelectorAll('input[type="range"],input[type="number"],select').forEach(function(el){
      var id = el.id || el.name; if (id) o[id] = el.value;
    });
    return o;
  }
  window.__emit = emit;
  window.__snapControls = snapControls;
  document.addEventListener('DOMContentLoaded', function(){
    emit('puzzle_open', {});
    document.querySelectorAll('input[type="range"],input[type="number"]').forEach(function(el){
      el.addEventListener('change', function(){
        if (window.__platformTraceControlsBound) return;
        emit('tuning', { control: el.id || 'slider', value: el.value });
      });
    });
    document.querySelectorAll('button,[role="button"]').forEach(function(el){
      el.addEventListener('click', function(){
        emit('action', { control: el.id || (el.textContent||'').trim().slice(0,24) || 'button' });
      });
    });
  });
})();
</script>
<script>/* __dualModeInitPhase */
(function(){
  function sync(){
    var s=document.getElementById('modeSelect'); if(!s) return;
    var p=s.value==='challenge'?'challenge':'explore';
    try{
      if(window.__platformTraceSetPhase){ window.__platformTraceSetPhase(p); window.__craftPhaseEmitted=p; return; }
      if(window.PlatformTraceAdapter&&window.PlatformTraceAdapter.setPhase){ window.PlatformTraceAdapter.setPhase(p); window.__craftPhaseEmitted=p; return; }
    }catch(e){}
    if(window.__craftPhaseEmitted===p) return;
    window.__craftPhaseEmitted=p;
    try{ if(window.__emit) window.__emit('phase_change',{phase:p}); }catch(e2){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(sync,0); });
  else setTimeout(sync,0);
})();
</script>
<script>
(function(){
  if (window.__noteExploreSuccess) return;
  window.__noteExploreSuccess = function(emitFn, controls) {
    try {
      var g = window.__exploreSuccessGate || (window.__exploreSuccessGate = { n: 0, keys: Object.create(null), done: false });
      g.n += 1;
      var c = controls || {};
      Object.keys(c).forEach(function(k){ g.keys[k] = 1; });
      var touched = window.__exploreAvTouched || {};
      if (g.done || g.n < 3 || !touched['s-T'] || !touched['s-m']) return;
      g.done = true;
      var emit = emitFn || window.__emit;
      if (typeof emit === 'function') emit('explore_success', { winOk: true, hintKey: 'explore_contrast', controls: c });
    } catch (e) {}
  };
  document.addEventListener('dual-mode-change', function(ev) {
    try {
      if (ev && ev.detail && ev.detail.mode === 'explore') {
        window.__exploreSuccessGate = { n: 0, keys: Object.create(null), done: false };
        window.__exploreAvTouched = Object.create(null);
      }
    } catch (e) {}
  });
})();
</script>
<script>
(function(){
  var intro = document.getElementById('craft-intro');
  var win = document.getElementById('craft-win');
  var btn = document.getElementById('craftIntroBtn');
  var wbtn = document.getElementById('craftWinBtn');
  var back = document.getElementById('craftBackBtn');
  if (btn) btn.addEventListener('click', function(){ if (intro) intro.hidden = true; });
  window.__craftShowWin = function(evidence){
    var line = document.getElementById('craftEvidenceLine');
    if (line) line.textContent = evidence || '本局已命中目标带。';
    if (win) win.hidden = false;
    window.__craftWinOpen = true;
  };
  if (wbtn) wbtn.addEventListener('click', function(){
    if (win) win.hidden = true;
    window.__craftWinOpen = false;
    window.__legacyWinEmitted = false;
    window.__challengeWon = false;
    var ms = document.getElementById('modeSelect');
    if (ms) { ms.value = 'explore'; ms.dispatchEvent(new Event('change')); }
    if (typeof window.__thermoReset === 'function') window.__thermoReset();
  });
  if (back) back.addEventListener('click', function(){
    try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'craft-back' }, '*'); } catch (e) {}
  });
})();
</script>
</body></html>
