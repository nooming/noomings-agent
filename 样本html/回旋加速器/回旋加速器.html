<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>加速舱 · 回旋半径</title>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<link rel="stylesheet" href="../_shared/craft-tokens.css">
<link rel="stylesheet" href="../_shared/craft-shell.css">
<style>
:root {
  --craft-accent: #40b8c8;
  --craft-bg: #0a1216;
  --craft-panel: #142228;
  --craft-text: #e0eef0;
  --craft-muted: #7898a0;
  --scene-ink: #0a1216;
  --scene-mid: #1e343c;
  --scene-hi: #80d8e0;
  --scene-glow: #30c8d8;
  --scene-ok: #6fae8f;
}
#essence-stage {
  min-height: max(240px, 40vh);
  background:
    radial-gradient(ellipse at 18% 12%, color-mix(in srgb, var(--scene-glow) 18%, transparent), transparent 42%),
    radial-gradient(ellipse at 78% 8%, rgba(255,255,255,.04), transparent 38%),
    linear-gradient(180deg, color-mix(in srgb, var(--scene-mid) 55%, var(--scene-ink)), var(--scene-ink));
}
#essence-stage canvas {
  touch-action: none;
}
.slider-group .val {
  font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  color: var(--craft-accent);
  font-weight: 600;
}
/* dual-mode settle (JS-injected); keep thin until moved into craft-shell */
#attempts-exhausted {
  position: fixed; inset: 0; z-index: 12050;
  display: flex; align-items: center; justify-content: center;
  padding: 18px; background: rgba(6, 10, 18, 0.62); backdrop-filter: blur(3px);
}
#attempts-exhausted[hidden] { display: none !important; }
#attempts-exhausted .craft-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
#attempts-exhausted .craft-actions button {
  width: 100%; padding: 12px; border: none; border-radius: 12px;
  cursor: pointer; font-size: 0.95rem; font-weight: 700;
  background: var(--craft-accent); color: #0b1020;
}
#attempts-exhausted .craft-btn-secondary {
  background: transparent !important;
  border: 1px solid color-mix(in srgb, var(--craft-accent) 45%, transparent) !important;
  color: var(--craft-text) !important; font-weight: 600 !important;
}
#attempts-exhausted .craft-btn-ghost {
  background: transparent !important; border: none !important;
  color: var(--craft-muted) !important; font-weight: 600 !important;
  padding: 8px !important; font-size: 0.88rem !important;
}
</style>
</head>
<body>

<div id="craft-intro">
  <div class="craft-card">
    <h2>加速舱 · 回旋半径</h2>
    <p>提取口对不准——轨道半径跟 B、v 怎么走？调磁场与入射速度，看轨道半径怎么变。</p>
    <p class="craft-intro-meta">探究≠竞赛；竞赛环带进入后固定，未命中扣次数。</p>
    <button type="button" id="craftIntroBtn">开始探究</button>
  </div>
</div>
<div id="craft-win" hidden>
  <div class="craft-card">
    <h2>过关 · 本局对照</h2>
    <p id="craftEvidenceLine" class="craft-evidence">本局证据将自动填入</p>
    <p id="craftEvidenceMeta" class="craft-evidence-meta" hidden></p>
    <div class="craft-attr" id="craftAttribution">
      <p class="craft-attr-label">就你这几发的对照来看，轨道半径主要跟着哪一项变？</p>
      <div class="craft-attr-options">
        <label><input type="radio" name="craftAttr" value="s-magnetic"> 主要是磁场 B</label>
        <label><input type="radio" name="craftAttr" value="s-velocity"> 主要是入射速度</label>
        <label><input type="radio" name="craftAttr" value="mixed"> 多参一起在变，说不清</label>
        <label><input type="radio" name="craftAttr" value="unsure"> 还不确定</label>
      </div>
      <p id="craftAttrHint" class="craft-attr-hint" hidden></p>
    </div>
    <div class="craft-reveal" id="craftReveal" hidden>
      <div class="formula" id="craftWinFormula">r = mv / (qB)</div>
      <p id="craftWinText">对照多组轨道，你摸清了半径如何随 B 与入射速度变化。</p>
      <p id="craftCv" class="craft-cv">腔压只改观感，不改 r=mv/(qB)（旁路）。</p>
    </div>
    <div class="craft-actions">
      <button type="button" id="craftWinBtn" disabled>再玩一次</button>
      <button type="button" id="craftBackBtn" class="craft-btn-secondary">返回列表</button>
    </div>
  </div>
</div>

<div id="essence-app">
  <div id="essence-stage">
    <div class="craft-mode-pill" id="craftModePill" data-mode="explore">
      <span id="modeLabel">探究模式</span>
      <span id="challengeStats">
        <span class="craft-mode-sep">|</span>
        <span>剩余机会</span>
        <span id="attemptsDisplay">5</span>
      </span>
      <span id="timerDisplay" hidden aria-hidden="true">10:00</span>
    </div>
    <div id="dual-mode-hud" hidden aria-hidden="true"></div>
    <div id="dual-timer-chip" class="dual-chip" hidden aria-hidden="true"></div>
    <canvas id="simCanvas"></canvas>
  </div>
  <aside id="essence-bench">
    <div class="bench-hd">
      <div class="bench-hd-text">
        <div class="bench-hd-title">束流控制台</div>
        <div class="bench-hd-sub">磁感应 · 入射速度</div>
      </div>
      <select id="modeSelect" aria-label="探究阶段">
        <option value="explore">探究</option>
        <option value="challenge">竞赛</option>
      </select>
    </div>
    <div class="essence-scroll" id="controlsPanel">
      <div class="side-goal-box">
        <div class="side-goal-cap">当前目标</div>
        <p id="sideGoal">调 B、v，看轨道半径怎么变。</p>
      </div>
      <div class="slider-group">
        <label for="s-magnetic">磁感应强度 B <span class="val" id="val-magnetic">1.0 T</span></label>
        <input type="range" id="s-magnetic" min="0.1" max="2.0" step="0.1" value="1.0">
      </div>
      <div class="slider-group">
        <label for="s-velocity">入射速度 v <span class="val" id="val-velocity">5.0 m/s</span></label>
        <input type="range" id="s-velocity" min="1" max="10" step="0.5" value="5.0">
      </div>
      <div class="slider-group">
        <label for="s-chamber-p">腔室气压 p <span class="val" id="val-pressure">1.0 atm</span></label>
        <input type="range" id="s-chamber-p" min="0.2" max="2.0" step="0.1" value="1.0">
      </div>
      <div class="observe-box pending" id="observeBox">
        <div><span class="val" id="rDisplay">—</span> <span style="font-size:12px;color:var(--craft-muted)">读数</span></div>
        <div class="hint" id="feedbackMsg">调参后点发射</div>
      </div>
    </div>
    <div class="essence-ft">
      <div class="row-buttons">
        <button type="button" id="btn-fire">发射</button>
        <button type="button" id="btn-reset" class="secondary">复位</button>
      </div>
    </div>
  </aside>
</div>

<!-- trace-adapter-hook -->
<script>
(function() {
    // ---------- 埋点模拟 (emit) ----------
    function emit(eventName, payload) {
        console.log(`[telemetry] ${eventName}`, JSON.stringify(payload));
        // 实际适配器可挂载 window.__traceAdapter
        if (window.__traceAdapter && typeof window.__traceAdapter.emit === 'function') {
            window.__traceAdapter.emit(eventName, payload);
        }
        try {
          if (window.PlatformTraceAdapter && typeof window.PlatformTraceAdapter.record === 'function') {
            window.PlatformTraceAdapter.record(eventName, payload || {});
          } else if (window.parent && window.parent !== window && window.parent.PlatformTraceAdapter && typeof window.parent.PlatformTraceAdapter.record === 'function') {
            window.parent.PlatformTraceAdapter.record(eventName, payload || {});
          }
        } catch (e) {}
    }

    // ---------- DOM 引用 ----------
    const canvas = document.getElementById('simCanvas');
    const CRAFT3 = {
      bg: 0x0a1218, mid: 0x1a2834, hi: 0x80d8e0, glow: 0x30c8d8,
      metal: 0x7a8490, accent: 0xffb347, ok: 0x6fae8f
    };
    let threeReady = false;
    let renderer, scene, camera, orbit, clock;
    let chamberGroup, particleMesh, orbitRing, trailLine, poleN, poleS, badgeSprite, extractRing;
    let labelN, labelS, labelExtract, labelBeam, labelB;
    let BArrowGroup;
    let floorMesh = null;
    let chamberLbl = null;
    /** 共轴根：舱体/磁极/提取环/轨道共用同一竖直轴，缩放不得平移环心 */
    let axisRoot = null;
    let apparatusRig = null; // 舱体+磁极：随大半径放大
    let beamRig = null;      // 提取环+轨道：真实米制，始终与舱心共轴
    /** 表现层：舱体随大半径放大，轨道/提取环仍按真实米制 1:1，不改判定 */
    const VIS_FIT_SAFE_R = 5.5; // 设计舱内舒适轨道上限（墙半径 7.2）
    const VIS_BEAM_Y = 1.6;     // 束流平面高度（共轴圆心）
    const CAM_BASE_DIST = 15;
    let visFitScale = 1;
    let lastCamFitScale = 1;

    function syncRendererSize() {
      const area = document.getElementById('essence-stage') || document.getElementById('simCanvasArea') || canvas.parentElement;
      const cssW = Math.max(2, (area && area.clientWidth) || canvas.clientWidth || 640);
      const cssH = Math.max(2, (area && area.clientHeight) || canvas.clientHeight || 420);
      if (renderer && camera) {
        const pr = Math.min(2, window.devicePixelRatio || 1);
        renderer.setPixelRatio(pr);
        renderer.setSize(cssW, cssH, false);
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
        camera.aspect = cssW / Math.max(1, cssH);
        camera.updateProjectionMatrix();
      }
      // keep 2d layout vars used by physics labeling
      centerX = cssW / 2;
      centerY = cssH / 2;
      scale = Math.min(cssW, cssH) / 10;
    }

    const canvasArea = document.getElementById('essence-stage') || document.getElementById('simCanvasArea');

    const sMag = document.getElementById('s-magnetic');
    const sVel = document.getElementById('s-velocity');
    const sPress = document.getElementById('s-chamber-p');
    const valMag = document.getElementById('val-magnetic');
    const valVel = document.getElementById('val-velocity');
    const valPress = document.getElementById('val-pressure');
    const feedbackMsg = document.getElementById('feedbackMsg');
    const rDisplay = document.getElementById('rDisplay');
    const observeBox = document.getElementById('observeBox');
    const btnFire = document.getElementById('btn-fire');
    const btnReset = document.getElementById('btn-reset');

    function setObserveState(state) {
      if (!observeBox) return;
      observeBox.classList.remove('pending', 'measured', 'ok', 'hit', 'fail', 'miss', 'measuring');
      if (state) observeBox.classList.add(state);
    }
    function setObserveReading(text) {
      if (rDisplay) rDisplay.textContent = text;
    }

    // ---------- 物理常量 ----------
    const MASS = 1.0;      // kg (固定)
    const CHARGE = 1.0;    // C (固定)

    // ---------- 仿真状态 ----------
    let simRunning = false;
    let animId = null;
    let lastTime = performance.now();

    // 粒子轨迹 (圆周运动)
    let angle = 0;          // 当前弧度
    let angularVel = 0;     // 角速度 rad/s
    let radius = 0;         // 轨道半径 m
    let centerX = 0, centerY = 0; // 画布坐标系圆心
    let scale = 60;         // 像素/米 (根据画布动态调整)

    // 目标半径范围：探究可观察；竞赛 FixedChallenge 进入时锁定一次
    let TARGET_R_MIN = 2.0;
    let TARGET_R_MAX = 3.5;
    let playMode = 'explore';
    let lockedBand = null; // { min, max } 竞赛锁定
    let challengeWon = false;
    /** 竞赛过关：先转圆轨再 emit/ShowWin，避免总结盖住轨道 */
    let challengeWinTimer = null;
    /** 仅发射后揭示轨道半径 r */
    let measuredR = null;
    /** 轨道尾迹（纯视觉） */
    let orbitTrail = [];
    let trailTick = 0;

    // 是否已经过关 (防止重复触发)
    let hasWon = false;

    function clearChallengeWinTimer() {
      if (challengeWinTimer) {
        clearTimeout(challengeWinTimer);
        challengeWinTimer = null;
      }
    }
    function challengeWinDelayMs() {
      // 约 1 圈，并夹在 0.8–1.2s，保证圆轨可见
      const periodMs = angularVel > 1e-6 ? (2 * Math.PI / angularVel) * 1000 : 1000;
      return Math.max(800, Math.min(1200, periodMs));
    }

    const MODE_GOALS = {
      explore: {
        hud: '试射：观察半径随 B、v 变化',
        side: '调 B、v，看轨道半径怎么变。'
      },
      challenge: {
        hud: '限次把轨道打进本局提取环（打偏不换环）',
        side: '限次把轨道打进本局提取环（打偏不换环）。'
      }
    };

    function refreshCycloGoals() {
      const g = MODE_GOALS[playMode] || MODE_GOALS.explore;
      const side = document.getElementById('sideGoal');
      if (playMode === 'challenge' && lockedBand) {
        const lo = lockedBand.min.toFixed(1);
        const hi = lockedBand.max.toFixed(1);
        if (side) side.textContent = '竞赛急单：把轨道半径调进 ' + lo + '–' + hi + ' m 提取环。环带已锁定，打偏不换环。';
      } else {
        if (side) side.textContent = g.side;
      }
    }

    /** FixedChallenge：仅进入竞赛时锁定一次提取环带 */
    function lockChallengeBand() {
      const mid = 1.6 + Math.random() * 1.8; // 1.6–3.4
      const half = 0.25 + Math.random() * 0.25; // 带宽 0.5–1.0
      lockedBand = {
        min: Math.max(0.8, mid - half),
        max: Math.min(4.0, mid + half)
      };
      TARGET_R_MIN = lockedBand.min;
      TARGET_R_MAX = lockedBand.max;
      // 开局张力：默认参数往往偏出环带（r≈0.75）
      sMag.value = '2.0';
      sVel.value = '1.5';
      clearChallengeWinTimer();
      challengeWon = false;
      hasWon = false;
      syncUI();
      recalcPhysics();
      refreshCycloGoals();
      setObserveState('pending');
      setObserveReading('—');
      if (feedbackMsg) feedbackMsg.textContent = '急单已锁定提取环（本局不变）';
      drawStatic();
    }

    function applyExploreBand() {
      lockedBand = null;
      clearChallengeWinTimer();
      challengeWon = false;
      hasWon = false;
      TARGET_R_MIN = 2.0;
      TARGET_R_MAX = 3.5;
      sMag.value = '1.0';
      sVel.value = '5.0';
      syncUI();
      recalcPhysics();
      refreshCycloGoals();
      setObserveState('pending');
      setObserveReading('—');
      if (feedbackMsg) feedbackMsg.textContent = '调参后点发射，观察半径随 B、v 的变化。';
      drawStatic();
    }

    window.__cycloApplyMode = function(mode) {
      playMode = mode === 'challenge' ? 'challenge' : 'explore';
      if (playMode === 'challenge') lockChallengeBand();
      else applyExploreBand();
    };

    // ---------- 画布尺寸 (DPR) ----------
    // iframe 首帧可能 clientWidth/Height≈0；过小时不写入近零尺寸，延后重试
    let _canvasResizeRetry = 0;
    const CANVAS_RESIZE_RETRY_MAX = 12;

    function afterCanvasResize() {
        if (!simRunning) drawStatic();
    }

    function scheduleCanvasResizeRetry() {
        if (_canvasResizeRetry >= CANVAS_RESIZE_RETRY_MAX) return;
        _canvasResizeRetry++;
        const n = _canvasResizeRetry;
        requestAnimationFrame(function() {
            if (resizeCanvas()) afterCanvasResize();
        });
        if (n === 1 || n === 3 || n === 6) {
            setTimeout(function() {
                if (resizeCanvas()) afterCanvasResize();
            }, 40 * n);
        }
    }

    function resizeCanvas() {
        const area = canvasArea || canvas.parentElement;
        const w = area ? area.clientWidth : 0;
        const h = area ? area.clientHeight : 0;
        if (w < 2 || h < 2) {
            scheduleCanvasResizeRetry();
            return false;
        }
        _canvasResizeRetry = 0;
        syncRendererSize();
        const maxDim = Math.min(w, h) * 0.38;
        scale = Math.max(30, maxDim / 4.5);
        centerX = w / 2;
        centerY = h / 2;
        return true;
    }

    // ---------- 更新物理 (根据当前滑条) ----------
    function recalcPhysics() {
        const B = parseFloat(sMag.value);
        const v = parseFloat(sVel.value);
        // 回旋半径 r = mv/(qB)
        if (B > 0.001) {
            radius = MASS * v / (CHARGE * B);
        } else {
            radius = 999;
        }
        // 角速度 ω = qB/m (rad/s)
        angularVel = CHARGE * B / MASS;
    }

    /** 视觉焦点半径（m）：取目标环、预测 r、实测 r 的较大者 */
    function computeVisFocusR() {
        let focus = Math.max(TARGET_R_MAX, 3.5);
        const B = Math.max(0.001, parseFloat(sMag.value) || 0.001);
        const v = parseFloat(sVel.value) || 0;
        const pred = MASS * v / (CHARGE * B);
        if (pred > 0 && pred < 500) focus = Math.max(focus, pred);
        if (measuredR != null && measuredR > 0 && measuredR < 500) {
            focus = Math.max(focus, measuredR);
        }
        return focus;
    }

    function computeVisFitScale() {
        return Math.max(1, computeVisFocusR() / VIS_FIT_SAFE_R);
    }

    /** 强制舱心 / 磁极轴 / 提取环 / 轨道共轴（仅允许绕竖直轴，禁止平移错心） */
    function lockCoaxialCenters() {
        if (axisRoot) axisRoot.position.set(0, 0, 0);
        if (apparatusRig) {
            apparatusRig.position.set(0, 0, 0);
            apparatusRig.rotation.set(0, 0, 0);
        }
        if (beamRig) {
            beamRig.position.set(0, 0, 0);
            beamRig.rotation.set(0, 0, 0);
            beamRig.scale.set(1, 1, 1);
        }
        if (chamberGroup) chamberGroup.position.set(0, 0, 0);
        if (floorMesh) floorMesh.position.set(0, 0, 0);
        if (poleN) poleN.position.set(0, 3.5, 0);
        if (poleS) poleS.position.set(0, -0.1, 0);
        if (BArrowGroup) BArrowGroup.position.set(0, 0, 0);
        if (extractRing) extractRing.position.set(0, VIS_BEAM_Y, 0);
        if (orbitRing) orbitRing.position.set(0, VIS_BEAM_Y, 0);
        if (orbit) orbit.target.set(0, VIS_BEAM_Y, 0);
    }

    function applyApparatusScale(s) {
        // 只放大舱体装置；不改 beamRig，避免环心与舱心相对漂移
        if (apparatusRig) apparatusRig.scale.setScalar(s);
        lockCoaxialCenters();
        // 角落说明牌跟着舱体尺度外移（装饰，非圆心）
        if (badgeSprite) badgeSprite.position.set(-5.2 * s, 4.2 + 0.8 * s, 3 * s);
        if (labelExtract) {
            // 标签挂在场景里：z 用真实米制半径，保持相对提取环
            const midR = (TARGET_R_MIN + TARGET_R_MAX) / 2;
            labelExtract.position.set(0, 2.35, Math.max(2.2, midR + 0.6));
        }
    }

    function applyVisCameraFit(fitScale) {
        if (!camera) return;
        if (scene && scene.fog) {
            scene.fog.near = 12 * fitScale;
            scene.fog.far = 42 * fitScale;
        }
        camera.near = 0.1;
        camera.far = Math.max(100, 90 * fitScale);
        camera.updateProjectionMatrix();
        if (!orbit) return;
        orbit.target.set(0, VIS_BEAM_Y, 0);
        const target = orbit.target;
        const desired = CAM_BASE_DIST * fitScale;
        const cur = camera.position.distanceTo(target);
        const scaleJump = Math.abs(fitScale - lastCamFitScale) > 0.03;
        if (scaleJump || cur < desired * 0.72 || cur > desired * 1.55) {
            const dir = camera.position.clone().sub(target);
            if (dir.lengthSq() < 1e-8) dir.set(6, 8, 12);
            dir.normalize().multiplyScalar(desired);
            camera.position.copy(target).add(dir);
            lastCamFitScale = fitScale;
        }
        orbit.minDistance = Math.max(4, 4.5 * fitScale);
        orbit.maxDistance = Math.max(24, 32 * fitScale);
    }

    function updateVisFit() {
        visFitScale = computeVisFitScale();
        applyApparatusScale(visFitScale);
        applyVisCameraFit(visFitScale);
    }

    // ---------- 更新读数 & 滑条同步 ----------
    function syncUI() {
        const B = parseFloat(sMag.value);
        const v = parseFloat(sVel.value);
        const p = sPress ? parseFloat(sPress.value) : 1;
        valMag.textContent = B.toFixed(1) + ' T';
        valVel.textContent = v.toFixed(1) + ' m/s';
        if (valPress) valPress.textContent = p.toFixed(1) + ' atm';
    }

    // 滑条事件绑定 (双向同步 + 埋点)
    // 调参时收回实测半径虚线，避免边拖边看到 r 结论
    // UI stays live on input; telemetry only on change (one event per gesture).
    function onTuneControl(controlId, value) {
        if (simRunning) stopSim();
        measuredR = null;
        angle = 0;
        orbitTrail = [];
        trailTick = 0;
        syncUI();
        recalcPhysics();
        drawStatic();
        setObserveState('pending');
        setObserveReading('—');
        if (feedbackMsg) feedbackMsg.textContent = '调节中… 点「发射」后显示轨道半径';
    }
    function emitTune(controlId, value) {
        if (window.__platformTraceControlsBound) return;
        emit('tuning', { controlId: controlId, value: value, timestamp: Date.now() });
    }
    sMag.addEventListener('input', function() {
        onTuneControl('s-magnetic', parseFloat(this.value));
    });
    sMag.addEventListener('change', function() {
        emitTune('s-magnetic', parseFloat(this.value));
    });
    sVel.addEventListener('input', function() {
        onTuneControl('s-velocity', parseFloat(this.value));
    });
    sVel.addEventListener('change', function() {
        emitTune('s-velocity', parseFloat(this.value));
    });
    if (sPress) {
      sPress.addEventListener('input', function() {
        syncUI();
        if (!simRunning) drawStatic();
      });
      sPress.addEventListener('change', function() {
        emitTune('s-chamber-p', parseFloat(this.value));
      });
    }

    // ---------- 绘制 (静态/动态) ----------
    function makeLabelSprite(text, opts) {
      opts = opts || {};
      const c = document.createElement('canvas');
      c.width = opts.w || 256; c.height = opts.h || 96;
      const g = c.getContext('2d');
      g.fillStyle = 'rgba(10,18,24,0.85)';
      g.fillRect(0, 0, c.width, c.height);
      g.strokeStyle = 'rgba(128,216,224,0.5)';
      g.strokeRect(4, 4, c.width - 8, c.height - 8);
      g.fillStyle = '#80d8e0';
      g.font = 'bold ' + (opts.fontSize || 26) + 'px "Microsoft YaHei",sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      String(text).split('\n').forEach(function(line, i, arr) {
        g.fillText(line, c.width / 2, c.height / 2 + (i - (arr.length - 1) / 2) * 26);
      });
      const tex = new THREE.CanvasTexture(c);
      const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
      spr.scale.set(opts.sx || 2.4, opts.sy || 0.85, 1);
      spr.userData = { tex: tex, canvas: c, g: g, opts: opts };
      return spr;
    }

    function updateSpriteText(spr, text) {
      if (!spr || !spr.userData || !spr.userData.g) return;
      const c = spr.userData.canvas, g = spr.userData.g, opts = spr.userData.opts || {};
      g.clearRect(0, 0, c.width, c.height);
      g.fillStyle = 'rgba(10,18,24,0.85)';
      g.fillRect(0, 0, c.width, c.height);
      g.strokeStyle = 'rgba(128,216,224,0.5)';
      g.strokeRect(4, 4, c.width - 8, c.height - 8);
      g.fillStyle = '#80d8e0';
      g.font = 'bold ' + (opts.fontSize || 26) + 'px "Microsoft YaHei",sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      String(text).split('\n').forEach(function(line, i, arr) {
        g.fillText(line, c.width / 2, c.height / 2 + (i - (arr.length - 1) / 2) * 26);
      });
      spr.userData.tex.needsUpdate = true;
    }

    function createChamber() {
      axisRoot = new THREE.Group();
      axisRoot.name = 'axisRoot';
      apparatusRig = new THREE.Group();
      apparatusRig.name = 'apparatusRig';
      beamRig = new THREE.Group();
      beamRig.name = 'beamRig';
      axisRoot.add(apparatusRig);
      axisRoot.add(beamRig);
      scene.add(axisRoot);

      floorMesh = new THREE.Mesh(
        new THREE.CircleGeometry(8, 48),
        new THREE.MeshStandardMaterial({ color: 0x1a2834, roughness: 0.85, metalness: 0.15 })
      );
      floorMesh.rotation.x = -Math.PI / 2;
      floorMesh.receiveShadow = true;
      apparatusRig.add(floorMesh);

      chamberGroup = new THREE.Group();
      const wall = new THREE.Mesh(
        new THREE.CylinderGeometry(7.2, 7.2, 3.2, 48, 1, true),

          color: 0x243848, metalness: 0.35, roughness: 0.55,

        })
      );
      wall.position.y = VIS_BEAM_Y;
      chamberGroup.add(wall);
      const rim = new THREE.Mesh(
        new THREE.TorusGeometry(7.2, 0.08, 8, 48),

      );
      rim.rotation.x = Math.PI / 2;
      rim.position.y = 3.2;
      chamberGroup.add(rim);
      apparatusRig.add(chamberGroup);
      chamberLbl = makeLabelSprite('真空腔外壁', { w: 160, h: 44, fontSize: 18, sx: 1.25, sy: 0.34 });
      chamberLbl.position.set(-5.6, 3.0, 2.5);
      apparatusRig.add(chamberLbl);

      poleN = new THREE.Mesh(
        new THREE.CylinderGeometry(2.8, 2.8, 0.35, 32),
        new THREE.MeshStandardMaterial({ color: 0xe06060, metalness: 0.4, roughness: 0.45, emissive: 0x601010, emissiveIntensity: 0.2 })
      );
      poleN.position.set(0, 3.5, 0);
      apparatusRig.add(poleN);
      poleS = new THREE.Mesh(
        new THREE.CylinderGeometry(2.8, 2.8, 0.35, 32),
        new THREE.MeshStandardMaterial({ color: 0x6080e0, metalness: 0.4, roughness: 0.45, emissive: 0x102060, emissiveIntensity: 0.2 })
      );
      poleS.position.set(0, -0.1, 0);
      apparatusRig.add(poleS);
      labelN = makeLabelSprite('磁极 N', { w: 120, h: 44, fontSize: 20, sx: 1.0, sy: 0.36 });
      labelN.position.set(0, 4.05, 0);
      apparatusRig.add(labelN);
      labelS = makeLabelSprite('磁极 S', { w: 120, h: 44, fontSize: 20, sx: 1.0, sy: 0.36 });
      labelS.position.set(0, 0.45, 2.6);
      apparatusRig.add(labelS);

      BArrowGroup = new THREE.Group();
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        const arrow = new THREE.Mesh(
          new THREE.ConeGeometry(0.12, 0.45, 8),
          new THREE.MeshBasicMaterial({ color: CRAFT3.hi, transparent: true, opacity: 0.7 })
        );
        arrow.position.set(Math.cos(a) * 3.2, 1.7, Math.sin(a) * 3.2);
        arrow.rotation.x = Math.PI;
        BArrowGroup.add(arrow);
      }
      apparatusRig.add(BArrowGroup);
      labelB = makeLabelSprite('B ↓', { w: 90, h: 44, fontSize: 22, sx: 0.8, sy: 0.34 });
      labelB.position.set(4.2, 2.4, 0);
      apparatusRig.add(labelB);

      extractRing = new THREE.Mesh(
        new THREE.TorusGeometry(2.75, 0.08, 10, 64),
        new THREE.MeshStandardMaterial({ color: CRAFT3.ok, emissive: CRAFT3.ok, emissiveIntensity: 0.35 })
      );
      extractRing.rotation.x = Math.PI / 2;
      extractRing.position.set(0, VIS_BEAM_Y, 0);
      beamRig.add(extractRing);
      labelExtract = makeLabelSprite('提取环（目标半径）', { w: 240, h: 48, fontSize: 18, sx: 1.85, sy: 0.38 });
      labelExtract.position.set(0, 2.35, 3.4);
      scene.add(labelExtract); // 屏幕向标签，位置每帧按米制半径更新

      orbitRing = new THREE.Mesh(
        new THREE.TorusGeometry(2.5, 0.04, 8, 64),
        new THREE.MeshStandardMaterial({ color: CRAFT3.accent, emissive: CRAFT3.glow, emissiveIntensity: 0.25 })
      );
      orbitRing.rotation.x = Math.PI / 2;
      orbitRing.position.set(0, VIS_BEAM_Y, 0);
      orbitRing.visible = false;
      beamRig.add(orbitRing);

      particleMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.18, 14, 14),
        new THREE.MeshStandardMaterial({ color: CRAFT3.accent, emissive: CRAFT3.glow, emissiveIntensity: 0.6 })
      );
      particleMesh.position.set(2.5, VIS_BEAM_Y, 0);
      particleMesh.visible = false;
      beamRig.add(particleMesh);
      labelBeam = makeLabelSprite('束流', { w: 100, h: 44, fontSize: 20, sx: 0.85, sy: 0.34 });
      labelBeam.position.set(2.5, 2.15, 0);
      labelBeam.visible = false;
      beamRig.add(labelBeam);

      badgeSprite = makeLabelSprite('绿环=提取目标', { w: 220, h: 48, fontSize: 18, sx: 1.7, sy: 0.38 });
      badgeSprite.position.set(-5.2, 5.0, 3);
      scene.add(badgeSprite);

      lockCoaxialCenters();

    function initThree() {
      if (typeof THREE === 'undefined') {
        console.error('Three.js missing');
        return false;
      }
      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.setClearColor(CRAFT3.bg, 1);
      scene = new THREE.Scene();
      scene.background = new THREE.Color(CRAFT3.bg);
      scene.fog = new THREE.Fog(CRAFT3.bg, 16, 40);
      camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
      camera.position.set(6, 8, 12);
      if (typeof THREE.OrbitControls !== 'undefined') {
        orbit = new THREE.OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;
        orbit.dampingFactor = 0.06;
        orbit.target.set(0, 1.6, 0);
        orbit.minDistance = 6;
        orbit.maxDistance = 24;
        orbit.maxPolarAngle = Math.PI * 0.49;
      }
      scene.add(new THREE.AmbientLight(0xa8c0d0, 0.4));
      const dir = new THREE.DirectionalLight(0xe8f4ff, 0.85);
      dir.position.set(8, 14, 10);
      dir.castShadow = true;
      scene.add(dir);
      createChamber();
      clock = new THREE.Clock();
      threeReady = true;
      syncRendererSize();
      return true;
    }

    function clearTrail3d() {
      if (trailLine) {
        if (trailLine.parent) trailLine.parent.remove(trailLine);
        else if (scene) scene.remove(trailLine);
        trailLine.geometry.dispose();
        trailLine = null;
      }
    }

    function updateTrail3d(points) {
      clearTrail3d();
      if (!points || points.length < 2) return;
      const pts = points.map(function(p) { return new THREE.Vector3(p.x, p.y, p.z); });
      trailLine = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: CRAFT3.glow, transparent: true, opacity: 0.7 })
      );
      if (beamRig) beamRig.add(trailLine);
      else scene.add(trailLine);
    }

    function drawStatic() {
      draw();
    }

    function draw() {
      if (!threeReady) return;
      syncRendererSize();
      updateVisFit();
      lockCoaxialCenters();
      const B = parseFloat(sMag.value) || 0;
      const bN = Math.min(1, B / 2);
      poleN.material.emissiveIntensity = 0.15 + bN * 0.45;
      poleS.material.emissiveIntensity = 0.15 + bN * 0.45;
      BArrowGroup.children.forEach(function(a) {
        a.material.opacity = 0.25 + bN * 0.7;
        a.material.transparent = true;
        a.scale.setScalar(0.7 + bN * 0.6);
      });

      const midR = (TARGET_R_MIN + TARGET_R_MAX) / 2;
      // 提取环 / 轨道：真实米制，圆心锁定在轴上；舱体由 apparatusRig 放大兜住大半径
      extractRing.position.set(0, VIS_BEAM_Y, 0);
      extractRing.scale.setScalar(Math.max(0.35, midR / 2.75));
      extractRing.material.emissiveIntensity = 0.25 + (playMode === 'challenge' ? 0.2 : 0);
      if (labelExtract) {
        labelExtract.position.set(0, 2.35, Math.max(2.2, midR + 0.6));
        updateSpriteText(labelExtract, playMode === 'challenge' ? '提取环（本局目标）' : '提取环（目标半径）');
      }

      if (measuredR != null && measuredR > 0 && measuredR < 500) {
        const rWorld = Math.max(0.4, measuredR);
        orbitRing.visible = true;
        orbitRing.position.set(0, VIS_BEAM_Y, 0);
        orbitRing.scale.setScalar(rWorld / 2.5);
        const px = Math.cos(angle) * rWorld;
        const pz = Math.sin(angle) * rWorld;
        particleMesh.visible = true;
        particleMesh.position.set(px, VIS_BEAM_Y, pz);
        if (labelBeam) {
          labelBeam.visible = true;
          labelBeam.position.set(px, VIS_BEAM_Y + 0.55, pz);
        }
        if (simRunning) {
          trailTick++;
          if (trailTick % 2 === 0) {
            if (!window.__orbitTrail3d) window.__orbitTrail3d = [];
            window.__orbitTrail3d.push({ x: px, y: VIS_BEAM_Y, z: pz });
            if (window.__orbitTrail3d.length > 120) window.__orbitTrail3d.shift();
            updateTrail3d(window.__orbitTrail3d);
          }
        }
        const inBand = measuredR >= TARGET_R_MIN && measuredR <= TARGET_R_MAX;
        orbitRing.material.color.setHex(inBand ? CRAFT3.ok : CRAFT3.accent);
        orbitRing.material.emissiveIntensity = inBand ? 0.45 : 0.2;
      } else {
        orbitRing.visible = false;
        particleMesh.visible = false;
        if (labelBeam) labelBeam.visible = false;
        clearTrail3d();
        window.__orbitTrail3d = [];
      }

      let label = '绿环=提取目标';
      if (measuredR != null) label += '\n束流轨道 r=' + measuredR.toFixed(2) + 'm';
      else label += '\n点发射看轨道';
      if (visFitScale > 1.05) {
        label += '\n舱体已放大（B小→r大）';
      }
      updateSpriteText(badgeSprite, label);

      if (orbit) orbit.update();
      if (renderer && scene && camera) renderer.render(scene, camera);
    }
    function update(dt) {
        if (!simRunning) return;
        // 角速度更新角度
        const deltaAngle = angularVel * (dt / 1000);
        angle += deltaAngle;
        // 角度归一化
        if (angle > 2 * Math.PI) angle -= 2 * Math.PI;
    }

    // ---------- RAF 循环 ----------
    function loop(now) {
        const dt = Math.min(50, now - lastTime);
        lastTime = now;
        update(dt);
        draw();
        animId = requestAnimationFrame(loop);
    }


    /** OrbitControls damping needs a live RAF; keep rendering even when particle is idle. */
    function ensureRenderLoop() {
        if (animId) return;
        lastTime = performance.now();
        animId = requestAnimationFrame(loop);
    }

    if (!initThree()) {
      if (feedbackMsg) feedbackMsg.textContent = '3D engine missing: vendor/three.min.js';
    } else {
      resizeCanvas();
      draw();
      ensureRenderLoop();
    }

    function startSim() {
        if (simRunning) return;
        simRunning = true;
        hasWon = false; // 重置过关状态
        /* win via craft-win */
        // 重置角度 (从0开始)
        angle = 0;
        recalcPhysics();
        syncUI();
        lastTime = performance.now();
        ensureRenderLoop();
    }

    function stopSim() {
        // Pause particle physics only; do not cancel RAF (pre-fire / reset still need orbit).
        simRunning = false;
    }

    function ensureFeedbackVisible() {
        const area = document.getElementById('observeBox') || document.getElementById('observeArea');
        const panel = document.getElementById('controlsPanel');
        if (panel && area) {
          const pr = panel.getBoundingClientRect();
          const ar = area.getBoundingClientRect();
          if (ar.bottom > pr.bottom - 2 || ar.top < pr.top + 2) {
            panel.scrollTop = Math.max(0, panel.scrollHeight - panel.clientHeight);
          }
        }
    }

    // ---------- 发射/测试 ----------
    function fire() {
        // 停止当前动画
        stopSim();
        // 重置角度
        angle = 0;
        orbitTrail = [];
        trailTick = 0;
        recalcPhysics();
        syncUI();
        const r = radius;
        measuredR = r;
        const controlsSnapshot = {
            's-magnetic': parseFloat(sMag.value),
            's-velocity': parseFloat(sVel.value)
        };

        if (playMode === 'explore') {
            // 探究：只反馈半径，不要求命中固定环，不重抽目标
            setObserveState('measured');
            setObserveReading('r≈' + r.toFixed(2) + ' m');
            if (feedbackMsg) feedbackMsg.textContent = 'r≈' + r.toFixed(2) + ' m · 再改一个量对照';
            emit('snapshot', { controls: controlsSnapshot, winOk: false, hintKey: 'explore_observe' });
            try { if (window.__noteExploreSuccess) window.__noteExploreSuccess(typeof emit === 'function' ? emit : (window.__emit || null), (typeof controlsSnapshot !== 'undefined' ? controlsSnapshot : (typeof controls !== 'undefined' ? controls : {}))); } catch (_es) {}
            ensureFeedbackVisible();
            startSim();
            return;
        }

        // 竞赛：命中本局锁定环带；失败不换环
        const winOk = (r >= TARGET_R_MIN && r <= TARGET_R_MAX);
        const bandTxt = TARGET_R_MIN.toFixed(1) + '–' + TARGET_R_MAX.toFixed(1);
        const measuredTxt = 'r≈' + r.toFixed(2) + ' m';
        if (winOk) {
            setObserveState('ok');
            setObserveReading(measuredTxt);
            if (feedbackMsg) {
              feedbackMsg.textContent = (window.CraftFeedback
                ? CraftFeedback.hitHint({ measured: measuredTxt, band: bandTxt })
                : ('已落入 · ' + measuredTxt + '（目标 ' + bandTxt + '）'));
            }
            if (!challengeWon) {
              // 先置位 + 侧栏；先转圆轨，再 emit/ShowWin（壳层会把 win 钩成立刻弹总结）
              challengeWon = true;
              try { window.__legacyWinEmitted = true; } catch (e0) {}
              emit('snapshot', { controls: controlsSnapshot, winOk: true, hintKey: 'cyclo_rush' });
              ensureFeedbackVisible();
              startSim();
              clearChallengeWinTimer();
              challengeWinTimer = setTimeout(function() {
                challengeWinTimer = null;
                if (playMode !== 'challenge' || !challengeWon) return;
                const emitLater = window.__emit || emit;
                if (emitLater) emitLater('win', { winOk: true });
                if (typeof window.__craftShowWin === 'function') {
                  window.__craftShowWin('提取环本局锁定。半径 r=mv/(qB)：B 增大半径缩小，v 增大半径变大。');
                }
              }, challengeWinDelayMs());
            } else {
              ensureFeedbackVisible();
              startSim();
            }
            hasWon = true;
        } else {
            // FixedChallenge：失败不换环；偏大/偏小可区分
            const verdict = r < TARGET_R_MIN ? 'low' : 'high';
            const hintKey = r < TARGET_R_MIN ? 'r_low' : 'r_high';
            setObserveState('fail');
            setObserveReading(measuredTxt);
            if (feedbackMsg) {
              feedbackMsg.textContent = (window.CraftFeedback
                ? CraftFeedback.missHint({ verdict: verdict, measured: measuredTxt, band: bandTxt })
                : ((verdict === 'low' ? '偏低' : '偏高') + ' · ' + measuredTxt + '（目标 ' + bandTxt + '）· 调参后再测'));
            }
            emit('snapshot', { controls: controlsSnapshot, winOk: false, hintKey: hintKey });
            ensureFeedbackVisible();
            startSim();
        }
    }

    // ---------- 复位 ----------
    function resetSim() {
        stopSim();
        angle = 0;
        measuredR = null;
        orbitTrail = [];
        trailTick = 0;
        recalcPhysics();
        syncUI();
        drawStatic();
        setObserveState('pending');
        setObserveReading('—');
        if (feedbackMsg) feedbackMsg.textContent = '已复位，读数待测 · 点发射后显示半径';
        hasWon = false;
    }

    // ---------- 事件绑定 ----------
    btnFire.addEventListener('click', fire);
    btnReset.addEventListener('click', resetSim);

    // ---------- 初始化 ----------
    function init() {
        resizeCanvas();
        recalcPhysics();
        syncUI();
        refreshCycloGoals();
        drawStatic();
        setObserveState('pending');
        setObserveReading('—');
        if (feedbackMsg) feedbackMsg.textContent = '调参后点发射';
        // 窗口resize
        window.addEventListener('resize', () => {
            if (resizeCanvas()) afterCanvasResize();
        });
        // 观察舞台区域：iframe/flex 布局变化时恢复尺寸与重绘
        if (typeof ResizeObserver !== 'undefined' && canvasArea) {
            new ResizeObserver(function() {
                if (resizeCanvas()) afterCanvasResize();
            }).observe(canvasArea);
        }
        // 模拟埋点适配器 (开发用)
        window.__traceAdapter = {
            emit: (evt, data) => console.log(`[adapter] ${evt}`, data)
        };
    }

    init();

    // 额外: 滑条埋点 (irrelevant_touch 示例, 无I1控件, 但保留)
    // 无I1控件, 忽略

    // 暴露 emit 给全局 (调试)
    window.__emit = emit;
    window.__cycloVisDebug = function() {
      const wallWorldR = 7.2 * (apparatusRig ? apparatusRig.scale.x : 1);
      const partR = particleMesh && particleMesh.visible
        ? Math.hypot(particleMesh.position.x, particleMesh.position.z) : null;
      const er = extractRing ? {
        x: extractRing.position.x, y: extractRing.position.y, z: extractRing.position.z,
        scale: extractRing.scale.x
      } : null;
      const or = orbitRing ? {
        x: orbitRing.position.x, y: orbitRing.position.y, z: orbitRing.position.z,
        scale: orbitRing.scale.x, visible: orbitRing.visible
      } : null;
      const pn = poleN ? { x: poleN.position.x, z: poleN.position.z } : null;
      return {
        visFitScale: visFitScale,
        focusR: computeVisFocusR(),
        measuredR: measuredR,
        radius: radius,
        wallWorldR: wallWorldR,
        particleR: partR,
        insideChamber: partR == null ? null : partR < wallWorldR * 0.98,
        coaxial: !!(er && or && pn &&
          Math.abs(er.x) < 1e-6 && Math.abs(er.z) < 1e-6 &&
          Math.abs(or.x) < 1e-6 && Math.abs(or.z) < 1e-6 &&
          Math.abs(pn.x) < 1e-6 && Math.abs(pn.z) < 1e-6 &&
          beamRig && Math.abs(beamRig.position.x) < 1e-6 && Math.abs(beamRig.position.z) < 1e-6 &&
          apparatusRig && Math.abs(apparatusRig.position.x) < 1e-6 && Math.abs(apparatusRig.position.z) < 1e-6),
        extract: er,
        orbitRing: or,
        poleN: pn,
        camDist: (camera && orbit) ? camera.position.distanceTo(orbit.target) : null
      };
    };

})();
</script>

  function scanWinText() {

  }
  function scheduleScanWinText(muts) {
    if (window.__legacyWinEmitted || window.__craftWinOpen || window.__craftWinDismissed) return;
    if (__legacyWinScanTimer) return;
    __legacyWinScanTimer = setTimeout(function() {
      __legacyWinScanTimer = null;
      var suspect = !muts || !muts.length;
      if (!suspect) {
        for (var i = 0; i < muts.length && !suspect; i++) {
          var m = muts[i];
          if (m.type === 'characterData') {
            var pt = m.target && m.target.parentElement;
            var t = ((pt && (pt.innerText || pt.textContent)) || (m.target && m.target.data) || '').slice(0, 240);
            if (/过关|命中|胜利|🏆|🎯/.test(t)) suspect = true;
          } else if (m.addedNodes && m.addedNodes.length) {
            for (var j = 0; j < m.addedNodes.length; j++) {
              var node = m.addedNodes[j];
              if (!node || (node.nodeType !== 1 && node.nodeType !== 3)) continue;
              var tx = node.nodeType === 3
                ? (node.data || '')
                : ((node.innerText || node.textContent || '') + ' ' + (node.className || '') + ' ' + (node.id || ''));
              if (/过关|命中|胜利|🏆|🎯|win-banner|win-badge|pass-badge|winBanner/.test(tx)) {
                suspect = true;
                break;
              }
            }
          }
        }
      }
      if (suspect) scanWinText();
    }, 200);
  }
  document.addEventListener('DOMContentLoaded', function() {
    var obs = new MutationObserver(function(muts) { scheduleScanWinText(muts); });
    if (document.body) obs.observe(document.body, { subtree: true, childList: true, characterData: true });
    setInterval(function(){
      if (!window.__legacyWinEmitted && !window.__craftWinOpen && !window.__craftWinDismissed) scanWinText();
    }, 2000);
  });
})();

<script>
/* === dual-mode-shell runtime (auto) === */
(function(){
  if (window.__dualModeShell) return;
  window.__dualModeShell = true;

  var MAX_ATTEMPTS = 5;
  var EXPLORE_SECONDS = 10 * 60;
  var state = {
    mode: 'explore',
    attempts: MAX_ATTEMPTS,
    timeLeft: EXPLORE_SECONDS,
    timerId: null
  };

  function $(id){ return document.getElementById(id); }

  function setPhase(phase){
    try {
      if (typeof window.__platformTraceSetPhase === 'function') {
        window.__platformTraceSetPhase(phase);
      } else if (window.PlatformTraceAdapter && typeof window.PlatformTraceAdapter.setPhase === 'function') {
        window.PlatformTraceAdapter.setPhase(phase);
      }
    } catch (e) { /* offline */ }
  }

  function fmt(sec){
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function renderAttempts(){
    var el = $('attemptsDisplay');
    if (el) el.textContent = String(state.attempts);
  }

  function primaryButtons(){
    return Array.prototype.slice.call(document.querySelectorAll(
      '#essence-bench .essence-ft button, #essence-bench button.btn, #essence-bench button[id^="btn"]'
    ));
  }

  function gateActions(){
    var disable = state.mode === 'challenge' && state.attempts <= 0;
    primaryButtons().forEach(function(btn){
      if (/reset|清除|重置|再来/i.test(btn.textContent || '') || /reset|clear/i.test(btn.id || '')) return;
      btn.classList.toggle('dual-disabled', disable);
      if (disable) btn.setAttribute('disabled', 'disabled');
      else btn.removeAttribute('disabled');
    });
  }

  function stopTimer(){
    if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
  }

  function startExploreTimer(){
    stopTimer();
    state.timeLeft = EXPLORE_SECONDS;
    var td = $('timerDisplay');
    if (td) td.textContent = fmt(state.timeLeft);
    state.timerId = setInterval(function(){
      if (state.mode !== 'explore') return;
      state.timeLeft -= 1;
      if (td) td.textContent = fmt(Math.max(0, state.timeLeft));
      if (state.timeLeft <= 0) {
        stopTimer();
        var sel = $('modeSelect');
        if (sel) {
          sel.value = 'challenge';
          sel.dispatchEvent(new Event('change', { bubbles: true }));
        }
      }
    }, 1000);
  }

  function applyMode(mode){
    hideAttemptsExhausted();
    var __nextMode = mode === 'challenge' ? 'challenge' : 'explore';
    if (__nextMode === 'challenge' && __exhaustedNeedsNewRound) {
      __exhaustedNeedsNewRound = false;
      try { if (typeof window.__platformTraceRequestNewRound === 'function') window.__platformTraceRequestNewRound('exhausted_mode_reenter'); } catch (__nr) {}
    }
    state.mode = __nextMode;
    var label = $('modeLabel');
    var stats = $('challengeStats');
    var timerChip = $('dual-timer-chip');
    var pill = $('craftModePill');
    if (label) label.textContent = state.mode === 'explore' ? '探究模式' : '竞赛模式';
    if (pill) pill.setAttribute('data-mode', state.mode);
    if (stats) {
      if (state.mode === 'challenge') stats.classList.add('is-visible');
      else stats.classList.remove('is-visible');
    }
    if (timerChip && !timerChip.hidden) timerChip.style.display = state.mode === 'explore' ? 'inline-flex' : 'none';
    if (state.mode === 'challenge') {
      stopTimer();
      state.attempts = MAX_ATTEMPTS;
      renderAttempts();
    } else {
      startExploreTimer();
    }
    setPhase(state.mode);
    gateActions();
    if (typeof window.__cycloApplyMode === 'function') {
      try { window.__cycloApplyMode(state.mode); } catch (e) {}
    }
  }


  /* === attempts-exhausted-settle === */
  var __exhaustTimer = null;
  var __exhaustBound = false;
  /* === exhausted-mode-reenter-new-round === */
  var __exhaustedNeedsNewRound = false;
  function __isChallengeWonNow(){
    if (window.__craftWinOpen) return true;
    if (window.__challengeWon) return true;
    var win = $('craft-win');
    if (win && !win.hidden && win.getAttribute('hidden') == null) {
      try { if (win.offsetParent !== null || getComputedStyle(win).display !== 'none') return true; } catch (e) { return true; }
    }
    if (win && win.hidden === false) return true;
    return false;
  }
  function hideAttemptsExhausted(){
    if (__exhaustTimer) { clearTimeout(__exhaustTimer); __exhaustTimer = null; }
    var el = $('attempts-exhausted');
    if (el) el.hidden = true;
  }
  function ensureAttemptsExhaustedUi(){
    if ($('attempts-exhausted')) return;
    var wrap = document.createElement('div');
    wrap.id = 'attempts-exhausted';
    wrap.hidden = true;
    wrap.innerHTML =
      '<div class="craft-card" role="dialog" aria-labelledby="attemptsExhaustedTitle">' +
        '<h2 id="attemptsExhaustedTitle">机会用尽</h2>' +
        '<p id="attemptsExhaustedDesc">本局急单未完成。目标仍按本局规则（口位/标定带等）锁定；可返回探究继续调参，或再开一局竞赛。</p>' +
        '<div class="craft-actions">' +
          '<button type="button" id="attemptsExhaustedExplore">返回探究</button>' +
          '<button type="button" id="attemptsExhaustedRetry" class="craft-btn-secondary">再开一局竞赛</button>' +
          '<button type="button" id="attemptsExhaustedList" class="craft-btn-ghost">返回列表</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(wrap);
    var bExplore = $('attemptsExhaustedExplore');
    var bRetry = $('attemptsExhaustedRetry');
    var bList = $('attemptsExhaustedList');
    if (bExplore) bExplore.addEventListener('click', function(){
      hideAttemptsExhausted();
      var sel = $('modeSelect');
      if (sel) {
        sel.value = 'explore';
        sel.dispatchEvent(new Event('change', { bubbles: true }));
      } else {
        applyMode('explore');
      }
    });
    if (bRetry) bRetry.addEventListener('click', function(){
      __exhaustedNeedsNewRound = false;
      try { if (typeof window.__platformTraceRequestNewRound === 'function') window.__platformTraceRequestNewRound('exhausted_retry'); } catch (__nr) {}
      hideAttemptsExhausted();
      state.attempts = MAX_ATTEMPTS;
      renderAttempts();
      gateActions();
      applyMode('challenge');
      var sel = $('modeSelect');
      if (sel) sel.value = 'challenge';
    });
    if (bList) {
      if (typeof window.__eaNavigateToStudentList !== 'function' && !document.getElementById('craftBackBtn')) {
        bList.hidden = true;
      } else {
        bList.addEventListener('click', function(){
          hideAttemptsExhausted();
          if (typeof window.__eaNavigateToStudentList === 'function') window.__eaNavigateToStudentList();
          else {
            var bb = document.getElementById('craftBackBtn');
            if (bb) bb.click();
          }
        });
      }
    }
  }
  function showAttemptsExhausted(){
    if (state.mode !== 'challenge' || state.attempts > 0) return;
    if (__isChallengeWonNow()) return;
    ensureAttemptsExhaustedUi();
    var el = $('attempts-exhausted');
    if (!el) return;
    var firstShow = !!el.hidden;
    el.hidden = false;
    if (firstShow) __exhaustedNeedsNewRound = true;
    /* === attempts-exhausted-emit === */
    if (firstShow) {
      try {
        var __exPayload = { attempts: 0, mode: 'challenge' };
        var __exSnap = { winOk: false, attemptsExhausted: true, hintKey: 'attempts_exhausted' };
        if (typeof window.__emit === 'function') {
          window.__emit('attempts_exhausted', __exPayload);
          window.__emit('snapshot', __exSnap);
        }
        // Always mirror to PlatformTraceAdapter — __emit may be a stub/wrapper
        try {
          if (window.PlatformTraceAdapter && typeof window.PlatformTraceAdapter.record === 'function') {
            window.PlatformTraceAdapter.record('attempts_exhausted', __exPayload);
            window.PlatformTraceAdapter.record('snapshot', __exSnap);
          } else if (window.parent && window.parent !== window && window.parent.PlatformTraceAdapter && typeof window.parent.PlatformTraceAdapter.record === 'function') {
            window.parent.PlatformTraceAdapter.record('attempts_exhausted', __exPayload);
            window.parent.PlatformTraceAdapter.record('snapshot', __exSnap);
          }
        } catch (__pta) {}
      } catch (__exErr) {}
    }

  }
  function scheduleAttemptsExhausted(){
    if (state.mode !== 'challenge' || state.attempts > 0) return;
    if (__exhaustTimer) clearTimeout(__exhaustTimer);
    __exhaustTimer = setTimeout(function(){
      __exhaustTimer = null;
      showAttemptsExhausted();
    }, 650);
  }
  function bindExhaustWinGuard(){
    if (__exhaustBound) return;
    __exhaustBound = true;
    var prev = window.__craftShowWin;
    if (typeof prev === 'function') {
      window.__craftShowWin = function(){
        hideAttemptsExhausted();
        return prev.apply(this, arguments);
      };
    }
    try {
      var obs = new MutationObserver(function(){
        if (__isChallengeWonNow()) hideAttemptsExhausted();
      });
      obs.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'class', 'style'] });
    } catch (e) {}
  }
  window.__showAttemptsExhausted = showAttemptsExhausted;
  window.__hideAttemptsExhausted = hideAttemptsExhausted;

  var FIRE_SEL = '#btnLaunch,#btn-test,#btn-test-ft,#btn-fire,#btnFire,#btnTest,#testBtn,#fireBtn,#launchBtn,#btn-run,#btnRun,#c4-discharge-btn,[data-action="fire"],[data-action="test"],[data-action="launch"]';
  function onPrimaryClick(e){
    if (state.mode !== 'challenge') return;
    var t = e.target && e.target.closest ? e.target.closest(FIRE_SEL) : null;
    if (!t) return;
    if (/reset|清除|重置|再来/i.test(t.textContent || '') || /reset|clear/i.test(t.id || '')) return;
    if (state.attempts <= 0) {
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    state.attempts -= 1;
    renderAttempts();
    gateActions();
    if (state.attempts <= 0) scheduleAttemptsExhausted();
  }

  function ensureUi(){
    var stage = $('essence-stage') || $('simCanvasArea') || document.querySelector('#proj-stage, #stage, #canvasContainer, .canvas-wrap')?.parentElement;
    var bench = $('essence-bench') || $('controlsPanel');
    if (!stage) return false;

    if (!$('craftModePill') && !$('dual-mode-hud')) {
      var hud = document.createElement('div');
      hud.className = 'craft-mode-pill';
      hud.id = 'craftModePill';
      hud.setAttribute('data-mode', 'explore');
      hud.innerHTML =
        '<span id="modeLabel">探究模式</span>' +
        '<span id="challengeStats"><span class="craft-mode-sep">|</span><span>剩余机会</span><span id="attemptsDisplay">5</span></span>' +
        '<span id="timerDisplay" hidden>10:00</span>';
      stage.style.position = stage.style.position || 'relative';
      stage.appendChild(hud);
    }

    if (bench && !$('modeSelect')) {
      bench.classList.add('dual-mode-ready');
      var hd = document.createElement('div');
      hd.id = 'essence-bench-hd';
      hd.className = 'bench-hd dual-bench-hd';
      var title = '环境控制台';
      var tEl = stage.querySelector('.essence-title, h1');
      if (tEl) title = (tEl.textContent || title).trim() || title;
      hd.innerHTML =
        '<div class="bench-hd-text"><div class="bench-hd-title">' + title.replace(/</g,'&lt;') + '</div>' +
        '<div class="bench-hd-sub">探究 · 竞赛</div></div>' +
        '<select id="modeSelect" aria-label="探究阶段">' +
          '<option value="explore">探究</option>' +
          '<option value="challenge">竞赛</option>' +
        '</select>';
      bench.insertBefore(hd, bench.firstChild);
    } else if (!$('modeSelect')) {
      // Fallback: floating select in hud
      var chip = $('dual-timer-chip');
      if (chip && !$('modeSelect')) {
        var sel = document.createElement('select');
        sel.id = 'modeSelect';
        sel.innerHTML = '<option value="explore">探究</option><option value="challenge">竞赛</option>';
        chip.appendChild(sel);
      }
    }
    return !!$('modeSelect');
  }

  function boot(){
    if (!ensureUi()) return;
    var sel = $('modeSelect');
    sel.addEventListener('change', function(){ applyMode(sel.value); });
    // Prefer whole bench so fire buttons outside .essence-ft still count
    var root = $('essence-bench') || document;
    root.addEventListener('click', onPrimaryClick, true);
    applyMode(sel.value || 'explore');
    setTimeout(bindExhaustWinGuard, 0);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>


<script>
/* === ea-minset-helper (cyclotron-radius) === */
(function(){
  if (window.__eaMinset) return; window.__eaMinset = true;
  var AV_LABELS = {"s-magnetic":"磁场 B","s-velocity":"入射速度"};
  var READING_SEL = "#craftGaugeVal, .observe-box .state, .observe-value, #hud-dist, #g-T, .gauge .gval, #c4-readout, #obs-rtotal, #obs-current";
  var READING_LABEL = "半径读数";
  var ACTION_LABEL = "操作";
  var EXTRA_TUNE_SEL = "";
  var sessionEvidence = {
    tuneCounts: {},
    fireCount: 0,
    lastReading: '',
    attribution: null,
    evidenceSummary: ''
  };
  Object.keys(AV_LABELS).forEach(function(id){ sessionEvidence.tuneCounts[id] = 0; });

  function noteAvTune(controlId){
    if (!sessionEvidence.tuneCounts.hasOwnProperty(controlId)) return;
    sessionEvidence.tuneCounts[controlId] += 1;
  }
  function noteFire(){ sessionEvidence.fireCount += 1; }
  function dominantAv(){
    var bestId = null, bestN = 0;
    Object.keys(sessionEvidence.tuneCounts).forEach(function(id){
      var n = sessionEvidence.tuneCounts[id];
      if (n > bestN) { bestN = n; bestId = id; }
    });
    return bestId ? { id: bestId, label: AV_LABELS[bestId] || bestId, count: bestN } : null;
  }
  function readObservation(){
    var nodes = document.querySelectorAll(READING_SEL);
    for (var i = 0; i < nodes.length; i++){
      var t = (nodes[i].textContent || '').replace(/\s+/g, ' ').trim();
      if (t && t !== '待测' && t !== '--' && t !== '—.———' && t !== '观测中') return t;
    }
    return sessionEvidence.lastReading || '--';
  }
  function modeIsChallenge(){
    var s = document.getElementById('modeSelect');
    var v = s ? String(s.value || '') : '';
    if (v === 'challenge') return true;
    try {
      if (typeof window.__platformTraceGetPhase === 'function') {
        return String(window.__platformTraceGetPhase() || '') === 'challenge';
      }
    } catch (e) {}
    return false;
  }
  function buildEvidenceSummary(reading){
    var dom = dominantAv();
    var mainTxt = dom && dom.count > 0 ? (dom.label + '×' + dom.count) : '未集中调节';
    var r = reading || readObservation();
    sessionEvidence.lastReading = r;
    if (modeIsChallenge()) {
      return '竞赛证据：' + READING_LABEL + ' ' + r + ' · 主调 ' + mainTxt + ' · ' + ACTION_LABEL + ' ' + sessionEvidence.fireCount + ' 次';
    }
    return '探究证据：' + READING_LABEL + ' ' + r + ' · 主调节 ' + mainTxt + ' · ' + ACTION_LABEL + ' ' + sessionEvidence.fireCount + ' 次';
  }
  function setCraftSettleOpen(open){
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'craft-settle', open: !!open }, '*');
      }
    } catch (e) {}
  }
  function navigateToStudentList(){
    try {
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'platform-navigate', to: 'student-list' }, '*'); } catch (e1) {}
        try { window.parent.location.href = '/student.html'; return; } catch (e2) {}
        return;
      }
    } catch (e3) {}
    window.location.href = '../index.html';
  }
  function updateAttrHint(selected){
    var hintEl = document.getElementById('craftAttrHint');
    if (!hintEl) return;
    var dom = dominantAv();
    if (!dom || dom.count <= 0 || !selected || selected === 'mixed' || selected === 'unsure' || selected === dom.id) {
      hintEl.hidden = true; hintEl.textContent = ''; return;
    }
    hintEl.hidden = false;
    hintEl.textContent = '本局证据主调是' + dom.label + '；若答物理上谁更灵敏可另说——此处问的是本局对照';
  }
  function setCraftRevealVisible(visible){
    var reveal = document.getElementById('craftReveal');
    if (reveal) reveal.hidden = !visible;
  }
  function prepareCraftWin(extraReading){
    var reading = extraReading || readObservation();
    sessionEvidence.evidenceSummary = buildEvidenceSummary(reading);
    sessionEvidence.attribution = null;
    var line = document.getElementById('craftEvidenceLine');
    if (line) line.innerHTML = '<strong>本局证据</strong>　' + sessionEvidence.evidenceSummary;
    document.querySelectorAll('input[name="craftAttr"]').forEach(function(el){ el.checked = false; });
    var wbtn = document.getElementById('craftWinBtn');
    if (wbtn) wbtn.disabled = true;
    setCraftRevealVisible(false);
    updateAttrHint(null);
    window.__eaSessionEvidence = sessionEvidence;
  }
  function emitAttributionSnapshot(){
    if (!window.__emit || !sessionEvidence.attribution) return;
    var c = window.__snapControls ? window.__snapControls() : {};
    window.__emit('snapshot', {
      controls: c,
      winOk: true,
      attribution: sessionEvidence.attribution,
      evidenceSummary: sessionEvidence.evidenceSummary
    });
  }

  function bindTunes(){
    Object.keys(AV_LABELS).forEach(function(id){
      var el = document.getElementById(id);
      if (!el) return;
      var handler = function(){ noteAvTune(id); };
      el.addEventListener('input', handler);
      el.addEventListener('change', handler);
    });
    // capacitor ch4 choice grids
    if (EXTRA_TUNE_SEL) {
      document.addEventListener('click', function(ev){
        var t = ev.target;
        if (!t || !t.closest) return;
        if (t.closest('#c4-c-grid')) noteAvTune('c4-c');
        else if (t.closest('#c4-v-grid')) noteAvTune('c4-v');
      }, true);
    }
    var fireSel = '#btnLaunch,#btn-test,#btn-fire,#btnFire,#btnTest,#fireBtn,#btn-run,#btnRun,#c4-discharge-btn,[data-action="fire"],[data-action="test"],[data-action="launch"]';
    document.addEventListener('click', function(ev){
      var t = ev.target;
      if (!t || !t.closest) return;
      if (t.closest(fireSel)) noteFire();
    }, true);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bindTunes);
  else bindTunes();

  window.__eaPrepareCraftWin = prepareCraftWin;
  window.__eaEmitAttribution = emitAttributionSnapshot;
  window.__eaSessionEvidence = sessionEvidence;
  window.__eaSetCraftSettleOpen = setCraftSettleOpen;
  window.__eaNavigateToStudentList = navigateToStudentList;
  window.__eaUpdateAttrHint = updateAttrHint;
  window.__eaSetCraftRevealVisible = setCraftRevealVisible;
  window.__eaNoteAvTune = noteAvTune;
  window.__eaNoteFire = noteFire;
})();
</script>

      var ev = window.__eaSessionEvidence;
      if (!(ev && ev.attribution)) {
        if (typeof window.__eaSetCraftRevealVisible === 'function') window.__eaSetCraftRevealVisible(false);
        if (wbtn) wbtn.disabled = true;
      }
      var t = document.getElementById('craftWinText');
      if (t && typeof extra === 'string' && extra) t.textContent = extra;
    }
  }
  window.__craftShowWin = showWin;

  var _emit = window.__emit;
  window.__emit = function(type, payload){
    if (typeof _emit === 'function') _emit(type, payload);
    if (type === 'win') showWin();
  };
  var obs = new MutationObserver(function(){
    if (window.__craftWinDismissed || window.__craftWinOpen) return;
    var el = document.querySelector('.win-banner,#winBanner,[data-win="1"]');
    if (el && el.offsetParent !== null) showWin();
  });
  obs.observe(document.body, {childList:true, subtree:true, attributes:true, attributeFilter:['class','style','hidden']});

  function tick(){
    var src = document.querySelector('.observe-box .state, .observe-value, #hud-dist, #g-T, .gauge .gval, #c4-readout, #obs-rtotal');
    var gval = document.getElementById('craftGaugeVal');
    if (gval && src && src !== gval) gval.textContent = (src.textContent || '').trim() || '观测中';
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>


<script>
/* === trace-new-round-on-retry === */
(function(){
  if (window.__platformTraceRequestNewRound) return;
  window.__platformTraceRequestNewRound = function(reason){
    var r = reason || 'retry';
    try {
      if (window.parent && window.parent !== window) {
        if (typeof window.parent.__platformTraceNewRound === 'function') {
          window.parent.__platformTraceNewRound({ reason: r });
          return true;
        }
        window.parent.postMessage({ type: 'platform-trace-new-round', reason: r }, '*');
        return true;
      }
    } catch (e) {}
    try {
      if (window.PlatformTraceAdapter && typeof window.PlatformTraceAdapter.beginNewRound === 'function') {
        window.PlatformTraceAdapter.beginNewRound({ reason: r });
        return true;
      }
    } catch (e2) {}
    return false;
  };
})();
</script>
<script>
/* === explore_success gate (百人复测) === */
(function(){
  if (window.__noteExploreSuccess) return;
  window.__noteExploreSuccess = function(emitFn, controls) {
    try {
      var g = window.__exploreSuccessGate || (window.__exploreSuccessGate = { n: 0, keys: Object.create(null), done: false });
      g.n += 1;
      var c = controls || {};
      Object.keys(c).forEach(function(k){ g.keys[k] = 1; });
      if (g.done || g.n < 3) return;
      g.done = true;
      var emit = emitFn || window.__emit || window.__traceEmit;
      if (typeof emit === 'function') {
        emit('explore_success', { winOk: true, hintKey: 'explore_contrast', controls: c });
      }
    } catch (e) {}
  };
  document.addEventListener('dual-mode-change', function(ev) {
    try {
      if (ev && ev.detail && ev.detail.mode === 'explore') {
        window.__exploreSuccessGate = { n: 0, keys: Object.create(null), done: false };
      }
    } catch (e) {}
  });
})();
</script>
