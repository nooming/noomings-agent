<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>气室 · 活塞实验桌</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family:var(--font-sans); background: #f5f7fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
        .card { max-width: 680px; width: 100%; background: white; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); padding: 24px 28px; }
        h1 { font-size: 1.6rem; font-weight: 600; margin-bottom: 4px; letter-spacing: -0.01em; }
        .sub { color: #4b5563; font-size: 0.95rem; margin-bottom: 20px; border-left: 3px solid #3b82f6; padding-left: 12px; }
        .canvas-wrap { background: #eef2f6; border-radius: 12px; padding: 12px; margin-bottom: 20px; }
        canvas { display: block; width: 100%; height: auto; background: white; border-radius: 8px; box-shadow: inset 0 1px 4px rgba(0,0,0,0.04); }
        .control-grid { display: flex; flex-direction: column; gap: 18px; margin: 18px 0 16px; }
        .slider-group { display: flex; flex-direction: column; gap: 4px; }
        .slider-group label { font-weight: 500; font-size: 0.9rem; display: flex; justify-content: space-between; }
        .slider-group input[type="range"] { width: 100%; accent-color: #2563eb; }
        .row-buttons { display: flex; gap: 12px; flex-wrap: wrap; margin: 8px 0 14px; }
        button { background: #2563eb; color: white; border: none; padding: 8px 20px; border-radius: 40px; font-weight: 500; font-size: 0.9rem; cursor: pointer; transition: background 0.15s; box-shadow: 0 2px 6px rgba(37,99,235,0.2); }
        button:hover { background: #1d4ed8; }
        button.secondary { background: #e5e7eb; color: #1f2937; box-shadow: none; }
        button.secondary:hover { background: #d1d5db; }
        .observe-box { background: #f8fafc; border-radius: 12px; padding: 14px 16px; margin: 12px 0 16px; border: 1px solid #e2e8f0; }
        .observe-box .val { font-size: 1.8rem; font-weight: 600; color: #0f172a; letter-spacing: -0.02em; }
        .observe-box .unit { font-size: 0.9rem; color: #475569; margin-left: 6px; }
        .hint { font-size: 0.9rem; color: #475569; margin-top: 6px; line-height: 1.45; max-width: 100%; overflow-wrap: anywhere; word-break: break-word; white-space: normal; }
        #hintMsg { max-width: 100%; overflow-wrap: anywhere; word-break: break-word; }
        .confound-note { background: #f1f5f9; border-radius: 8px; padding: 8px 14px; font-size: 0.85rem; color: #334155; border-left: 3px solid #94a3b8; margin: 8px 0 12px; }
        .pass-badge { background: #10b981; color: white; padding: 6px 14px; border-radius: 40px; font-weight: 600; font-size: 0.85rem; display: inline-block; margin-top: 6px; }
        .irr-area { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #d1d5db; display: flex; justify-content: flex-end; }
        #I1 { background: transparent; border: 1px solid #cbd5e1; color: #334155; box-shadow: none; font-size: 0.8rem; padding: 4px 14px; }
        #I1:hover { background: #f1f5f9; }
        footer { font-size: 0.7rem; color: #94a3b8; text-align: center; margin-top: 16px; }
    
/* === essence-sidebar-shell (auto) === */
html, body { width:100%; height:100%; margin:0; padding:0 !important; overflow:hidden; }
body { display:block !important; align-items:stretch !important; justify-content:stretch !important; min-height:0 !important; }
#essence-app {
  display:flex; flex-direction:row; width:100%; height:100%; min-height:0;
  background:inherit;
}
#essence-stage {
  position:relative; flex:1; min-width:0; min-height:0;
  display:flex; flex-direction:column; background:#0f172a;
}
#essence-stage canvas {
  display:block; width:100% !important; height:100% !important; max-width:none !important;
  margin:0 !important; border-radius:0 !important; flex:1; min-height:0;
}
#essence-hud {
  position:absolute; top:10px; left:10px; right:10px; z-index:5; pointer-events:none;
  display:flex; flex-direction:column; gap:4px; max-width:min(420px, calc(100% - 20px));
}
#essence-hud .essence-title {
  pointer-events:none; padding:8px 12px; border-radius:12px;
  background:rgba(15,23,42,0.88); color:#e2e8f0; font-size:14px; font-weight:600;
  border:1px solid rgba(148,163,184,0.35);
}
#essence-hud .essence-sub {
  pointer-events:none; padding:6px 12px; border-radius:10px;
  background:rgba(15,23,42,0.75); color:#94a3b8; font-size:12px;
  border:1px solid rgba(148,163,184,0.25);
}
#essence-bench {
  width:clamp(280px, 28vw, 340px); flex-shrink:0; min-height:0;
  display:flex; flex-direction:column;
  background:#fff; border-left:1px solid #e2e8f0;
  color:#1a202c;
}
#essence-bench .essence-scroll {
  flex:1; overflow-y:auto; padding:14px 16px 8px; min-height:0;
  -webkit-overflow-scrolling:touch;
}
#essence-bench .essence-ft {
  padding:10px 16px 14px; border-top:1px solid #e2e8f0; flex-shrink:0;
  display:flex; flex-direction:column; gap:8px;
}
#essence-bench .slider-group input[type=range],
#essence-bench input[type=range] {
  width:100%; height:28px; margin:0;
}
@media (max-width:720px) {
  #essence-app { flex-direction:column; }
  #essence-stage { flex:1 1 0; min-height:48vh; }
  #essence-bench { width:100%; max-height:min(42vh,360px); border-left:none; border-top:1px solid #e2e8f0; }
}

#essence-stage .canvas-wrap,
#essence-stage .canvas-area,
#essence-stage > div:not(#essence-hud):not(#dual-mode-hud) {
  flex:1; min-height:0; width:100%; height:100%;
  margin:0 !important; padding:0 !important; border-radius:0 !important;
  background:transparent !important; display:flex; align-items:stretch;
}

/* dual-mode HUD 不得吃到舞台 flex 拉伸规则 */
#essence-stage > #dual-mode-hud {
  position:absolute !important; top:10px !important; left:10px !important; right:10px !important;
  width:auto !important; height:auto !important; max-width:none !important;
  flex:none !important; margin:0 !important; padding:0 !important;
  background:transparent !important; align-items:flex-start !important;
  justify-content:flex-start !important; z-index:9; pointer-events:none !important;
}
#essence-stage > #dual-mode-hud .dual-chip,
#essence-stage > #dual-mode-hud #challengeStats {
  height:auto !important; align-self:flex-start !important; flex:none !important;
  pointer-events:auto !important;
}
#essence-bench .essence-scroll > .app,
#essence-bench .essence-scroll > .card,
#essence-bench .essence-scroll > .container,
#essence-bench .essence-scroll > .game {
  display:contents;
}

/* hide original card chrome when wrapped */
.essence-legacy-hide-outer > .app,
.essence-legacy-hide-outer > .card,
.essence-legacy-hide-outer > .container,
.essence-legacy-hide-outer > .game,
.essence-legacy-hide-outer > #app { display:contents; }


/* === dual-mode-shell (auto) === */
#dual-mode-hud {
  position:absolute; top:10px; left:10px; right:10px; z-index:8;
  display:flex; justify-content:space-between; align-items:flex-start;
  gap:8px; pointer-events:none;
}
#dual-mode-hud .dual-chip {
  pointer-events:auto; display:inline-flex; align-items:center; gap:10px;
  padding:8px 14px; border-radius:999px;
  background:rgba(255,255,255,0.92); border:1px solid rgba(148,163,184,0.45);
  box-shadow:0 4px 12px rgba(15,23,42,0.12); color:#1e293b; font-size:13px;
}
#dual-mode-hud #modeLabel { font-weight:700; color:#2563eb; }
#dual-mode-hud #timerDisplay { font-family:var(--font-mono); font-weight:600; color:#334155; }
#challengeStats {
  pointer-events:auto; display:none; align-items:center; gap:8px;
  padding:8px 14px; border-radius:999px;
  background:rgba(255,255,255,0.92); border:1px solid rgba(248,113,113,0.45);
  box-shadow:0 4px 12px rgba(15,23,42,0.12); color:#1e293b; font-size:13px;
}
#challengeStats.is-visible { display:inline-flex; }
#attemptsDisplay { font-weight:700; color:#dc2626; font-size:16px; }
#essence-bench-hd, .dual-bench-hd {
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:12px 16px; border-bottom:1px solid #e2e8f0; background:#fff; flex-shrink:0;
}
#essence-bench-hd h1, .dual-bench-hd h1 {
  margin:0; font-size:15px; font-weight:700; color:#1e293b; line-height:1.3;
}
#modeSelect {
  border:1px solid #93c5fd; border-radius:999px; padding:4px 10px;
  font-size:12px; font-weight:600; color:#1d4ed8; background:#eff6ff; cursor:pointer;
}
#essence-bench.dual-mode-ready { display:flex; flex-direction:column; }
button.dual-disabled, .dual-disabled { opacity:0.45; pointer-events:none; cursor:not-allowed; }


/* === craft-gold-shell === */
:root{--font-sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;--font-mono:ui-monospace,"Cascadia Code",Consolas,monospace;--font-display:var(--font-sans);--font-formula:"Cambria Math","Times New Roman",serif;--craft-accent:#6a9ab8;--craft-bg:#101418;--craft-panel:#1a2228;--craft-text:#e8eef2;--craft-muted:#8a9aa8;}
html,body{width:100%!important;height:100%!important;margin:0!important;padding:0!important;overflow:hidden!important;
  font-family:var(--font-sans)!important;background:var(--craft-bg)!important;color:var(--craft-text)!important;}
#essence-app,#app{background:var(--craft-bg)!important;}
#essence-stage,#stage{background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.04),transparent 55%),var(--craft-bg)!important;}
#essence-bench,.control-panel,#controls-area,#bench{background:linear-gradient(180deg,color-mix(in srgb,var(--craft-panel) 92%,#fff),var(--craft-panel))!important;border-left:1px solid color-mix(in srgb,var(--craft-accent) 35%,transparent)!important;color:var(--craft-text)!important;}
#essence-bench-hd,.dual-bench-hd,.bench-hd,.ctrl-hd{background:rgba(0,0,0,.25)!important;border-bottom:1px solid color-mix(in srgb,var(--craft-accent) 30%,transparent)!important;}
#essence-bench-hd h1,.bench-hd-title,.ctrl-hd{color:var(--craft-accent)!important;}
#essence-bench .essence-scroll,#essence-bench .essence-ft,.bench-scroll,.ctrl-scroll,.ctrl-ft{background:transparent!important;color:var(--craft-text)!important;}
#essence-bench label,.slider-group label,.slabel{color:var(--craft-text)!important;}
#essence-bench .btn,button.btn,.pixel-btn,#btnLaunch,#btn-test{background:var(--craft-accent)!important;border:none!important;color:#0b1020!important;font-weight:700!important;border-radius:12px!important;}
#essence-bench .secondary,#btn-reset{background:rgba(0,0,0,.35)!important;color:var(--craft-text)!important;}
#essence-bench .observe-box{background:rgba(0,0,0,.32)!important;border:1px solid color-mix(in srgb,var(--craft-accent) 28%,transparent)!important;color:var(--craft-text)!important;}
#essence-bench .observe-box .val{color:#ffe0c2!important;}
#essence-bench .hint{color:var(--craft-text)!important;}
#essence-bench footer{display:none!important;}
#essence-bench .irr-area{display:none!important;}
#essence-hud{top:10px!important;right:12px!important;left:auto!important;max-width:min(240px,calc(100% - 24px))!important;align-items:flex-end!important;}
#craft-intro,#craft-win{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.72);backdrop-filter:blur(8px);
}
#craft-intro[hidden],#craft-win[hidden]{display:none!important;}

.craft-card button:disabled{opacity:.45;cursor:not-allowed;filter:none;}
.craft-evidence{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.22);border:1px solid color-mix(in srgb,var(--craft-accent) 32%,transparent);font-size:.88rem;line-height:1.55;color:var(--craft-text);}
.craft-evidence strong{color:var(--craft-accent);font-weight:600;}
.craft-attr{margin:0 0 12px;}
.craft-attr-label{margin:0 0 8px;font-size:.9rem;color:var(--craft-muted);}
.craft-attr-options{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;}
@media (max-width:420px){.craft-attr-options{grid-template-columns:1fr;}}
.craft-attr label{display:flex;align-items:flex-start;gap:8px;margin:0;font-size:.86rem;line-height:1.4;color:var(--craft-text);cursor:pointer;}
.craft-attr input{margin-top:3px;accent-color:var(--craft-accent);}
.craft-attr-hint{margin:8px 0 0;font-size:.78rem;line-height:1.45;color:var(--craft-muted);}
.craft-attr-hint[hidden]{display:none!important;}
.craft-reveal{margin-top:4px;}
.craft-reveal[hidden]{display:none!important;}
.craft-cv,#craft-cv{font-size:.8rem;color:var(--craft-muted);border:1px dashed color-mix(in srgb,var(--craft-accent) 35%,transparent);
  border-radius:10px;padding:8px 10px;margin:0 0 4px;line-height:1.45;}
.craft-actions{display:flex;gap:10px;margin-top:14px;}
.craft-actions button{flex:1;width:auto;padding:11px 10px;font-size:.95rem;}
.craft-btn-secondary{background:transparent!important;border:1px solid color-mix(in srgb,var(--craft-accent) 45%,transparent)!important;color:var(--craft-text)!important;font-weight:600!important;}
.craft-btn-secondary:hover{filter:brightness(1.08);background:rgba(255,255,255,.04)!important;}

.craft-card{
  width:min(440px,92vw);background:var(--craft-panel);border:1px solid color-mix(in srgb,var(--craft-accent) 45%,transparent);
  border-radius:18px;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.craft-card h2{margin:0 0 10px;font-size:1.25rem;color:var(--craft-accent);letter-spacing:1px;}
.craft-card p{margin:0 0 12px;line-height:1.65;color:var(--craft-text);font-size:.95rem;}
.craft-card .formula{font-family:var(--font-formula);font-size:1.05rem;color:#fff;background:rgba(0,0,0,.28);
  border-left:3px solid var(--craft-accent);padding:10px 12px;border-radius:8px;margin:10px 0 16px;}
.craft-card button{width:100%;padding:12px;border:none;border-radius:12px;background:var(--craft-accent);color:#0b1020;font-weight:700;cursor:pointer;font-size:1rem;}
#craft-gauge{display:none!important;}
#craft-gauge strong{color:var(--craft-accent);font-family:var(--font-mono);font-size:16px;display:block;margin-top:2px;}
#craft-cv{font-size:12px;color:var(--craft-muted);border:1px dashed color-mix(in srgb,var(--craft-accent) 35%,transparent);
  border-radius:10px;padding:8px 10px;margin:8px 0;}
.app,.card,.container{background:transparent!important;box-shadow:none!important;color:inherit!important;}
.sub,.hint{color:var(--craft-text)!important;border-left-color:var(--craft-accent)!important;}
#dual-mode-hud .dual-chip,#challengeStats,
#essence-stage > #dual-mode-hud .dual-chip,#essence-stage > #dual-mode-hud #challengeStats{
  background:#0f172a!important;
  border:1px solid color-mix(in srgb,var(--craft-accent) 55%,transparent)!important;
  color:#f8fafc!important;box-shadow:0 4px 14px rgba(0,0,0,.4)!important;
}
#dual-mode-hud #modeLabel{color:var(--craft-accent)!important;font-weight:700!important;}
#dual-mode-hud #timerDisplay{
  font-family:var(--font-mono)!important;
  font-weight:700!important;color:#ffe0c2!important;letter-spacing:.5px;
}
#attemptsDisplay{color:#fda4af!important;font-weight:800!important;}


/* === craft-sidebar-contrast === */
.sub,.hint{color:var(--craft-text)!important;border-left-color:var(--craft-accent)!important;}
#essence-bench .hint,
#essence-bench .hint-msg,
#essence-bench .hint-area,
#essence-bench #hintMessage,
#essence-bench #hintMsg,
#essence-bench #observeText,
#essence-bench #feedbackArea,
#essence-bench .hint-bar,
#essence-bench #hintBar,
#proj-side .hint,
#controls-area .hint-msg,
#bench .hint,
#bench .hint-msg{
  background:rgba(0,0,0,.35)!important;
  border:1px solid color-mix(in srgb,var(--craft-accent) 50%,transparent)!important;
  color:var(--craft-text)!important;
}
#essence-bench .confound-note,
#controls-area .confound-note,
#bench .confound-note{
  background:rgba(0,0,0,.28)!important;
  border:1px solid color-mix(in srgb,var(--craft-accent) 40%,transparent)!important;
  color:var(--craft-text)!important;
}
#essence-bench .hint-msg.win-msg,
#essence-bench .hint.win-msg{
  background:rgba(34,197,94,.22)!important;color:#bbf7d0!important;
  border-color:rgba(34,197,94,.45)!important;
}
#essence-bench .hint-msg.fail-msg,
#essence-bench .hint.fail-msg{
  background:rgba(248,113,113,.22)!important;color:#fecaca!important;
  border-color:rgba(248,113,113,.45)!important;
}
#sideGoal,p#sideGoal,#essence-bench #sideGoal,#proj-side #sideGoal{
  color:var(--craft-text)!important;
}
#essence-bench .footer,
#essence-bench .footer span,
#essence-bench .text-sm,
#essence-bench .observe-unit,
#essence-bench .unit,
#essence-bench .note{
  color:var(--craft-muted)!important;
}


/* === craft-scene-tokens (gas-ideal) === */
:root{
  --craft-accent:#6a9ab8;--craft-bg:#101418;--craft-panel:#1a2228;
  --craft-text:#e8eef2;--craft-muted:#8a9aa8;
  --scene-ink:#101418;--scene-mid:#2a343c;--scene-hi:#b8d0e0;
  --scene-glow:#5a9ec8;--scene-metal:#8a969e;--scene-ok:#6fae8f;
}
#essence-app,#app{background:var(--scene-ink)!important;}
#essence-stage,#stage{
  background:
    radial-gradient(ellipse at 18% 12%,color-mix(in srgb,var(--scene-glow) 18%,transparent),transparent 42%),
    radial-gradient(ellipse at 78% 8%,rgba(255,255,255,.04),transparent 38%),
    linear-gradient(180deg,color-mix(in srgb,var(--scene-mid) 55%,var(--scene-ink)),var(--scene-ink))!important;
}
#essence-bench,.control-panel,#controls-area,#bench{
  background:linear-gradient(180deg,color-mix(in srgb,var(--scene-mid) 85%,#fff),var(--craft-panel) 45%,color-mix(in srgb,var(--scene-ink) 70%,var(--craft-panel)))!important;
  border-left:1px solid color-mix(in srgb,var(--craft-accent) 45%,transparent)!important;
  box-shadow:-8px 0 28px rgba(0,0,0,.35)!important;
  color:var(--craft-text)!important;
}
#essence-bench-hd,.dual-bench-hd,.bench-hd,.ctrl-hd{
  background:rgba(0,0,0,.28)!important;
  border-bottom:1px solid color-mix(in srgb,var(--craft-accent) 35%,transparent)!important;
}
#essence-bench-hd h1,.bench-hd-title,.ctrl-hd,.essence-title{color:var(--scene-hi)!important;}
#essence-hud .essence-title{
  background:rgba(0,0,0,.55)!important;border:1px solid color-mix(in srgb,var(--craft-accent) 40%,transparent)!important;
  color:var(--scene-hi)!important;letter-spacing:2px;
}
#essence-hud .essence-sub{
  background:rgba(0,0,0,.42)!important;border:1px solid color-mix(in srgb,var(--craft-accent) 22%,transparent)!important;
  color:var(--craft-muted)!important;
}
#essence-bench label,.slider-group label,.slabel{color:var(--craft-muted)!important;}
#essence-bench .value-tag,.slider-value,.sval{color:var(--scene-hi)!important;}
#essence-bench input[type=range],.slider-group input[type=range],input[type=range]{
  accent-color:var(--craft-accent);
}
#essence-bench input[type=range]::-webkit-slider-runnable-track,
.slider-group input[type=range]::-webkit-slider-runnable-track{
  height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--scene-ink),var(--scene-mid));
  box-shadow:inset 0 1px 2px rgba(0,0,0,.65);
}
#essence-bench input[type=range]::-webkit-slider-thumb,
.slider-group input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--scene-hi),var(--craft-accent) 55%,color-mix(in srgb,var(--craft-accent) 50%,#000));
  border:1px solid color-mix(in srgb,var(--craft-accent) 40%,#000);
  box-shadow:0 2px 5px rgba(0,0,0,.55);
}
#essence-bench .btn,button.btn,.pixel-btn,#btnLaunch,#btn-test,#btn-fire,#btnFire{
  background:linear-gradient(180deg,var(--scene-hi),var(--craft-accent) 60%,color-mix(in srgb,var(--craft-accent) 70%,#000))!important;
  border:1px solid color-mix(in srgb,var(--craft-accent) 50%,#000)!important;
  color:#1a1208!important;font-weight:700!important;border-radius:6px!important;
  box-shadow:0 3px 10px color-mix(in srgb,var(--craft-accent) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.35)!important;
}
.craft-card{
  background:linear-gradient(170deg,var(--scene-mid),var(--craft-panel))!important;
  border:1px solid color-mix(in srgb,var(--craft-accent) 50%,transparent)!important;
  border-radius:8px!important;
  box-shadow:0 24px 70px rgba(0,0,0,.5),inset 0 1px 0 color-mix(in srgb,var(--scene-hi) 25%,transparent)!important;
}
.craft-card h2{color:var(--scene-hi)!important;letter-spacing:3px;}
.craft-card .formula{border-left-color:var(--craft-accent)!important;}
.craft-card button{
  background:linear-gradient(180deg,var(--scene-hi),var(--craft-accent) 60%,color-mix(in srgb,var(--craft-accent) 70%,#000))!important;
  color:#1a1208!important;border-radius:6px!important;
}
#essence-bench .observe-box,.observe-box{
  background:rgba(0,0,0,.38)!important;
  border:1px solid color-mix(in srgb,var(--craft-accent) 40%,transparent)!important;
  border-left:3px solid var(--craft-accent)!important;

(function(){
    function emit(type, payload) {
        try {
            if (window.PlatformTraceAdapter) {
                window.PlatformTraceAdapter.record(type, payload || {});
                return;
            }
        } catch (e) {}
        try {
            if (window.parent && window.parent !== window && window.parent.PlatformTraceAdapter) {
                window.parent.PlatformTraceAdapter.record(type, payload || {});
            }
        } catch (e) {}
    }

    function snapControls() {
        var o = {};
        document.querySelectorAll('input[type="range"], input[type="number"]').forEach(function(el) {
            var id = el.id || el.name; if (id) o[id] = el.value;
        });
        return o;
    }

    document.addEventListener('DOMContentLoaded', function() {
        // puzzle_open
        emit('puzzle_open', {});

        // tuning 绑定 (所有 range)
        document.querySelectorAll('input[type="range"]').forEach(function(el) {
            el.addEventListener('change', function() {
                if (window.__platformTraceControlsBound) return;
                emit('tuning', { control: el.id || 'slider', value: el.value });
            });
        });

        // irrelevant_touch 绑定 I1
        var i1 = document.getElementById('I1');
        if (i1) {
            i1.addEventListener('click', function() {
                emit('irrelevant_touch', { control: 'I1', value: 'click' });
            });
        }
    });
})();

<script>
    (function() {
        const pSlider = document.getElementById('s-pressure');
        const vSlider = document.getElementById('s-volume');
        const mSlider = document.getElementById('s-piston-mass');
        const pDisplay = document.getElementById('pValDisplay');
        const vDisplay = document.getElementById('vValDisplay');
        const mDisplay = document.getElementById('mValDisplay');
        const pvDisplay = document.getElementById('pvDisplay');
        const hintMsg = document.getElementById('hintMessage');
        const winIndicator = document.getElementById('winIndicator');
        const btnTest = document.getElementById('btn-test');
        const btnReset = document.getElementById('btn-reset');
        const canvas = document.getElementById('gasCanvas');
        const ctx = canvas.getContext('2d');
        let W = 600, H = 320, animT = 0;
        /** 事件动画 FSM：idle(null) | windup | peak | settle；点击时冻结 drivers */
        let eventAnim = null;
        let rafLastTs = 0;
        let needleFlick = 0;
        let BAND_LO = 9.5, BAND_HI = 10.5;
        let playMode = 'explore';
        let lockedBand = null;
        let challengeWon = false;
        /** 仅「测试」后揭示 p·V 乘积 */
        let measuredPV = null;
        const MODE_GOALS = {
          explore: {
            hud: '试压：观察 p·V 乘积如何变化',
            side: '调 p 或 V，看乘积是否近似恒定；活塞质量为本关旁路。'
          },
          challenge: {
            hud: '限次把乘积打进本局标定带（打偏不换带）',
            side: '限次把乘积打进本局标定带（打偏不换带）；活塞质量为本关旁路。'
          }
        };
        function refreshGasGoals() {
          const g = MODE_GOALS[playMode] || MODE_GOALS.explore;
          const mission = document.getElementById('goalMission');
          const side = document.getElementById('sideGoal');
          if (playMode === 'challenge' && lockedBand) {
            if (mission) mission.textContent = '急单标定带：' + BAND_LO.toFixed(1) + '–' + BAND_HI.toFixed(1) + ' · 本局固定';
            if (side) side.textContent = '竞赛急单：限次把乘积调进 ' + BAND_LO.toFixed(1) + '–' + BAND_HI.toFixed(1) + '（本局固定，打偏不换带）。';
          } else {
            if (mission) mission.textContent = g.hud;
            if (side) side.textContent = g.side;
          }
        }
        /** FixedChallenge：仅进入竞赛时锁定一次标定带（带宽明显窄于探究 ±0.5） */
        function lockChallengeBand() {
          const mid = 8 + Math.random() * 6; // 8–14
          const half = 0.22 + Math.random() * 0.13; // 带宽约 0.44–0.70，窄于探究 1.0
          BAND_LO = Math.round((mid - half) * 10) / 10;
          BAND_HI = Math.round((mid + half) * 10) / 10;
          lockedBand = { lo: BAND_LO, hi: BAND_HI };
          challengeWon = false;
          measuredPV = null;
          pSlider.value = '3.0';
          vSlider.value = '5.0';
          refreshGasGoals();
          updateAll();
          hintMsg.textContent = '急单已锁定 · 标定带本局固定 · 调参后点测试';
          winIndicator.innerHTML = '';
        }
        function applyExploreBand() {
          lockedBand = null;
          BAND_LO = 9.5; BAND_HI = 10.5;
          challengeWon = false;
          measuredPV = null;
          refreshGasGoals();
          updateAll();
          hintMsg.textContent = '自由试压 · 点测试后对比乘积';
          winIndicator.innerHTML = '';
        }
        window.__gasApplyMode = function(mode) {
          playMode = mode === 'challenge' ? 'challenge' : 'explore';
          if (playMode === 'challenge') lockChallengeBand();
          else applyExploreBand();
        };
        document.addEventListener('dual-mode-change', function(ev) {
          var m = ev && ev.detail && ev.detail.mode;
          if (typeof window.__gasApplyMode === 'function') window.__gasApplyMode(m);
        });
        /* BATCH6-FIXED-20260724 FixedChallenge */

        function syncCanvasSize() {
            var stage = document.getElementById('essence-stage') || canvas.parentElement;
            var cssW = Math.max(2, (stage && stage.clientWidth) || 600);
            var cssH = Math.max(2, (stage && stage.clientHeight) || 320);
            var dpr = Math.min(2.5, window.devicePixelRatio || 1);
            canvas.style.width = cssW + 'px';
            canvas.style.height = cssH + 'px';
            var bw = Math.round(cssW * dpr), bh = Math.round(cssH * dpr);
            if (canvas.width !== bw || canvas.height !== bh) { canvas.width = bw; canvas.height = bh; }
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            W = cssW; H = cssH;
        }

        function computePV() {
            const p = parseFloat(pSlider.value) || 1;
            const V = parseFloat(vSlider.value) || 1;
            return { p, V, pv: p * V };
        }

        function computeBand(pv) {
            if (pv >= BAND_LO && pv <= BAND_HI) return 'ok';
            return pv < BAND_LO ? 'low' : 'high';
        }

        function mapGasToDur(p, pv) {
            const pNorm = Math.min(1, p / 10);
            const mid = (BAND_LO + BAND_HI) / 2;
            const offNorm = Math.min(1, Math.abs(pv - mid) / Math.max(0.5, (BAND_HI - BAND_LO) * 2));
            return Math.max(0.4, Math.min(1.5, 0.42 + pNorm * 0.55 + offNorm * 0.45));
        }

        function startEventAnim(p, V, pv) {
            eventAnim = {
                phase: 'windup',
                t: 0,
                drivers: {
                    p: p, V: V, pv: pv,
                    band: computeBand(pv),
                    pNorm: Math.min(1, p / 10),
                    surgeAmp: Math.min(1, p / 10),
                    totalDur: mapGasToDur(p, pv),
                    bandLo: BAND_LO, bandHi: BAND_HI
                }
            };
        }

        function getEventPhaseDurs() {
            if (!eventAnim) return { windupDur: 0.2, peakDur: 0.12, settleDur: 0.3 };
            const d = eventAnim.drivers;
            const windupDur = Math.max(0.12, d.totalDur * 0.28);
            const peakDur = Math.max(0.1, Math.min(0.18, d.totalDur * 0.15));
            const settleDur = Math.max(0.15, d.totalDur - windupDur - peakDur);
            return { windupDur: windupDur, peakDur: peakDur, settleDur: settleDur };
        }

        function stepEventAnim(dt) {
            if (!eventAnim) return;
            eventAnim.t += dt;
            const ph = getEventPhaseDurs();
            if (eventAnim.phase === 'windup') {
                if (eventAnim.t >= ph.windupDur) { eventAnim.phase = 'peak'; eventAnim.t = 0; }
            } else if (eventAnim.phase === 'peak') {
                if (eventAnim.t >= ph.peakDur) { eventAnim.phase = 'settle'; eventAnim.t = 0; }
            } else if (eventAnim.phase === 'settle') {
                if (eventAnim.t >= ph.settleDur) eventAnim = null;
            }
        }

        function drawScene(p, V, pv) {
            syncCanvasSize();
            ctx.clearRect(0, 0, W, H);

            const C = {
                bg: '#101418', mid: '#2a343c', hi: '#b8d0e0', metal: '#8a969e',
                accent: '#6a9ab8', glow: '#5a9ec8', ok: '#6fae8f', panel: '#1a2228',
                brass: '#c9973f', brassHi: '#e8c878', brassDark: '#6a4a18'
            };

            function rr(x, y, w, h, r) {
                r = Math.min(r, w / 2, h / 2);
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.arcTo(x + w, y, x + w, y + h, r);
                ctx.arcTo(x + w, y + h, x, y + h, r);
                ctx.arcTo(x, y + h, x, y, r);
                ctx.arcTo(x, y, x + w, y, r);
                ctx.closePath();
            }

            function brassDial(cx, cy, r) {
                const bz = ctx.createRadialGradient(cx - r * 0.28, cy - r * 0.32, r * 0.15, cx, cy, r);
                bz.addColorStop(0, C.brassHi);
                bz.addColorStop(0.55, C.brass);
                bz.addColorStop(1, C.brassDark);
                ctx.fillStyle = bz;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fill();
                const fg = ctx.createRadialGradient(cx, cy, 1, cx, cy, r * 0.78);
                fg.addColorStop(0, '#ece4d0');
                fg.addColorStop(1, '#c4b8a0');
                ctx.fillStyle = fg;
                ctx.beginPath();
                ctx.arc(cx, cy, r * 0.78, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(cx, cy, r * 0.78, -Math.PI * 0.72, Math.PI * 0.08);
                ctx.stroke();
                for (let t = 0; t <= 10; t++) {
                    const a = -Math.PI * 0.75 + (t / 10) * Math.PI * 1.5;
                    const inner = r * (t % 5 === 0 ? 0.52 : 0.6);
                    ctx.strokeStyle = t % 5 === 0 ? 'rgba(42,52,60,0.85)' : 'rgba(42,52,60,0.45)';
                    ctx.lineWidth = t % 5 === 0 ? 1.4 : 0.8;
                    ctx.beginPath();
                    ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
                    ctx.lineTo(cx + Math.cos(a) * r * 0.72, cy + Math.sin(a) * r * 0.72);
                    ctx.stroke();
                }
            }

            // 背景与顶光
            const bg = ctx.createLinearGradient(0, 0, 0, H);
            bg.addColorStop(0, '#182028');
            bg.addColorStop(0.55, C.bg);
            bg.addColorStop(1, '#0a0c10');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            // FAR：实验顶架 + 远端气瓶组剪影（顶 y<50，侧 y≥118）
            ctx.fillStyle = 'rgba(24,32,40,0.65)';
            ctx.fillRect(0, 0, W, 42);
            ctx.strokeStyle = 'rgba(138,150,158,0.22)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, 14);
            ctx.lineTo(W, 14);
            ctx.stroke();
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(W * 0.08, 28);
            ctx.lineTo(W * 0.92, 28);
            ctx.stroke();
            for (let pr = 0; pr < 5; pr++) {
                ctx.fillStyle = 'rgba(106,154,184,0.12)';
                ctx.fillRect(36 + pr * (W / 5.8), 6, 8, 34);
            }
            for (let db = 0; db < 4; db++) {
                const dx = W * 0.78 + db * 14;
                ctx.fillStyle = 'rgba(42,52,60,0.45)';
                ctx.fillRect(dx, 118, 10, H * 0.22);
                ctx.fillRect(dx - 2, 118, 14, 6);
            }

            const drv = eventAnim ? eventAnim.drivers : null;
            if (drv) { p = drv.p; V = drv.V; pv = drv.pv; }

            const pNorm = Math.min(1, p / 10);
            const band = drv ? drv.band : (measuredPV != null ? computeBand(pv) : null);
            let fogBoost = 0, tubePulse = 0;
            if (eventAnim) {
                const d = eventAnim.drivers;
                const ph = getEventPhaseDurs();
                if (eventAnim.phase === 'windup') {
                    fogBoost = Math.min(1, eventAnim.t / Math.max(0.05, ph.windupDur)) * d.surgeAmp * 0.55;
                } else if (eventAnim.phase === 'peak') {
                    fogBoost = d.surgeAmp;
                    tubePulse = 1 - eventAnim.t / Math.max(0.05, ph.peakDur);
                    needleFlick = Math.sin(eventAnim.t * 48) * 0.1 * d.surgeAmp;
                } else if (eventAnim.phase === 'settle') {
                    fogBoost = d.surgeAmp * Math.exp(-eventAnim.t * 2.2);
                    needleFlick *= Math.exp(-eventAnim.t * 5);
                    if (band === 'ok') tubePulse = Math.max(0, 0.6 - eventAnim.t * 0.85);
                }
            } else {
                needleFlick *= 0.88;
            }
            let fogRgb = '58,120,160';
            if (band === 'ok') fogRgb = '90,170,130';
            else if (band === 'high') fogRgb = '180,90,70';
            else if (band === 'low') fogRgb = '70,110,180';

            const topGlowA = 0.10 + pNorm * 0.14 + fogBoost * 0.08;
            const topGlow = ctx.createRadialGradient(W * 0.22, H * 0.08, 8, W * 0.22, H * 0.08, W * 0.55);
            topGlow.addColorStop(0, 'rgba(90,158,200,' + topGlowA + ')');
            topGlow.addColorStop(1, 'rgba(90,158,200,0)');
            ctx.fillStyle = topGlow;
            ctx.fillRect(0, 0, W, H);

            const deskY = H * 0.8;
            const deskGrad = ctx.createLinearGradient(0, deskY - 20, 0, H);
            deskGrad.addColorStop(0, '#3a444c');
            deskGrad.addColorStop(0.12, C.mid);
            deskGrad.addColorStop(1, '#141a20');
            ctx.fillStyle = deskGrad;
            ctx.fillRect(0, deskY, W, H - deskY);
            ctx.fillStyle = 'rgba(184,208,224,0.12)';
            ctx.fillRect(0, deskY, W, 3);
            ctx.strokeStyle = 'rgba(0,0,0,0.35)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 7; i++) {
                ctx.beginPath();
                ctx.moveTo(24 + i * (W / 6.5), deskY + 8);
                ctx.lineTo(24 + i * (W / 6.5), H - 6);
                ctx.stroke();
            }

            // 气瓶 + 阀门（左侧，吃上空）
            const bottleX = 22, bottleY = 118, bottleW = 44, bottleH = H * 0.38;
            ctx.fillStyle = '#2a343c';
            rr(bottleX, bottleY + 20, bottleW, bottleH, 10);
            ctx.fill();
            const botG = ctx.createLinearGradient(bottleX, bottleY, bottleX + bottleW, bottleY);
            botG.addColorStop(0, '#4a6a78');
            botG.addColorStop(0.5, C.accent);
            botG.addColorStop(1, '#3a5460');
            ctx.fillStyle = botG;
            rr(bottleX + 4, bottleY + 28, bottleW - 8, bottleH - 24, 8);
            ctx.fill();
            ctx.fillStyle = C.brass;
            rr(bottleX + 12, bottleY, bottleW - 24, 28, 4);
            ctx.fill();
            ctx.fillStyle = C.brassHi;
            ctx.fillRect(bottleX + 18, bottleY - 10, 8, 14);
            ctx.beginPath();
            ctx.arc(bottleX + 22, bottleY - 12, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = C.hi;
            ctx.font = '10px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
            ctx.fillText('气瓶', bottleX + 8, bottleY + bottleH + 36);

            // 气缸布局（加高加厚 L 架）
            const mountW = W * 0.72, mountH = H * 0.48;
            const mountX = W * 0.1, mountY = Math.max(108, H * 0.16);
            const tubeX = mountX + mountW * 0.06;
            const tubeY = mountY + mountH * 0.32;
            const tubeW = mountW * 0.7;
            const tubeH = Math.max(52, mountH * 0.36);
            const wall = 14;
            const innerX = tubeX + wall;
            const innerY = tubeY + wall * 0.55;
            const innerW = tubeW - wall * 2;
            const innerH = tubeH - wall;

            // L 型钢架
            ctx.fillStyle = 'rgba(0,0,0,0.28)';
            rr(mountX + 6, deskY - 4, mountW, 12, 4);
            ctx.fill();
            const frameGrad = ctx.createLinearGradient(mountX, mountY, mountX, mountY + mountH);
            frameGrad.addColorStop(0, '#4a545c');
            frameGrad.addColorStop(0.45, C.metal);
            frameGrad.addColorStop(1, '#3a4248');
            ctx.fillStyle = frameGrad;
            rr(mountX, mountY + mountH * 0.78, mountW, mountH * 0.12, 5);
            ctx.fill();
            ctx.strokeStyle = 'rgba(184,208,224,0.22)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            // 竖立柱 + 横梁
            ctx.fillStyle = '#525c64';
            rr(mountX + mountW * 0.03, mountY + 8, mountW * 0.08, mountH * 0.78, 4);
            ctx.fill();
            rr(mountX + mountW * 0.88, mountY + 8, mountW * 0.08, mountH * 0.78, 4);
            ctx.fill();
            rr(mountX + mountW * 0.03, mountY + 8, mountW * 0.93, 16, 3);
            ctx.fill();

            // 厚玻璃气缸
            const shellGrad = ctx.createLinearGradient(tubeX, tubeY, tubeX, tubeY + tubeH);
            shellGrad.addColorStop(0, 'rgba(200,220,232,0.65)');
            shellGrad.addColorStop(0.3, 'rgba(106,154,184,0.28)');
            shellGrad.addColorStop(0.7, 'rgba(42,52,60,0.4)');
            shellGrad.addColorStop(1, 'rgba(138,150,158,0.55)');
            ctx.fillStyle = shellGrad;
            rr(tubeX, tubeY, tubeW, tubeH, tubeH / 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(184,208,224,0.5)';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.strokeStyle = 'rgba(255,255,255,0.28)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(tubeX + tubeH * 0.35, tubeY + 5);
            ctx.lineTo(tubeX + tubeW - tubeH * 0.35, tubeY + 5);
            ctx.stroke();
            // 玻璃穹顶高光
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            rr(tubeX + 10, tubeY + 4, tubeW * 0.35, tubeH * 0.35, 10);
            ctx.fill();

            // 左端盖（钢）
            const capGrad = ctx.createLinearGradient(tubeX - 18, tubeY, tubeX + 8, tubeY + tubeH);
            capGrad.addColorStop(0, '#6a747c');
            capGrad.addColorStop(1, '#3a4248');
            ctx.fillStyle = capGrad;
            rr(tubeX - 16, tubeY + 2, 18, tubeH - 4, 4);
            ctx.fill();
            // 阀门把手
            ctx.fillStyle = C.brass;
            ctx.fillRect(tubeX - 8, tubeY - 18, 10, 20);
            ctx.beginPath();
            ctx.arc(tubeX - 3, tubeY - 20, 8, 0, Math.PI * 2);
            ctx.fill();

            // 气体体积（随 V）
            const gasW = Math.max(28, (V / 10) * innerW);
            const gasGrad = ctx.createLinearGradient(innerX, innerY, innerX + gasW, innerY);
            gasGrad.addColorStop(0, 'rgba(90,158,200,0.42)');
            gasGrad.addColorStop(0.6, 'rgba(106,154,184,0.32)');
            gasGrad.addColorStop(1, 'rgba(184,208,224,0.18)');
            ctx.fillStyle = gasGrad;
            rr(innerX, innerY, gasW, innerH, innerH / 2);
            ctx.fill();
            // 腔室压强雾（随 p；事件时 surge ∝ P，三态着色）
            ctx.fillStyle = 'rgba(' + fogRgb + ',' + (0.04 + pNorm * 0.14 + fogBoost * 0.24) + ')';
            rr(innerX, innerY, innerW, innerH, innerH / 2);
            ctx.fill();
            const gasGlow = ctx.createRadialGradient(innerX + gasW * 0.35, innerY + innerH * 0.5, 4, innerX + gasW * 0.35, innerY + innerH * 0.5, gasW * 0.55);
            gasGlow.addColorStop(0, 'rgba(90,158,200,' + (0.14 + pNorm * 0.18) + ')');
            gasGlow.addColorStop(1, 'rgba(90,158,200,0)');
            ctx.fillStyle = gasGlow;
            rr(innerX, innerY, gasW, innerH, innerH / 2);
            ctx.fill();

            // 分子
            const n = 8 + Math.floor(p);
            const gasInnerW = Math.max(16, gasW - 20);
            for (let i = 0; i < n; i++) {
                const mx = innerX + 12 + ((i * 47 + animT * (18 + p * 7)) % Math.max(12, gasInnerW));
                const my = innerY + 10 + (i * 37 % Math.max(12, innerH - 20));
                ctx.beginPath();
                ctx.fillStyle = 'rgba(184,208,224,' + (0.55 + (i % 3) * 0.12) + ')';
                ctx.arc(mx, my, 2.2 + (i % 2) * 0.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(106,154,184,0.35)';
                ctx.beginPath();
                ctx.arc(mx - 0.8, my - 0.8, 0.9, 0, Math.PI * 2);
                ctx.fill();
            }

            // 黄铜活塞（厚度/阴影随旁路质量略变，不改物理）
            const massG = mSlider ? (parseFloat(mSlider.value) || 200) : 200;
            const massNorm = Math.max(0, Math.min(1, (massG - 50) / 450));
            const pistonX = innerX + gasW;
            const pistonW = 12 + massNorm * 10;
            const brassGrad = ctx.createLinearGradient(pistonX, innerY, pistonX + pistonW, innerY + innerH);
            brassGrad.addColorStop(0, C.brassHi);
            brassGrad.addColorStop(0.45, C.brass);
            brassGrad.addColorStop(1, C.brassDark);
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,' + (0.18 + massNorm * 0.32).toFixed(2) + ')';
            ctx.shadowBlur = 3 + massNorm * 10;
            ctx.shadowOffsetX = 2 + massNorm * 2;
            ctx.fillStyle = brassGrad;
            rr(pistonX - 1, innerY - 2, pistonW, innerH + 4, 3);
            ctx.fill();
            ctx.restore();
            ctx.strokeStyle = 'rgba(255,255,255,0.25)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(pistonX + 3, innerY + 2);
            ctx.lineTo(pistonX + 3, innerY + innerH - 2);
            ctx.stroke();
            const rodLen = Math.min(72, W - pistonX - pistonW - 48);
            const rodGrad = ctx.createLinearGradient(pistonX + pistonW, innerY + innerH * 0.42, pistonX + pistonW + rodLen, innerY + innerH * 0.58);
            rodGrad.addColorStop(0, '#a8b0b8');
            rodGrad.addColorStop(1, '#5a626a');
            ctx.fillStyle = rodGrad;
            rr(pistonX + pistonW, innerY + innerH * 0.38, rodLen, innerH * 0.24, 2);
            ctx.fill();
            ctx.fillStyle = C.hi;
            ctx.font = 'bold 11px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('活塞', pistonX + pistonW + 6, innerY - 8);

            // 压力表 + 连接管（加大）
            const gaugeX = Math.min(W * 0.86, tubeX + tubeW + 40);
            const gaugeY = mountY + mountH * 0.28;
            const gaugeR = Math.min(52, H * 0.14);
            ctx.strokeStyle = '#7a5520';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(tubeX + tubeW * 0.82, tubeY + tubeH * 0.35);
            ctx.lineTo(gaugeX - gaugeR * 0.5, gaugeY);
            ctx.stroke();
            ctx.strokeStyle = 'rgba(201,151,63,0.55)';
            ctx.lineWidth = 2;
            ctx.stroke();
            brassDial(gaugeX, gaugeY, gaugeR);
            // 黄铜表 rim 辉光（随 p）
            ctx.strokeStyle = 'rgba(201,151,63,' + (0.25 + pNorm * 0.55) + ')';
            ctx.lineWidth = 3;
            ctx.shadowColor = C.brass;
            ctx.shadowBlur = 2 + pNorm * 12;
            ctx.beginPath();
            ctx.arc(gaugeX, gaugeY, gaugeR + 2, 0, Math.PI * 2);
            ctx.stroke();
            ctx.shadowBlur = 0;
            const ang = -Math.PI * 0.75 + (p / 10) * Math.PI * 1.5 + needleFlick;
            ctx.strokeStyle = '#2a343c';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(gaugeX, gaugeY);
            ctx.lineTo(gaugeX + Math.cos(ang) * gaugeR * 0.58, gaugeY + Math.sin(ang) * gaugeR * 0.58);
            ctx.stroke();
            ctx.fillStyle = C.brassDark;
            ctx.beginPath();
            ctx.arc(gaugeX, gaugeY, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = C.hi;
            ctx.font = '11px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('压强表', gaugeX, gaugeY + gaugeR + 16);
            ctx.fillStyle = C.accent;
            ctx.font = '10px ui-monospace,monospace';
            ctx.fillText(p.toFixed(1) + ' atm', gaugeX, gaugeY + gaugeR + 30);

            const onBand = band === 'ok' || (band == null && pv >= BAND_LO && pv <= BAND_HI);
            const boxW = 230, boxH = 50, boxX = W - boxW - 16, boxY = H - boxH - 72;
            ctx.fillStyle = 'rgba(16,20,24,0.88)';
            rr(boxX, boxY, boxW, boxH, 6);
            ctx.fill();
            let boxStroke = onBand ? 'rgba(111,174,143,0.75)' : 'rgba(138,150,158,0.35)';
            if (band === 'high') boxStroke = 'rgba(212,132,122,0.85)';
            else if (band === 'low') boxStroke = 'rgba(106,144,208,0.75)';
            else if (band === 'ok') boxStroke = 'rgba(111,174,143,0.85)';
            ctx.strokeStyle = boxStroke;
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.fillStyle = C.hi;
            ctx.font = '12px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText((playMode === 'challenge' ? '急单' : '对照') + ' ' + BAND_LO.toFixed(1) + '–' + BAND_HI.toFixed(1) + ' atm·L', boxX + 10, boxY + 20);
            if (measuredPV == null) {
                ctx.fillStyle = '#e8eef2';
                ctx.fillText('当前乘积 待测 · 点测试后显示', boxX + 10, boxY + 38);
            } else {
                ctx.fillStyle = onBand ? C.ok : '#d4847a';
                ctx.fillText('当前乘积 ' + measuredPV.toFixed(2), boxX + 10, boxY + 38);
            }

            if (tubePulse > 0) {
                ctx.globalAlpha = tubePulse * 0.85;
                ctx.strokeStyle = band === 'ok' ? C.ok : (band === 'high' ? '#d4847a' : (band === 'low' ? '#6a90d0' : C.glow));
                ctx.lineWidth = 3;
                rr(tubeX - 6, tubeY - 6, tubeW + 12, tubeH + 12, tubeH / 2 + 4);
                ctx.stroke();
                ctx.globalAlpha = 1;
            }
        }

        function updateAll() {
            const { p, V, pv } = computePV();
            pDisplay.textContent = p.toFixed(1) + ' atm';
            vDisplay.textContent = V.toFixed(1) + ' L';
            if (mDisplay && mSlider) mDisplay.textContent = parseFloat(mSlider.value).toFixed(0) + ' g';
            pvDisplay.textContent = measuredPV == null ? '—' : measuredPV.toFixed(2);
            drawScene(p, V, pv);
        }

        function checkWin() {
            const { pv } = computePV();
            const ok = (pv >= BAND_LO && pv <= BAND_HI);
            let hintKey = 'win';
            if (!ok) hintKey = pv < BAND_LO ? 'pv_low' : 'pv_high';
            return { winOk: ok, hintKey: hintKey, pv: pv };
        }

        function emit(type, payload) {
            try { if (window.PlatformTraceAdapter) { window.PlatformTraceAdapter.record(type, payload || {}); return; } } catch (e) {}
            try { if (window.parent && window.parent !== window && window.parent.PlatformTraceAdapter) { window.parent.PlatformTraceAdapter.record(type, payload || {}); } } catch (e) {}
        }

        function fireSnapshotAndWin() {
            const { p, V, pv } = computePV();
            const { winOk, hintKey } = checkWin();
            measuredPV = pv;
            startEventAnim(p, V, pv);
            const controls = {};
            document.querySelectorAll('input[type="range"]').forEach(el => { if (el.id) controls[el.id] = el.value; });
            try { emit('snapshot', { controls, winOk: playMode==='challenge' && winOk, hintKey: playMode==='explore'?'explore_observe':hintKey }); } catch(e) {}
            if (playMode === 'explore') {
                winIndicator.innerHTML = '';
                hintMsg.textContent = '乘积 ' + pv.toFixed(2) + ' · 对照 p、V 再测';
            } else if (winOk) {
                try { emit('win', { winOk: true }); } catch(e) {}
                winIndicator.innerHTML = '<span class="pass-badge">过关 · 乘积落入锁定标定带</span>';
                hintMsg.textContent = '急单完成 · 乘积已入标定带';
                if (!challengeWon && typeof window.__craftShowWin === 'function') {
                  challengeWon = true;
                  window.__craftShowWin('急单标定带本局锁定。等温下 pV 由 p、V 决定；活塞质量为本关旁路，不进乘积。');
                }
            } else {
                // FixedChallenge：失败不换带；偏高/偏低可区分
                winIndicator.innerHTML = '';
                const sideTxt = pv < BAND_LO ? '乘积偏低' : '乘积偏高';
                hintMsg.innerHTML = '<span style="font-weight:600">' + sideTxt + '</span><br><span style="font-size:0.82em;opacity:.92">本次 ' + pv.toFixed(2) + ' · 带 ' + BAND_LO.toFixed(1) + '–' + BAND_HI.toFixed(1) + '</span>';
            }
            updateAll();
        }

        function resetToDefault() {
            eventAnim = null;
            pSlider.value = '3.0';
            vSlider.value = '5.0';
            measuredPV = null;
            updateAll();
            winIndicator.innerHTML = '';
            hintMsg.textContent = '已重置 · 调参后点测试查看乘积';

<script>
(function(){
  function emit(type, payload) {
    try {
      if (window.PlatformTraceAdapter) {
        window.PlatformTraceAdapter.record(type, payload || {});
        return;
      }
    } catch (e) {}
    try {
      if (window.parent && window.parent !== window && window.parent.PlatformTraceAdapter) {
        window.parent.PlatformTraceAdapter.record(type, payload || {});
      }
    } catch (e) {}
  }
  function snapControls() {
    var o = {};
    document.querySelectorAll('input[type="range"], input[type="number"], select').forEach(function(el) {
      var id = el.id || el.name;
      if (id) o[id] = el.value;
    });
    return o;
  }
  document.addEventListener('DOMContentLoaded', function() {
    emit('puzzle_open', {});
    document.querySelectorAll('input[type="range"], input[type="number"]').forEach(function(el) {
      el.addEventListener('change', function() {
        if (window.__platformTraceControlsBound) return;
        emit('tuning', { control: el.id || el.name || 'slider', value: el.value });
      });
    });
    document.querySelectorAll('button, [role="button"]').forEach(function(el) {
      el.addEventListener('click', function() {
        emit('action', { control: el.id || (el.textContent || '').trim().slice(0, 24) || 'button' });
      });
    });
    window.__emit = emit;
    window.__snapControls = snapControls;
  });
})();

<script>
(function(){
  function emitWin(hintKey) {
    if (window.__legacyWinEmitted) return;
    window.__legacyWinEmitted = true;
    var emit = window.__emit;
    if (!emit) return;
    var controls = window.__snapControls ? window.__snapControls() : {};
    emit('snapshot', { controls: controls, winOk: true, hintKey: hintKey || 'legacy_win' });
    emit('win', { winOk: true });
  }
  var WIN_TEXT = [/完美命中/, /游戏胜利/, /过关！/, /命中目标！/, /🎯\s*命中目标/, /🏆\s*过关/];
  var __legacyWinScanTimer = null;
  function scanWinText() {
    if (window.__legacyWinEmitted || window.__craftWinOpen || window.__craftWinDismissed) return false;
    var nodes = document.querySelectorAll(
      '.win-banner,#winBanner,[data-win="1"],.pass-badge,#winIndicator,.toast,.banner,.observe-item,[class*="win"]'
    );
    var text = '';
    for (var n = 0; n < nodes.length; n++) {
      text += (nodes[n].innerText || nodes[n].textContent || '') + '\n';
      if (text.length > 8000) break;
    }
    if (!text) return false;
    for (var i = 0; i < WIN_TEXT.length; i++) {
      if (WIN_TEXT[i].test(text)) {
        emitWin('text_' + i);
        return true;
      }
    }
    return false;
  }
  function scheduleScanWinText(muts) {
    if (window.__legacyWinEmitted || window.__craftWinOpen || window.__craftWinDismissed) return;
    if (__legacyWinScanTimer) return;
    __legacyWinScanTimer = setTimeout(function() {
      __legacyWinScanTimer = null;
      var suspect = !muts || !muts.length;
      if (!suspect) {
        for (var i = 0; i < muts.length && !suspect; i++) {
          var m = muts[i];
          if (m.type === 'characterData') {
            var pt = m.target && m.target.parentElement;
            var t = ((pt && (pt.innerText || pt.textContent)) || (m.target && m.target.data) || '').slice(0, 240);
            if (/过关|命中|胜利|🏆|🎯/.test(t)) suspect = true;
          } else if (m.addedNodes && m.addedNodes.length) {
            for (var j = 0; j < m.addedNodes.length; j++) {
              var node = m.addedNodes[j];
              if (!node || (node.nodeType !== 1 && node.nodeType !== 3)) continue;
              var tx = node.nodeType === 3
                ? (node.data || '')
                : ((node.innerText || node.textContent || '') + ' ' + (node.className || '') + ' ' + (node.id || ''));
              if (/过关|命中|胜利|🏆|🎯|win-banner|win-badge|pass-badge|winBanner/.test(tx)) {
                suspect = true;
                break;
              }
            }
          }
        }
      }
      if (suspect) scanWinText();
    }, 200);
  }
  document.addEventListener('DOMContentLoaded', function() {
    var obs = new MutationObserver(function(muts) { scheduleScanWinText(muts); });
    if (document.body) obs.observe(document.body, { subtree: true, childList: true, characterData: true });
    setInterval(function(){
      if (!window.__legacyWinEmitted && !window.__craftWinOpen && !window.__craftWinDismissed) scanWinText();
    }, 2000);
  });
})();
</script>

<script>
/* === dual-mode-shell runtime (auto) === */
(function(){
  if (window.__dualModeShell) return;
  window.__dualModeShell = true;

  var MAX_ATTEMPTS = 5;
  var EXPLORE_SECONDS = 10 * 60;
  var state = {
    mode: 'explore',
    attempts: MAX_ATTEMPTS,
    timeLeft: EXPLORE_SECONDS,
    timerId: null
  };

  function $(id){ return document.getElementById(id); }

  function setPhase(phase){
    try {
      if (typeof window.__platformTraceSetPhase === 'function') {
        window.__platformTraceSetPhase(phase);
      } else if (window.PlatformTraceAdapter && typeof window.PlatformTraceAdapter.setPhase === 'function') {
        window.PlatformTraceAdapter.setPhase(phase);
      }
    } catch (e) { /* offline */ }
  }

  function fmt(sec){
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function renderAttempts(){
    var el = $('attemptsDisplay');
    if (el) el.textContent = String(state.attempts);
  }

  function primaryButtons(){
    return Array.prototype.slice.call(document.querySelectorAll(
      '#essence-bench .essence-ft button, #essence-bench button.btn, #essence-bench button[id^="btn"]'
    ));
  }

  function gateActions(){
    var disable = state.mode === 'challenge' && state.attempts <= 0;
    primaryButtons().forEach(function(btn){
      if (/reset|清除|重置|再来/i.test(btn.textContent || '') || /reset|clear/i.test(btn.id || '')) return;
      btn.classList.toggle('dual-disabled', disable);
      if (disable) btn.setAttribute('disabled', 'disabled');
      else btn.removeAttribute('disabled');
    });
  }

  function stopTimer(){
    if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
  }

  function startExploreTimer(){
    stopTimer();
    state.timeLeft = EXPLORE_SECONDS;
    var td = $('timerDisplay');
    if (td) td.textContent = fmt(state.timeLeft);
    state.timerId = setInterval(function(){
      if (state.mode !== 'explore') return;
      state.timeLeft -= 1;
      if (td) td.textContent = fmt(Math.max(0, state.timeLeft));
      if (state.timeLeft <= 0) {
        stopTimer();
        var sel = $('modeSelect');
        if (sel) {
          sel.value = 'challenge';
          sel.dispatchEvent(new Event('change', { bubbles: true }));

  }

  function applyMode(mode){
    hideAttemptsExhausted();
    var __nextMode = mode === 'challenge' ? 'challenge' : 'explore';
    if (__nextMode === 'challenge' && __exhaustedNeedsNewRound) {
      __exhaustedNeedsNewRound = false;
      try { if (typeof window.__platformTraceRequestNewRound === 'function') window.__platformTraceRequestNewRound('exhausted_mode_reenter'); } catch (__nr) {}
    }
    state.mode = __nextMode;
    var label = $('modeLabel');
    var stats = $('challengeStats');
    var timerChip = $('dual-timer-chip');
    if (label) label.textContent = state.mode === 'explore' ? '探究模式' : '竞赛模式';
    if (stats) {
      if (state.mode === 'challenge') stats.classList.add('is-visible');
      else stats.classList.remove('is-visible');
    }
    if (timerChip) timerChip.style.display = state.mode === 'explore' ? 'inline-flex' : 'none';
    if (state.mode === 'challenge') {
      stopTimer();
      state.attempts = MAX_ATTEMPTS;
      renderAttempts();
    } else {
      startExploreTimer();
    }
    setPhase(state.mode);
    gateActions();
    try {
      if (typeof window.__gasApplyMode === 'function') window.__gasApplyMode(state.mode);
    } catch (e) {}
    document.dispatchEvent(new CustomEvent('dual-mode-change', { detail: { mode: state.mode, attempts: state.attempts } }));
  }


  /* === attempts-exhausted-settle === */
  var __exhaustTimer = null;
  var __exhaustBound = false;
  /* === exhausted-mode-reenter-new-round === */
  var __exhaustedNeedsNewRound = false;
  function __isChallengeWonNow(){
    if (window.__craftWinOpen) return true;
    if (window.__challengeWon) return true;
    var win = $('craft-win');
    if (win && !win.hidden && win.getAttribute('hidden') == null) {
      try { if (win.offsetParent !== null || getComputedStyle(win).display !== 'none') return true; } catch (e) { return true; }
    }
    if (win && win.hidden === false) return true;
    return false;
  }
  function hideAttemptsExhausted(){
    if (__exhaustTimer) { clearTimeout(__exhaustTimer); __exhaustTimer = null; }
    var el = $('attempts-exhausted');
    if (el) el.hidden = true;
  }
  function ensureAttemptsExhaustedUi(){
    if ($('attempts-exhausted')) return;
    var wrap = document.createElement('div');
    wrap.id = 'attempts-exhausted';
    wrap.hidden = true;
    wrap.innerHTML =
      '<div class="craft-card" role="dialog" aria-labelledby="attemptsExhaustedTitle">' +
        '<h2 id="attemptsExhaustedTitle">机会用尽</h2>' +
        '<p id="attemptsExhaustedDesc">本局急单未完成。目标仍按本局规则（口位/标定带等）锁定；可返回探究继续调参，或再开一局竞赛。</p>' +
        '<div class="craft-actions">' +
          '<button type="button" id="attemptsExhaustedExplore">返回探究</button>' +
          '<button type="button" id="attemptsExhaustedRetry" class="craft-btn-secondary">再开一局竞赛</button>' +
          '<button type="button" id="attemptsExhaustedList" class="craft-btn-ghost">返回列表</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(wrap);
    var bExplore = $('attemptsExhaustedExplore');
    var bRetry = $('attemptsExhaustedRetry');
    var bList = $('attemptsExhaustedList');
    if (bExplore) bExplore.addEventListener('click', function(){
      hideAttemptsExhausted();
      var sel = $('modeSelect');
      if (sel) {
        sel.value = 'explore';
        sel.dispatchEvent(new Event('change', { bubbles: true }));
      } else {
        applyMode('explore');
      }
    });
    if (bRetry) bRetry.addEventListener('click', function(){
      __exhaustedNeedsNewRound = false;
      try { if (typeof window.__platformTraceRequestNewRound === 'function') window.__platformTraceRequestNewRound('exhausted_retry'); } catch (__nr) {}
      hideAttemptsExhausted();
      state.attempts = MAX_ATTEMPTS;
      renderAttempts();
      gateActions();
      applyMode('challenge');
      var sel = $('modeSelect');
      if (sel) sel.value = 'challenge';
    });
    if (bList) {
      if (typeof window.__eaNavigateToStudentList !== 'function' && !document.getElementById('craftBackBtn')) {
        bList.hidden = true;
      } else {
        bList.addEventListener('click', function(){
          hideAttemptsExhausted();
          if (typeof window.__eaNavigateToStudentList === 'function') window.__eaNavigateToStudentList();
          else {
            var bb = document.getElementById('craftBackBtn');
            if (bb) bb.click();
          }
        });
      }
    }
  }
  function showAttemptsExhausted(){
    if (state.mode !== 'challenge' || state.attempts > 0) return;
    if (__isChallengeWonNow()) return;
    ensureAttemptsExhaustedUi();
    var el = $('attempts-exhausted');
    if (!el) return;
    var firstShow = !!el.hidden;
    el.hidden = false;
    if (firstShow) __exhaustedNeedsNewRound = true;
    /* === attempts-exhausted-emit === */
    if (firstShow) {
      try {
        var __exPayload = { attempts: 0, mode: 'challenge' };
        var __exSnap = { winOk: false, attemptsExhausted: true, hintKey: 'attempts_exhausted' };
        if (typeof window.__emit === 'function') {
          window.__emit('attempts_exhausted', __exPayload);
          window.__emit('snapshot', __exSnap);
        }
        // Always mirror to PlatformTraceAdapter — __emit may be a stub/wrapper
        try {
          if (window.PlatformTraceAdapter && typeof window.PlatformTraceAdapter.record === 'function') {
            window.PlatformTraceAdapter.record('attempts_exhausted', __exPayload);
            window.PlatformTraceAdapter.record('snapshot', __exSnap);
          } else if (window.parent && window.parent !== window && window.parent.PlatformTraceAdapter && typeof window.parent.PlatformTraceAdapter.record === 'function') {
            window.parent.PlatformTraceAdapter.record('attempts_exhausted', __exPayload);
            window.parent.PlatformTraceAdapter.record('snapshot', __exSnap);
          }
        } catch (__pta) {}
      } catch (__exErr) {}
    }

  }
  function scheduleAttemptsExhausted(){
    if (state.mode !== 'challenge' || state.attempts > 0) return;
    if (__exhaustTimer) clearTimeout(__exhaustTimer);
    __exhaustTimer = setTimeout(function(){
      __exhaustTimer = null;
      showAttemptsExhausted();
    }, 650);
  }
  function bindExhaustWinGuard(){
    if (__exhaustBound) return;
    __exhaustBound = true;
    var prev = window.__craftShowWin;
    if (typeof prev === 'function') {
      window.__craftShowWin = function(){
        hideAttemptsExhausted();
        return prev.apply(this, arguments);
      };
    }
    try {
      var obs = new MutationObserver(function(){
        if (__isChallengeWonNow()) hideAttemptsExhausted();
      });
      obs.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'class', 'style'] });
    } catch (e) {}
  }
  window.__showAttemptsExhausted = showAttemptsExhausted;
  window.__hideAttemptsExhausted = hideAttemptsExhausted;

  var FIRE_SEL = '#btnLaunch,#btn-test,#btn-test-ft,#btn-fire,#btnFire,#btnTest,#testBtn,#fireBtn,#launchBtn,#btn-run,#btnRun,#c4-discharge-btn,[data-action="fire"],[data-action="test"],[data-action="launch"]';
  function onPrimaryClick(e){
    if (state.mode !== 'challenge') return;
    var t = e.target && e.target.closest ? e.target.closest(FIRE_SEL) : null;
    if (!t) return;
    if (/reset|清除|重置|再来/i.test(t.textContent || '') || /reset|clear/i.test(t.id || '')) return;
    if (state.attempts <= 0) {
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    state.attempts -= 1;
    renderAttempts();
    gateActions();
    if (state.attempts <= 0) scheduleAttemptsExhausted();
  }

  function ensureUi(){
    var stage = $('essence-stage') || document.querySelector('#proj-stage, #stage, #canvasContainer, .canvas-wrap')?.parentElement;
    var bench = $('essence-bench');

          '<span id="timerDisplay">10:00</span>' +
        '</div>' +

      stage.style.position = stage.style.position || 'relative';
      stage.appendChild(hud);
    }

    if (bench && !$('modeSelect')) {
      bench.classList.add('dual-mode-ready');
      var hd = document.createElement('div');

      hd.className = 'dual-bench-hd';

  }

  function boot(){
    if (!ensureUi()) return;
    var sel = $('modeSelect');
    sel.addEventListener('change', function(){ applyMode(sel.value); });
    // Empty .essence-ft misses fire buttons in .essence-scroll — bind bench + fire selectors
    var root = $('essence-bench') || document;
    root.addEventListener('click', onPrimaryClick, true);

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

<script>
/* === ea-minset-helper (gas-ideal) === */
(function(){
  if (window.__eaMinset) return; window.__eaMinset = true;
  var AV_LABELS = {"s-pressure":"压强","s-volume":"体积","s-piston-mass":"活塞质量"};
  var READING_SEL = "#craftGaugeVal, .observe-box .state, .observe-value, #hud-dist, #g-T, .gauge .gval, #c4-readout, #obs-rtotal, #obs-current";
  var READING_LABEL = "pV 读数";
  var ACTION_LABEL = "操作";
  var EXTRA_TUNE_SEL = "";
  var sessionEvidence = {
    tuneCounts: {},
    fireCount: 0,
    lastReading: '',
    attribution: null,
    evidenceSummary: ''
  };
  Object.keys(AV_LABELS).forEach(function(id){ sessionEvidence.tuneCounts[id] = 0; });

  function noteAvTune(controlId){
    if (!sessionEvidence.tuneCounts.hasOwnProperty(controlId)) return;
    sessionEvidence.tuneCounts[controlId] += 1;
  }
  function noteFire(){ sessionEvidence.fireCount += 1; }
  function dominantAv(){
    var bestId = null, bestN = 0;
    Object.keys(sessionEvidence.tuneCounts).forEach(function(id){
      var n = sessionEvidence.tuneCounts[id];
      if (n > bestN) { bestN = n; bestId = id; }
    });
    return bestId ? { id: bestId, label: AV_LABELS[bestId] || bestId, count: bestN } : null;
  }
  function readObservation(){
    var nodes = document.querySelectorAll(READING_SEL);
    for (var i = 0; i < nodes.length; i++){
      var t = (nodes[i].textContent || '').replace(/\s+/g, ' ').trim();
      if (t && t !== '待测' && t !== '--' && t !== '—.———' && t !== '观测中') return t;
    }
    return sessionEvidence.lastReading || '--';
  }
  function modeIsChallenge(){
    var s = document.getElementById('modeSelect');
    var v = s ? String(s.value || '') : '';
    if (v === 'challenge') return true;
    try {
      if (typeof window.__platformTraceGetPhase === 'function') {
        return String(window.__platformTraceGetPhase() || '') === 'challenge';
      }
    } catch (e) {}
    return false;
  }
  function buildEvidenceSummary(reading){
    var dom = dominantAv();
    var mainTxt = dom && dom.count > 0 ? (dom.label + '×' + dom.count) : '未集中调节';
    var r = reading || readObservation();
    sessionEvidence.lastReading = r;
    if (modeIsChallenge()) {
      return '竞赛证据：' + READING_LABEL + ' ' + r + ' · 主调 ' + mainTxt + ' · ' + ACTION_LABEL + ' ' + sessionEvidence.fireCount + ' 次';
    }
    return '探究证据：' + READING_LABEL + ' ' + r + ' · 主调节 ' + mainTxt + ' · ' + ACTION_LABEL + ' ' + sessionEvidence.fireCount + ' 次';
  }
  function setCraftSettleOpen(open){
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'craft-settle', open: !!open }, '*');
      }
    } catch (e) {}
  }
  function navigateToStudentList(){
    try {
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'platform-navigate', to: 'student-list' }, '*'); } catch (e1) {}
        try { window.parent.location.href = '/student.html'; return; } catch (e2) {}
        return;
      }
    } catch (e3) {}
    window.location.href = '../index.html';
  }
  function updateAttrHint(selected){
    var hintEl = document.getElementById('craftAttrHint');
    if (!hintEl) return;
    var dom = dominantAv();
    if (!dom || dom.count <= 0 || !selected || selected === 'mixed' || selected === 'unsure' || selected === dom.id) {
      hintEl.hidden = true; hintEl.textContent = ''; return;
    }
    hintEl.hidden = false;
    hintEl.textContent = '本局证据主调是' + dom.label + '；若答物理上谁更灵敏可另说——此处问的是本局对照';
  }
  function setCraftRevealVisible(visible){
    var reveal = document.getElementById('craftReveal');
    if (reveal) reveal.hidden = !visible;
  }
  function prepareCraftWin(extraReading){
    var reading = extraReading || readObservation();
    sessionEvidence.evidenceSummary = buildEvidenceSummary(reading);
    sessionEvidence.attribution = null;
    var line = document.getElementById('craftEvidenceLine');
    if (line) line.innerHTML = '<strong>本局证据</strong>　' + sessionEvidence.evidenceSummary;
    document.querySelectorAll('input[name="craftAttr"]').forEach(function(el){ el.checked = false; });
    var wbtn = document.getElementById('craftWinBtn');
    if (wbtn) wbtn.disabled = true;
    setCraftRevealVisible(false);
    updateAttrHint(null);
    window.__eaSessionEvidence = sessionEvidence;
  }
  function emitAttributionSnapshot(){
    if (!window.__emit || !sessionEvidence.attribution) return;
    var c = window.__snapControls ? window.__snapControls() : {};
    window.__emit('snapshot', {
      controls: c,
      winOk: true,
      attribution: sessionEvidence.attribution,
      evidenceSummary: sessionEvidence.evidenceSummary
    });
  }

  function bindTunes(){
    Object.keys(AV_LABELS).forEach(function(id){
      var el = document.getElementById(id);
      if (!el) return;
      var handler = function(){ noteAvTune(id); };
      el.addEventListener('input', handler);
      el.addEventListener('change', handler);
    });
    // capacitor ch4 choice grids
    if (EXTRA_TUNE_SEL) {
      document.addEventListener('click', function(ev){
        var t = ev.target;
        if (!t || !t.closest) return;
        if (t.closest('#c4-c-grid')) noteAvTune('c4-c');
        else if (t.closest('#c4-v-grid')) noteAvTune('c4-v');
      }, true);
    }
    var fireSel = '#btnLaunch,#btn-test,#btn-fire,#btnFire,#btnTest,#fireBtn,#btn-run,#btnRun,#c4-discharge-btn,[data-action="fire"],[data-action="test"],[data-action="launch"]';
    document.addEventListener('click', function(ev){
      var t = ev.target;
      if (!t || !t.closest) return;
      if (t.closest(fireSel)) noteFire();
    }, true);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bindTunes);
  else bindTunes();

  window.__eaPrepareCraftWin = prepareCraftWin;
  window.__eaEmitAttribution = emitAttributionSnapshot;
  window.__eaSessionEvidence = sessionEvidence;
  window.__eaSetCraftSettleOpen = setCraftSettleOpen;
  window.__eaNavigateToStudentList = navigateToStudentList;
  window.__eaUpdateAttrHint = updateAttrHint;
  window.__eaSetCraftRevealVisible = setCraftRevealVisible;
  window.__eaNoteAvTune = noteAvTune;
  window.__eaNoteFire = noteFire;
})();
</script>
<script>
/* === craft-gold-runtime === */
(function(){
  if (window.__craftGold) return; window.__craftGold = true;
  var intro = document.getElementById('craft-intro');
  var win = document.getElementById('craft-win');
  var btn = document.getElementById('craftIntroBtn');
  var wbtn = document.getElementById('craftWinBtn');
  var bbtn = document.getElementById('craftBackBtn');
  if (btn) btn.addEventListener('click', function(){ if(intro) intro.hidden = true; });
  function setSettle(open){
    if (typeof window.__eaSetCraftSettleOpen === 'function') window.__eaSetCraftSettleOpen(open);
  }
  function replayLevel(){
    if (typeof window.__craftReplay === 'function') {
      try { window.__craftReplay(); return; } catch (e) {}
    }
    var rbtn = document.getElementById('btn-reset')
      || document.querySelector('#btnReset, button.btn-reset, [data-action="reset"]');
    if (rbtn) { try { rbtn.click(); } catch (e) {} }
  }
  if (wbtn) wbtn.addEventListener('click', function(){
    if (wbtn.disabled) return;
    try { if (typeof window.__platformTraceRequestNewRound === 'function') window.__platformTraceRequestNewRound('craft_win_replay'); } catch (__nr) {}
    window.__craftWinDismissed = true;
    window.__craftWinOpen = false;
    if (win) win.hidden = true;
    setSettle(false);
    replayLevel();
  });
  if (bbtn) bbtn.addEventListener('click', function(){
    if (typeof window.__eaNavigateToStudentList === 'function') window.__eaNavigateToStudentList();
  });
  document.querySelectorAll('input[name="craftAttr"]').forEach(function(el){
    el.addEventListener('change', function(){
      if (!el.checked) return;
      var ev = window.__eaSessionEvidence;
      if (ev) ev.attribution = el.value;
      if (typeof window.__eaSetCraftRevealVisible === 'function') window.__eaSetCraftRevealVisible(true);
      if (typeof window.__eaUpdateAttrHint === 'function') window.__eaUpdateAttrHint(el.value);
      if (typeof window.__eaEmitAttribution === 'function') window.__eaEmitAttribution();
      if (wbtn) wbtn.disabled = false;
    });
  });

  function showWin(extra){
    if (window.__craftWinOpen) {
      var t0 = document.getElementById('craftWinText');
      if (t0 && typeof extra === 'string' && extra) t0.textContent = extra;
      return;
    }
    if (win) {
      window.__craftWinOpen = true;
      window.__craftWinDismissed = false;
      if (typeof window.__eaPrepareCraftWin === 'function') {
        var ev0 = window.__eaSessionEvidence;
        if (!ev0 || !ev0.evidenceSummary) window.__eaPrepareCraftWin();
      }
      try {
        var msg = document.getElementById('messageBox');
        if (msg) msg.classList.add('hidden');
      } catch (e) {}
      // prefer craft-win over long chapter summaries when both exist
      try {
        ['summary4','summary1','summary2','summary3','victory'].forEach(function(id){
          var el = document.getElementById(id);
          if (el) el.style.display = 'none';
        });
      } catch (e2) {}
      win.hidden = false;
      setSettle(true);
      var ev = window.__eaSessionEvidence;
      if (!(ev && ev.attribution)) {
        if (typeof window.__eaSetCraftRevealVisible === 'function') window.__eaSetCraftRevealVisible(false);
        if (wbtn) wbtn.disabled = true;
        var tip = document.getElementById('craftAttrHint');
        if (tip) {
          tip.hidden = false;
          tip.textContent = '请先点选上方归因，再点「再玩一次」';
        }
      }
      var t = document.getElementById('craftWinText');
      if (t && typeof extra === 'string' && extra) t.textContent = extra;
    }
  }
  window.__craftShowWin = showWin;

  var _emit = window.__emit;
  window.__emit = function(type, payload){
    if (typeof _emit === 'function') _emit(type, payload);
    if (type === 'win') showWin();
  };
  var obs = new MutationObserver(function(){
    if (window.__craftWinDismissed || window.__craftWinOpen) return;
    var el = document.querySelector('.win-banner,#winBanner,[data-win="1"]');
    if (el && el.offsetParent !== null) showWin();
  });
  obs.observe(document.body, {childList:true, subtree:true, attributes:true, attributeFilter:['class','style','hidden']});

  function tick(){
    var src = document.querySelector('.observe-box .state, .observe-value, #hud-dist, #g-T, .gauge .gval, #c4-readout, #obs-rtotal');
    var gval = document.getElementById('craftGaugeVal');
    if (gval && src && src !== gval) gval.textContent = (src.textContent || '').trim() || '观测中';
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>


<script>
/* === trace-new-round-on-retry === */
(function(){
  if (window.__platformTraceRequestNewRound) return;
  window.__platformTraceRequestNewRound = function(reason){
    var r = reason || 'retry';
    try {
      if (window.parent && window.parent !== window) {
        if (typeof window.parent.__platformTraceNewRound === 'function') {
          window.parent.__platformTraceNewRound({ reason: r });
          return true;
        }
        window.parent.postMessage({ type: 'platform-trace-new-round', reason: r }, '*');
        return true;
      }
    } catch (e) {}
    try {
      if (window.PlatformTraceAdapter && typeof window.PlatformTraceAdapter.beginNewRound === 'function') {
        window.PlatformTraceAdapter.beginNewRound({ reason: r });
        return true;
      }
    } catch (e2) {}
    return false;
  };
})();
</script>
