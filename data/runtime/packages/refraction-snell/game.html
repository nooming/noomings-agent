<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光学台 · 水槽折射</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family:var(--font-sans); background: #f5f7fa; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h1 { font-size: 1.6rem; margin-bottom: 4px; }
        .subtitle { color: #555; margin-bottom: 16px; font-size: 0.95rem; }
        .canvas-wrap { background: #eef1f5; border-radius: 10px; padding: 8px; margin-bottom: 20px; }
        canvas { display: block; width: 100%; height: auto; background: white; border-radius: 6px; }
        .controls-grid { display: flex; flex-wrap: wrap; gap: 20px 30px; margin-bottom: 20px; }
        .slider-group { flex: 1 1 180px; }
        .slider-group label { display: block; font-weight: 500; margin-bottom: 4px; font-size: 0.9rem; }
        .slider-group input { width: 100%; }
        .slider-group .value { font-size: 0.85rem; color: #2c3e50; margin-top: 2px; }
        .action-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
        button { background: #2c7be5; color: white; border: none; padding: 8px 22px; border-radius: 30px; font-size: 1rem; cursor: pointer; }
        button:active { background: #1a5bb5; }
        .observe-box { background: #f0f4f8; border-radius: 8px; padding: 12px 16px; margin: 12px 0 16px; border-left: 4px solid #2c7be5; }
        .observe-box strong { font-size: 0.95rem; }
        .observe-box .reading { font-size: 1.2rem; font-weight: 600; color: #1a3a5c; margin-left: 8px; }
        .feedback { min-height: 28px; font-weight: 500; color: #1e3c5a; margin: 6px 0 10px; }
        .pass-badge { background: #27ae60; color: white; padding: 6px 18px; border-radius: 40px; display: inline-block; font-weight: 600; }
        .irrelevant-area { margin-top: 20px; padding-top: 12px; border-top: 1px dashed #ccc; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .irrelevant-area button { background: #b0b8c5; color: #1f2a3f; font-size: 0.8rem; padding: 4px 14px; }
        .irrelevant-area button:active { background: #8f98a8; }
        .formula-note { background: #f8f9fc; padding: 8px 14px; border-radius: 20px; font-size: 0.9rem; color: #2c3e50; margin-bottom: 10px; display: inline-block; }
        .flex { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    
/* === essence-sidebar-shell (auto) === */
html, body { width:100%; height:100%; margin:0; padding:0 !important; overflow:hidden; }
body { display:block !important; align-items:stretch !important; justify-content:stretch !important; min-height:0 !important; }
#essence-app {
  display:flex; flex-direction:row; width:100%; height:100%; min-height:0;
  background:inherit;
}
#essence-stage {
  position:relative; flex:1; min-width:0; min-height:0;
  display:flex; flex-direction:column; background:#0f172a;
}
#essence-stage canvas {
  display:block; width:100% !important; height:100% !important; max-width:none !important;
  margin:0 !important; border-radius:0 !important; flex:1; min-height:0;
}
#essence-hud {
  position:absolute; top:10px; left:10px; right:10px; z-index:5; pointer-events:none;
  display:flex; flex-direction:column; gap:4px; max-width:min(420px, calc(100% - 20px));
}
#essence-hud .essence-title {
  pointer-events:none; padding:8px 12px; border-radius:12px;
  background:rgba(15,23,42,0.88); color:#e2e8f0; font-size:14px; font-weight:600;
  border:1px solid rgba(148,163,184,0.35);
}
#essence-hud .essence-sub {
  pointer-events:none; padding:6px 12px; border-radius:10px;
  background:rgba(15,23,42,0.75); color:#94a3b8; font-size:12px;
  border:1px solid rgba(148,163,184,0.25);
}
#essence-bench {
  width:clamp(280px, 28vw, 340px); flex-shrink:0; min-height:0;
  display:flex; flex-direction:column;
  background:#fff; border-left:1px solid #e2e8f0;
  color:#1a202c;
}
#essence-bench .essence-scroll {
  flex:1; overflow-y:auto; padding:14px 16px 8px; min-height:0;
  -webkit-overflow-scrolling:touch;
}
#essence-bench .essence-ft {
  padding:10px 16px 14px; border-top:1px solid #e2e8f0; flex-shrink:0;
  display:flex; flex-direction:column; gap:8px;
}
#essence-bench .slider-group input[type=range],
#essence-bench input[type=range] {
  width:100%; height:28px; margin:0;
}
@media (max-width:720px) {
  #essence-app { flex-direction:column; }
  #essence-stage { flex:1 1 0; min-height:48vh; }
  #essence-bench { width:100%; max-height:min(42vh,360px); border-left:none; border-top:1px solid #e2e8f0; }
}

#essence-stage .canvas-wrap,
#essence-stage .canvas-area,
#essence-stage > div:not(#essence-hud):not(#dual-mode-hud) {
  flex:1; min-height:0; width:100%; height:100%;
  margin:0 !important; padding:0 !important; border-radius:0 !important;
  background:transparent !important; display:flex; align-items:stretch;
}

/* dual-mode HUD 不得吃到舞台 flex 拉伸规则 */
#essence-stage > #dual-mode-hud {
  position:absolute !important; top:10px !important; left:10px !important; right:10px !important;
  width:auto !important; height:auto !important; max-width:none !important;
  flex:none !important; margin:0 !important; padding:0 !important;
  background:transparent !important; align-items:flex-start !important;
  justify-content:flex-start !important; z-index:9; pointer-events:none !important;
}
#essence-stage > #dual-mode-hud .dual-chip,
#essence-stage > #dual-mode-hud #challengeStats {
  height:auto !important; align-self:flex-start !important; flex:none !important;
  pointer-events:auto !important;
}
#essence-bench .essence-scroll > .app,
#essence-bench .essence-scroll > .card,
#essence-bench .essence-scroll > .container,
#essence-bench .essence-scroll > .game {
  display:contents;
}

/* hide original card chrome when wrapped */
.essence-legacy-hide-outer > .app,
.essence-legacy-hide-outer > .card,
.essence-legacy-hide-outer > .container,
.essence-legacy-hide-outer > .game,
.essence-legacy-hide-outer > #app { display:contents; }


/* === dual-mode-shell (auto) === */
#dual-mode-hud {
  position:absolute; top:10px; left:10px; right:10px; z-index:8;
  display:flex; justify-content:space-between; align-items:flex-start;
  gap:8px; pointer-events:none;
}
#dual-mode-hud .dual-chip {
  pointer-events:auto; display:inline-flex; align-items:center; gap:10px;
  padding:8px 14px; border-radius:999px;
  background:rgba(255,255,255,0.92); border:1px solid rgba(148,163,184,0.45);
  box-shadow:0 4px 12px rgba(15,23,42,0.12); color:#1e293b; font-size:13px;
}
#dual-mode-hud #modeLabel { font-weight:700; color:#2563eb; }
#dual-mode-hud #timerDisplay { font-family:var(--font-mono); font-weight:600; color:#334155; }
#challengeStats {
  pointer-events:auto; display:none; align-items:center; gap:8px;
  padding:8px 14px; border-radius:999px;
  background:rgba(255,255,255,0.92); border:1px solid rgba(248,113,113,0.45);
  box-shadow:0 4px 12px rgba(15,23,42,0.12); color:#1e293b; font-size:13px;
}
#challengeStats.is-visible { display:inline-flex; }
#attemptsDisplay { font-weight:700; color:#dc2626; font-size:16px; }
#essence-bench-hd, .dual-bench-hd {
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:12px 16px; border-bottom:1px solid #e2e8f0; background:#fff; flex-shrink:0;
}
#essence-bench-hd h1, .dual-bench-hd h1 {
  margin:0; font-size:15px; font-weight:700; color:#1e293b; line-height:1.3;
}
#modeSelect {
  border:1px solid #93c5fd; border-radius:999px; padding:4px 10px;
  font-size:12px; font-weight:600; color:#1d4ed8; background:#eff6ff; cursor:pointer;
}
#essence-bench.dual-mode-ready { display:flex; flex-direction:column; }
button.dual-disabled, .dual-disabled { opacity:0.45; pointer-events:none; cursor:not-allowed; }


/* === craft-gold-shell === */
:root{--font-sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;--font-mono:ui-monospace,"Cascadia Code",Consolas,monospace;--font-display:var(--font-sans);--font-formula:"Cambria Math","Times New Roman",serif;--craft-accent:#3a9e9a;--craft-bg:#0a1414;--craft-panel:#142422;--craft-text:#e4f0ee;--craft-muted:#7a9a96;}
html,body{width:100%!important;height:100%!important;margin:0!important;padding:0!important;overflow:hidden!important;
  font-family:var(--font-sans)!important;background:var(--craft-bg)!important;color:var(--craft-text)!important;}
#essence-app,#app{background:var(--craft-bg)!important;}
#essence-stage,#stage{background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.04),transparent 55%),var(--craft-bg)!important;}
#essence-bench,.control-panel,#controls-area,#bench{background:linear-gradient(180deg,color-mix(in srgb,var(--craft-panel) 92%,#fff),var(--craft-panel))!important;border-left:1px solid color-mix(in srgb,var(--craft-accent) 35%,transparent)!important;color:var(--craft-text)!important;}
#essence-bench-hd,.dual-bench-hd,.bench-hd,.ctrl-hd{background:rgba(0,0,0,.25)!important;border-bottom:1px solid color-mix(in srgb,var(--craft-accent) 30%,transparent)!important;}
#essence-bench-hd h1,.bench-hd-title,.ctrl-hd{color:var(--craft-accent)!important;}
#essence-bench .essence-scroll,#essence-bench .essence-ft,.bench-scroll,.ctrl-scroll,.ctrl-ft{background:transparent!important;color:var(--craft-text)!important;}
#essence-bench label,.slider-group label,.slabel{color:var(--craft-text)!important;}
#essence-bench .btn,button.btn,.pixel-btn,#btnLaunch,#btn-fire{background:var(--craft-accent)!important;border:none!important;color:#0b1020!important;font-weight:700!important;border-radius:12px!important;}
#essence-bench .observe-box{background:rgba(0,0,0,.32)!important;border:1px solid color-mix(in srgb,var(--craft-accent) 28%,transparent)!important;color:var(--craft-text)!important;}
#essence-bench .value,.observe-box .reading{color:#ffe0c2!important;}
#essence-bench .formula-note,.irrelevant-area{display:none!important;}
#essence-bench .feedback{color:var(--craft-text)!important;}
#essence-hud{top:10px!important;right:12px!important;left:auto!important;max-width:min(240px,calc(100% - 24px))!important;align-items:flex-end!important;}
#essence-hud .essence-title,#essence-hud .essence-sub{text-shadow:none!important;}
#craft-intro,#craft-win{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.72);backdrop-filter:blur(8px);
}
#craft-intro[hidden],#craft-win[hidden]{display:none!important;}

.craft-card button:disabled{opacity:.45;cursor:not-allowed;filter:none;}
.craft-evidence{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.22);border:1px solid color-mix(in srgb,var(--craft-accent) 32%,transparent);font-size:.88rem;line-height:1.55;color:var(--craft-text);}
.craft-evidence strong{color:var(--craft-accent);font-weight:600;}
.craft-attr{margin:0 0 12px;}
.craft-attr-label{margin:0 0 8px;font-size:.9rem;color:var(--craft-muted);}
.craft-attr-options{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;}
@media (max-width:420px){.craft-attr-options{grid-template-columns:1fr;}}
.craft-attr label{display:flex;align-items:flex-start;gap:8px;margin:0;font-size:.86rem;line-height:1.4;color:var(--craft-text);cursor:pointer;}
.craft-attr input{margin-top:3px;accent-color:var(--craft-accent);}
.craft-attr-hint{margin:8px 0 0;font-size:.78rem;line-height:1.45;color:var(--craft-muted);}
.craft-attr-hint[hidden]{display:none!important;}
.craft-reveal{margin-top:4px;}
.craft-reveal[hidden]{display:none!important;}
.craft-cv,#craft-cv{font-size:.8rem;color:var(--craft-muted);border:1px dashed color-mix(in srgb,var(--craft-accent) 35%,transparent);
  border-radius:10px;padding:8px 10px;margin:0 0 4px;line-height:1.45;}
.craft-actions{display:flex;gap:10px;margin-top:14px;}
.craft-actions button{flex:1;width:auto;padding:11px 10px;font-size:.95rem;}
.craft-btn-secondary{background:transparent!important;border:1px solid color-mix(in srgb,var(--craft-accent) 45%,transparent)!important;color:var(--craft-text)!important;font-weight:600!important;}
.craft-btn-secondary:hover{filter:brightness(1.08);background:rgba(255,255,255,.04)!important;}

.craft-card{
  width:min(440px,92vw);background:var(--craft-panel);border:1px solid color-mix(in srgb,var(--craft-accent) 45%,transparent);
  border-radius:18px;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.craft-card h2{margin:0 0 10px;font-size:1.25rem;color:var(--craft-accent);letter-spacing:1px;}
.craft-card p{margin:0 0 12px;line-height:1.65;color:var(--craft-text);font-size:.95rem;}
.craft-card .formula{font-family:var(--font-formula);font-size:1.05rem;color:#fff;background:rgba(0,0,0,.28);
  border-left:3px solid var(--craft-accent);padding:10px 12px;border-radius:8px;margin:10px 0 16px;}
.craft-card button{width:100%;padding:12px;border:none;border-radius:12px;background:var(--craft-accent);color:#0b1020;font-weight:700;cursor:pointer;font-size:1rem;}
#craft-gauge{display:none!important;}
#craft-gauge strong{color:var(--craft-accent);font-family:var(--font-mono);font-size:16px;display:block;margin-top:2px;}
#craft-cv{font-size:12px;color:var(--craft-muted);border:1px dashed color-mix(in srgb,var(--craft-accent) 35%,transparent);
  border-radius:10px;padding:8px 10px;margin:8px 0;}
.app,.card,.container{background:transparent!important;box-shadow:none!important;color:inherit!important;}
.sub,.hint{color:var(--craft-text)!important;border-left-color:var(--craft-accent)!important;}
#dual-mode-hud .dual-chip,#challengeStats,
#essence-stage > #dual-mode-hud .dual-chip,#essence-stage > #dual-mode-hud #challengeStats{
  background:#0f172a!important;
  border:1px solid color-mix(in srgb,var(--craft-accent) 55%,transparent)!important;
  color:#f8fafc!important;box-shadow:0 4px 14px rgba(0,0,0,.4)!important;
}
#dual-mode-hud #modeLabel{color:var(--craft-accent)!important;font-weight:700!important;}
#dual-mode-hud #timerDisplay{
  font-family:var(--font-mono)!important;
  font-weight:700!important;color:#ffe0c2!important;letter-spacing:.5px;
}
#attemptsDisplay{color:#fda4af!important;font-weight:800!important;}


/* === craft-sidebar-contrast === */
.sub,.hint{color:var(--craft-text)!important;border-left-color:var(--craft-accent)!important;}
#essence-bench .hint,
#essence-bench .hint-msg,
#essence-bench .hint-area,
#essence-bench #hintMessage,
#essence-bench #hintMsg,
#essence-bench #observeText,
#essence-bench #feedbackArea,
#essence-bench .hint-bar,
#essence-bench #hintBar,
#proj-side .hint,
#controls-area .hint-msg,
#bench .hint,
#bench .hint-msg{
  background:rgba(0,0,0,.35)!important;
  border:1px solid color-mix(in srgb,var(--craft-accent) 50%,transparent)!important;
  color:var(--craft-text)!important;
}
#essence-bench .confound-note,
#controls-area .confound-note,
#bench .confound-note{
  background:rgba(0,0,0,.28)!important;
  border:1px solid color-mix(in srgb,var(--craft-accent) 40%,transparent)!important;
  color:var(--craft-text)!important;
}
#essence-bench .hint-msg.win-msg,
#essence-bench .hint.win-msg{
  background:rgba(34,197,94,.22)!important;color:#bbf7d0!important;
  border-color:rgba(34,197,94,.45)!important;
}
#essence-bench .hint-msg.fail-msg,
#essence-bench .hint.fail-msg{
  background:rgba(248,113,113,.22)!important;color:#fecaca!important;
  border-color:rgba(248,113,113,.45)!important;
}
#sideGoal,p#sideGoal,#essence-bench #sideGoal,#proj-side #sideGoal{
  color:var(--craft-text)!important;
}
#essence-bench .footer,
#essence-bench .footer span,
#essence-bench .text-sm,
#essence-bench .observe-unit,
#essence-bench .unit,
#essence-bench .note{
  color:var(--craft-muted)!important;
}


/* === craft-scene-tokens (refraction-snell) === */
:root{
  --craft-accent:#3a9e9a;--craft-bg:#0a1414;--craft-panel:#142422;
  --craft-text:#e4f0ee;--craft-muted:#7a9a96;
  --scene-ink:#0a1414;--scene-mid:#1e3430;--scene-hi:#8ad4c8;
  --scene-glow:#f0d060;--scene-metal:#6a7880;--scene-ok:#6fae8f;
}
#essence-app,#app{background:var(--scene-ink)!important;}
#essence-stage,#stage{
  background:
    radial-gradient(ellipse at 18% 12%,color-mix(in srgb,var(--scene-glow) 18%,transparent),transparent 42%),
    radial-gradient(ellipse at 78% 8%,rgba(255,255,255,.04),transparent 38%),
    linear-gradient(180deg,color-mix(in srgb,var(--scene-mid) 55%,var(--scene-ink)),var(--scene-ink))!important;
}
#essence-bench,.control-panel,#controls-area,#bench{
  background:linear-gradient(180deg,color-mix(in srgb,var(--scene-mid) 85%,#fff),var(--craft-panel) 45%,color-mix(in srgb,var(--scene-ink) 70%,var(--craft-panel)))!important;
  border-left:1px solid color-mix(in srgb,var(--craft-accent) 45%,transparent)!important;
  box-shadow:-8px 0 28px rgba(0,0,0,.35)!important;
  color:var(--craft-text)!important;
}
#essence-bench-hd,.dual-bench-hd,.bench-hd,.ctrl-hd{
  background:rgba(0,0,0,.28)!important;
  border-bottom:1px solid color-mix(in srgb,var(--craft-accent) 35%,transparent)!important;
}
#essence-bench-hd h1,.bench-hd-title,.ctrl-hd,.essence-title{color:var(--scene-hi)!important;}
#essence-hud .essence-title{
  background:rgba(0,0,0,.55)!important;border:1px solid color-mix(in srgb,var(--craft-accent) 40%,transparent)!important;
  color:var(--scene-hi)!important;letter-spacing:2px;
}
#essence-hud .essence-sub{
  background:rgba(0,0,0,.42)!important;border:1px solid color-mix(in srgb,var(--craft-accent) 22%,transparent)!important;
  color:var(--craft-muted)!important;
}
#essence-bench label,.slider-group label,.slabel{color:var(--craft-muted)!important;}
#essence-bench .value-tag,.slider-value,.sval{color:var(--scene-hi)!important;}
#essence-bench input[type=range],.slider-group input[type=range],input[type=range]{
  accent-color:var(--craft-accent);
}
#essence-bench input[type=range]::-webkit-slider-runnable-track,
.slider-group input[type=range]::-webkit-slider-runnable-track{
  height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--scene-ink),var(--scene-mid));
  box-shadow:inset 0 1px 2px rgba(0,0,0,.65);
}
#essence-bench input[type=range]::-webkit-slider-thumb,
.slider-group input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--scene-hi),var(--craft-accent) 55%,color-mix(in srgb,var(--craft-accent) 50%,#000));
  border:1px solid color-mix(in srgb,var(--craft-accent) 40%,#000);
  box-shadow:0 2px 5px rgba(0,0,0,.55);
}
#essence-bench .btn,button.btn,.pixel-btn,#btnLaunch,#btn-test,#btn-fire,#btnFire{
  background:linear-gradient(180deg,var(--scene-hi),var(--craft-accent) 60%,color-mix(in srgb,var(--craft-accent) 70%,#000))!important;
  border:1px solid color-mix(in srgb,var(--craft-accent) 50%,#000)!important;
  color:#1a1208!important;font-weight:700!important;border-radius:6px!important;
  box-shadow:0 3px 10px color-mix(in srgb,var(--craft-accent) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.35)!important;
}
.craft-card{
  background:linear-gradient(170deg,var(--scene-mid),var(--craft-panel))!important;
  border:1px solid color-mix(in srgb,var(--craft-accent) 50%,transparent)!important;
  border-radius:8px!important;
  box-shadow:0 24px 70px rgba(0,0,0,.5),inset 0 1px 0 color-mix(in srgb,var(--scene-hi) 25%,transparent)!important;
}
.craft-card h2{color:var(--scene-hi)!important;letter-spacing:3px;}
.craft-card .formula{border-left-color:var(--craft-accent)!important;}
.craft-card button{
  background:linear-gradient(180deg,var(--scene-hi),var(--craft-accent) 60%,color-mix(in srgb,var(--craft-accent) 70%,#000))!important;
  color:#1a1208!important;border-radius:6px!important;
}
#essence-bench .observe-box,.observe-box{
  background:rgba(0,0,0,.38)!important;
  border:1px solid color-mix(in srgb,var(--craft-accent) 40%,transparent)!important;
  border-left:3px solid var(--craft-accent)!important;
  border-radius:6px!important;
}
#essence-bench .observe-box .val,.observe-box .val{color:var(--scene-hi)!important;}
#dual-mode-hud .dual-chip,#challengeStats{
  background:rgba(0,0,0,.55)!important;
  border:1px solid color-mix(in srgb,var(--craft-accent) 40%,transparent)!important;
  color:var(--craft-text)!important;border-radius:8px!important;
}
#dual-mode-hud #modeLabel{color:var(--scene-hi)!important;}
#modeSelect{
  background:rgba(0,0,0,.45)!important;border:1px solid color-mix(in srgb,var(--craft-accent) 45%,transparent)!important;
  color:var(--scene-hi)!important;border-radius:6px!important;
}
/* === craft-hud-safezone: TL dual / TR essence / playfield y≥120 === */

#stage > #dual-mode-hud,

<script>
(function(){
  function emit(type, payload) {
    try {
      if (window.PlatformTraceAdapter) {
        window.PlatformTraceAdapter.record(type, payload || {});
        return;
      }
    } catch (e) {}
    try {
      if (window.parent && window.parent !== window && window.parent.PlatformTraceAdapter) {
        window.parent.PlatformTraceAdapter.record(type, payload || {});
      }
    } catch (e) {}
  }

  function snapControls() {
    var o = {};
    document.querySelectorAll('input[type="range"], input[type="number"]').forEach(function(el) {
      var id = el.id || el.name; if (id) o[id] = el.value;
    });
    return o;
  }

  document.addEventListener('DOMContentLoaded', function() {
    // puzzle_open
    emit('puzzle_open', {});

    // tuning 绑定 (所有 range)
    document.querySelectorAll('input[type="range"]').forEach(function(el) {
      el.addEventListener('change', function() {
        if (window.__platformTraceControlsBound) return;
        emit('tuning', { control: el.id || 'slider', value: el.value });
      });
    });

    // irrelevant_touch 绑定 I1
    var i1 = document.getElementById('I1');
    if (i1) {
      i1.addEventListener('click', function() {
        emit('irrelevant_touch', { control: 'I1' });
      });
    }
  });
})();
</script>
<script>
(function() {
  const canvas = document.getElementById('refractionCanvas');
  const ctx = canvas.getContext('2d');
  const angleSlider = document.getElementById('s-incident-angle');
  const indexSlider = document.getElementById('s-refractive-index');
  const tempSlider = document.getElementById('s-water-temp');
  const angleValueSpan = document.getElementById('angleValue');
  const indexValueSpan = document.getElementById('indexValue');
  const tempValueSpan = document.getElementById('tempValue');
  const refractionDisplay = document.getElementById('refractionAngleDisplay');
  const feedback = document.getElementById('feedbackMsg');
  const winMessageDiv = document.getElementById('winMessage');
  const fireBtn = document.getElementById('btn-fire');

  const n1 = 1.0;
  const FIXED_LAM_NM = 550; // 固定光束色，不进入折射角计算
  let W = 700, H = 400;
  let layout = { groundY: 240, launchX: 100, launchY: 70, target: { x: 520, y: 310, radius: 18 } };
  let playMode = 'explore';
  let lockedTargetFrac = null; // FixedChallenge：横向比例
  let challengeWon = false;
  /** 竞赛过关：侧栏先更新，等光路 eventAnim settle 后再 emit/ShowWin */
  let pendingChallengeWin = false;
  let challengeWinTimer = null;
  const CHALLENGE_WIN_SETTLE_PAD_MS = 150;
  let measuredTheta2 = null; // 测后门控：发射后才揭示 θ₂
  /** 事件动画 FSM：idle(null) | windup | peak | settle；点击时冻结 drivers */
  let eventAnim = null;

  function clearChallengeWinTimer() {
    if (challengeWinTimer) {
      clearTimeout(challengeWinTimer);
      challengeWinTimer = null;
    }
  }
  function flushChallengeWin() {
    clearChallengeWinTimer();
    pendingChallengeWin = false;
    if (playMode !== 'challenge' || !challengeWon) return;
    try {
      const emitFn = window.__emit || window.emit;
      if (emitFn) emitFn('win', { winOk: true });
    } catch (e) {}
    if (typeof window.__craftShowWin === 'function') {
      window.__craftShowWin('急单靶位本局锁定。折射角由 θ₁ 与 n₂ 决定；水温不改变折射角，本关 n₂ 已给定。');
    }
  }
  function scheduleChallengeWinAfterSettle() {
    clearChallengeWinTimer();
    challengeWinTimer = setTimeout(function() {
      challengeWinTimer = null;
      flushChallengeWin();
    }, CHALLENGE_WIN_SETTLE_PAD_MS);
  }
  let ambientT = 0;
  let lastFrameTs = 0;
  let lastFireHit = null;
  let lastFireMissSide = null;
  let tempTouchedSinceFire = false;
  let lastFireAvKey = null; // θ1|n2 快照，用于「只拧水温」复盘提示
  const MODE_GOALS = {
    explore: {
      hud: '试照：观察折射光随 θ₁、n₂ 变化',
      side: '调入射角与折射率，看折射光怎么拐。'
    },
    challenge: {
      hud: '限次命中本局水下靶（打偏不换靶）',
      side: '限次命中本局水下靶（打偏不换靶）。'
    }
  };
  function refreshRefractGoals() {
    const g = MODE_GOALS[playMode] || MODE_GOALS.explore;
    const mission = document.getElementById('goalMission');
    const side = document.getElementById('sideGoal');
    if (playMode === 'challenge' && lockedTargetFrac != null) {
      if (mission) mission.textContent = '急单靶位已锁定 · 本局固定';
      if (side) side.textContent = '限次命中本局水下靶（打偏不换靶）。';
    } else {
      if (mission) mission.textContent = g.hud;
      if (side) side.textContent = g.side;
    }
  }
  /** FixedChallenge：仅进入竞赛时锁定一次靶位 */
  function lockChallengeTarget() {
    lockedTargetFrac = 0.55 + Math.random() * 0.28; // 0.55–0.83
    clearChallengeWinTimer();
    pendingChallengeWin = false;
    challengeWon = false;
    eventAnim = null;
    angleSlider.value = '45';
    indexSlider.value = '1.3';
    tempTouchedSinceFire = false;
    lastFireAvKey = '45|1.3';
    refreshRefractGoals();
    updateExperiment(false);
    feedback.textContent = '急单已锁定 · 水下靶位本局固定';
    winMessageDiv.innerHTML = '';
  }
  function applyExploreTarget() {
    lockedTargetFrac = null;
    clearChallengeWinTimer();
    pendingChallengeWin = false;
    challengeWon = false;
    eventAnim = null;
    tempTouchedSinceFire = false;
    lastFireAvKey = parseFloat(angleSlider.value).toFixed(0) + '|' + parseFloat(indexSlider.value).toFixed(1);
    refreshRefractGoals();
    updateExperiment(false);
    feedback.textContent = '调入射角与折射率，看光路';
    winMessageDiv.innerHTML = '';
  }
  window.__refractApplyMode = function(mode) {
    playMode = mode === 'challenge' ? 'challenge' : 'explore';
    if (playMode === 'challenge') lockChallengeTarget();
    else applyExploreTarget();
  };
  /** Offline hit probe for challenge target (no attempt consume). */
  window.__refractHitProbe = function(theta1Deg, n2) {
    const L = syncCanvasSize();
    const target = L.target;
    const theta2 = calcRefractionAngle(theta1Deg, n2);
    const valid = !(isNaN(theta2) || theta2 < 0 || theta2 > 89);
    if (!valid) return { hit: false, missSide: null, valid: false, theta2: NaN, target: target, frac: lockedTargetFrac };
    const groundY = L.groundY, launchX = L.launchX, launchY = L.launchY;
    const theta2Rad = theta2 * Math.PI / 180;
    const len = Math.min(H - groundY - 20, W * 0.35);
    const ix = launchX + (groundY - launchY) * Math.tan(theta1Deg * Math.PI / 180);
    const endX = ix + len * Math.sin(theta2Rad);
    const endY = groundY + len * Math.cos(theta2Rad);
    const dx = endX - ix, dy = endY - groundY;
    const l2 = dx * dx + dy * dy;
    let hit = false, missSide = null;
    if (l2 > 0.0001) {
      let t = ((target.x - ix) * dx + (target.y - groundY) * dy) / l2;
      t = Math.max(0, Math.min(1, t));
      const cx = ix + t * dx, cy = groundY + t * dy;
      if ((cx - target.x) * (cx - target.x) + (cy - target.y) * (cy - target.y) <= target.radius * target.radius) hit = true;
      else missSide = cx < target.x ? 'left' : 'right';
    }
    return { hit: hit, missSide: missSide, valid: true, theta2: theta2, target: target, frac: lockedTargetFrac };
  };
  document.addEventListener('dual-mode-change', function(ev) {
    var m = ev && ev.detail && ev.detail.mode;
    if (typeof window.__refractApplyMode === 'function') window.__refractApplyMode(m);
  });
  /* BATCH6-FIXED-20260724 FixedChallenge */

  function syncCanvasSize() {
    var stage = document.getElementById('essence-stage') || canvas.parentElement;
    var cssW = Math.max(2, (stage && stage.clientWidth) || 700);
    var cssH = Math.max(2, (stage && stage.clientHeight) || 400);
    var dpr = Math.min(2.5, window.devicePixelRatio || 1);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    var bw = Math.round(cssW * dpr), bh = Math.round(cssH * dpr);
    if (canvas.width !== bw || canvas.height !== bh) { canvas.width = bw; canvas.height = bh; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = cssW; H = cssH;
    layout.groundY = Math.round(H * 0.52);
    layout.launchX = Math.round(W * 0.16);
    layout.launchY = Math.round(H * 0.18);
    var txFrac = (playMode === 'challenge' && lockedTargetFrac != null) ? lockedTargetFrac : 0.72;
    // 探究靶较大；竞赛靶更小，目视可辨且同参未必两边同命中
    var rFrac = playMode === 'challenge' ? 0.022 : 0.042;
    layout.target = {
      x: Math.round(W * txFrac),
      y: Math.round(H * 0.72),
      radius: Math.max(playMode === 'challenge' ? 10 : 16, Math.round(Math.min(W, H) * rFrac))
    };
    return layout;
  }

  function calcRefractionAngle(theta1Deg, n2) {
    const theta1Rad = theta1Deg * Math.PI / 180;
    const sinTheta2 = (n1 * Math.sin(theta1Rad)) / n2;
    if (sinTheta2 > 1.0) return NaN;
    return Math.asin(sinTheta2) * 180 / Math.PI;
  }

  function wavelengthToRgb(nm) {
    // 固定色相用；λ 不进入折射角计算
    var t = Math.max(0, Math.min(1, (nm - 400) / 300));
    var r = Math.round(255 * Math.min(1, Math.max(0, t < 0.25 ? (0.25 - t) * 4 : t > 0.55 ? (t - 0.55) / 0.45 : 0)));
    var g = Math.round(255 * Math.min(1, Math.max(0, t < 0.5 ? t * 2 : (1 - t) * 2)));
    var b = Math.round(255 * Math.min(1, Math.max(0, t < 0.45 ? 1 : (0.7 - t) / 0.25)));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function readWaterTemp() {
    if (!tempSlider) return 22;
    var v = parseFloat(tempSlider.value);
    return isNaN(v) ? 22 : Math.max(5, Math.min(40, v));
  }

  function mapAngleToDur(theta1) {
    const t = Math.max(10, Math.min(80, theta1 || 30));
    return 0.4 + ((t - 10) / 70) * 1.1;
  }

  function getEventPhaseDurs() {
    if (!eventAnim) return { windupDur: 0.2, peakDur: 0.12, settleDur: 0.3 };
    const d = eventAnim.drivers;
    const windupDur = Math.max(0.12, d.totalDur * 0.28);
    const peakDur = Math.max(0.1, Math.min(0.18, d.totalDur * 0.15));
    const settleDur = Math.max(0.15, d.totalDur - windupDur - peakDur);
    return { windupDur: windupDur, peakDur: peakDur, settleDur: settleDur };
  }

  function stepEventAnim(dt) {
    if (!eventAnim) return;
    eventAnim.t += dt;
    const ph = getEventPhaseDurs();
    if (eventAnim.phase === 'windup') {
      if (eventAnim.t >= ph.windupDur) { eventAnim.phase = 'peak'; eventAnim.t = 0; }
    } else if (eventAnim.phase === 'peak') {
      if (eventAnim.t >= ph.peakDur) { eventAnim.phase = 'settle'; eventAnim.t = 0; }
    } else if (eventAnim.phase === 'settle') {
      const p = Math.min(1, eventAnim.t / ph.settleDur);
      if (eventAnim.drivers.hit) eventAnim.flashHit = Math.max(0, 1 - p * 2.5);
      if (eventAnim.t >= ph.settleDur) {
        eventAnim = null;
        if (pendingChallengeWin) scheduleChallengeWinAfterSettle();
      }
    }
  }

  function getBeamSweepT() {
    if (!eventAnim) return 1;
    const ph = getEventPhaseDurs();
    const t = eventAnim.t;
    if (eventAnim.phase === 'windup') return Math.min(1, t / Math.max(0.05, ph.windupDur));
    if (eventAnim.phase === 'peak') return Math.min(1, t / Math.max(0.05, ph.peakDur));
    return Math.min(1, t / Math.max(0.05, ph.settleDur));
  }

  function drawBeamSegment(x1, y1, x2, y2, sweepT, color, width, glow) {
    const ex = x1 + (x2 - x1) * sweepT;
    const ey = y1 + (y2 - y1) * sweepT;
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = glow || 0;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    if (sweepT > 0.02 && sweepT < 1) {
      ctx.beginPath();
      ctx.arc(ex, ey, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    }
    ctx.restore();
  }

  function drawScene(theta1Deg, n2, waterTemp) {
    const drv = eventAnim ? eventAnim.drivers : null;
    if (drv) { theta1Deg = drv.theta1; n2 = drv.n2; waterTemp = drv.waterTemp; }
    var beamColor = wavelengthToRgb(FIXED_LAM_NM);
    const L = syncCanvasSize();
    const groundY = L.groundY, launchX = L.launchX, launchY = L.launchY, target = L.target;
    ctx.clearRect(0, 0, W, H);

    var SC = { accent:'#3a9e9a', bg:'#0a1414', hi:'#8ad4c8', glow:'#f0d060', metal:'#6a7880', mid:'#1e3430' };
    var tankL = 18, tankR = W - 18, tankBot = H - 14, benchTh = 16;
    // 水温只改水色冷暖与雾气/气泡观感；不改 groundY / 发射几何 / 靶位
    var tempVal = waterTemp != null && !isNaN(waterTemp) ? waterTemp : 22;
    var tempT = Math.max(0, Math.min(1, (tempVal - 5) / 35)); // 0=冷青 → 1=暖绿
    var rW = Math.round(36 + tempT * 42);
    var gW = Math.round(148 + tempT * 18);
    var bW = Math.round(162 - tempT * 78);
    var waterAlpha = 0.42 + tempT * 0.18;
    var bubbleN = 4 + Math.round(tempT * 7);
    var fogAlpha = 0.03 + tempT * 0.11;
    var ripMax = 2 + Math.round((0.35 + tempT * 0.65) * 3);

    // 空气层
    const air = ctx.createLinearGradient(0, 0, 0, groundY);
    air.addColorStop(0, SC.bg);
    air.addColorStop(0.55, SC.mid);
    air.addColorStop(1, '#163532');
    ctx.fillStyle = air;
    ctx.fillRect(0, 0, W, groundY);
    ctx.fillStyle = 'rgba(138,212,200,0.04)';
    ctx.fillRect(0, 0, W, Math.round(groundY * 0.45));

    // 对准度（发射后光路距靶心）
    const pathRevealedEarly = measuredTheta2 != null || !!eventAnim;
    let alignQual = 0;
    const theta2Pre = drv ? drv.theta2 : calcRefractionAngle(theta1Deg, n2);
    const validPre = drv ? drv.valid : !(isNaN(theta2Pre) || theta2Pre < 0 || theta2Pre > 89);
    if (pathRevealedEarly && validPre) {
      const theta2RadP = theta2Pre * Math.PI / 180;
      const lenP = Math.min(H - groundY - 20, W * 0.35);
      const ixP = launchX + (groundY - launchY) * Math.tan(theta1Deg * Math.PI / 180);
      const endXP = ixP + lenP * Math.sin(theta2RadP);
      const endYP = groundY + lenP * Math.cos(theta2RadP);
      const dxP = endXP - ixP, dyP = endYP - groundY;
      const l2P = dxP * dxP + dyP * dyP;
      if (l2P > 0.0001) {
        let tP = ((target.x - ixP) * dxP + (target.y - groundY) * dyP) / l2P;
        tP = Math.max(0, Math.min(1, tP));
        const cxP = ixP + tP * dxP, cyP = groundY + tP * dyP;
        const distP = Math.hypot(cxP - target.x, cyP - target.y);
        alignQual = Math.max(0, 1 - distP / (target.radius * 3));
      }
    } else if (!pathRevealedEarly) {
      alignQual = 0.25 + 0.08 * Math.sin(ambientT * 2.2);
    }
    const ambientBoost = eventAnim ? 0 : (0.04 * Math.sin(ambientT * 2.5));
    const beamAlpha = 0.55 + alignQual * 0.45 + ambientBoost;
    const causticAlpha = 0.12 + alignQual * 0.28;

    // 木架剪影（水槽后方，吃上空）
    ctx.fillStyle = 'rgba(60,40,24,0.55)';
    ctx.fillRect(W * 0.72, 110, 28, groundY - 118);
    ctx.fillRect(W * 0.88, 110, 28, groundY - 118);
    ctx.fillRect(W * 0.72, 110, W * 0.18, 14);
    for (var rs = 0; rs < 3; rs++) {
      ctx.fillRect(W * 0.74, 140 + rs * 40, W * 0.14, 6);
    }

    // 光学木台（承托水槽）
    var benchY = groundY - 1;
    const woodG = ctx.createLinearGradient(0, benchY, 0, benchY + benchTh);
    woodG.addColorStop(0, '#6b4a32');
    woodG.addColorStop(0.35, '#8f6238');
    woodG.addColorStop(0.7, '#5c3f28');
    woodG.addColorStop(1, '#4a3220');
    ctx.fillStyle = woodG;
    ctx.fillRect(0, benchY, W, benchTh);
    ctx.strokeStyle = 'rgba(0,0,0,0.18)';
    ctx.lineWidth = 1;
    for (var wg = 0; wg < Math.ceil(W / 28); wg++) {
      var gx = wg * 28 + (wg % 3) * 4;
      ctx.beginPath();
      ctx.moveTo(gx, benchY + 2);
      ctx.bezierCurveTo(gx + 8, benchY + benchTh * 0.4, gx + 18, benchY + benchTh * 0.75, gx + 26, benchY + benchTh - 1);
      ctx.stroke();
    }
    ctx.fillStyle = SC.metal;
    ctx.fillRect(0, benchY + benchTh - 2, W, 2);

    // 界面以下整槽介质区（折射界面固定在 groundY；水温不抬界面、不造第二液面）
    ctx.fillStyle = 'rgba(30,52,48,0.22)';
    ctx.fillRect(tankL, groundY, tankR - tankL, tankBot - groundY);

    // 水体填充：整槽（groundY → 槽底），色相随水温冷暖变化
    const water = ctx.createLinearGradient(0, groundY, 0, tankBot);
    water.addColorStop(0, 'rgba(' + rW + ',' + gW + ',' + bW + ',' + (0.30 + tempT * 0.16).toFixed(2) + ')');
    water.addColorStop(0.45, 'rgba(' + Math.round(rW * 0.55) + ',' + Math.round(gW * 0.42) + ',' + Math.round(bW * 0.48) + ',' + waterAlpha.toFixed(2) + ')');
    water.addColorStop(1, 'rgba(10,20,20,' + Math.min(0.9, 0.68 + tempT * 0.14).toFixed(2) + ')');
    ctx.fillStyle = water;
    ctx.fillRect(tankL, groundY, tankR - tankL, tankBot - groundY);

    // 暖水时界面附近薄雾（观感，不改几何）
    if (fogAlpha > 0.04) {
      const fog = ctx.createLinearGradient(0, groundY, 0, groundY + 36);
      fog.addColorStop(0, 'rgba(220,235,230,' + fogAlpha.toFixed(2) + ')');
      fog.addColorStop(1, 'rgba(220,235,230,0)');
      ctx.fillStyle = fog;
      ctx.fillRect(tankL + 2, groundY, tankR - tankL - 4, 36);
    }

    // 水底焦散 shimmer（整槽介质区内）
    ctx.save();
    ctx.beginPath();
    ctx.rect(tankL + 2, groundY + 2, tankR - tankL - 4, Math.max(4, tankBot - groundY - 6));
    ctx.clip();
    ctx.globalAlpha = causticAlpha * (0.55 + tempT * 0.35);
    ctx.strokeStyle = 'rgba(' + Math.min(220, rW + 80) + ',' + Math.min(230, gW + 60) + ',' + Math.min(220, bW + 40) + ',0.85)';
    ctx.lineWidth = 1.1;
    for (var ci = 0; ci < 10 + Math.round(tempT * 4); ci++) {
      var cx0 = tankL + 12 + (ci * 37) % (tankR - tankL - 24);
      var cy0 = groundY + 10 + (ci * 23) % Math.max(12, tankBot - groundY - 24);
      ctx.beginPath();
      ctx.moveTo(cx0, cy0);
      ctx.bezierCurveTo(cx0 + 14, cy0 - 6, cx0 + 28, cy0 + 10, cx0 + 42, cy0 + 2);
      ctx.stroke();
    }
    ctx.globalAlpha = causticAlpha * 0.55;
    ctx.fillStyle = SC.glow;
    for (var si = 0; si < 6 + Math.round(tempT * 4); si++) {
      var sx = tankL + 20 + (si * 53) % (tankR - tankL - 40);
      var sy = groundY + 16 + (si * 41) % Math.max(10, tankBot - groundY - 40);
      ctx.beginPath();
      ctx.ellipse(sx, sy, 10 + (si % 3) * 4, 5 + (si % 2) * 3, si * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
    // 气泡：数量随水温略增
    ctx.globalAlpha = 0.32 + tempT * 0.28;
    ctx.strokeStyle = 'rgba(200,240,235,0.75)';
    ctx.fillStyle = 'rgba(180,230,220,0.18)';
    ctx.lineWidth = 1;
    for (var bi = 0; bi < bubbleN; bi++) {
      var bx = tankL + 16 + ((bi * 47 + Math.floor(ambientT * 18)) % Math.max(20, tankR - tankL - 32));
      var by = groundY + 12 + ((bi * 31 + Math.floor(ambientT * (10 + tempT * 8))) % Math.max(10, tankBot - groundY - 28));
      var br = 2 + (bi % 4) * 0.7 + tempT * 0.9;
      ctx.beginPath();
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();

    // 加厚玻璃槽壁 + 金属底框
    function drawGlassWall(x, w, inner) {
      var g = ctx.createLinearGradient(x, groundY, inner ? x + w : x - w, groundY);
      g.addColorStop(0, 'rgba(106,120,128,0.82)');
      g.addColorStop(0.35, 'rgba(138,212,200,0.22)');
      g.addColorStop(0.65, 'rgba(58,158,154,0.35)');
      g.addColorStop(1, 'rgba(30,52,48,0.65)');
      ctx.fillStyle = g;
      ctx.fillRect(x, groundY, w, tankBot - groundY);
      ctx.strokeStyle = inner ? 'rgba(138,212,200,0.65)' : 'rgba(106,120,128,0.55)';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(inner ? x + w - 1 : x + 1, groundY);
      ctx.lineTo(inner ? x + w - 1 : x + 1, tankBot);
      ctx.stroke();
    }
    drawGlassWall(0, tankL, true);
    drawGlassWall(tankR, W - tankR, false);
    // 整槽涟漪（界面 groundY 本身不动；疏密随水温微调）
    ctx.strokeStyle = 'rgba(' + Math.min(210, rW + 90) + ',' + Math.min(230, gW + 70) + ',' + Math.min(220, bW + 50) + ',' + (0.18 + tempT * 0.22).toFixed(2) + ')';
    ctx.lineWidth = 1.2;
    for (var rip = 0; rip < ripMax; rip++) {
      var ry = groundY + 8 + rip * 11;
      if (ry >= tankBot - 18) break;
      ctx.beginPath();
      ctx.moveTo(tankL + 8, ry);
      for (var rx = tankL + 8; rx < tankR - 8; rx += 24) {
        ctx.quadraticCurveTo(rx + 12, ry + (rip % 2 ? 3 : -3) * Math.sin(Date.now() * 0.003 + rip), rx + 24, ry);
      }
      ctx.stroke();
    }
    const floorG = ctx.createLinearGradient(0, tankBot - 16, 0, tankBot);
    floorG.addColorStop(0, 'rgba(58,158,154,0.35)');
    floorG.addColorStop(0.5, 'rgba(106,120,128,0.5)');
    floorG.addColorStop(1, '#4a3220');
    ctx.fillStyle = floorG;
    ctx.fillRect(0, tankBot - 16, W, 16);
    ctx.strokeStyle = SC.metal;
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, tankBot - 16.5, W - 1, 15);

    // 水面高光与液面
    ctx.beginPath();
    ctx.moveTo(tankL, groundY);
    ctx.lineTo(tankR, groundY);
    ctx.strokeStyle = SC.hi;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(240,208,96,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(tankL + 4, groundY - 1);
    ctx.lineTo(tankR - 4, groundY - 1);
    ctx.stroke();

    ctx.font = '12px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
    ctx.fillStyle = SC.hi;
    ctx.fillText('空气', 18, groundY - 10);
    ctx.fillStyle = 'rgba(138,212,200,0.85)';
    ctx.fillText('水槽介质 n₂=' + n2.toFixed(1), 18, groundY + 22);
    // 槽壁水温刻度（中性标注，不剧透）
    ctx.fillStyle = 'rgba(200,220,215,0.7)';
    ctx.font = '11px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
    ctx.fillText('水温 ' + tempVal.toFixed(0) + ' °C', tankR - 96, groundY + 38);

    // 探照灯 — 加大灯座 + 黄铜灯室
    ctx.fillStyle = SC.metal;
    ctx.fillRect(launchX - 16, launchY + 14, 32, 10);
    ctx.fillRect(launchX - 6, launchY + 8, 12, 8);
    ctx.save();
    ctx.shadowColor = SC.glow;
    ctx.shadowBlur = 28;
    ctx.beginPath();
    ctx.arc(launchX, launchY, 14, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(240,208,96,0.4)';
    ctx.fill();
    ctx.restore();
    const brass = ctx.createLinearGradient(launchX - 28, launchY - 16, launchX + 16, launchY + 16);
    brass.addColorStop(0, '#8a7344');
    brass.addColorStop(0.45, SC.glow);
    brass.addColorStop(0.75, SC.metal);
    brass.addColorStop(1, '#4a4030');
    ctx.fillStyle = brass;
    ctx.fillRect(launchX - 28, launchY - 14, 44, 28);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(launchX - 28, launchY - 14, 44, 28);
    ctx.fillStyle = '#3a3530';
    ctx.fillRect(launchX - 8, launchY - 20, 16, 8);
    const lensG = ctx.createRadialGradient(launchX - 2, launchY - 1, 1, launchX, launchY, 12);
    lensG.addColorStop(0, '#fff8dc');
    lensG.addColorStop(0.5, SC.glow);
    lensG.addColorStop(1, 'rgba(240,160,40,0.85)');
    ctx.beginPath();
    ctx.arc(launchX, launchY, 11, 0, 2 * Math.PI);
    ctx.fillStyle = lensG;
    ctx.shadowColor = SC.glow;
    ctx.shadowBlur = 18;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = SC.glow;
    ctx.font = '12px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
    ctx.fillText('探照灯', launchX - 20, launchY - 26);

    const theta1Rad = theta1Deg * Math.PI / 180;
    let ix = launchX + (groundY - launchY) * Math.tan(theta1Rad);
    if (ix < 16) ix = 16;
    if (ix > W - 16) ix = W - 16;

    const isTIR = drv ? drv.isTIR : !validPre;
    const animActive = !!eventAnim;
    const windupT = animActive && eventAnim.phase === 'windup' ? getBeamSweepT() : (animActive ? 1 : 0);
    const peakT = animActive && eventAnim.phase === 'peak' ? getBeamSweepT() : (animActive && eventAnim.phase === 'settle' ? 1 : 0);
    const settleT = animActive && eventAnim.phase === 'settle' ? getBeamSweepT() : (animActive ? 0 : 1);

    // 入射光：空闲虚线预览 / 事件实线扫入 / 测后实线
    if (animActive) {
      drawBeamSegment(launchX, launchY, ix, groundY, windupT, beamColor, 2.5 + alignQual * 1.5, 8 + alignQual * 12);
    } else if (pathRevealedEarly) {
      ctx.save();
      ctx.shadowColor = beamColor;
      ctx.shadowBlur = 6 + alignQual * 16;
      ctx.globalAlpha = beamAlpha;
      ctx.beginPath();
      ctx.moveTo(launchX, launchY);
      ctx.lineTo(ix, groundY);
      ctx.strokeStyle = beamColor;
      ctx.lineWidth = 2 + alignQual * 1.5;
      ctx.stroke();
      ctx.restore();
    } else {
      ctx.save();
      ctx.setLineDash([6, 5]);
      ctx.globalAlpha = 0.38 + ambientBoost;
      ctx.beginPath();
      ctx.moveTo(launchX, launchY);
      ctx.lineTo(ix, groundY);
      ctx.strokeStyle = beamColor;
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.restore();
    }

    ctx.beginPath();
    ctx.setLineDash([6, 6]);
    ctx.moveTo(ix, groundY - 56);
    ctx.lineTo(ix, groundY + 56);
    ctx.strokeStyle = 'rgba(148,163,184,0.7)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.beginPath();
    ctx.arc(ix, groundY, 28, -Math.PI/2, -Math.PI/2 + theta1Rad, false);
    ctx.strokeStyle = '#fdba74';
    ctx.stroke();
    ctx.fillStyle = '#fdba74';
    ctx.fillText('θ₁=' + theta1Deg.toFixed(0) + '°', ix + 18, groundY - 26);

    // 测前不预计算/绘制正确 θ₂ 路径（避免剧透）；hit 判定仅在发射后使用
    const theta2Deg = pathRevealedEarly
      ? (drv ? drv.theta2 : calcRefractionAngle(theta1Deg, n2))
      : NaN;
    let valid = pathRevealedEarly
      ? (drv ? drv.valid : !(isNaN(theta2Deg) || theta2Deg < 0 || theta2Deg > 89))
      : false;
    let refrEndX = ix, refrEndY = groundY;
    const pathRevealed = measuredTheta2 != null || animActive;
    if (pathRevealed && valid) {
      const theta2Rad = theta2Deg * Math.PI / 180;
      const len = Math.min(H - groundY - 20, W * 0.35);
      refrEndX = ix + len * Math.sin(theta2Rad);
      refrEndY = groundY + len * Math.cos(theta2Rad);
      if (animActive) {
        const incDone = eventAnim.phase !== 'windup';
        if (incDone) {
          drawBeamSegment(ix, groundY, refrEndX, refrEndY,
            eventAnim.phase === 'peak' ? peakT : (eventAnim.phase === 'settle' ? settleT : 0),
            beamColor, 2.5 + alignQual * 1.5, 6 + alignQual * 14);
        }
      } else {
        ctx.beginPath();
        ctx.moveTo(ix, groundY);
        ctx.lineTo(refrEndX, refrEndY);
        ctx.strokeStyle = beamColor;
        ctx.lineWidth = 2 + alignQual * 1.5;
        ctx.globalAlpha = beamAlpha;
        ctx.shadowColor = beamColor;
        ctx.shadowBlur = 4 + alignQual * 12;
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
      }
      ctx.beginPath();
      ctx.arc(ix, groundY, 26, Math.PI/2, Math.PI/2 + theta2Rad, false);
      ctx.strokeStyle = '#7dd3fc';
      ctx.stroke();
      ctx.fillStyle = '#7dd3fc';
      if (!isNaN(measuredTheta2) && measuredTheta2 != null) {
        ctx.fillText('θ₂=' + measuredTheta2.toFixed(1) + '°', ix + 18, groundY + 44);
      }
    } else if (pathRevealed && !valid) {
      // TIR：沿界面滑动光带
      const slideLen = Math.min(W * 0.22, 120);
      const slideT = animActive
        ? (eventAnim.phase === 'windup' ? 0 : (eventAnim.phase === 'peak' ? peakT : 1))
        : 1;
      const dir = theta1Deg > 45 ? 1 : -1;
      const sx0 = ix - slideLen * 0.5 * dir;
      const sx1 = ix + slideLen * 0.5 * dir;
      const slideX = sx0 + (sx1 - sx0) * slideT;
      ctx.save();
      ctx.strokeStyle = 'rgba(253,164,175,0.85)';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#fda4af';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(sx0, groundY);
      ctx.lineTo(slideX, groundY);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(slideX, groundY, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#fda4af';
      ctx.fill();
      ctx.restore();
      // 反射回空气
      if (animActive && eventAnim.phase === 'settle') {
        const reflLen = Math.min(groundY - launchY - 10, 80);
        const reflX = slideX - reflLen * Math.sin(theta1Rad) * dir;
        const reflY = groundY - reflLen * Math.cos(theta1Rad);
        drawBeamSegment(slideX, groundY, reflX, reflY, settleT, 'rgba(253,164,175,0.7)', 2, 8);
      }
      ctx.fillStyle = '#fda4af';
      ctx.fillText('全反射 / 无效', ix + 16, groundY + 36);
    } else {
      // 发射前：界面下不确定雾扇（不编码正确 θ₂），中性提示
      ctx.save();
      const fogLen = Math.min(H - groundY - 28, 70);
      const fog = ctx.createRadialGradient(ix, groundY, 4, ix, groundY + fogLen * 0.45, fogLen);
      fog.addColorStop(0, 'rgba(148,163,184,0.16)');
      fog.addColorStop(0.55, 'rgba(100,120,130,0.08)');
      fog.addColorStop(1, 'rgba(100,120,130,0)');
      ctx.fillStyle = fog;
      ctx.beginPath();
      ctx.moveTo(ix, groundY);
      ctx.arc(ix, groundY, fogLen, Math.PI * 0.15, Math.PI - Math.PI * 0.15, false);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#94a3b8';
      ctx.fillText('点发射后观察水下光路', ix + 16, groundY + 36);
    }

    // 水下靶 — 信标盘 + 十字准星（竞赛命中/未中视觉区分）
    var tr = target.radius;
    const flashHit = eventAnim ? (eventAnim.flashHit || 0) : 0;
    const frozenHit = drv ? drv.hit : (pathRevealedEarly ? lastFireHit : null);
    ctx.save();
    ctx.beginPath();
    ctx.arc(target.x, target.y, tr + 10, 0, Math.PI * 2);
    var haloG = ctx.createRadialGradient(target.x, target.y, tr * 0.3, target.x, target.y, tr + 10);
    if (playMode === 'challenge' && pathRevealed && frozenHit === true) {
      haloG.addColorStop(0, 'rgba(45,212,191,' + (0.35 + flashHit * 0.45) + ')');
      haloG.addColorStop(0.6, 'rgba(45,212,191,0.15)');
      haloG.addColorStop(1, 'rgba(45,212,191,0)');
    } else if (playMode === 'challenge' && pathRevealed && frozenHit === false) {
      haloG.addColorStop(0, 'rgba(248,113,113,0.22)');
      haloG.addColorStop(0.6, 'rgba(248,113,113,0.08)');
      haloG.addColorStop(1, 'rgba(248,113,113,0)');
    } else {
      haloG.addColorStop(0, 'rgba(240,208,96,0.28)');
      haloG.addColorStop(0.6, 'rgba(240,120,80,0.12)');
      haloG.addColorStop(1, 'rgba(240,80,60,0)');
    }
    ctx.fillStyle = haloG;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(target.x, target.y + tr + 14);
    ctx.lineTo(target.x, tankBot - 4);
    ctx.strokeStyle = 'rgba(106,120,128,0.55)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = SC.metal;
    ctx.fillRect(target.x - 4, tankBot - 6, 8, 6);
    ctx.beginPath();
    ctx.arc(target.x, target.y, tr + 4, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(240,208,96,0.45)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(target.x, target.y, tr, 0, Math.PI * 2);
    var discG = ctx.createRadialGradient(target.x - tr * 0.25, target.y - tr * 0.25, 1, target.x, target.y, tr);
    if (playMode === 'challenge' && pathRevealed && frozenHit === true) {
      discG.addColorStop(0, 'rgba(167,243,208,0.75)');
      discG.addColorStop(0.5, 'rgba(45,212,191,0.55)');
      discG.addColorStop(1, 'rgba(20,120,100,0.5)');
    } else if (playMode === 'challenge' && pathRevealed && frozenHit === false) {
      discG.addColorStop(0, 'rgba(254,202,202,0.45)');
      discG.addColorStop(0.5, 'rgba(180,50,50,0.35)');
      discG.addColorStop(1, 'rgba(100,30,30,0.4)');
    } else {
      discG.addColorStop(0, 'rgba(255,200,180,0.55)');

    }
    ctx.fillStyle = discG;
    ctx.fill();
    ctx.strokeStyle = (playMode === 'challenge' && pathRevealed && frozenHit === true) ? '#2dd4bf' : ((playMode === 'challenge' && pathRevealed && frozenHit === false) ? '#f87171' : '#f87171');
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(target.x, target.y, tr * 0.55, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,220,200,0.7)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(target.x - tr * 0.65, target.y);
    ctx.lineTo(target.x + tr * 0.65, target.y);
    ctx.moveTo(target.x, target.y - tr * 0.65);

    ctx.fillText(playMode==='challenge'?'急单靶':'对照靶', target.x - 22, target.y - tr - 8);

    let hit = drv ? drv.hit : false;
    let missSide = drv ? drv.missSide : null;
    if (!drv && pathRevealed && valid) {
      const dx = refrEndX - ix, dy = refrEndY - groundY;
      const l2 = dx*dx + dy*dy;
      if (l2 > 0.0001) {
        let t = ((target.x - ix)*dx + (target.y - groundY)*dy) / l2;
        t = Math.max(0, Math.min(1, t));
        const cx = ix + t * dx, cy = groundY + t * dy;
        if ((cx - target.x)*(cx - target.x) + (cy - target.y)*(cy - target.y) <= target.radius*target.radius) hit = true;
        else missSide = cx < target.x ? 'left' : 'right';
      }
    }

    const boxW = 210, boxH = 44, boxX = W - boxW - 16, boxY = H - boxH - 72;
    ctx.fillStyle = 'rgba(15,23,42,0.85)';
    ctx.fillRect(boxX, boxY, boxW, boxH);
    ctx.strokeStyle = (pathRevealed && hit) ? 'rgba(45,212,191,0.7)' : 'rgba(148,163,184,0.35)';
    ctx.strokeRect(boxX, boxY, boxW, boxH);

    ctx.font = '12px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';

      ctx.fillText('光路待测 · 点发射后判定', boxX + 10, boxY + 28);
    } else if (!valid) {
      ctx.fillText('全反射 · 未见折射光路', boxX + 10, boxY + 28);
    } else if (playMode === 'challenge') {
      ctx.fillText(hit ? '光线已命中锁定信标' : '光线尚未命中信标', boxX + 10, boxY + 28);
    } else {
      ctx.fillText(hit ? '碰巧扫到参考信标' : '探究观察折射走向', boxX + 10, boxY + 28);
    }

    return { hit, missSide, theta2Deg: valid ? theta2Deg : NaN, valid };
  }

  // ----- 更新UI & 判定 -----
  function updateExperiment(fireAction = false) {
    const theta1 = parseFloat(angleSlider.value);
    const n2 = parseFloat(indexSlider.value);
    const waterTemp = readWaterTemp();
    const avKey = theta1.toFixed(0) + '|' + n2.toFixed(1);
    angleValueSpan.textContent = theta1 + '°';
    indexValueSpan.textContent = n2.toFixed(1);
    if (tempValueSpan) tempValueSpan.textContent = waterTemp.toFixed(0) + ' °C';

    // 发射时先揭示，再绘制，使出射光路与读数同帧出现
    if (fireAction) {
      const t2pre = calcRefractionAngle(theta1, n2);
      const validPre = !(isNaN(t2pre) || t2pre < 0 || t2pre > 89);
      measuredTheta2 = validPre ? t2pre : NaN; // NaN = 已测但无效/全反射
    }

    const result = drawScene(theta1, n2, waterTemp);
    const theta2 = result.theta2Deg;
    const valid = result.valid;

    // 显示折射角（测前待测）
    if (measuredTheta2 != null && !isNaN(measuredTheta2)) {
      refractionDisplay.textContent = measuredTheta2.toFixed(1) + '°';
    } else if (measuredTheta2 != null && isNaN(measuredTheta2)) {
      refractionDisplay.textContent = '无效';
    } else {
      refractionDisplay.textContent = '—';
    }

    // 约束检查 (C1, C2)
    let c1ok = (theta1 >= 0 && theta1 <= 89);
    let c2ok = (n2 >= 1.0 && n2 <= 2.5);
    if (!c1ok) {
      feedback.textContent = '入射角超范围 · 调回 0°–89°';
      winMessageDiv.innerHTML = '';
      return { winOk: false, hintKey: 'C1' };
    }
    if (!c2ok) {
      feedback.textContent = '折射率超范围 · 调回 1.0–2.5';
      winMessageDiv.innerHTML = '';
      return { winOk: false, hintKey: 'C2' };
    }

    // 如果点击发射 或 自动检测 (fireAction)
    if (fireAction) {
      const onlyTempProbe = tempTouchedSinceFire && lastFireAvKey != null && lastFireAvKey === avKey;
      if (!valid || isNaN(theta2)) {
        feedback.textContent = onlyTempProbe
          ? '光路仍无效 · 水温不改变折射角；本关 n₂ 已给定'
          : '光路无效 · 可能全反射';
        winMessageDiv.innerHTML = '';
        tempTouchedSinceFire = false;
        lastFireAvKey = avKey;
        return { winOk: false, hintKey: 'C3', hit: false, missSide: null, valid: false, theta2: NaN };
      }
      const hit = result.hit;
      const missSide = result.missSide;
      if (playMode === 'explore') {
        if (onlyTempProbe && !hit) {
          feedback.textContent = '水温不改变折射角 · 本关 n₂ 已给定，请调 θ₁ 或 n₂';
        } else {
          feedback.textContent = hit
            ? '光路已出 · 对照入射角与折射率再瞄'
            : (missSide === 'left' ? '光路偏左未中靶 · 继续对比' : (missSide === 'right' ? '光路偏右未中靶 · 继续对比' : '未命中对照靶 · 继续对比光路'));
        }
        winMessageDiv.innerHTML = '';
        tempTouchedSinceFire = false;
        lastFireAvKey = avKey;
        return { winOk: false, hintKey: 'explore_observe', hit: hit, missSide: missSide, valid: valid, theta2: theta2 };
            try { if (window.__noteExploreSuccess) window.__noteExploreSuccess(typeof emit === 'function' ? emit : (window.__emit || null), (typeof controlsSnapshot !== 'undefined' ? controlsSnapshot : (typeof controls !== 'undefined' ? controls : {}))); } catch (_es) {}
      }
      if (hit) {
        feedback.textContent = '急单完成 · 命中锁定水下靶';
        // 徽章文案避免匹配 legacy「过关！」扫描，以免抢在光路动画前弹总结
        winMessageDiv.innerHTML = '<span class="pass-badge">命中锁定靶</span>';
        if (!challengeWon) {
          challengeWon = true;
          pendingChallengeWin = true;
          try { window.__legacyWinEmitted = true; } catch (e0) {}
        }
        tempTouchedSinceFire = false;
        lastFireAvKey = avKey;
        return { winOk: true, hintKey: null, hit: hit, missSide: missSide, valid: valid, theta2: theta2 };
      } else {
        // FixedChallenge：失败不换靶
        const sideTxt = missSide === 'left' ? '光路偏左' : (missSide === 'right' ? '光路偏右' : '未命中');
        feedback.textContent = onlyTempProbe
          ? '水温不改变折射角 · 本关 n₂ 已给定，请改 θ₁ 或 n₂ 后发射'
          : (sideTxt + ' · 靶位仍锁定，对照光路再调参后发射');
        winMessageDiv.innerHTML = '';
        tempTouchedSinceFire = false;
        lastFireAvKey = avKey;
        return { winOk: false, hintKey: missSide === 'left' ? 'miss_left' : (missSide === 'right' ? 'miss_right' : 'C3'), hit: hit, missSide: missSide, valid: valid, theta2: theta2 };
      }
    } else {
      // 非发射：不剧透全反射/命中结论
      feedback.textContent = '调节参数，点击「发射光线」测试光路';
      winMessageDiv.innerHTML = '';
      return { winOk: false, hintKey: null };
    }
  }

  // ----- 发射/测试 事件 (含埋点 snapshot & win) -----
  function fireAndEmit() {
    if (eventAnim) return;
    const status = updateExperiment(true);
    const winOk = status.winOk;
    const hintKey = status.hintKey;

    // 启动事件动画（冻结 drivers；约束未通过时不启动）
    if (measuredTheta2 != null) {
      lastFireHit = !!status.hit;
      lastFireMissSide = status.missSide || null;
      const theta1 = parseFloat(angleSlider.value);
      const n2 = parseFloat(indexSlider.value);
      const waterTemp = readWaterTemp();
      const valid = status.valid != null ? status.valid : !isNaN(measuredTheta2);
      const totalDur = Math.max(0.4, Math.min(1.5, mapAngleToDur(theta1)));
      eventAnim = {
        phase: 'windup', t: 0, flashHit: 0,
        drivers: {
          theta1: theta1, n1: n1, n2: n2, theta2: measuredTheta2,
          isTIR: !valid, valid: valid, hit: !!status.hit, missSide: status.missSide || null,
          waterTemp: waterTemp, lam: FIXED_LAM_NM, totalDur: totalDur
        }
      };
    }

    // 构造 controls 快照
    const controls = {
      's-incident-angle': angleSlider.value,
      's-refractive-index': indexSlider.value,
      's-water-temp': tempSlider ? tempSlider.value : String(readWaterTemp())
    };

    // snapshot 事件
    try {
      const snapPayload = { controls: controls, winOk: winOk, hintKey: hintKey };
      if (window.PlatformTraceAdapter) {
        window.PlatformTraceAdapter.record('snapshot', snapPayload);
      } else if (window.parent && window.parent.PlatformTraceAdapter) {
        window.parent.PlatformTraceAdapter.record('snapshot', snapPayload);
      }
    } catch (e) {}

    // 竞赛过关：不在此处立刻 emit/ShowWin；等 eventAnim settle（见 stepEventAnim）
    // 若未启动动画则短延后补发，保证光路至少可见约 0.7s
    if (winOk && pendingChallengeWin && !eventAnim) {
      clearChallengeWinTimer();
      challengeWinTimer = setTimeout(function() {
        challengeWinTimer = null;
        flushChallengeWin();
      }, 700);
    }
  }

  // ----- 绑定事件（事件动画期间忽略滑条，避免劫持冻结 drivers）-----
  angleSlider.addEventListener('input', function() {
    if (eventAnim) return;
    measuredTheta2 = null;
    lastFireHit = null;
    lastFireMissSide = null;
    updateExperiment(false);
  });
  indexSlider.addEventListener('input', function() {
    if (eventAnim) return;
    measuredTheta2 = null;
    lastFireHit = null;
    lastFireMissSide = null;
    updateExperiment(false);
  });
  if (tempSlider) tempSlider.addEventListener('input', function() {
    if (eventAnim) return;
    tempTouchedSinceFire = true;
    updateExperiment(false);
  });
  fireBtn.addEventListener('click', function() {
    fireAndEmit();
  });

  // 初始化 UI 读数（canvas 由 loop 驱动）
  lastFireAvKey = parseFloat(angleSlider.value).toFixed(0) + '|' + parseFloat(indexSlider.value).toFixed(1);
  updateExperiment(false);

  // 连续渲染：空闲环境光 + 事件 FSM
  (function loop(ts) {
    const dt = lastFrameTs ? Math.min(0.05, (ts - lastFrameTs) / 1000) : 0.016;
    lastFrameTs = ts;
    ambientT += dt;
    stepEventAnim(dt);
    const theta1 = eventAnim ? eventAnim.drivers.theta1 : parseFloat(angleSlider.value);
    const n2 = eventAnim ? eventAnim.drivers.n2 : parseFloat(indexSlider.value);
    const waterTemp = eventAnim ? eventAnim.drivers.waterTemp : readWaterTemp();
    drawScene(theta1, n2, waterTemp);
    requestAnimationFrame(loop);
  })(performance.now());
})();
</script>
<script>
(function(){
  function emit(type, payload) {
    try {
      if (window.PlatformTraceAdapter) {
        window.PlatformTraceAdapter.record(type, payload || {});
        return;
      }
    } catch (e) {}
    try {
      if (window.parent && window.parent !== window && window.parent.PlatformTraceAdapter) {
        window.parent.PlatformTraceAdapter.record(type, payload || {});
      }
    } catch (e) {}
  }
  function snapControls() {
    var o = {};
    document.querySelectorAll('input[type="range"], input[type="number"], select').forEach(function(el) {
      var id = el.id || el.name;
      if (id) o[id] = el.value;
    });
    return o;
  }
  document.addEventListener('DOMContentLoaded', function() {
    emit('puzzle_open', {});
    document.querySelectorAll('input[type="range"], input[type="number"]').forEach(function(el) {
      el.addEventListener('change', function() {
        if (window.__platformTraceControlsBound) return;
        emit('tuning', { control: el.id || el.name || 'slider', value: el.value });
      });
    });
    document.querySelectorAll('button, [role="button"]').forEach(function(el) {
      el.addEventListener('click', function() {
        emit('action', { control: el.id || (el.textContent || '').trim().slice(0, 24) || 'button' });
      });
    });
    window.__emit = emit;
    window.__snapControls = snapControls;
  });
})();
</script>
<script>
(function(){
  function emitWin(hintKey) {
    if (window.__legacyWinEmitted) return;
    window.__legacyWinEmitted = true;
    var emit = window.__emit;
    if (!emit) return;
    var controls = window.__snapControls ? window.__snapControls() : {};
    emit('snapshot', { controls: controls, winOk: true, hintKey: hintKey || 'legacy_win' });
    emit('win', { winOk: true });
  }
  var WIN_TEXT = [/完美命中/, /游戏胜利/, /过关！/, /命中目标！/, /🎯\s*命中目标/, /🏆\s*过关/];
  var __legacyWinScanTimer = null;
  function scanWinText() {
    if (window.__legacyWinEmitted || window.__craftWinOpen || window.__craftWinDismissed) return false;
    var nodes = document.querySelectorAll(
      '.win-banner,#winBanner,[data-win="1"],.pass-badge,#winIndicator,.toast,.banner,.observe-item,[class*="win"]'
    );
    var text = '';
    for (var n = 0; n < nodes.length; n++) {
      text += (nodes[n].innerText || nodes[n].textContent || '') + '\n';
      if (text.length > 8000) break;
    }
    if (!text) return false;
    for (var i = 0; i < WIN_TEXT.length; i++) {
      if (WIN_TEXT[i].test(text)) {
        emitWin('text_' + i);
        return true;
      }
    }
    return false;
  }
  function scheduleScanWinText(muts) {
    if (window.__legacyWinEmitted || window.__craftWinOpen || window.__craftWinDismissed) return;
    if (__legacyWinScanTimer) return;
    __legacyWinScanTimer = setTimeout(function() {
      __legacyWinScanTimer = null;
      var suspect = !muts || !muts.length;
      if (!suspect) {
        for (var i = 0; i < muts.length && !suspect; i++) {
          var m = muts[i];
          if (m.type === 'characterData') {
            var pt = m.target && m.target.parentElement;
            var t = ((pt && (pt.innerText || pt.textContent)) || (m.target && m.target.data) || '').slice(0, 240);
            if (/过关|命中|胜利|🏆|🎯/.test(t)) suspect = true;
          } else if (m.addedNodes && m.addedNodes.length) {
            for (var j = 0; j < m.addedNodes.length; j++) {
              var node = m.addedNodes[j];
              if (!node || (node.nodeType !== 1 && node.nodeType !== 3)) continue;
              var tx = node.nodeType === 3
                ? (node.data || '')
                : ((node.innerText || node.textContent || '') + ' ' + (node.className || '') + ' ' + (node.id || ''));
              if (/过关|命中|胜利|🏆|🎯|win-banner|win-badge|pass-badge|winBanner/.test(tx)) {
                suspect = true;
                break;
              }
            }
          }
        }
      }
      if (suspect) scanWinText();
    }, 200);
  }
  document.addEventListener('DOMContentLoaded', function() {
    var obs = new MutationObserver(function(muts) { scheduleScanWinText(muts); });
    if (document.body) obs.observe(document.body, { subtree: true, childList: true, characterData: true });
    setInterval(function(){
      if (!window.__legacyWinEmitted && !window.__craftWinOpen && !window.__craftWinDismissed) scanWinText();
    }, 2000);
  });
})();
</script>

    // keep design buffer; CSS scales visually

  window.addEventListener('resize', fit);

    var st = document.getElementById('essence-stage');
    if (st) new ResizeObserver(fit).observe(st);
  }
  fit();

(function(){

  var MAX_ATTEMPTS = 5;
  var EXPLORE_SECONDS = 10 * 60;
  var state = {
    mode: 'explore',
    attempts: MAX_ATTEMPTS,
    timeLeft: EXPLORE_SECONDS,
    timerId: null
  };

  function $(id){ return document.getElementById(id); }

  function setPhase(phase){
    try {
      if (typeof window.__platformTraceSetPhase === 'function') {
        window.__platformTraceSetPhase(phase);
      } else if (window.PlatformTraceAdapter && typeof window.PlatformTraceAdapter.setPhase === 'function') {
        window.PlatformTraceAdapter.setPhase(phase);
      }
    } catch (e) { /* offline */ }
  }

  function fmt(sec){
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function renderAttempts(){
    var el = $('attemptsDisplay');

  }

  function primaryButtons(){

      '#essence-bench .essence-ft button, #essence-bench button.btn, #essence-bench button[id^="btn"]'

  }

  function gateActions(){

  function applyMode(mode){

      state.attempts = MAX_ATTEMPTS;

      startExploreTimer();
    }
    setPhase(state.mode);
    gateActions();
    if (typeof window.__snellApplyMode === 'function') {
      try { window.__snellApplyMode(state.mode); } catch (e) {}
    }
    try {
      if (typeof window.__refractApplyMode === 'function') window.__refractApplyMode(state.mode);
    } catch (e) {}
    document.dispatchEvent(new CustomEvent('dual-mode-change', { detail: { mode: state.mode, attempts: state.attempts } }));
  }


  /* === attempts-exhausted-settle === */
  var __exhaustTimer = null;
  var __exhaustBound = false;
  /* === exhausted-mode-reenter-new-round === */
  var __exhaustedNeedsNewRound = false;
  function __isChallengeWonNow(){
    if (window.__craftWinOpen) return true;
    if (window.__challengeWon) return true;

    }

    return false;

    if (__exhaustTimer) { clearTimeout(__exhaustTimer); __exhaustTimer = null; }

  function ensureAttemptsExhaustedUi(){

    wrap.hidden = true;
    wrap.innerHTML =
      '<div class="craft-card" role="dialog" aria-labelledby="attemptsExhaustedTitle">' +
        '<h2 id="attemptsExhaustedTitle">机会用尽</h2>' +
        '<p id="attemptsExhaustedDesc">本局急单未完成。目标仍按本局规则（口位/标定带等）锁定；可返回探究继续调参，或再开一局竞赛。</p>' +
        '<div class="craft-actions">' +
          '<button type="button" id="attemptsExhaustedExplore">返回探究</button>' +
          '<button type="button" id="attemptsExhaustedRetry" class="craft-btn-secondary">再开一局竞赛</button>' +
          '<button type="button" id="attemptsExhaustedList" class="craft-btn-ghost">返回列表</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(wrap);
    var bExplore = $('attemptsExhaustedExplore');
    var bRetry = $('attemptsExhaustedRetry');
    var bList = $('attemptsExhaustedList');
    if (bExplore) bExplore.addEventListener('click', function(){
      hideAttemptsExhausted();
      var sel = $('modeSelect');
      if (sel) {
        sel.value = 'explore';
        sel.dispatchEvent(new Event('change', { bubbles: true }));
      } else {
        applyMode('explore');
      }
    });
    if (bRetry) bRetry.addEventListener('click', function(){
      __exhaustedNeedsNewRound = false;
      try { if (typeof window.__platformTraceRequestNewRound === 'function') window.__platformTraceRequestNewRound('exhausted_retry'); } catch (__nr) {}
      hideAttemptsExhausted();
      state.attempts = MAX_ATTEMPTS;
      renderAttempts();
      gateActions();

      var sel = $('modeSelect');
      if (sel) sel.value = 'challenge';
    });
    if (bList) {
      if (typeof window.__eaNavigateToStudentList !== 'function' && !document.getElementById('craftBackBtn')) {
        bList.hidden = true;
      } else {
        bList.addEventListener('click', function(){
          hideAttemptsExhausted();
          if (typeof window.__eaNavigateToStudentList === 'function') window.__eaNavigateToStudentList();
          else {
            var bb = document.getElementById('craftBackBtn');
            if (bb) bb.click();
          }
        });
      }
    }
  }
  function showAttemptsExhausted(){
    if (state.mode !== 'challenge' || state.attempts > 0) return;
    if (__isChallengeWonNow()) return;
    ensureAttemptsExhaustedUi();
    var el = $('attempts-exhausted');
    if (!el) return;
    var firstShow = !!el.hidden;
    el.hidden = false;
    if (firstShow) __exhaustedNeedsNewRound = true;
    /* === attempts-exhausted-emit === */
    if (firstShow) {
      try {
        var __exPayload = { attempts: 0, mode: 'challenge' };
        var __exSnap = { winOk: false, attemptsExhausted: true, hintKey: 'attempts_exhausted' };
        if (typeof window.__emit === 'function') {
          window.__emit('attempts_exhausted', __exPayload);

        }
        // Always mirror to PlatformTraceAdapter — __emit may be a stub/wrapper
        try {
          if (window.PlatformTraceAdapter && typeof window.PlatformTraceAdapter.record === 'function') {

          } else if (window.parent && window.parent !== window && window.parent.PlatformTraceAdapter && typeof window.parent.PlatformTraceAdapter.record === 'function') {
            window.parent.PlatformTraceAdapter.record('attempts_exhausted', __exPayload);

      } catch (__exErr) {}
    }

  }
  function scheduleAttemptsExhausted(){

    if (__exhaustTimer) clearTimeout(__exhaustTimer);

      __exhaustTimer = null;
      showAttemptsExhausted();
    }, 650);
  }
  function bindExhaustWinGuard(){
    if (__exhaustBound) return;
    __exhaustBound = true;
    var prev = window.__craftShowWin;
    if (typeof prev === 'function') {
      window.__craftShowWin = function(){
        hideAttemptsExhausted();
        return prev.apply(this, arguments);
      };
    }
    try {
      var obs = new MutationObserver(function(){
        if (__isChallengeWonNow()) hideAttemptsExhausted();
      });
