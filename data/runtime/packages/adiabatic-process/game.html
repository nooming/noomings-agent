<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>过程台 · 绝热与等温</title>
<link rel="stylesheet" href="../_shared/craft-tokens.css">
<style>
:root{
  --craft-accent:#0a9bb0;
  --craft-bg:#0c1418;
  --craft-panel:#142028;
  --craft-text:#e6eef2;
  --craft-muted:#8a9aa6;
  --craft-radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--craft-bg);color:var(--craft-text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
#essence-app{display:flex;height:100vh;min-height:480px}
#essence-stage{flex:1;position:relative;min-width:0;background:#071014;overflow:hidden}
#essence-stage canvas{display:block;width:100%;height:100%}
#essence-hud{position:absolute;left:16px;top:14px;z-index:2;pointer-events:none}
.essence-title{font-size:15px;font-weight:700;letter-spacing:.02em;text-shadow:0 2px 12px rgba(0,0,0,.55)}
.essence-sub,#goalMission{display:none!important}
#essence-bench{width:min(340px,38vw);background:var(--craft-panel);border-left:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column}
.essence-scroll{padding:14px 14px 10px;overflow:auto;flex:1}
.side-goal-cap{font-size:11px;color:var(--craft-muted);text-transform:uppercase;letter-spacing:.06em}
#sideGoal{margin:6px 0 12px;font-size:14px;line-height:1.55;color:var(--craft-text)}
.mode-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
#modeSelect{flex:1;min-height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:#0f1a20;color:var(--craft-text);padding:6px 8px}
.slider-group{margin:10px 0}
.slider-group label{display:flex;justify-content:space-between;font-size:12px;color:var(--craft-muted);margin-bottom:4px}
.slider-group input[type=range]{width:100%}
.row-buttons{display:flex;gap:8px;margin:12px 0}
button{cursor:pointer;border:0;border-radius:8px;padding:8px 12px;font-weight:600;background:var(--craft-accent);color:#041016}
button.secondary{background:rgba(255,255,255,.08);color:var(--craft-text)}
.observe-box{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08)}
.observe-box .val{font-size:20px;font-weight:700}
.observe-box.measuring .val{animation:readPulse .35s ease-in-out 2}
@keyframes readPulse{0%,100%{opacity:1}50%{opacity:.5;color:#9fe7f0}}
.observe-box .hint{font-size:12px;color:var(--craft-muted);margin-top:6px;line-height:1.4}
.pass-badge{display:inline-block;margin-top:8px;padding:5px 12px;border-radius:999px;background:#0f9f7a;color:#fff;font-size:12px;font-weight:700}
.attempts{font-size:12px;color:var(--craft-muted);margin-top:8px}
#craft-intro,#craft-win{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(4,10,14,.72);padding:20px}
#craft-intro[hidden],#craft-win[hidden]{display:none!important}
.craft-card{width:min(440px,92vw);background:#14242c;border:1px solid rgba(10,155,176,.35);border-radius:14px;padding:22px 22px 18px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.craft-card h2{margin:0 0 8px;font-size:20px}
.craft-card p{margin:0 0 10px;color:var(--craft-muted);font-size:13px;line-height:1.5}
.craft-card .formula{font-family:ui-monospace,Consolas,monospace;color:#9fe7f0;margin:8px 0 12px}
.craft-actions{display:flex;gap:8px;margin-top:14px}
.craft-btn-secondary{background:rgba(255,255,255,.08);color:var(--craft-text)}
@media (max-width:820px){#essence-app{flex-direction:column}#essence-bench{width:100%;height:46vh}#essence-stage{height:54vh}}
.process-tog{display:flex;gap:6px;margin:8px 0 4px}
.process-tog button{flex:1;font-size:12px;padding:6px}
.process-tog button.active{outline:2px solid var(--craft-accent)}
</style>
</head>
<body>

<div id="craft-intro">
  <div class="craft-card">
    <h2>过程台 · 绝热与等温</h2>
    <p>同一初态，绝热与等温压缩路径不同。拧体积与初温，对照两条曲线，竞赛落到目标态。</p>
    <p style="font-size:12px;color:var(--craft-muted)">探究与竞赛目标不同；竞赛目标本局锁定，未命中只扣次数。</p>
    <button type="button" id="craftIntroBtn">开始探究</button>
  </div>
</div>
<div id="craft-win" hidden>
  <div class="craft-card">
    <h2>过关 · 本局对照</h2>
    <p id="craftEvidenceLine" class="craft-evidence">本局证据将自动填入</p>
    <div class="formula" id="craftWinFormula">绝热 PV^γ=const；等温 PV=const</div>
    <p id="craftWinText">绝热比等温压强升得更快（γ>1）；同一初态，压缩路径不同。</p>
    <div class="craft-actions">
      <button type="button" id="craftWinBtn">再玩一次</button>
      <button type="button" id="craftBackBtn" class="craft-btn-secondary">返回列表</button>
    </div>
  </div>
</div>
<div id="essence-app">
  <div id="essence-stage">
    <canvas id="simCanvas"></canvas>
    <div id="essence-hud">
      <div class="essence-title">绝热过程</div>
      <div class="essence-sub" id="goalMission">探究：绝热 vs 等温对照</div>
    </div>
  </div>
  <aside id="essence-bench">
    <div class="essence-scroll" id="controlsPanel">
      <div class="side-goal-cap">当前目标</div>
      <p id="sideGoal">对照两条路径，读当前态。</p>
      <div class="mode-row">
        <label for="modeSelect" style="font-size:12px;color:var(--craft-muted)">模式</label>
        <select id="modeSelect">
          <option value="explore">探究</option>
          <option value="challenge">竞赛</option>
        </select>
      </div>
      <div class="process-tog">
        <button type="button" id="btn-adi" class="active">沿绝热</button>
        <button type="button" id="btn-iso" class="secondary">看等温对照</button>
      </div>
      <div class="slider-group">
        <label for="s-V">体积 V <span id="vVal">1.00</span></label>
        <input type="range" id="s-V" min="0.4" max="2.2" step="0.02" value="1.2">
      </div>
      <div class="slider-group">
        <label for="s-T0">初温 T₀ <span id="tVal">300 K</span></label>
        <input type="range" id="s-T0" min="200" max="500" step="5" value="300">
      </div>
      <div class="slider-group">
        <label for="s-tag">铭牌质量 <span id="gVal">120 g</span></label>
        <input type="range" id="s-tag" min="50" max="400" step="10" value="120">
      </div>
      <div class="row-buttons">
        <button type="button" id="btn-test">测试 · 读状态</button>
        <button type="button" id="btn-reset" class="secondary">重置</button>
      </div>
      <div class="observe-box" id="observeBox">
        <div><span class="val" id="stateDisplay">—</span></div>
        <div class="hint" id="hintMessage">调参后点测试</div>
        <div id="winIndicator"></div>
      </div>
      <div class="attempts" id="attemptsLine"></div>
    </div>
  </aside>
</div>
<script>
(function(){
  var canvas = document.getElementById('simCanvas');
  var ctx = canvas.getContext('2d');
  var mode = 'explore';
  var attempts = 6;
  var gamma = 1.4;
  var V0 = 1.6, P0 = 1.0;
  var showIso = true;
  var followAdi = true;
  var targetV = 0.8, targetP = 1.6, tolV = 0.08, tolP = 0.12;
  var animTime = 0;
  var pistonSmooth = 1.2;
  var processBlend = 1; // 1=adi visual, 0=iso
  var processTarget = 1;
  var strokeAnim = 0; // compress/expand pulse on test
  var strokeDir = 0;
  var measureT = 0;
  var testing = false;
  var dust = [];
  var pathFlash = 0;

  function stateAt(V, T0) {
    var Pref = P0 * (T0 / 300);
    var Padi = Pref * Math.pow(V0 / V, gamma);
    var Piso = Pref * (V0 / V);
    var Tadi = T0 * Math.pow(V0 / V, gamma - 1);
    var Tiso = T0;
    return { Pref: Pref, Padi: Padi, Piso: Piso, Tadi: Tadi, Tiso: Tiso, V: V };
  }

  function current() {
    var V = +document.getElementById('s-V').value;
    var T0 = +document.getElementById('s-T0').value;
    var st = stateAt(V, T0);
    if (followAdi) return { V: V, P: st.Padi, T: st.Tadi, kind: 'adi', ref: st };
    return { V: V, P: st.Piso, T: st.Tiso, kind: 'iso', ref: st };
  }

  function resize() {
    var r = canvas.parentElement.getBoundingClientRect();
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.max(320, r.width) * dpr;
    canvas.height = Math.max(240, r.height) * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function roundRectPath(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function drawLab(w, h, t) {
    var wall = ctx.createLinearGradient(0, 0, 0, h);
    wall.addColorStop(0, '#1a242c');
    wall.addColorStop(0.5, '#101a20');
    wall.addColorStop(1, '#0a1216');
    ctx.fillStyle = wall;
    ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 1;
    for (var x = 40; x < w; x += 90) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h * 0.7); ctx.stroke();
    }

    // far equipment rack
    ctx.fillStyle = 'rgba(12,20,26,0.8)';
    ctx.fillRect(w * 0.72, h * 0.12, w * 0.22, h * 0.4);
    ctx.strokeStyle = 'rgba(127,212,224,0.1)';
    ctx.strokeRect(w * 0.72 + 3, h * 0.12 + 3, w * 0.22 - 6, h * 0.4 - 6);
    for (var i = 0; i < 4; i++) {
      ctx.fillStyle = 'rgba(50,70,80,0.5)';
      ctx.fillRect(w * 0.75 + (i % 2) * 36, h * 0.18 + Math.floor(i / 2) * 50, 22, 34);
    }

    var floorY = h * 0.72;
    var floor = ctx.createLinearGradient(0, floorY, 0, h);
    floor.addColorStop(0, '#2a343c');
    floor.addColorStop(1, '#12181c');
    ctx.fillStyle = floor;
    ctx.fillRect(0, floorY, w, h - floorY);
    ctx.strokeStyle = 'rgba(10,155,176,0.08)';
    for (var j = 1; j < 6; j++) {
      var fy = floorY + j * j * 2.6;
      ctx.beginPath(); ctx.moveTo(0, fy); ctx.lineTo(w, fy); ctx.stroke();
    }

    // bench
    var by = floorY - 6;
    var bg = ctx.createLinearGradient(0, by - 22, 0, by + 16);
    bg.addColorStop(0, '#3a4850'); bg.addColorStop(1, '#1e282e');
    ctx.fillStyle = bg;
    ctx.fillRect(w * 0.03, by - 16, w * 0.94, 24);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(w * 0.03, by + 8, w * 0.94, 16);
    ctx.strokeStyle = 'rgba(180,220,230,0.18)';
    ctx.beginPath(); ctx.moveTo(w * 0.03, by - 16); ctx.lineTo(w * 0.97, by - 16); ctx.stroke();

    // lamp
    var lx = w * 0.28, ly = 14;
    var flick = 0.94 + 0.06 * Math.sin(t * 1.8);
    var glow = ctx.createRadialGradient(lx, ly + 50, 10, lx, ly + 50, w * 0.45);
    glow.addColorStop(0, 'rgba(140,220,235,' + (0.18 * flick) + ')');
    glow.addColorStop(1, 'rgba(10,155,176,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#243038';
    ctx.beginPath();
    ctx.moveTo(lx - 22, 30); ctx.lineTo(lx + 22, 30); ctx.lineTo(lx + 12, 46); ctx.lineTo(lx - 12, 46);
    ctx.closePath(); ctx.fill();

    if (!dust.length) {
      for (var d = 0; d < 22; d++) dust.push({ x: Math.random() * w, y: Math.random() * h * 0.7, r: 0.5 + Math.random(), a: 0.06 + Math.random() * 0.14, vx: 3 + Math.random() * 8, ph: Math.random() * 6 });
    }
    for (var di = 0; di < dust.length; di++) {
      var p = dust[di];
      p.x += p.vx * 0.016; p.y += Math.sin(t + p.ph) * 0.12;
      if (p.x > w + 6) p.x = -4;
      ctx.globalAlpha = p.a;
      ctx.fillStyle = '#9fe7f0';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    var vig = ctx.createRadialGradient(w * 0.35, h * 0.4, h * 0.15, w * 0.4, h * 0.45, h * 0.9);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.42)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, w, h);
  }

  function drawCylinder(w, h, cur, tag) {
    var floorY = h * 0.72;
    var cylW = Math.min(150, w * 0.22);
    var cylH = Math.min(280, h * 0.48);
    var cx = w * 0.28;
    var baseY = floorY - 28;
    var topY = baseY - cylH;

    // target visual V with stroke animation overshoot
    var Vvis = pistonSmooth;
    if (strokeAnim > 0) {
      Vvis += strokeDir * Math.sin(strokeAnim * Math.PI) * 0.12;
    }
    var Vmin = 0.4, Vmax = 2.2;
    var fillFrac = Math.max(0.18, Math.min(0.88, (Vvis - Vmin) / (Vmax - Vmin)));
    var gasH = cylH * fillFrac;
    var pistonY = baseY - gasH;

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(cx, baseY + 14, cylW * 0.7, 12, 0, 0, Math.PI * 2);
    ctx.fill();

    // stand
    ctx.fillStyle = '#1a242c';
    ctx.fillRect(cx - cylW * 0.55, baseY, cylW * 1.1, 10);
    var stand = ctx.createLinearGradient(cx - 40, 0, cx + 40, 0);
    stand.addColorStop(0, '#2a343c'); stand.addColorStop(0.5, '#4a5860'); stand.addColorStop(1, '#2a343c');
    ctx.fillStyle = stand;
    ctx.fillRect(cx - 36, baseY + 8, 72, 8);

    // cylinder walls (thick metal)
    var wallG = ctx.createLinearGradient(cx - cylW / 2, 0, cx + cylW / 2, 0);
    wallG.addColorStop(0, '#1a2830');
    wallG.addColorStop(0.2, '#4a606c');
    wallG.addColorStop(0.5, '#2a3e48');
    wallG.addColorStop(0.8, '#4a606c');
    wallG.addColorStop(1, '#152028');
    ctx.fillStyle = wallG;
    roundRectPath(ctx, cx - cylW / 2 - 10, topY - 8, cylW + 20, cylH + 24, 10);
    ctx.fill();

    // insulation hatch marks when adiabatic-leaning
    if (processBlend > 0.35) {
      ctx.strokeStyle = 'rgba(240,160,100,' + (0.18 * processBlend) + ')';
      ctx.lineWidth = 1.5;
      for (var hi = 0; hi < 10; hi++) {
        var hy = topY + 10 + hi * (cylH / 10);
        ctx.beginPath();
        ctx.moveTo(cx - cylW / 2 - 8, hy);
        ctx.lineTo(cx - cylW / 2 - 2, hy + 8);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx + cylW / 2 + 2, hy);
        ctx.lineTo(cx + cylW / 2 + 8, hy + 8);
        ctx.stroke();
      }
    }

    // gas color by temperature / process
    var Tnorm = Math.min(1, Math.max(0, (cur.T - 180) / 420));
    var r = Math.round(20 + Tnorm * 160 * (0.4 + 0.6 * processBlend));
    var g = Math.round(50 + (1 - Tnorm) * 40);
    var b = Math.round(70 + (1 - Tnorm) * 80 * (1 - processBlend * 0.5));
    var gasG = ctx.createLinearGradient(cx, pistonY, cx, baseY);
    gasG.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',0.85)');
    gasG.addColorStop(1, 'rgba(' + Math.round(r * 0.4) + ',' + Math.round(g * 0.5) + ',' + Math.round(b * 0.6) + ',0.95)');
    ctx.fillStyle = gasG;
    ctx.fillRect(cx - cylW / 2 + 4, pistonY, cylW - 8, gasH);

    // gas shimmer particles
    ctx.fillStyle = 'rgba(255,230,180,' + (0.15 + Tnorm * 0.25) + ')';
    for (var gi = 0; gi < 12; gi++) {
      var gx = cx - cylW / 2 + 12 + (gi * 37 + animTime * 40) % (cylW - 24);
      var gy = pistonY + 10 + ((gi * 53 + animTime * 30) % Math.max(8, gasH - 16));
      ctx.globalAlpha = 0.25 + 0.35 * Math.sin(animTime * 3 + gi);
      ctx.beginPath(); ctx.arc(gx, gy, 1.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // piston head
    var pistG = ctx.createLinearGradient(cx - cylW / 2, pistonY - 14, cx + cylW / 2, pistonY + 8);
    pistG.addColorStop(0, '#5a6a72');
    pistG.addColorStop(0.45, '#c8d4dc');
    pistG.addColorStop(1, '#3a4850');
    ctx.fillStyle = pistG;
    roundRectPath(ctx, cx - cylW / 2 + 2, pistonY - 14, cylW - 4, 18, 3);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.strokeRect(cx - cylW / 2 + 6, pistonY - 8, cylW - 12, 6);

    // piston rod
    var rodG = ctx.createLinearGradient(cx - 6, 0, cx + 6, 0);
    rodG.addColorStop(0, '#3a4850'); rodG.addColorStop(0.5, '#a8b8c0'); rodG.addColorStop(1, '#3a4850');
    ctx.fillStyle = rodG;
    ctx.fillRect(cx - 5, topY - 40, 10, pistonY - (topY - 40));
    // handle crossbar
    ctx.fillStyle = '#4a5860';
    ctx.fillRect(cx - 28, topY - 48, 56, 10);
    ctx.fillStyle = '#8a9aa6';
    ctx.fillRect(cx - 32, topY - 52, 10, 18);
    ctx.fillRect(cx + 22, topY - 52, 10, 18);

    // glass sheen on cylinder
    var sheen = ctx.createLinearGradient(cx - cylW / 2, 0, cx, 0);
    sheen.addColorStop(0, 'rgba(200,240,255,0.12)');
    sheen.addColorStop(1, 'rgba(200,240,255,0)');
    ctx.fillStyle = sheen;
    ctx.fillRect(cx - cylW / 2 + 4, topY, cylW * 0.28, cylH);

    // nameplate CV
    var px = cx + cylW / 2 + 18, py = baseY - 70;
    var plate = ctx.createLinearGradient(px, py, px + 78, py);
    plate.addColorStop(0, '#2a1e10'); plate.addColorStop(1, '#1a140c');
    ctx.fillStyle = plate;
    roundRectPath(ctx, px, py, 78, 36, 4); ctx.fill();
    ctx.strokeStyle = 'rgba(201,151,63,0.45)';
    roundRectPath(ctx, px + 2, py + 2, 74, 32, 3); ctx.stroke();
    ctx.fillStyle = '#a87826';
    ctx.font = '10px sans-serif';
    ctx.fillText('铭牌', px + 10, py + 14);
    ctx.fillStyle = '#f0cf8a';
    ctx.font = '12px sans-serif';
    ctx.fillText(tag + ' g', px + 10, py + 28);

    // process badge
    ctx.fillStyle = processBlend > 0.5 ? 'rgba(240,140,80,0.85)' : 'rgba(120,180,200,0.85)';
    roundRectPath(ctx, cx - 36, topY - 78, 72, 22, 6); ctx.fill();
    ctx.fillStyle = '#0a1216';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(processBlend > 0.5 ? '绝热' : '等温', cx, topY - 63);
    ctx.textAlign = 'left';

    if (measureT > 0) {
      ctx.strokeStyle = 'rgba(159,231,240,' + (0.4 + 0.4 * Math.sin(animTime * 16)) + ')';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 4]);
      roundRectPath(ctx, cx - cylW / 2 - 16, topY - 56, cylW + 32, cylH + 80, 12);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  function drawPV(w, h, cur, T0) {
    // Larger plate; keep clear of cylinder (~w*0.28) and HUD on narrow widths
    var panelW = Math.min(400, Math.max(260, w * 0.48));
    var panelH = Math.min(360, Math.max(240, h * 0.58));
    if (w < 720) {
      panelW = Math.min(panelW, w * 0.46);
      panelH = Math.min(panelH, h * 0.52);
    }
    var left = w - panelW - 14;
    var top = Math.max(40, Math.min(h - panelH - 16, h * 0.08));
    // Margins: title/legend top, axis labels, bottom readout
    var padL = 40, padR = 16, padT = 36, padB = 36;
    var gw = panelW - padL - padR, gh = panelH - padT - padB;

    // panel plate
    var plate = ctx.createLinearGradient(left, top, left, top + panelH);
    plate.addColorStop(0, 'rgba(18,28,34,0.92)');
    plate.addColorStop(1, 'rgba(10,16,20,0.94)');
    ctx.fillStyle = plate;
    roundRectPath(ctx, left, top, panelW, panelH, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(10,155,176,0.35)';
    ctx.lineWidth = 1.5;
    roundRectPath(ctx, left + 2, top + 2, panelW - 4, panelH - 4, 8); ctx.stroke();

    ctx.fillStyle = '#8a9aa6';
    ctx.font = '11px sans-serif';
    ctx.fillText('p–V 图', left + 12, top + 20);
    ctx.fillStyle = '#0a9bb0';
    ctx.fillText('绝热', left + panelW - 88, top + 20);
    ctx.fillStyle = 'rgba(180,190,200,0.7)';
    ctx.fillText('等温', left + panelW - 48, top + 20);

    var ox = left + padL, oy = top + padT;
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.strokeRect(ox, oy, gw, gh);
    ctx.fillStyle = '#6a7a84';
    ctx.font = '10px sans-serif';
    ctx.fillText('V →', ox + gw - 24, oy + gh + 18);
    ctx.save();
    ctx.translate(left + 14, oy + gh / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('P', 0, 0);
    ctx.restore();

    // Fit P-axis to current T0 curve peak (+headroom) so adi never spills
    var vmin = 0.35, vmax = 2.3, pmin = 0.15;
    var peak = stateAt(0.4, T0).Padi;
    var pmax = Math.max(peak * 1.12, 3.5);

    function map(V, P) {
      var x = ox + ((V - vmin) / (vmax - vmin)) * gw;
      var y = oy + gh - ((P - pmin) / (pmax - pmin)) * gh;
      return {
        x: Math.max(ox, Math.min(ox + gw, x)),
        y: Math.max(oy, Math.min(oy + gh, y))
      };
    }

    function path(kind, color, dash, width) {
      ctx.beginPath();
      for (var i = 0; i <= 60; i++) {
        var V = 0.4 + i / 60 * 1.8;
        var st = stateAt(V, T0);
        var P = kind === 'adi' ? st.Padi : st.Piso;
        var pt = map(V, P);
        if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
      }
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.setLineDash(dash || []);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.save();
    ctx.beginPath();
    ctx.rect(ox, oy, gw, gh);
    ctx.clip();

    var adiW = 2 + processBlend * 1.5;
    var isoW = 1.5 + (1 - processBlend) * 1.5;
    path('adi', 'rgba(10,155,176,' + (0.55 + processBlend * 0.45) + ')', [], adiW);
    if (showIso) path('iso', 'rgba(180,190,200,' + (0.35 + (1 - processBlend) * 0.45) + ')', [5, 4], isoW);

    if (mode === 'challenge') {
      var tg = map(targetV, targetP);
      ctx.strokeStyle = 'rgba(240,198,116,0.95)';
      ctx.lineWidth = 2;
      ctx.strokeRect(tg.x - 10, tg.y - 10, 20, 20);
      ctx.fillStyle = '#f0c674';
      ctx.font = '11px sans-serif';
      ctx.fillText('目标', tg.x + 12, tg.y - 4);
    }

    var pt = map(cur.V, cur.P);
    var ring = 6 + (pathFlash > 0 ? pathFlash * 8 : 0);
    ctx.fillStyle = followAdi ? '#7fd4e0' : '#c8d4dc';
    ctx.beginPath(); ctx.arc(pt.x, pt.y, ring * 0.55, 0, Math.PI * 2); ctx.fill();
    if (pathFlash > 0 || measureT > 0) {
      ctx.strokeStyle = 'rgba(159,231,240,' + Math.max(measureT, pathFlash) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, ring, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();

    ctx.fillStyle = '#e6eef2';
    ctx.font = '11px sans-serif';
    ctx.fillText((followAdi ? '绝热' : '等温') + '  P≈' + cur.P.toFixed(2) + '  T≈' + cur.T.toFixed(0) + 'K', left + 12, top + panelH - 10);
  }

  function draw(dt) {
    var rect = canvas.getBoundingClientRect();
    var w = rect.width, h = rect.height;
    animTime += dt;
    if (measureT > 0) measureT = Math.max(0, measureT - dt);
    if (strokeAnim > 0) strokeAnim = Math.max(0, strokeAnim - dt * 1.8);
    if (pathFlash > 0) pathFlash = Math.max(0, pathFlash - dt * 1.6);
    processBlend += (processTarget - processBlend) * Math.min(1, dt * 5);
    var Vnow = +document.getElementById('s-V').value;
    pistonSmooth += (Vnow - pistonSmooth) * Math.min(1, dt * 6);

    var cur = current();
    var T0 = +document.getElementById('s-T0').value;
    var tag = +document.getElementById('s-tag').value;

    drawLab(w, h, animTime);
    drawCylinder(w, h, cur, tag);
    drawPV(w, h, cur, T0);
  }

  function loop(ts) {
    var dt = loop._last ? Math.min(0.05, (ts - loop._last) / 1000) : 0.016;
    loop._last = ts;
    draw(dt);
    requestAnimationFrame(loop);
  }

  function syncLabels() {
    document.getElementById('vVal').textContent = (+document.getElementById('s-V').value).toFixed(2);
    document.getElementById('tVal').textContent = document.getElementById('s-T0').value + ' K';
    document.getElementById('gVal').textContent = document.getElementById('s-tag').value + ' g';
  }

  function lockTarget() {
    var T0 = 280 + Math.random() * 80;
    document.getElementById('s-T0').value = Math.round(T0 / 5) * 5;
    targetV = 0.55 + Math.random() * 0.55;
    var st = stateAt(targetV, +document.getElementById('s-T0').value);
    targetP = st.Padi;
    tolV = 0.07; tolP = 0.10 + Math.random() * 0.05;
  }

  function refreshGoals() {
    var side = document.getElementById('sideGoal');
    var att = document.getElementById('attemptsLine');
    if (mode === 'explore') {
      side.textContent = '探究：拧 V、T₀，对照绝热与等温路径上的态点。';
      att.textContent = '';
    } else {
      side.textContent = '竞赛：沿绝热落到 V≈' + targetV.toFixed(2) + '  P≈' + targetP.toFixed(2) + '（本局锁定）';
      att.textContent = '剩余机会 ' + attempts;
      followAdi = true; processTarget = 1;
      document.getElementById('btn-adi').classList.add('active');
      document.getElementById('btn-iso').classList.remove('active');
    }
  }

  function onMode() {
    var s = document.getElementById('modeSelect');
    var next = s.value === 'challenge' ? 'challenge' : 'explore';
    if (next !== mode) {
      mode = next;
      try {
        if (window.__craftPhaseEmitted !== mode) {
          window.__craftPhaseEmitted = mode;
          if (window.__emit) window.__emit('phase_change', { phase: mode });
        }
      } catch (e) {}
      document.dispatchEvent(new CustomEvent('dual-mode-change', { detail: { mode: mode } }));
      if (mode === 'challenge') { attempts = 6; lockTarget(); window.__legacyWinEmitted = false; window.__challengeWon = false; }
      refreshGoals(); syncLabels();
    }
  }

  function settleTest() {
    var cur = current();
    document.getElementById('stateDisplay').textContent = 'P ' + cur.P.toFixed(2) + ' · T ' + cur.T.toFixed(0) + 'K';
    var controls = window.__snapControls ? window.__snapControls() : {};
    var hint = document.getElementById('hintMessage');
    var winInd = document.getElementById('winIndicator');
    winInd.innerHTML = '';
    if (mode === 'explore') {
      var ref = cur.ref;
      hint.textContent = '绝热P ' + ref.Padi.toFixed(2) + ' · 等温P ' + ref.Piso.toFixed(2);
      if (window.__emit) {
        window.__emit('snapshot', { controls: controls, winOk: false, hintKey: 'explore_observe' });
        if (window.__noteExploreSuccess) window.__noteExploreSuccess(window.__emit, controls);
      }
      return;
    }
    if (attempts <= 0 || window.__challengeWon) return;
    attempts -= 1; refreshGoals();
    var st = stateAt(cur.V, +document.getElementById('s-T0').value);
    var P = st.Padi;
    var ok = Math.abs(cur.V - targetV) <= tolV && Math.abs(P - targetP) <= tolP;
    if (window.__emit) window.__emit('snapshot', { controls: controls, winOk: ok, hintKey: ok ? 'win' : 'miss' });
    if (ok) {
      hint.textContent = '落到目标邻域';
      window.__challengeWon = true;
      setTimeout(function() {
        if (mode !== 'challenge' || !window.__challengeWon) return;
        try { window.__legacyWinEmitted = true; } catch (e) {}
        if (window.__emit) window.__emit('win', { winOk: true });
        winInd.innerHTML = '<span class="pass-badge">过关 · 沿绝热到达目标态</span>';
        if (typeof window.__craftShowWin === 'function') {
          window.__craftShowWin('本局 (V,P)≈(' + cur.V.toFixed(2) + ',' + P.toFixed(2) + ')，目标 (' + targetV.toFixed(2) + ',' + targetP.toFixed(2) + ')。');
        }
      }, 1100);
    } else {
      hint.innerHTML = '未入邻域<br>当前 V ' + cur.V.toFixed(2) + ' P ' + P.toFixed(2) + ' · 目标 V ' + targetV.toFixed(2) + ' P ' + targetP.toFixed(2);
      if (attempts <= 0 && !window.__challengeWon) {
        try {
          if (window.__emit) {
            window.__emit('attempts_exhausted', { attempts: 0, mode: 'challenge' });
            window.__emit('snapshot', { controls: controls, winOk: false, attemptsExhausted: true, hintKey: 'attempts_exhausted' });
          }
        } catch (eEx) {}
        hint.innerHTML = '<strong>机会用尽</strong><br>可切换探究对照后再开竞赛';
      }
    }
  }

  function doTest() {
    if (testing) return;
    if (mode === 'challenge' && (attempts <= 0 || window.__challengeWon)) return;
    syncLabels();
    testing = true;
    measureT = 0.55;
    strokeAnim = 1;
    strokeDir = (+document.getElementById('s-V').value < pistonSmooth + 0.01) ? -1 : 1;
    // nudge toward compress if near mid
    if (Math.abs(strokeDir) < 0.1) strokeDir = -1;
    pathFlash = 1;
    var box = document.getElementById('observeBox');
    box.classList.add('measuring');
    document.getElementById('hintMessage').textContent = '过程采样…';
    document.getElementById('stateDisplay').textContent = '···';
    setTimeout(function() {
      box.classList.remove('measuring');
      testing = false;
      settleTest();
    }, 520);
  }

  window.__thermoReset = function() {
    document.getElementById('s-V').value = 1.2;
    document.getElementById('s-T0').value = 300;
    document.getElementById('s-tag').value = 120;
    document.getElementById('stateDisplay').textContent = '—';
    document.getElementById('hintMessage').textContent = '调参后点测试';
    document.getElementById('winIndicator').innerHTML = '';
    document.getElementById('observeBox').classList.remove('measuring');
    testing = false; measureT = 0;
    attempts = 6; followAdi = true; showIso = true; processTarget = 1;
    document.getElementById('btn-adi').classList.add('active');
    document.getElementById('btn-iso').classList.remove('active');
    syncLabels(); refreshGoals();
  };

  document.getElementById('btn-adi').addEventListener('click', function(){
    followAdi = true; showIso = true; processTarget = 1; pathFlash = 0.8;
    this.classList.add('active');
    document.getElementById('btn-iso').classList.remove('active');
    window.__exploreAvTouched = window.__exploreAvTouched || Object.create(null);
    window.__exploreAvTouched.path = 1;
  });
  document.getElementById('btn-iso').addEventListener('click', function(){
    followAdi = false; showIso = true; processTarget = 0; pathFlash = 0.8;
    this.classList.add('active');
    document.getElementById('btn-adi').classList.remove('active');
    window.__exploreAvTouched = window.__exploreAvTouched || Object.create(null);
    window.__exploreAvTouched.path = 1;
  });

  window.__exploreAvTouched = window.__exploreAvTouched || Object.create(null);
  ['s-V','s-T0','s-tag'].forEach(function(id){
    document.getElementById(id).addEventListener('input', function(){
      syncLabels();
      if (id === 's-V' || id === 's-T0') window.__exploreAvTouched[id] = 1;
    });
  });
  document.getElementById('modeSelect').addEventListener('change', onMode);
  document.getElementById('btn-test').addEventListener('click', doTest);
  document.getElementById('btn-reset').addEventListener('click', function(){ window.__thermoReset(); });
  window.addEventListener('resize', function(){ resize(); dust = []; });
  resize(); syncLabels(); lockTarget(); refreshGoals();
  pistonSmooth = +document.getElementById('s-V').value;
  requestAnimationFrame(loop);
})();
</script>

<script>
(function(){
  function emit(type, payload) {
    try { if (window.PlatformTraceAdapter) { window.PlatformTraceAdapter.record(type, payload || {}); return; } } catch (e) {}
    try { if (window.parent && window.parent !== window && window.parent.PlatformTraceAdapter) { window.parent.PlatformTraceAdapter.record(type, payload || {}); } } catch (e) {}
  }
  function snapControls() {
    var o = {};
    document.querySelectorAll('input[type="range"],input[type="number"],select').forEach(function(el){
      var id = el.id || el.name; if (id) o[id] = el.value;
    });
    return o;
  }
  window.__emit = emit;
  window.__snapControls = snapControls;
  document.addEventListener('DOMContentLoaded', function(){
    emit('puzzle_open', {});
    document.querySelectorAll('input[type="range"],input[type="number"]').forEach(function(el){
      el.addEventListener('change', function(){
        if (window.__platformTraceControlsBound) return;
        emit('tuning', { control: el.id || 'slider', value: el.value });
      });
    });
    document.querySelectorAll('button,[role="button"]').forEach(function(el){
      el.addEventListener('click', function(){
        emit('action', { control: el.id || (el.textContent||'').trim().slice(0,24) || 'button' });
      });
    });
  });
})();
</script>
<script>/* __dualModeInitPhase */
(function(){
  function sync(){
    var s=document.getElementById('modeSelect'); if(!s) return;
    var p=s.value==='challenge'?'challenge':'explore';
    try{
      if(window.__platformTraceSetPhase){ window.__platformTraceSetPhase(p); window.__craftPhaseEmitted=p; return; }
      if(window.PlatformTraceAdapter&&window.PlatformTraceAdapter.setPhase){ window.PlatformTraceAdapter.setPhase(p); window.__craftPhaseEmitted=p; return; }
    }catch(e){}
    if(window.__craftPhaseEmitted===p) return;
    window.__craftPhaseEmitted=p;
    try{ if(window.__emit) window.__emit('phase_change',{phase:p}); }catch(e2){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(sync,0); });
  else setTimeout(sync,0);
})();
</script>
<script>
(function(){
  if (window.__noteExploreSuccess) return;
  window.__noteExploreSuccess = function(emitFn, controls) {
    try {
      var g = window.__exploreSuccessGate || (window.__exploreSuccessGate = { n: 0, keys: Object.create(null), done: false });
      g.n += 1;
      var c = controls || {};
      Object.keys(c).forEach(function(k){ g.keys[k] = 1; });
      var touched = window.__exploreAvTouched || {};
      var avOk = !!(touched['s-V'] || touched['s-T0'] || touched.path);
      if (g.done || g.n < 3 || !avOk) return;
      g.done = true;
      var emit = emitFn || window.__emit;
      if (typeof emit === 'function') emit('explore_success', { winOk: true, hintKey: 'explore_contrast', controls: c });
    } catch (e) {}
  };
  document.addEventListener('dual-mode-change', function(ev) {
    try {
      if (ev && ev.detail && ev.detail.mode === 'explore') {
        window.__exploreSuccessGate = { n: 0, keys: Object.create(null), done: false };
        window.__exploreAvTouched = Object.create(null);
      }
    } catch (e) {}
  });
})();
</script>
<script>
(function(){
  var intro = document.getElementById('craft-intro');
  var win = document.getElementById('craft-win');
  var btn = document.getElementById('craftIntroBtn');
  var wbtn = document.getElementById('craftWinBtn');
  var back = document.getElementById('craftBackBtn');
  if (btn) btn.addEventListener('click', function(){ if (intro) intro.hidden = true; });
  window.__craftShowWin = function(evidence){
    var line = document.getElementById('craftEvidenceLine');
    if (line) line.textContent = evidence || '本局已命中目标带。';
    if (win) win.hidden = false;
    window.__craftWinOpen = true;
  };
  if (wbtn) wbtn.addEventListener('click', function(){
    if (win) win.hidden = true;
    window.__craftWinOpen = false;
    window.__legacyWinEmitted = false;
    window.__challengeWon = false;
    var ms = document.getElementById('modeSelect');
    if (ms) { ms.value = 'explore'; ms.dispatchEvent(new Event('change')); }
    if (typeof window.__thermoReset === 'function') window.__thermoReset();
  });
  if (back) back.addEventListener('click', function(){
    try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'craft-back' }, '*'); } catch (e) {}
  });
})();
</script>
