<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>气室 · 压强微观模型</title>
<link rel="stylesheet" href="../_shared/craft-tokens.css">
<style>
:root{
  --craft-accent:#0a9bb0;
  --craft-bg:#0c1418;
  --craft-panel:#142028;
  --craft-text:#e6eef2;
  --craft-muted:#8a9aa6;
  --craft-radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--craft-bg);color:var(--craft-text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
#essence-app{display:flex;height:100vh;min-height:480px}
#essence-stage{flex:1;position:relative;min-width:0;background:#071014;overflow:hidden}
#essence-stage canvas{display:block;width:100%;height:100%}
#essence-hud{position:absolute;left:16px;top:14px;z-index:2;pointer-events:none}
.essence-title{font-size:15px;font-weight:700;letter-spacing:.02em;text-shadow:0 2px 12px rgba(0,0,0,.55)}
.essence-sub,#goalMission{display:none!important}
#essence-bench{width:min(340px,38vw);background:var(--craft-panel);border-left:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column}
.essence-scroll{padding:14px 14px 10px;overflow:auto;flex:1}
.side-goal-cap{font-size:11px;color:var(--craft-muted);text-transform:uppercase;letter-spacing:.06em}
#sideGoal{margin:6px 0 12px;font-size:14px;line-height:1.55;color:var(--craft-text)}
.mode-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
#modeSelect{flex:1;min-height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:#0f1a20;color:var(--craft-text);padding:6px 8px}
.slider-group{margin:10px 0}
.slider-group label{display:flex;justify-content:space-between;font-size:12px;color:var(--craft-muted);margin-bottom:4px}
.slider-group input[type=range]{width:100%}
.row-buttons{display:flex;gap:8px;margin:12px 0}
button{cursor:pointer;border:0;border-radius:8px;padding:8px 12px;font-weight:600;background:var(--craft-accent);color:#041016}
button.secondary{background:rgba(255,255,255,.08);color:var(--craft-text)}
.observe-box{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08)}
.observe-box .val{font-size:20px;font-weight:700}
.observe-box.measuring .val{animation:readPulse .35s ease-in-out 2}
@keyframes readPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(1.04);color:#9fe7f0}}
.observe-box .hint{font-size:12px;color:var(--craft-muted);margin-top:6px;line-height:1.4}
.pass-badge{display:inline-block;margin-top:8px;padding:5px 12px;border-radius:999px;background:#0f9f7a;color:#fff;font-size:12px;font-weight:700}
.attempts{font-size:12px;color:var(--craft-muted);margin-top:8px}
#craft-intro,#craft-win{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(4,10,14,.72);padding:20px}
#craft-intro[hidden],#craft-win[hidden]{display:none!important}
.craft-card{width:min(440px,92vw);background:#14242c;border:1px solid rgba(10,155,176,.35);border-radius:14px;padding:22px 22px 18px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.craft-card h2{margin:0 0 8px;font-size:20px}
.craft-card p{margin:0 0 10px;color:var(--craft-muted);font-size:13px;line-height:1.5}
.craft-card .formula{font-family:ui-monospace,Consolas,monospace;color:#9fe7f0;margin:8px 0 12px}
.craft-actions{display:flex;gap:8px;margin-top:14px}
.craft-btn-secondary{background:rgba(255,255,255,.08);color:var(--craft-text)}
@media (max-width:820px){#essence-app{flex-direction:column}#essence-bench{width:100%;height:46vh}#essence-stage{height:54vh}}
</style>
</head>
<body>

<div id="craft-intro">
  <div class="craft-card">
    <h2>气室 · 压强微观模型</h2>
    <p>粒子在气室里乱撞——更多、更热、更挤，压强怎么变？调节侧栏参数，对照压强读数。</p>
    <p style="font-size:12px;color:var(--craft-muted)">探究与竞赛目标不同；竞赛目标本局锁定，未命中只扣次数。</p>
    <button type="button" id="craftIntroBtn">开始探究</button>
  </div>
</div>
<div id="craft-win" hidden>
  <div class="craft-card">
    <h2>过关 · 本局对照</h2>
    <p id="craftEvidenceLine" class="craft-evidence">本局证据将自动填入</p>
    <div class="formula" id="craftWinFormula">P = NkT / V</div>
    <p id="craftWinText">压强由粒子数、温度与体积共同决定（P ∝ N·T / V）。</p>
    <div class="craft-actions">
      <button type="button" id="craftWinBtn">再玩一次</button>
      <button type="button" id="craftBackBtn" class="craft-btn-secondary">返回列表</button>
    </div>
  </div>
</div>
<div id="essence-app">
  <div id="essence-stage">
    <canvas id="simCanvas"></canvas>
    <div id="essence-hud">
      <div class="essence-title">压强微观台</div>
      <div class="essence-sub" id="goalMission">探究：对照侧栏参数与压强读数</div>
    </div>
  </div>
  <aside id="essence-bench">
    <div class="essence-scroll" id="controlsPanel">
      <div class="side-goal-cap">当前目标</div>
      <p id="sideGoal">调参后点测试，看压强读数。</p>
      <div class="mode-row">
        <label for="modeSelect" style="font-size:12px;color:var(--craft-muted)">模式</label>
        <select id="modeSelect">
          <option value="explore">探究</option>
          <option value="challenge">竞赛</option>
        </select>
      </div>
      <div class="slider-group">
        <label for="s-N">粒子数 N <span id="nVal">40</span></label>
        <input type="range" id="s-N" min="10" max="120" step="1" value="40">
      </div>
      <div class="slider-group">
        <label for="s-box-mass">容器质量 <span id="mVal">2.0 kg</span></label>
        <input type="range" id="s-box-mass" min="0.5" max="8" step="0.5" value="2">
      </div>
      <div class="slider-group">
        <label for="s-T">温度 T <span id="tVal">300 K</span></label>
        <input type="range" id="s-T" min="150" max="600" step="5" value="300">
      </div>
      <div class="slider-group">
        <label for="s-V">体积 V <span id="vVal">1.00</span></label>
        <input type="range" id="s-V" min="0.5" max="2.5" step="0.05" value="1.0">
      </div>
      <div class="row-buttons">
        <button type="button" id="btn-test">测试 · 读压强</button>
        <button type="button" id="btn-reset" class="secondary">重置</button>
      </div>
      <div class="observe-box" id="observeBox">
        <div><span class="val" id="pDisplay">—</span> <span style="font-size:12px;color:var(--craft-muted)">arb</span></div>
        <div class="hint" id="hintMessage">调参后点测试</div>
        <div id="winIndicator"></div>
      </div>
      <div class="attempts" id="attemptsLine"></div>
    </div>
  </aside>
</div>
<script>
(function(){
  var canvas = document.getElementById('simCanvas');
  var ctx = canvas.getContext('2d');
  var mode = 'explore';
  var attempts = 6;
  var bandLo = 18, bandHi = 26;
  var particles = [];
  var flashes = [];
  var dust = [];
  var wallPulse = 0;
  var impulseNeedle = 0;
  var impulseTarget = 0;
  var measureT = 0;
  var testing = false;
  var animTime = 0;
  var boxSmooth = 1;
  var k = 0.002;

  function pressure() {
    var N = +document.getElementById('s-N').value;
    var T = +document.getElementById('s-T').value;
    var V = +document.getElementById('s-V').value;
    return (N * k * T) / V;
  }

  function resize() {
    var r = canvas.parentElement.getBoundingClientRect();
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.max(320, r.width) * dpr;
    canvas.height = Math.max(240, r.height) * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function spawnDust(w, h) {
    dust = [];
    for (var i = 0; i < 28; i++) {
      dust.push({
        x: Math.random() * w, y: Math.random() * h * 0.78,
        r: 0.6 + Math.random() * 1.4, a: 0.08 + Math.random() * 0.18,
        vx: 4 + Math.random() * 10, ph: Math.random() * 6.28
      });
    }
  }

  function spawn() {
    var N = +document.getElementById('s-N').value;
    var T = +document.getElementById('s-T').value;
    var V = +document.getElementById('s-V').value;
    var speed = 0.55 + Math.sqrt(T / 300) * 1.85;
    particles = [];
    for (var i = 0; i < N; i++) {
      particles.push({
        x: Math.random(), y: Math.random(),
        vx: (Math.random() * 2 - 1) * speed,
        vy: (Math.random() * 2 - 1) * speed,
        r: 1.8 + Math.random() * 1.4
      });
    }
    window.__boxScale = Math.sqrt(V);
  }

  function roundRectPath(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function drawLab(w, h, t) {
    var wall = ctx.createLinearGradient(0, 0, 0, h);
    wall.addColorStop(0, '#152830');
    wall.addColorStop(0.55, '#0e1a22');
    wall.addColorStop(1, '#0a1218');
    ctx.fillStyle = wall;
    ctx.fillRect(0, 0, w, h);

    // tiled wall seams
    ctx.strokeStyle = 'rgba(0,0,0,0.22)';
    ctx.lineWidth = 1;
    var tile = 72;
    for (var x = 0; x < w; x += tile) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h * 0.68); ctx.stroke();
    }
    for (var y = 40; y < h * 0.68; y += 48) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(10,155,176,0.08)';
    ctx.beginPath(); ctx.moveTo(0, h * 0.68); ctx.lineTo(w, h * 0.68); ctx.stroke();

    // back shelf silhouette
    ctx.fillStyle = 'rgba(8,16,22,0.75)';
    ctx.fillRect(w * 0.06, h * 0.18, w * 0.18, h * 0.28);
    ctx.fillRect(w * 0.76, h * 0.16, w * 0.18, h * 0.32);
    ctx.strokeStyle = 'rgba(127,212,224,0.12)';
    ctx.strokeRect(w * 0.06 + 4, h * 0.18 + 4, w * 0.18 - 8, h * 0.28 - 8);
    ctx.strokeRect(w * 0.76 + 4, h * 0.16 + 4, w * 0.18 - 8, h * 0.32 - 8);
    // bottle silhouettes
    for (var b = 0; b < 3; b++) {
      var bx = w * 0.09 + b * 28;
      ctx.fillStyle = 'rgba(40,80,90,0.45)';
      ctx.fillRect(bx, h * 0.28, 14, 36);
      ctx.beginPath(); ctx.arc(bx + 7, h * 0.28, 7, Math.PI, 0); ctx.fill();
    }

    // floor / bench top
    var floorY = h * 0.68;
    var floor = ctx.createLinearGradient(0, floorY, 0, h);
    floor.addColorStop(0, '#243038');
    floor.addColorStop(0.35, '#1a242c');
    floor.addColorStop(1, '#0d1418');
    ctx.fillStyle = floor;
    ctx.fillRect(0, floorY, w, h - floorY);
    ctx.strokeStyle = 'rgba(10,155,176,0.1)';
    for (var i = 1; i < 7; i++) {
      var fy = floorY + i * i * 2.4;
      ctx.beginPath(); ctx.moveTo(0, fy); ctx.lineTo(w, fy); ctx.stroke();
    }

    // bench slab
    var by = floorY - 8;
    var benchG = ctx.createLinearGradient(0, by - 28, 0, by + 18);
    benchG.addColorStop(0, '#3a4a52');
    benchG.addColorStop(0.45, '#2a363e');
    benchG.addColorStop(1, '#1a2228');
    ctx.fillStyle = benchG;
    ctx.fillRect(w * 0.04, by - 18, w * 0.92, 28);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(w * 0.04, by + 10, w * 0.92, 14);
    // edge highlight
    ctx.strokeStyle = 'rgba(180,220,230,0.22)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(w * 0.04, by - 18); ctx.lineTo(w * 0.96, by - 18); ctx.stroke();

    // overhead lamp
    var lx = w * 0.52, ly = 18;
    var flick = 0.94 + 0.06 * Math.sin(t * 2.1) * Math.sin(t * 1.3 + 1.2);
    var glow = ctx.createRadialGradient(lx, ly + 40, 8, lx, ly + 40, Math.max(220, w * 0.55));
    glow.addColorStop(0, 'rgba(140,220,235,' + (0.22 * flick) + ')');
    glow.addColorStop(0.35, 'rgba(10,155,176,' + (0.08 * flick) + ')');
    glow.addColorStop(1, 'rgba(10,155,176,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#1a2830'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, 34); ctx.stroke();
    ctx.fillStyle = '#243038';
    ctx.beginPath();
    ctx.moveTo(lx - 28, 34); ctx.lineTo(lx + 28, 34); ctx.lineTo(lx + 16, 52); ctx.lineTo(lx - 16, 52);
    ctx.closePath(); ctx.fill();
    var flame = ctx.createRadialGradient(lx, 56, 1, lx, 56, 16);
    flame.addColorStop(0, 'rgba(200,245,255,' + (0.85 * flick) + ')');
    flame.addColorStop(1, 'rgba(10,155,176,0)');
    ctx.fillStyle = flame;
    ctx.beginPath(); ctx.arc(lx, 56, 16, 0, Math.PI * 2); ctx.fill();

    // dust motes
    if (!dust.length) spawnDust(w, h);
    for (var d = 0; d < dust.length; d++) {
      var p = dust[d];
      p.x += p.vx * 0.016;
      p.y += Math.sin(t * 0.9 + p.ph) * 0.15;
      if (p.x > w + 8) { p.x = -8; p.y = Math.random() * h * 0.7; }
      ctx.globalAlpha = p.a * (0.7 + 0.3 * Math.sin(t + p.ph));
      ctx.fillStyle = '#9fe7f0';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // vignette
    var vig = ctx.createRadialGradient(w * 0.5, h * 0.42, h * 0.2, w * 0.5, h * 0.45, h * 0.85);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, w, h);
  }

  function chamberGeom(w, h, scale) {
    var pad = Math.max(36, Math.min(w, h) * 0.08);
    var maxW = Math.min(w - pad * 2, 560);
    var maxH = Math.min(h * 0.52, 340);
    var bw = maxW * (0.62 + 0.38 * scale);
    var bh = maxH * (0.62 + 0.38 * scale);
    var bx = (w - bw) / 2;
    var by = h * 0.68 - 36 - bh;
    return { bx: bx, by: by, bw: bw, bh: bh };
  }

  function drawChamber(g, boxMass, t) {
    var bx = g.bx, by = g.by, bw = g.bw, bh = g.bh;
    var thick = 12 + boxMass * 1.1;

    // cast shadow on bench
    ctx.fillStyle = 'rgba(0,0,0,0.38)';
    ctx.beginPath();
    ctx.ellipse(bx + bw / 2, by + bh + 18, bw * 0.48, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // outer metal frame (bevel) — thicker with container mass (visual only)
    var frame = ctx.createLinearGradient(bx - thick, by, bx + bw + thick, by);
    frame.addColorStop(0, '#1a2a32');
    frame.addColorStop(0.35, '#3a5560');
    frame.addColorStop(0.55, '#2a3e48');
    frame.addColorStop(1, '#152028');
    ctx.fillStyle = frame;
    roundRectPath(ctx, bx - thick, by - thick, bw + thick * 2, bh + thick * 2, 14);
    ctx.fill();

    // bolts
    ctx.fillStyle = '#8a9aa6';
    var bolts = [
      [bx - thick + 10, by - thick + 10],
      [bx + bw + thick - 10, by - thick + 10],
      [bx - thick + 10, by + bh + thick - 10],
      [bx + bw + thick - 10, by + bh + thick - 10]
    ];
    for (var i = 0; i < bolts.length; i++) {
      var bg = ctx.createRadialGradient(bolts[i][0] - 1, bolts[i][1] - 1, 0.5, bolts[i][0], bolts[i][1], 5);
      bg.addColorStop(0, '#d0dde4'); bg.addColorStop(0.6, '#7a8a94'); bg.addColorStop(1, '#3a4850');
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.arc(bolts[i][0], bolts[i][1], 5, 0, Math.PI * 2); ctx.fill();
    }

    // glass cavity with depth
    var gas = ctx.createLinearGradient(bx, by, bx, by + bh);
    var T = +document.getElementById('s-T').value;
    var warm = Math.min(1, Math.max(0, (T - 150) / 450));
    gas.addColorStop(0, 'rgba(' + Math.round(20 + warm * 40) + ',' + Math.round(40 + warm * 10) + ',' + Math.round(48 - warm * 10) + ',0.92)');
    gas.addColorStop(1, 'rgba(6,14,18,0.96)');
    ctx.fillStyle = gas;
    roundRectPath(ctx, bx, by, bw, bh, 8);
    ctx.fill();

    // inner glass rim + pulse
    var pulseA = wallPulse > 0 ? 0.55 + wallPulse * 0.9 : 0.28;
    ctx.strokeStyle = 'rgba(127,212,224,' + pulseA + ')';
    ctx.lineWidth = 2 + wallPulse * 3;
    roundRectPath(ctx, bx, by, bw, bh, 8);
    ctx.stroke();

    // container mass bob + label (CV visual only; not in P)
    var bobR = 6 + boxMass * 1.15;
    var mx = bx + bw + thick + 22;
    var my = by + bh * 0.42;
    ctx.strokeStyle = 'rgba(160,190,200,0.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(bx + bw + thick - 2, my); ctx.lineTo(mx - bobR, my); ctx.stroke();
    var bobG = ctx.createRadialGradient(mx - 2, my - 2, 1, mx, my, bobR + 1);
    bobG.addColorStop(0, '#c8d8e0'); bobG.addColorStop(0.5, '#6a8490'); bobG.addColorStop(1, '#2a3840');
    ctx.fillStyle = bobG;
    ctx.beginPath(); ctx.arc(mx, my, bobR, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#9ab0bc';
    ctx.font = '10px sans-serif';
    ctx.fillText('M ' + boxMass.toFixed(1) + ' kg', mx - 16, my + bobR + 14);

    // glass sheen
    var sheen = ctx.createLinearGradient(bx, by, bx + bw * 0.45, by + bh);
    sheen.addColorStop(0, 'rgba(200,240,250,0.14)');
    sheen.addColorStop(0.35, 'rgba(200,240,250,0.03)');
    sheen.addColorStop(1, 'rgba(200,240,250,0)');
    ctx.fillStyle = sheen;
    roundRectPath(ctx, bx + 4, by + 4, bw * 0.38, bh - 8, 6);
    ctx.fill();

    // measuring sweep
    if (measureT > 0) {
      var sweep = 1 - measureT;
      ctx.strokeStyle = 'rgba(159,231,240,' + (0.35 + 0.4 * Math.sin(sweep * 12)) + ')';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 5]);
      roundRectPath(ctx, bx - 4, by - 4, bw + 8, bh + 8, 10);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(10,155,176,' + (0.06 + 0.08 * Math.sin(animTime * 14)) + ')';
      roundRectPath(ctx, bx, by, bw, bh, 8);
      ctx.fill();
    }
  }

  function drawGauge(w, h, P) {
    var gx = w - 118, gy = 22, gw = 98, gh = 86;
    var plate = ctx.createLinearGradient(gx, gy, gx + gw, gy + gh);
    plate.addColorStop(0, '#1a2830'); plate.addColorStop(1, '#0e181e');
    ctx.fillStyle = plate;
    roundRectPath(ctx, gx, gy, gw, gh, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(10,155,176,0.4)';
    ctx.lineWidth = 1.5;
    roundRectPath(ctx, gx + 2, gy + 2, gw - 4, gh - 4, 6);
    ctx.stroke();
    ctx.fillStyle = '#8a9aa6';
    ctx.font = '10px sans-serif';
    ctx.fillText('压强计', gx + 12, gy + 16);
    var show = measureT > 0 ? (P * (0.85 + 0.3 * Math.sin(animTime * 18))) : P;
    ctx.fillStyle = '#9fe7f0';
    ctx.font = 'bold 16px ui-monospace,Consolas,monospace';
    ctx.fillText('P≈' + show.toFixed(1), gx + 12, gy + 40);

    // impulse micro-needle
    impulseTarget = Math.min(1, P / 60);
    impulseNeedle += (impulseTarget - impulseNeedle) * 0.12;
    impulseNeedle += (Math.random() - 0.5) * 0.02 * (0.3 + wallPulse);
    var nx = gx + 14, ny = gy + 58, nw = gw - 28;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    roundRectPath(ctx, nx, ny, nw, 8, 3); ctx.fill();
    ctx.fillStyle = '#0a9bb0';
    ctx.fillRect(nx, ny, nw * Math.max(0.05, impulseNeedle), 8);
    ctx.fillStyle = '#e6eef2';
    ctx.fillRect(nx + nw * Math.max(0.05, impulseNeedle) - 1.5, ny - 2, 3, 12);
    ctx.fillStyle = '#8a9aa6';
    ctx.font = '9px sans-serif';
    ctx.fillText('冲量示意', gx + 12, gy + 78);
  }

  function addFlash(x, y, side) {
    flashes.push({ x: x, y: y, side: side, life: 0.28 + Math.random() * 0.12 });
  }

  function draw(dt) {
    var rect = canvas.getBoundingClientRect();
    var w = rect.width, h = rect.height;
    animTime += dt;
    if (measureT > 0) measureT = Math.max(0, measureT - dt);
    var targetScale = window.__boxScale || 1;
    boxSmooth += (targetScale - boxSmooth) * Math.min(1, dt * 4);

    drawLab(w, h, animTime);
    var g = chamberGeom(w, h, boxSmooth);
    var boxMass = +document.getElementById('s-box-mass').value;
    drawChamber(g, boxMass, animTime);

    var T = +document.getElementById('s-T').value;
    var spdMul = 0.55 + Math.sqrt(T / 300);
    var bx = g.bx, by = g.by, bw = g.bw, bh = g.bh;
    var hot = Math.min(1, (T - 150) / 450);

    particles.forEach(function(p) {
      p.x += p.vx * dt * 0.35 * spdMul / Math.max(0.5, boxSmooth);
      p.y += p.vy * dt * 0.35 * spdMul / Math.max(0.5, boxSmooth);
      var hit = false, side = 0;
      if (p.x < 0) { p.x = 0; p.vx = Math.abs(p.vx); hit = true; side = 0; }
      if (p.x > 1) { p.x = 1; p.vx = -Math.abs(p.vx); hit = true; side = 1; }
      if (p.y < 0) { p.y = 0; p.vy = Math.abs(p.vy); hit = true; side = 2; }
      if (p.y > 1) { p.y = 1; p.vy = -Math.abs(p.vy); hit = true; side = 3; }
      var px = bx + 10 + p.x * (bw - 20);
      var py = by + 10 + p.y * (bh - 20);
      if (hit) {
        wallPulse = 0.45;
        impulseNeedle = Math.min(1, impulseNeedle + 0.08);
        addFlash(px, py, side);
      }
      var col = 'rgba(' + Math.round(100 + hot * 120) + ',' + Math.round(200 - hot * 40) + ',' + Math.round(220 - hot * 80) + ',0.95)';
      var glow = ctx.createRadialGradient(px - 1, py - 1, 0.2, px, py, p.r * 2.2);
      glow.addColorStop(0, '#e8fbff');
      glow.addColorStop(0.45, col);
      glow.addColorStop(1, 'rgba(10,155,176,0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(px, py, p.r * 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(px, py, p.r, 0, Math.PI * 2); ctx.fill();
    });

    for (var fi = flashes.length - 1; fi >= 0; fi--) {
      var f = flashes[fi];
      f.life -= dt;
      if (f.life <= 0) { flashes.splice(fi, 1); continue; }
      var a = f.life / 0.35;
      ctx.strokeStyle = 'rgba(180,245,255,' + a + ')';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      if (f.side === 0) { ctx.moveTo(bx + 2, f.y - 10); ctx.lineTo(bx + 2, f.y + 10); }
      else if (f.side === 1) { ctx.moveTo(bx + bw - 2, f.y - 10); ctx.lineTo(bx + bw - 2, f.y + 10); }
      else if (f.side === 2) { ctx.moveTo(f.x - 10, by + 2); ctx.lineTo(f.x + 10, by + 2); }
      else { ctx.moveTo(f.x - 10, by + bh - 2); ctx.lineTo(f.x + 10, by + bh - 2); }
      ctx.stroke();
      ctx.fillStyle = 'rgba(159,231,240,' + (a * 0.55) + ')';
      ctx.beginPath(); ctx.arc(f.x, f.y, 6 * a, 0, Math.PI * 2); ctx.fill();
    }
    wallPulse = Math.max(0, wallPulse - dt * 1.1);

    drawGauge(w, h, pressure());
  }

  var last = 0;
  function loop(ts) {
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
    last = ts;
    draw(dt);
    requestAnimationFrame(loop);
  }

  function syncLabels() {
    document.getElementById('nVal').textContent = document.getElementById('s-N').value;
    document.getElementById('tVal').textContent = document.getElementById('s-T').value + ' K';
    document.getElementById('vVal').textContent = (+document.getElementById('s-V').value).toFixed(2);
    document.getElementById('mVal').textContent = (+document.getElementById('s-box-mass').value).toFixed(1) + ' kg';
  }

  function lockBand() {
    var N = 18 + Math.random() * 70;
    var T = 180 + Math.random() * 320;
    var V = 0.65 + Math.random() * 1.5;
    var mid = (N * k * T) / V;
    var half = Math.max(2.2, mid * 0.09);
    bandLo = mid - half; bandHi = mid + half;
  }

  function refreshGoals() {
    var side = document.getElementById('sideGoal');
    var att = document.getElementById('attemptsLine');
    if (mode === 'explore') {
      side.textContent = '探究：每次先改一个量再测试，对照压强读数。';
      att.textContent = '';
    } else {
      side.textContent = '竞赛：把 P 打进 ' + bandLo.toFixed(1) + ' – ' + bandHi.toFixed(1) + '（本局锁定）';
      att.textContent = '剩余机会 ' + attempts;
    }
  }

  function onMode() {
    var s = document.getElementById('modeSelect');
    var next = s.value === 'challenge' ? 'challenge' : 'explore';
    if (next !== mode) {
      mode = next;
      try {
        if (window.__craftPhaseEmitted !== mode) {
          window.__craftPhaseEmitted = mode;
          if (window.__emit) window.__emit('phase_change', { phase: mode });
        }
      } catch (e) {}
      document.dispatchEvent(new CustomEvent('dual-mode-change', { detail: { mode: mode } }));
      if (mode === 'challenge') { attempts = 6; lockBand(); window.__legacyWinEmitted = false; window.__challengeWon = false; }
      refreshGoals();
    }
  }

  function settleTest() {
    var P = pressure();
    document.getElementById('pDisplay').textContent = P.toFixed(2);
    var controls = window.__snapControls ? window.__snapControls() : {};
    var hint = document.getElementById('hintMessage');
    var winInd = document.getElementById('winIndicator');
    winInd.innerHTML = '';
    if (mode === 'explore') {
      hint.textContent = 'P ≈ ' + P.toFixed(2) + ' · 再改一个量对照';
      if (window.__emit) {
        window.__emit('snapshot', { controls: controls, winOk: false, hintKey: 'explore_observe' });
        if (window.__noteExploreSuccess) window.__noteExploreSuccess(window.__emit, controls);
      }
      return;
    }
    if (attempts <= 0 || window.__challengeWon) return;
    attempts -= 1;
    refreshGoals();
    var ok = P >= bandLo && P <= bandHi;
    if (window.__emit) window.__emit('snapshot', { controls: controls, winOk: ok, hintKey: ok ? 'win' : 'miss' });
    if (ok) {
      hint.textContent = '落入标定带';
      window.__challengeWon = true;
      setTimeout(function() {
        if (mode !== 'challenge' || !window.__challengeWon) return;
        try { window.__legacyWinEmitted = true; } catch (e) {}
        if (window.__emit) window.__emit('win', { winOk: true });
        winInd.innerHTML = '<span class="pass-badge">过关 · 压强落入锁定带</span>';
        if (typeof window.__craftShowWin === 'function') {
          window.__craftShowWin('本局 P≈' + P.toFixed(2) + '，带 ' + bandLo.toFixed(1) + '–' + bandHi.toFixed(1) + '。');
        }
      }, 950);
    } else {
      var side = P < bandLo ? '偏低' : '偏高';
      hint.innerHTML = '<strong>' + side + '</strong><br><span style="font-size:0.9em">本次 ' + P.toFixed(2) + ' · 带 ' + bandLo.toFixed(1) + '–' + bandHi.toFixed(1) + '</span>';
      if (attempts <= 0 && !window.__challengeWon) {
        try {
          if (window.__emit) {
            window.__emit('attempts_exhausted', { attempts: 0, mode: 'challenge' });
            window.__emit('snapshot', { controls: controls, winOk: false, attemptsExhausted: true, hintKey: 'attempts_exhausted' });
          }
        } catch (eEx) {}
        hint.innerHTML = '<strong>机会用尽</strong><br><span style="font-size:0.9em">可切换探究对照后再开竞赛</span>';
      }
    }
  }

  function doTest() {
    if (testing) return;
    if (mode === 'challenge' && (attempts <= 0 || window.__challengeWon)) return;
    syncLabels();
    spawn();
    testing = true;
    measureT = 0.55;
    var box = document.getElementById('observeBox');
    box.classList.add('measuring');
    document.getElementById('hintMessage').textContent = '测量中…';
    document.getElementById('pDisplay').textContent = '···';
    setTimeout(function() {
      box.classList.remove('measuring');
      testing = false;
      settleTest();
    }, 520);
  }

  window.__thermoReset = function() {
    document.getElementById('s-N').value = 40;
    document.getElementById('s-T').value = 300;
    document.getElementById('s-V').value = 1;
    document.getElementById('s-box-mass').value = 2;
    document.getElementById('pDisplay').textContent = '—';
    document.getElementById('hintMessage').textContent = '调参后点测试';
    document.getElementById('winIndicator').innerHTML = '';
    document.getElementById('observeBox').classList.remove('measuring');
    testing = false; measureT = 0;
    attempts = 6; syncLabels(); spawn(); refreshGoals();
  };

  window.__exploreAvTouched = window.__exploreAvTouched || Object.create(null);
  ['s-N','s-box-mass','s-T','s-V'].forEach(function(id){
    document.getElementById(id).addEventListener('input', function(){
      syncLabels(); spawn();
      if (id === 's-N' || id === 's-T' || id === 's-V') window.__exploreAvTouched[id] = 1;
    });
  });
  document.getElementById('modeSelect').addEventListener('change', onMode);
  document.getElementById('btn-test').addEventListener('click', doTest);
  document.getElementById('btn-reset').addEventListener('click', function(){ window.__thermoReset(); });
  window.addEventListener('resize', function(){ resize(); dust = []; });
  resize(); syncLabels(); spawn(); lockBand(); refreshGoals();
  requestAnimationFrame(loop);
})();
</script>

<script>
(function(){
  function emit(type, payload) {
    try { if (window.PlatformTraceAdapter) { window.PlatformTraceAdapter.record(type, payload || {}); return; } } catch (e) {}
    try { if (window.parent && window.parent !== window && window.parent.PlatformTraceAdapter) { window.parent.PlatformTraceAdapter.record(type, payload || {}); } } catch (e) {}
  }
  function snapControls() {
    var o = {};
    document.querySelectorAll('input[type="range"],input[type="number"],select').forEach(function(el){
      var id = el.id || el.name; if (id) o[id] = el.value;
    });
    return o;
  }
  window.__emit = emit;
  window.__snapControls = snapControls;
  document.addEventListener('DOMContentLoaded', function(){
    emit('puzzle_open', {});
    document.querySelectorAll('input[type="range"],input[type="number"]').forEach(function(el){
      el.addEventListener('change', function(){
        if (window.__platformTraceControlsBound) return;
        emit('tuning', { control: el.id || 'slider', value: el.value });
      });
    });
    document.querySelectorAll('button,[role="button"]').forEach(function(el){
      el.addEventListener('click', function(){
        emit('action', { control: el.id || (el.textContent||'').trim().slice(0,24) || 'button' });
      });
    });
  });
})();
</script>

(function () {
  if (window.CraftTelemetry) window.CraftTelemetry.initDualModePhase();
})();
</script>
<script>
(function(){
  if (window.__noteExploreSuccess) return;
  window.__noteExploreSuccess = function(emitFn, controls) {
    try {
      var g = window.__exploreSuccessGate || (window.__exploreSuccessGate = { n: 0, keys: Object.create(null), done: false });
      g.n += 1;
      var c = controls || {};
      Object.keys(c).forEach(function(k){ g.keys[k] = 1; });
      var touched = window.__exploreAvTouched || {};
      var avN = ['s-N','s-T','s-V'].filter(function(id){ return !!touched[id]; }).length;
      if (g.done || g.n < 3 || avN < 2) return;
      g.done = true;
      var emit = emitFn || window.__emit;
      if (typeof emit === 'function') emit('explore_success', { winOk: true, hintKey: 'explore_contrast', controls: c });
    } catch (e) {}
  };
  document.addEventListener('dual-mode-change', function(ev) {
    try {
      if (ev && ev.detail && ev.detail.mode === 'explore') {
        window.__exploreSuccessGate = { n: 0, keys: Object.create(null), done: false };
        window.__exploreAvTouched = Object.create(null);
      }
    } catch (e) {}
  });
})();
</script>
<script>
(function(){
  var intro = document.getElementById('craft-intro');
  var win = document.getElementById('craft-win');
  var btn = document.getElementById('craftIntroBtn');
  var wbtn = document.getElementById('craftWinBtn');
  var back = document.getElementById('craftBackBtn');
  if (btn) btn.addEventListener('click', function(){ if (intro) intro.hidden = true; });
  window.__craftShowWin = function(evidence){
    var line = document.getElementById('craftEvidenceLine');
    if (line) line.textContent = evidence || '本局已命中目标带。';
    if (win) win.hidden = false;
    window.__craftWinOpen = true;
  };
  if (wbtn) wbtn.addEventListener('click', function(){
    if (win) win.hidden = true;
    window.__craftWinOpen = false;
    window.__legacyWinEmitted = false;
    window.__challengeWon = false;
    var ms = document.getElementById('modeSelect');
    if (ms) { ms.value = 'explore'; ms.dispatchEvent(new Event('change')); }
    if (typeof window.__thermoReset === 'function') window.__thermoReset();
  });
  if (back) back.addEventListener('click', function(){
    try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'craft-back' }, '*'); } catch (e) {}
  });
})();
</script>
