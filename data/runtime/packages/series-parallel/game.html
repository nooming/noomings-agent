    <style>

/* === essence-sidebar-shell (auto) === */
html, body { width:100%; height:100%; margin:0; padding:0 !important; overflow:hidden; }

}

<script>
(function(){
    function emit(type, payload) {
        try {
            if (window.PlatformTraceAdapter) {
                window.PlatformTraceAdapter.record(type, payload || {});
                return;
            }
        } catch (e) {}
        try {
            if (window.parent && window.parent !== window && window.parent.PlatformTraceAdapter) {
                window.parent.PlatformTraceAdapter.record(type, payload || {});
            }
        } catch (e) {}
    }

    function snapControls() {
        var o = {};
        document.querySelectorAll('input[type="range"], input[type="number"]').forEach(function(el) {
            var id = el.id || el.name; if (id) o[id] = el.value;
        });
        // 额外记录连接状态
        var connectBtn = document.getElementById('btn-connect');
        if (connectBtn) o['btn-connect'] = connectBtn.dataset.mode || 'series';
        return o;
    }

    document.addEventListener('DOMContentLoaded', function() {
        // puzzle_open
        emit('puzzle_open', {});

        // tuning 绑定 (滑条)
        document.querySelectorAll('input[type="range"]').forEach(function(el) {
            el.addEventListener('input', function() {
                emit('tuning', { control: el.id || 'slider', value: el.value });
            });
        });

        // 无关控件 I1
        var i1 = document.getElementById('I1');
        if (i1) {
            i1.addEventListener('click', function() {
                emit('irrelevant_touch', { control: 'I1', value: 'click' });
            });
        }
    });
})();
</script>

            hud: '探究：切换串/并联，对比总电流如何变',
            side: '探究·后台试配：试着弄清串并联如何改变总电流；不必先盯固定目标。'
          },
          challenge: {
            hud: '竞赛：限次把电流对准本局锁定目标（本局固定）',
            side: '竞赛·开演急单：限次把电流对准本局锁定目标；打偏不换目标。'
          }
        };

        function refreshSeriesGoals() {
          const g = MODE_GOALS[playMode] || MODE_GOALS.explore;
          const mission = document.getElementById('goalMission');
          const side = document.getElementById('sideGoal');
          if (playMode === 'challenge' && lockedTargetI != null) {
            if (mission) mission.textContent = '急单目标电流：' + targetCurrent.toFixed(2) + ' A · 本局固定';
            if (side) side.textContent = '竞赛急单：限次把电流调到 ' + targetCurrent.toFixed(2) + ' A（本局固定，打偏不换目标）。';
            obsTarget.textContent = targetCurrent.toFixed(2);
          } else {
            if (mission) mission.textContent = g.hud;
            if (side) side.textContent = g.side;
            obsTarget.textContent = '—';
          }
        }

        /** FixedChallenge：仅进入竞赛时锁定一次目标电流 */
        function lockChallengeTarget() {
          // 可达区间：串联约 0.08–0.30 A（12V / 40–150Ω）
          lockedTargetI = 0.10 + Math.random() * 0.16;
          targetCurrent = Math.round(lockedTargetI * 100) / 100;
          challengeWon = false;
          mode = 'series';
          sR1.value = '80';
          sR2.value = '80';
          btnConnect.textContent = '🔁 切换连接 (串联)';
          refreshSeriesGoals();
          updateAll();
          feedback.className = 'feedback info';
          feedback.textContent = '急单已锁定 · 目标电流 ' + targetCurrent.toFixed(2) + ' A（本局固定）';
        }

        function applyExploreTarget() {
          lockedTargetI = null;
          challengeWon = false;
          targetCurrent = 0.15;
          mode = 'series';
          sR1.value = '50';
          sR2.value = '50';
          btnConnect.textContent = '🔁 切换连接 (串联)';
          refreshSeriesGoals();
          updateAll();
          feedback.className = 'feedback info';
          feedback.textContent = '自由试配：切换串/并联，观察电流变化。';
        }

        window.__seriesApplyMode = function(m) {
          playMode = m === 'challenge' ? 'challenge' : 'explore';
          if (playMode === 'challenge') lockChallengeTarget();
          else applyExploreTarget();
        };

        obsTarget.textContent = '—';

        function computeCircuit(r1, r2, mode) {
            let Rtotal;
            if (mode === 'series') {
                Rtotal = r1 + r2;
            } else {
                if (r1 === 0 || r2 === 0) Rtotal = 0;
                else Rtotal = 1 / ((1 / r1) + (1 / r2));
            }
            const I = (Rtotal > 0) ? (U_SOURCE / Rtotal) : 0;
            return { Rtotal: Rtotal, I: I };
        }

        function resizeCanvas() {
            const rect = wrap.getBoundingClientRect();
            dpr = window.devicePixelRatio || 1;
            W = Math.max(320, rect.width);
            H = Math.max(240, rect.height);
            canvas.width = Math.floor(W * dpr);
            canvas.height = Math.floor(H * dpr);
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            updateAll();
        }

        /** 仅测试后揭示 R总、I */
        let measuredI = null;
        let measuredRtotal = null;

        function updateAll() {
            const r1 = parseFloat(sR1.value) || 1;
            const r2 = parseFloat(sR2.value) || 1;
            const out = computeCircuit(r1, r2, mode);
            r1Val.textContent = r1;
            r2Val.textContent = r2;
            if (meterRVal && sMeterR) meterRVal.textContent = parseFloat(sMeterR.value).toFixed(1);
            if (measuredI != null) {
              obsRtotal.textContent = measuredRtotal.toFixed(2);
              obsCurrent.textContent = measuredI.toFixed(3);
            } else {
              obsRtotal.textContent = '—';
              obsCurrent.textContent = '—';
            }
            connectStatus.textContent = (mode === 'series') ? '串联' : '并联';
            drawWorkbench(r1, r2, mode, out.Rtotal, out.I);
        }

        function drawResistorBody(x, y, w, h, label, ohms) {
            ctx.fillStyle = '#78350f';
            ctx.fillRect(x, y, w, h);
            const bands = ['#ef4444', '#fbbf24', '#22c55e', '#f8fafc'];
            for (let i = 0; i < 4; i++) {
                ctx.fillStyle = bands[i];
                ctx.fillRect(x + 10 + i * (w - 28) / 4, y + 4, 7, h - 8);
            }
            ctx.strokeStyle = '#fde68a';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(x, y, w, h);
            ctx.fillStyle = '#ecfdf5';
            ctx.font = 'bold 12px "Microsoft YaHei",sans-serif';
            ctx.fillText(label + ' ' + ohms + 'Ω', x, y - 8);
        }

        function drawFlowDots(points, speed) {
            if (points.length < 2) return;
            let total = 0;
            const seg = [];
            for (let i = 1; i < points.length; i++) {
                const dx = points[i].x - points[i - 1].x;
                const dy = points[i].y - points[i - 1].y;
                const len = Math.hypot(dx, dy);
                seg.push(len);
                total += len;
            }
            const n = 10;
            for (let k = 0; k < n; k++) {
                let dist = ((flowT * speed + k / n) % 1) * total;
                for (let i = 0; i < seg.length; i++) {
                    if (dist <= seg[i]) {
                        const t = seg[i] ? dist / seg[i] : 0;
                        const x = points[i].x + (points[i + 1].x - points[i].x) * t;
                        const y = points[i].y + (points[i + 1].y - points[i].y) * t;
                        ctx.beginPath();
                        ctx.arc(x, y, 3.2, 0, Math.PI * 2);
                        ctx.fillStyle = '#67e8f9';
                        ctx.shadowColor = '#22d3ee';
                        ctx.shadowBlur = 8;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        break;
                    }
                    dist -= seg[i];
                }
            }
        }

        function drawWorkbench(r1, r2, mode, Rtotal, I) {
            ctx.clearRect(0, 0, W, H);
            // 车间墙面
            const bg = ctx.createLinearGradient(0, 0, 0, H);
            bg.addColorStop(0, '#0a1a14');
            bg.addColorStop(0.55, '#0f241c');
            bg.addColorStop(1, '#07140f');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);
            // 工具挂板
            ctx.fillStyle = '#14532d';
            ctx.fillRect(16, 40, 70, 120);
            ctx.fillStyle = '#86efac';
            ctx.font = '11px "Microsoft YaHei",sans-serif';
            ctx.fillText('工具板', 28, 58);
            for (let i = 0; i < 3; i++) {
                ctx.fillStyle = '#64748b';
                ctx.fillRect(30, 70 + i * 28, 40, 6);
            }
            // 窗户
            ctx.fillStyle = '#0ea5e9';
            ctx.globalAlpha = 0.25;
            ctx.fillRect(W - 150, 36, 110, 80);
            ctx.globalAlpha = 1;
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 3;
            ctx.strokeRect(W - 150, 36, 110, 80);

            // 木工位台面
            const benchY = H - 64;
            ctx.fillStyle = '#3f2a1a';
            ctx.fillRect(0, benchY, W, 64);
            ctx.fillStyle = '#5b3d24';
            ctx.fillRect(0, benchY, W, 12);

            // 面包板
            const bx = W * 0.12, by = H * 0.28, bw = W * 0.52, bh = H * 0.38;
            ctx.fillStyle = '#fff7ed';
            ctx.fillRect(bx, by, bw, bh);
            ctx.strokeStyle = '#fdba74';
            ctx.lineWidth = 2;
            ctx.strokeRect(bx, by, bw, bh);
            ctx.fillStyle = '#fed7aa';
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 18; col++) {
                    ctx.beginPath();
                    ctx.arc(bx + 18 + col * (bw - 36) / 17, by + 18 + row * (bh - 36) / 7, 2.2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.fillStyle = '#9a3412';
            ctx.font = 'bold 13px "Microsoft YaHei",sans-serif';
            ctx.fillText('舞台电源板 · ' + (mode === 'series' ? '串联' : '并联'), bx + 12, by - 10);

            // 电源模块
            const px = 24, py = benchY - 120;
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(px, py, 90, 100);
            ctx.strokeStyle = '#34d399';
            ctx.strokeRect(px, py, 90, 100);
            ctx.fillStyle = '#6ee7b7';
            ctx.font = 'bold 14px "Microsoft YaHei",sans-serif';
            ctx.fillText('12V', px + 28, py + 36);
            ctx.fillStyle = '#94a3b8';
            ctx.font = '11px "Microsoft YaHei",sans-serif';
            ctx.fillText('直流电源', px + 18, py + 58);
            ctx.fillStyle = '#ef4444';
            ctx.beginPath(); ctx.arc(px + 28, py + 78, 6, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(px + 62, py + 78, 6, 0, Math.PI * 2); ctx.fill();

            // 电流表
            const mx = W - 150, my = benchY - 140;
            ctx.fillStyle = '#111827';
            ctx.fillRect(mx, my, 120, 120);
            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 2;
            ctx.strokeRect(mx, my, 120, 120);
            ctx.fillStyle = '#022c22';
            ctx.fillRect(mx + 12, my + 16, 96, 44);
            const showI = measuredI != null ? measuredI : null;
            const onTarget = showI != null && Math.abs(showI - targetCurrent) < 0.001;
            ctx.fillStyle = showI != null ? (onTarget ? '#4ade80' : '#fbbf24') : '#94a3b8';
            ctx.font = 'bold 20px ui-monospace,monospace';
            ctx.fillText(showI != null ? showI.toFixed(3) : '—', mx + 18, my + 45);
            ctx.fillStyle = '#a7f3d0';
            ctx.font = '12px "Microsoft YaHei",sans-serif';
            ctx.fillText(playMode === 'challenge' ? ('A  目标 ' + targetCurrent.toFixed(2)) : 'A  待测', mx + 16, my + 72);
            ctx.fillStyle = showI != null ? (onTarget ? '#86efac' : '#fca5a5') : '#94a3b8';
            ctx.fillText(showI != null ? (onTarget ? '已对准' : '未对准') : '待测', mx + 16, my + 96);

            // 电阻与连线
            const r1x = bx + bw * 0.18, r2x = bx + bw * 0.58;
            const ry = by + bh * 0.42;
            const rw = Math.min(70, bw * 0.18), rh = 28;
            if (mode === 'series') {
                drawResistorBody(r1x, ry, rw, rh, 'R₁', r1);
                drawResistorBody(r2x, ry, rw, rh, 'R₂', r2);
                ctx.strokeStyle = '#0f766e';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(px + 90, py + 50);
                ctx.lineTo(r1x, ry + rh / 2);
                ctx.lineTo(r1x + rw, ry + rh / 2);
                ctx.lineTo(r2x, ry + rh / 2);
                ctx.lineTo(r2x + rw, ry + rh / 2);
                ctx.lineTo(mx, my + 40);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(mx + 60, my + 120);
                ctx.lineTo(mx + 60, benchY - 8);
                ctx.lineTo(px + 45, benchY - 8);
                ctx.lineTo(px + 45, py + 100);
                ctx.stroke();
                drawFlowDots([
                    { x: px + 90, y: py + 50 },
                    { x: r1x, y: ry + rh / 2 },
                    { x: r2x + rw, y: ry + rh / 2 },
                    { x: mx, y: my + 40 }
                ], 0.35 + Math.min(0.8, I));
            } else {
                const y1 = ry - 36, y2 = ry + 36;
                drawResistorBody(r1x + 40, y1, rw, rh, 'R₁', r1);
                drawResistorBody(r1x + 40, y2, rw, rh, 'R₂', r2);
                ctx.strokeStyle = '#0f766e';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(px + 90, py + 50);
                ctx.lineTo(r1x, ry + rh / 2);
                ctx.moveTo(r1x, y1 + rh / 2);
                ctx.lineTo(r1x, y2 + rh / 2);
                ctx.moveTo(r1x, y1 + rh / 2);
                ctx.lineTo(r1x + 40, y1 + rh / 2);
                ctx.lineTo(r1x + 40 + rw, y1 + rh / 2);
                ctx.lineTo(r2x + rw, y1 + rh / 2);
                ctx.moveTo(r1x, y2 + rh / 2);
                ctx.lineTo(r1x + 40, y2 + rh / 2);
                ctx.lineTo(r1x + 40 + rw, y2 + rh / 2);
                ctx.lineTo(r2x + rw, y2 + rh / 2);
                ctx.moveTo(r2x + rw, y1 + rh / 2);
                ctx.lineTo(r2x + rw, y2 + rh / 2);
                ctx.lineTo(mx, my + 40);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(mx + 60, my + 120);
                ctx.lineTo(mx + 60, benchY - 8);
                ctx.lineTo(px + 45, benchY - 8);
                ctx.lineTo(px + 45, py + 100);
                ctx.stroke();
                drawFlowDots([
                    { x: px + 90, y: py + 50 },
                    { x: r1x, y: ry + rh / 2 },
                    { x: r2x + rw, y: ry + rh / 2 },
                    { x: mx, y: my + 40 }
                ], 0.45 + Math.min(1, I));
            }

            // 底部状态条
            ctx.fillStyle = 'rgba(6, 78, 59, 0.85)';
            ctx.fillRect(16, benchY - 40, 280, 32);
            ctx.strokeStyle = 'rgba(52,211,153,0.45)';
            ctx.strokeRect(16, benchY - 40, 280, 32);
            ctx.fillStyle = '#ecfdf5';
            ctx.font = '12px "Microsoft YaHei",sans-serif';
            const tgtLabel = playMode === 'challenge'
              ? ('急单 ' + targetCurrent.toFixed(2) + 'A')
              : '探究对比';
            if (measuredI != null) {
              ctx.fillText('R总 ' + measuredRtotal.toFixed(1) + 'Ω · I ' + measuredI.toFixed(3) + 'A · ' + tgtLabel, 26, benchY - 19);
            } else {
              ctx.fillText('R总 待测 · I 待测 · ' + tgtLabel, 26, benchY - 19);
            }
        }

        // ----- 测试/发射 与过关判定 (snapshot + win) -----
        function fireTest() {
            const r1 = parseFloat(sR1.value) || 1;
            const r2 = parseFloat(sR2.value) || 1;
            const { Rtotal, I } = computeCircuit(r1, r2, mode);
            measuredI = I;
            measuredRtotal = Rtotal;
            var controlsSnapshot = snapControls();
            controlsSnapshot['mode'] = mode;

            if (playMode === 'explore') {
                feedback.className = 'feedback info';
                feedback.textContent = '当前电流 · 继续对比串并联（探究）';
                try {
                    (function() {
                        function emit(type, payload) {
                            try { if (window.PlatformTraceAdapter) { window.PlatformTraceAdapter.record(type, payload); return; } } catch(e) {}
                            try { if (window.parent && window.parent!==window && window.parent.PlatformTraceAdapter) { window.parent.PlatformTraceAdapter.record(type, payload); } } catch(e) {}
                        }
                        emit('snapshot', { controls: controlsSnapshot, winOk: false, hintKey: 'explore_observe' });
                    })();
                } catch(e) {}
                updateAll();
                return;
            }

            // 探究观察不靠此容差过关；竞赛用更紧容差（分流）
            const iTol = playMode === 'challenge' ? 0.004 : 0.012;
            const winOk = (Math.abs(I - targetCurrent) < iTol);
            const hintKey = winOk ? 'win' : (I > targetCurrent ? '电流偏大，增大电阻' : '电流偏小，减小电阻');

            if (winOk) {
                feedback.className = 'feedback win';
                feedback.textContent = '急单完成 · 电流已对准目标';
                if (!challengeWon) {
                    challengeWon = true;
                    if (typeof window.__craftShowWin === 'function') {
                        window.__craftShowWin('目标电流本局锁定。串联电阻相加、并联等效更小，同一电源下总电流随之变化。');
                    }
                }
            } else {
                // FixedChallenge：失败不换目标
                feedback.className = 'feedback fail';
                feedback.textContent = '未对准 · 目标仍锁定，再调参后测试';
            }

            try {
                var snapPayload = { controls: controlsSnapshot, winOk: winOk, hintKey: hintKey };
                (function() {
                    function emit(type, payload) {
                        try { if (window.PlatformTraceAdapter) { window.PlatformTraceAdapter.record(type, payload); return; } } catch(e) {}
                        try { if (window.parent && window.parent!==window && window.parent.PlatformTraceAdapter) { window.parent.PlatformTraceAdapter.record(type, payload); } } catch(e) {}
                    }
                    emit('snapshot', snapPayload);
                    if (winOk) emit('win', { winOk: true });
                })();
            } catch(e) {}

            updateAll();
        }

        // 辅助 snapControls (与埋点一致)
        function snapControls() {
            var o = {};
            document.querySelectorAll('input[type="range"], input[type="number"]').forEach(function(el) {
                var id = el.id || el.name; if (id) o[id] = el.value;
            });
            o['btn-connect'] = mode;
            return o;
        }

        // ----- 事件绑定 -----
        // 滑条 input 更新 (tuning 已在 adapter 中绑定，这里只做UI)
        sR1.addEventListener('input', function() { measuredI = null; measuredRtotal = null; updateAll(); });
        sR2.addEventListener('input', function() { measuredI = null; measuredRtotal = null; updateAll(); });
        if (sMeterR) sMeterR.addEventListener('input', function() { updateAll(); });

        // 连接切换
        btnConnect.addEventListener('click', function() {
            mode = (mode === 'series') ? 'parallel' : 'series';
            measuredI = null; measuredRtotal = null;
            // 更新按钮文字
            btnConnect.textContent = (mode === 'series') ? '🔁 切换连接 (串联)' : '🔁 切换连接 (并联)';
            updateAll();
            // 额外 tuning 事件 (连接切换视为 tuning, 但 adapter 未绑, 手动补)
            try {
                (function() {
                    function emit(type, payload) {
                        try { if (window.PlatformTraceAdapter) { window.PlatformTraceAdapter.record(type, payload); return; } } catch(e) {}
                        try { if (window.parent && window.parent!==window && window.parent.PlatformTraceAdapter) { window.parent.PlatformTraceAdapter.record(type, payload); } } catch(e) {}
                    }
                    emit('tuning', { control: 'btn-connect', value: mode });
                })();
            } catch(e) {}
        });

        // 测试按钮
        btnTest.addEventListener('click', fireTest);
        var btnTestFt = document.getElementById('btn-test-ft');
        if (btnTestFt) btnTestFt.addEventListener('click', fireTest);

        // 无关控件 I1 点击 (埋点已在 adapter 中绑定 irrelevant_touch, 额外视觉反馈)
        document.getElementById('I1').addEventListener('click', function() {
            // 仅装饰反馈
            feedback.className = 'feedback info';
            feedback.textContent = '已记录一次工作台操作';
            setTimeout(function() { feedback.textContent = '待测 · 调电阻或切换连接后点测试'; }, 1200);
        });

        window.addEventListener('resize', resizeCanvas);
        if (typeof ResizeObserver !== 'undefined' && wrap) {
            new ResizeObserver(resizeCanvas).observe(wrap);
        }
        resizeCanvas();
        (function loop() {
            flowT += 0.008;
            const r1 = parseFloat(sR1.value) || 1;
            const r2 = parseFloat(sR2.value) || 1;
            const out = computeCircuit(r1, r2, mode);
            drawWorkbench(r1, r2, mode, out.Rtotal, out.I);
            requestAnimationFrame(loop);
        })();
    })();
</script>
<script>
(function(){
  function emit(type, payload) {
    try {
      if (window.PlatformTraceAdapter) {
        window.PlatformTraceAdapter.record(type, payload || {});
        return;
      }
    } catch (e) {}
    try {
      if (window.parent && window.parent !== window && window.parent.PlatformTraceAdapter) {
        window.parent.PlatformTraceAdapter.record(type, payload || {});
      }
    } catch (e) {}
  }
  function snapControls() {
    var o = {};
    document.querySelectorAll('input[type="range"], input[type="number"], select').forEach(function(el) {
      var id = el.id || el.name;
      if (id) o[id] = el.value;
    });
    return o;
  }
  document.addEventListener('DOMContentLoaded', function() {
    emit('puzzle_open', {});
    document.querySelectorAll('input[type="range"], input[type="number"]').forEach(function(el) {
      el.addEventListener('input', function() {
        emit('tuning', { control: el.id || el.name || 'slider', value: el.value });
      });
    });
    document.querySelectorAll('button, [role="button"]').forEach(function(el) {
      el.addEventListener('click', function() {
        emit('action', { control: el.id || (el.textContent || '').trim().slice(0, 24) || 'button' });
      });
    });
    window.__emit = emit;
    window.__snapControls = snapControls;
  });
})();
</script>
<script>
(function(){
  function emitWin(hintKey) {
    if (window.__legacyWinEmitted) return;
    window.__legacyWinEmitted = true;
    var emit = window.__emit;
    if (!emit) return;
    var controls = window.__snapControls ? window.__snapControls() : {};
    emit('snapshot', { controls: controls, winOk: true, hintKey: hintKey || 'legacy_win' });
    emit('win', { winOk: true });
  }
  var WIN_TEXT = [/完美命中/, /游戏胜利/, /过关！/, /命中目标！/, /🎯\s*命中目标/, /🏆\s*过关/];
  function scanWinText() {
    var text = document.body ? document.body.innerText : '';
    for (var i = 0; i < WIN_TEXT.length; i++) {
      if (WIN_TEXT[i].test(text)) {
        emitWin('text_' + i);
        return true;
      }
    }
    return false;
  }
  document.addEventListener('DOMContentLoaded', function() {
    var obs = new MutationObserver(function() { scanWinText(); });
    if (document.body) obs.observe(document.body, { subtree: true, childList: true, characterData: true });
    setInterval(scanWinText, 800);
  });
})();
</script>


<script>
(function(){
  if (window.__essenceStageResize) return;
  window.__essenceStageResize = true;
  function fit(){
    var stage = document.getElementById('essence-stage');
    var cvs = stage && stage.querySelector('canvas');
    if (!stage || !cvs) return;
    var w = stage.clientWidth, h = stage.clientHeight;
    if (w < 2 || h < 2) return;
    var dw = Number(cvs.getAttribute('width')) || cvs.width || 600;
    var dh = Number(cvs.getAttribute('height')) || cvs.height || 400;
    // keep design buffer; CSS scales visually
    if (!cvs._essenceDesign) cvs._essenceDesign = { dw: dw, dh: dh };
  }
  window.addEventListener('resize', fit);
  if (typeof ResizeObserver !== 'undefined') {
    var st = document.getElementById('essence-stage');
    if (st) new ResizeObserver(fit).observe(st);
  }
  fit();
})();
</script>

<script>
/* === dual-mode-shell runtime (auto) === */
(function(){
  if (window.__dualModeShell) return;
  window.__dualModeShell = true;

  var MAX_ATTEMPTS = 5;
  var EXPLORE_SECONDS = 10 * 60;
  var state = {
    mode: 'explore',
    attempts: MAX_ATTEMPTS,
    timeLeft: EXPLORE_SECONDS,
    timerId: null
  };

  function $(id){ return document.getElementById(id); }

  function setPhase(phase){
    try {
      if (typeof window.__platformTraceSetPhase === 'function') {
        window.__platformTraceSetPhase(phase);
      } else if (window.PlatformTraceAdapter && typeof window.PlatformTraceAdapter.setPhase === 'function') {
        window.PlatformTraceAdapter.setPhase(phase);
      }
    } catch (e) { /* offline */ }
  }

  function fmt(sec){
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function renderAttempts(){
    var el = $('attemptsDisplay');
    if (el) el.textContent = String(state.attempts);
  }

  function primaryButtons(){
    return Array.prototype.slice.call(document.querySelectorAll(
      '#essence-bench .essence-ft button, #essence-bench button.btn, #essence-bench button[id^="btn"]'
    ));
  }

  function gateActions(){
    var disable = state.mode === 'challenge' && state.attempts <= 0;
    primaryButtons().forEach(function(btn){
      if (/reset|清除|重置|再来/i.test(btn.textContent || '') || /reset|clear/i.test(btn.id || '')) return;
      btn.classList.toggle('dual-disabled', disable);
      if (disable) btn.setAttribute('disabled', 'disabled');
      else btn.removeAttribute('disabled');
    });
  }

  function stopTimer(){
    if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
  }

  function startExploreTimer(){
    stopTimer();
    state.timeLeft = EXPLORE_SECONDS;
    var td = $('timerDisplay');
    if (td) td.textContent = fmt(state.timeLeft);
    state.timerId = setInterval(function(){
      if (state.mode !== 'explore') return;
      state.timeLeft -= 1;
      if (td) td.textContent = fmt(Math.max(0, state.timeLeft));
      if (state.timeLeft <= 0) {
        stopTimer();
        var sel = $('modeSelect');
        if (sel) {
          sel.value = 'challenge';
          sel.dispatchEvent(new Event('change', { bubbles: true }));
        }
      }
    }, 1000);
  }

  function applyMode(mode){
    state.mode = mode === 'challenge' ? 'challenge' : 'explore';
    var label = $('modeLabel');
    var stats = $('challengeStats');
    var timerChip = $('dual-timer-chip');
    if (label) label.textContent = state.mode === 'explore' ? '探究模式' : '竞赛模式';
    if (stats) {
      if (state.mode === 'challenge') stats.classList.add('is-visible');
      else stats.classList.remove('is-visible');
    }
    if (timerChip) timerChip.style.display = state.mode === 'explore' ? 'inline-flex' : 'none';
    if (state.mode === 'challenge') {
      stopTimer();
      state.attempts = MAX_ATTEMPTS;
      renderAttempts();
    } else {
      startExploreTimer();
    }
    setPhase(state.mode);
    gateActions();
    if (typeof window.__seriesApplyMode === 'function') {
      try { window.__seriesApplyMode(state.mode); } catch (e) {}
    }
  }

  function onPrimaryClick(e){
    if (state.mode !== 'challenge') return;
    var t = e.target.closest('button');
    if (!t) return;
    if (/reset|清除|重置|再来/i.test(t.textContent || '') || /reset|clear/i.test(t.id || '')) return;
    if (state.attempts <= 0) {
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    state.attempts -= 1;
    renderAttempts();
    gateActions();
  }

  function ensureUi(){
    var stage = $('essence-stage') || document.querySelector('#proj-stage, #stage, #canvasContainer, .canvas-wrap')?.parentElement;
    var bench = $('essence-bench');
    if (!stage) return false;

    if (!$('dual-mode-hud')) {
      var hud = document.createElement('div');
      hud.id = 'dual-mode-hud';
      hud.innerHTML =
        '<div id="dual-timer-chip" class="dual-chip">' +
          '<span id="modeLabel">探究模式</span><span style="width:1px;height:14px;background:#cbd5e1"></span>' +
          '<span id="timerDisplay">10:00</span>' +
        '</div>' +
        '<div id="challengeStats"><span>剩余机会</span><span id="attemptsDisplay">5</span></div>';
      stage.style.position = stage.style.position || 'relative';
      stage.appendChild(hud);
    }

    if (bench && !$('modeSelect')) {
      bench.classList.add('dual-mode-ready');
      var hd = document.createElement('div');
      hd.id = 'essence-bench-hd';
      hd.className = 'dual-bench-hd';
      var title = '环境控制台';
      var tEl = stage.querySelector('.essence-title, h1');
      if (tEl) title = (tEl.textContent || title).trim() || title;
      hd.innerHTML =
        '<h1>' + title.replace(/</g,'&lt;') + '</h1>' +
        '<select id="modeSelect" aria-label="探究阶段">' +
          '<option value="explore">自由探究</option>' +
          '<option value="challenge">竞赛挑战</option>' +
        '</select>';
      bench.insertBefore(hd, bench.firstChild);
    } else if (!$('modeSelect')) {
      // Fallback: floating select in hud
      var chip = $('dual-timer-chip');
      if (chip && !$('modeSelect')) {
        var sel = document.createElement('select');
        sel.id = 'modeSelect';
        sel.innerHTML = '<option value="explore">自由探究</option><option value="challenge">竞赛挑战</option>';
        chip.appendChild(sel);
      }
    }
    return !!$('modeSelect');
  }

  function boot(){
    if (!ensureUi()) return;
    var sel = $('modeSelect');
    sel.addEventListener('change', function(){ applyMode(sel.value); });
    var ft = document.querySelector('#essence-bench .essence-ft') || $('essence-bench') || document.body;
    ft.addEventListener('click', onPrimaryClick, true);
    applyMode(sel.value || 'explore');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>


<script>
/* === craft-gold-runtime === */
(function(){
  if (window.__craftGold) return; window.__craftGold = true;
  var intro = document.getElementById('craft-intro');
  var win = document.getElementById('craft-win');
  var btn = document.getElementById('craftIntroBtn');
  var wbtn = document.getElementById('craftWinBtn');
  if (btn) btn.addEventListener('click', function(){ if(intro) intro.hidden = true; });
  function replayLevel(){
    if (typeof window.__craftReplay === 'function') {
      try { window.__craftReplay(); return; } catch (e) {}
    }
    var rbtn = document.getElementById('btn-reset')
      || document.querySelector('#btnReset, button.btn-reset, [data-action="reset"]');
    if (rbtn) { try { rbtn.click(); } catch (e) {} }
  }
  if (wbtn) wbtn.addEventListener('click', function(){
    window.__craftWinDismissed = true;
    if (win) win.hidden = true;
    replayLevel();
  });

  // gauge into hud
  var hud = document.getElementById('essence-hud') || document.getElementById('dual-mode-hud') || document.getElementById('hud');
  if (hud && !document.getElementById('craft-gauge')) {
    var g = document.createElement('div');
    g.id = 'craft-gauge';
    g.innerHTML = '<span>目标仪表</span><strong id="craftGaugeVal">待测</strong>';
    hud.appendChild(g);
  }
function showWin(extra){
    if (win) {
      window.__craftWinDismissed = false;
      win.hidden = false;
      var t = document.getElementById('craftWinText');
      if (t && extra) t.textContent = extra;
    }
  }
  window.__craftShowWin = showWin;

  // Hook common win paths
  var _emit = window.__emit;
  window.__emit = function(type, payload){
    if (typeof _emit === 'function') _emit(type, payload);
    if (type === 'win') showWin();
  };
  // Observe win banners
  var obs = new MutationObserver(function(){
    if (window.__craftWinDismissed) return;
    var el = document.querySelector('.win-banner,.win-badge,#winBanner,[data-win="1"]');
    if (el && el.offsetParent !== null) showWin();
  });
  obs.observe(document.body, {childList:true, subtree:true, attributes:true, attributeFilter:['class','style','hidden']});

  // Live gauge from first range readout if possible
  function tick(){
    var val = document.querySelector('#essence-bench .value-badge, #essence-bench .value, .observe-box .state, .observe-value, #craftGaugeVal');
    var src = document.querySelector('.observe-box .state, .observe-value, #hud-dist, #g-T, .gauge .gval');
    var gval = document.getElementById('craftGaugeVal');
    if (gval && src && src !== gval) gval.textContent = (src.textContent || '').trim() || '观测中';
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
