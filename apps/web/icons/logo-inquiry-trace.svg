<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="??????">
  <!--
    Inquiry Trace Mark — line / foyer (currentColor)
    Composition: instrument frame + rising projectile arc + progressive nodes.
    Optical nudge: +0.25x +0.4y (counter solid state mass at UR).
  -->
  <style>
    .mark-full { display: inline; }
    .mark-lite { display: none; }
    @media (max-width: 20px) {
      .mark-full { display: none; }
      .mark-lite { display: inline; }
    }
  </style>

  <g class="mark-full" transform="translate(0.25 0.4)">
    <rect x="2.1" y="2.1" width="43" height="43" stroke="currentColor" stroke-width="1.3"/>
    <path
      d="M7.15 12.55V7.15H12.55M34.55 7.15H39.95V12.55M39.95 34.55V39.95H34.55M12.55 39.95H7.15V34.55"
      stroke="currentColor" stroke-width="1" stroke-linecap="square" opacity="0.4"/>
    <path
      d="M11.05 36.35H22M11.05 36.35V34.5M14.7 36.35V35M18.35 36.35V35M22 36.35V34.5"
      stroke="currentColor" stroke-width="0.9" stroke-linecap="square" opacity="0.28"/>

    <!-- Rising projectile: steep mid-rise, softens into landing -->
    <path
      d="M11 33.8C14.5 20 26 12.2 35.2 13.1"
      stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Event rings on path — radius & opacity ramp toward state -->
    <circle cx="16.5" cy="22.5" r="1.2" stroke="currentColor" stroke-width="1.05" opacity="0.62"/>
    <circle cx="24.3" cy="15.7" r="1.55" stroke="currentColor" stroke-width="1.15" opacity="0.9"/>

    <!-- State / landing point -->
    <circle cx="35.2" cy="13.1" r="2.45" fill="currentColor"/>
  </g>

  <g class="mark-lite">
    <rect x="2.5" y="2.5" width="43" height="43" stroke="currentColor" stroke-width="2.2"/>
    <path
      d="M11.2 33.4C15.8 21.5 26 13 34.5 13.4"
      stroke="currentColor" stroke-width="2.7" stroke-linecap="round"/>
    <circle cx="34.5" cy="13.4" r="3.2" fill="currentColor"/>
  </g>
</svg>
