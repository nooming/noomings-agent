<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c8aad">
<title>教师登录 · 物理探究教学平台</title>
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/icons/favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="shortcut icon" href="/icons/favicon.ico">
<link rel="stylesheet" href="/static/ui/platform-shell.css">
</head>
<body class="platform-page edu-shell platform-foyer platform-foyer--auth platform-foyer--teacher">

<div class="foyer-atmosphere" aria-hidden="true"></div>

<main class="foyer-auth">
  <section class="foyer-auth-brand" aria-label="产品品牌">
    <a class="foyer-home-link" href="/">返回首页</a>
    <div class="foyer-brand-mark foyer-brand-mark--auth" aria-hidden="true">
      <svg class="foyer-mark-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g transform="translate(0.25 0.4)">
          <rect x="2.1" y="2.1" width="43" height="43" stroke="currentColor" stroke-width="1.3"/>
          <path d="M7.15 12.55V7.15H12.55M34.55 7.15H39.95V12.55M39.95 34.55V39.95H34.55M12.55 39.95H7.15V34.55" stroke="currentColor" stroke-width="1" stroke-linecap="square" opacity="0.4"/>
          <path d="M11.05 36.35H22M11.05 36.35V34.5M14.7 36.35V35M18.35 36.35V35M22 36.35V34.5" stroke="currentColor" stroke-width="0.9" stroke-linecap="square" opacity="0.28"/>
          <path d="M11 33.8C14.5 20 26 12.2 35.2 13.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="16.5" cy="22.5" r="1.2" stroke="currentColor" stroke-width="1.05" opacity="0.62"/>
          <circle cx="24.3" cy="15.7" r="1.55" stroke="currentColor" stroke-width="1.15" opacity="0.9"/>
          <circle cx="35.2" cy="13.1" r="2.45" fill="currentColor"/>
        </g>
      </svg>
    </div>
    <p class="foyer-kicker">教师入口</p>
    <h1 class="foyer-product-name">物理探究教学平台</h1>
    <p class="foyer-product-en">Physics Inquiry Platform</p>
    <p class="foyer-lead">输入课堂通行码后进入工作台，发布探究任务并回看学情轨迹。</p>
  </section>

  <section class="foyer-auth-stage">
    <form class="edu-panel foyer-auth-panel" id="loginForm" autocomplete="off">
      <header class="foyer-auth-head">
        <h2 class="foyer-auth-title">教师登录</h2>
        <p class="foyer-auth-hint">输入课堂通行码进入教师工作台。</p>
      </header>

      <div class="form-row">
        <label for="accessCode">通行码</label>
        <input type="password" id="accessCode" name="code" placeholder="请输入教师通行码" required maxlength="128" autocomplete="current-password">
      </div>
      <p class="hint" id="loginError" hidden></p>
      <div class="tool-link-row foyer-auth-actions">
        <button type="submit" class="edu-btn edu-btn-primary foyer-btn-primary" id="loginBtn">进入工作台</button>
        <a class="edu-btn edu-btn-outline" href="/">返回首页</a>
      </div>
    </form>
  </section>
</main>

<script>
const TOKEN_KEY = 'platform-teacher-token';
if (sessionStorage.getItem(TOKEN_KEY)) {
  location.replace('/teacher.html');
}

const form = document.getElementById('loginForm');
const errEl = document.getElementById('loginError');
const btn = document.getElementById('loginBtn');

function showError(msg) {
  errEl.hidden = !msg;
  errEl.textContent = msg || '';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  showError('');
  const code = document.getElementById('accessCode').value.trim();
  if (!code) {
    showError('请输入通行码');
    return;
  }
  btn.disabled = true;
  try {
    const r = await fetch('/api/platform/teacher-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok || !data.ok || !data.token) {
      if (data.error === 'teacher_access_not_configured') {
        showError('服务端未配置教师通行码（TEACHER_ACCESS_CODE）');
      } else {
        showError('通行码不正确，请重试');
      }
      return;
    }
    sessionStorage.setItem(TOKEN_KEY, data.token);
    location.replace('/teacher.html');
  } catch {
    showError('网络错误，请稍后重试');
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
