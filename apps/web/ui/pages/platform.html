<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#0c8aad">
<title>物理探究教学平台</title>
<link rel="stylesheet" href="/static/ui/platform-shell.css">
</head>
<body class="platform-page edu-shell">

<header class="platform-header">
  <div class="platform-header-inner">
    <a class="platform-brand" href="/">
      <span class="platform-brand-mark">PE</span>
      <span>
        <span class="platform-brand-text">物理探究教学平台</span>
        <span class="platform-brand-sub">Physics Inquiry Platform</span>
      </span>
    </a>
  </div>
</header>

<main class="platform-main">
  <section class="platform-hero">
    <h1>事理图谱驱动的探究教学</h1>
    <p>教师发布任务，学生进课堂做实验；操作轨迹自动上报，便于回看学情。</p>
  </section>

  <div class="platform-cards">
    <a class="platform-card teacher" href="/teacher-login.html">

      <p>通行码进入工作台：发布探究任务，查看轨迹与评判。</p>
      <span class="platform-card-tag">通行码登录 · 工作台</span>
    </a>
    <a class="platform-card student" href="/student-join.html">
      <div class="platform-card-icon">S</div>
      <h2>学生进入课堂</h2>
      <p>学号签到后进入教师发布的探究游戏。</p>
      <span class="platform-card-tag">学号签到 · 探究游戏</span>
    </a>
