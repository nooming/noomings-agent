            <path d="M11.05 36.35H22M11.05 36.35V34.5M14.7 36.35V35M18.35 36.35V35M22 36.35V34.5" stroke="currentColor" stroke-width="0.9" stroke-linecap="square" opacity="0.28"/>

    </div>
    <p class="foyer-lead">教师发布任务，学生课堂码进关；操作轨迹自动上报，便于回看学情。</p>

  <nav class="foyer-roles" aria-label="选择入口">

        </svg>
      </span>

        <span class="foyer-role-title">教师登录</span>
        <span class="foyer-role-desc">通行码进入工作台：发布探究任务，查看轨迹与评判。</span>

    </a>
  </nav>
</main>

<script>
(function () {
  var el = document.querySelector('.foyer-mascot');
  if (!el) return;
  var clicks = 0;
  var timer = null;
  var NEED = 4;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  el.addEventListener('click', function () {
    clicks += 1;
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () { clicks = 0; }, 1400);
    if (clicks < NEED) return;
    clicks = 0;
    if (reduceMotion.matches) return;
    el.classList.remove('is-bounce');
    void el.offsetWidth;
    el.classList.add('is-bounce');
  });
  el.addEventListener('animationend', function () {
    el.classList.remove('is-bounce');
  });
})();
</script>

</body>
</html>
