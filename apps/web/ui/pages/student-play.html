<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>探究中…</title>
<link rel="stylesheet" href="/static/ui/platform-shell.css">
</head>
<body class="platform-page edu-shell play-page">

<div id="playEnterOverlay" class="play-enter-overlay" aria-hidden="true"></div>
<div id="playSoftTip" class="play-soft-tip" hidden role="status"></div>
<div class="play-shell">
  <div id="playIdleHint" class="play-idle-hint" hidden>💡 请先调节参数，再点击页面内的<strong>发射</strong>或<strong>测试</strong>按钮开始模拟</div>
  <div id="pathTypeChip" class="play-path-type-chip" hidden></div>
  <div id="pathAdviceChip" class="play-path-advice-chip" hidden></div>
  <div class="play-frame-wrap">
    <iframe id="gameFrame" title="探究游戏" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
  </div>
  <div class="play-fab" id="playFab">
    <div class="play-fab-menu" id="fabMenu" hidden>
      <div class="play-fab-menu-title" id="playTitle">探究游戏</div>
      <a href="/student.html" class="play-fab-item">← 返回列表</a>
      <div class="play-fab-item play-fab-status" id="playStatus" aria-live="polite">操作已记录</div>
      <label class="play-fab-item play-fab-toggle" id="pathTypeToggleWrap">
        <input type="checkbox" id="pathTypeToggle"> 显示探究路径类型
      </label>
      <button type="button" class="play-fab-item play-fab-item-btn" id="exportTraceBtn">导出会话信息（可选）</button>
    </div>
    <button type="button" class="play-fab-btn" id="fabToggle" aria-label="打开菜单" aria-expanded="false" aria-controls="fabMenu">⋯</button>
  </div>
</div>

<script src="/static/ui/platform-nav.js"></script>
<script src="/static/ui/trace-adapter-platform.js"></script>
<script src="/static/ui/strategy-path-summary.js"></script>
<script>
if (!PlatformNav.requireStudentSession()) { throw new Error('redirect_student_join'); }

const params = new URLSearchParams(location.search);
const catalogId = params.get('id');
const studentId = (localStorage.getItem('platform-student-id') || '').trim();
const studentLabel = (localStorage.getItem('platform-student-name') || '').trim() || studentId || '学生';
const taskCode = localStorage.getItem('platform-task-code') || params.get('taskCode') || catalogId || '';
const pathTypeEnabled = params.get('showPathType') === '1'
  || localStorage.getItem('platform-show-path-type') === '1';

const fabToggle = document.getElementById('fabToggle');
const fabMenu = document.getElementById('fabMenu');
const playFab = document.getElementById('playFab');
let fabDimTimer = null;

function setFabMenuOpen(open) {
  fabMenu.hidden = !open;
  fabToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  fabToggle.setAttribute('aria-label', open ? '关闭菜单' : '打开菜单');
  playFab.classList.toggle('is-menu-open', open);
  if (fabDimTimer) clearTimeout(fabDimTimer);
  playFab.classList.remove('is-dimmed');
  if (!open) {
    fabDimTimer = setTimeout(() => playFab.classList.add('is-dimmed'), 3000);
  }
}

fabToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  setFabMenuOpen(fabMenu.hidden);
});

document.addEventListener('click', (e) => {
  if (!playFab.contains(e.target)) setFabMenuOpen(false);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') setFabMenuOpen(false);
});

playFab.addEventListener('mouseenter', () => playFab.classList.remove('is-dimmed'));

async function boot() {
  const titleEl = document.getElementById('playTitle');
  const statusEl = document.getElementById('playStatus');

  if (!catalogId) {
    titleEl.textContent = '缺少任务';
    statusEl.textContent = '请从学生端列表进入游戏';
    return;
  }

  const r = await fetch('/api/platform/catalog');
  const data = await r.json();
  const item = (data.items || []).find(i => i.id === catalogId);
  if (!item) {
    titleEl.textContent = '任务不可用';
    statusEl.textContent = '任务不存在或未发布';
    return;
  }

  titleEl.textContent = item.title;
  document.title = item.title + ' · 探究';

  const traceCfg = {
    catalogId: item.id,
    graphId: item.graphId,
    studentLabel,
    studentId: studentId || undefined,
    taskCode: taskCode || item.id,
    ch: 0,
  };
  const traceSessionId = `sess-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
  let sawInteraction = false;
  const idleHintEl = document.getElementById('playIdleHint');
  const idleHintTimer = setTimeout(() => {
    if (!sawInteraction && idleHintEl) idleHintEl.hidden = false;
  }, 5000);

  await PlatformTraceAdapter.start({
    ...traceCfg,
    sessionId: traceSessionId,
    skipBindControls: true,
  });

  const frame = document.getElementById('gameFrame');
  let currentPhase = 'explore';
  let sawExploreSuccess = false;
  let exploreActionCount = 0;
  const CHALLENGE_SOFT_GATE = true; // 巩固探究门控：未达探究门槛进竞赛仅软提示
  // 门槛：已有 explore_success，或探究段有效调节/发射 ≥3 次（见 maybeWarnChallengeGate）
  const SOFT_TERMINAL_LIMIT = 5;
  const softTipEl = document.getElementById('playSoftTip');
  let softTipTimer = null;

  function showSoftTip(msg, ms) {
    if (!softTipEl || !msg) return;
    softTipEl.hidden = false;
    softTipEl.textContent = msg;
    if (softTipTimer) clearTimeout(softTipTimer);
    softTipTimer = setTimeout(() => { softTipEl.hidden = true; }, ms || 5200);
  }

  function maybeWarnChallengeGate() {
    if (!CHALLENGE_SOFT_GATE) return;
    if (sawExploreSuccess || exploreActionCount >= 3) return;
    showSoftTip('建议先在探究模式多试几组参数并完成探究对照（explore_success），再进入挑战（本次仅提示，不拦截）。');
  }

  async function maybeWarnSoftTerminalLimit() {
    if (!studentId || !item.graphId) return;
    try {
      const key = `platform-soft-limit-warned:${studentId}:${item.graphId}`;
      if (sessionStorage.getItem(key) === '1') return;
      // 轻量：用本机 localStorage 计数（无学生读学情 API）；终局后由 play 页递增
      const countKey = `platform-terminal-count:${studentId}:${item.graphId}`;
      const n = Number(localStorage.getItem(countKey) || '0') || 0;
      if (n >= SOFT_TERMINAL_LIMIT) {
        sessionStorage.setItem(key, '1');
        showSoftTip(`本任务有效终局已约 ${n} 次（建议上限 ${SOFT_TERMINAL_LIMIT}）。可继续练习，但请优先保证每次认真完成。`, 7000);
      }
    } catch { /* ignore */ }
  }

  function bumpTerminalLocalCount() {
    if (!studentId || !item.graphId) return;
    try {
      const countKey = `platform-terminal-count:${studentId}:${item.graphId}`;
      const n = (Number(localStorage.getItem(countKey) || '0') || 0) + 1;
      localStorage.setItem(countKey, String(n));
    } catch { /* ignore */ }
  }

  const pathChip = document.getElementById('pathTypeChip');
  const adviceChip = document.getElementById('pathAdviceChip');
  const pathToggle = document.getElementById('pathTypeToggle');
  let showPathType = pathTypeEnabled;
  let craftSettleOpen = false;
  let pathChipWantVisible = false;
  let adviceChipWantVisible = false;
  /** Monotonic token so stale strategy-path fetches cannot re-show chips after clear/interim. */
  let pathChipFetchGen = 0;

  function applyPathChipVisibility() {
    if (pathChip) {
      pathChip.hidden = craftSettleOpen || !showPathType || !pathChipWantVisible;
    }
    if (adviceChip) {
      adviceChip.hidden = craftSettleOpen || !showPathType || !adviceChipWantVisible;
    }
  }

  function clearPathChips() {
    pathChipFetchGen += 1;
    pathChipWantVisible = false;
    adviceChipWantVisible = false;
    applyPathChipVisibility();
  }

  /** Mid-campaign / non-terminal wins must not surface path/advice chips. */
  function isInterimWin(payload) {
    if (!payload || typeof payload !== 'object') return false;
    if (payload.interim === true) return true;
    if (payload.final === false) return true;
    return false;
  }

  if (pathToggle) {
    pathToggle.checked = showPathType;
    pathToggle.addEventListener('change', () => {
      showPathType = pathToggle.checked;
      localStorage.setItem('platform-show-path-type', showPathType ? '1' : '0');
      if (!showPathType) {
        clearPathChips();
      } else {
        applyPathChipVisibility();
      }
    });
  }

  /** Best-effort rules judge (idempotent on server). No student UI for scores. */
  const NEW_ROUND_FLUSH_MS = 2500;
  let leaveJudgeSent = false;
  function requestAutoJudgeForSession(sid, reason, extras) {
    if (!sid) return Promise.resolve(null);
    const url = '/api/platform/auto-judge-on-leave';
    const x = extras || {};
    const payload = {
      sessionId: sid,
      mode: 'rules',
      reason: reason || 'leave',
    };
    if (x.terminalOutcome) payload.terminalOutcome = x.terminalOutcome;
    if (x.attemptsExhausted) payload.attemptsExhausted = true;
    const body = JSON.stringify(payload);
    const awaitResult = x.awaitResult === true;
    const timeoutMs = x.timeoutMs != null ? x.timeoutMs : NEW_ROUND_FLUSH_MS;

    // Unload path: prefer sendBeacon (no await). New-round path awaits fetch after flush.
    if (!awaitResult) {
      try {
        if (typeof navigator.sendBeacon === 'function') {
          const blob = new Blob([body], { type: 'application/json' });
          if (navigator.sendBeacon(url, blob)) return Promise.resolve({ ok: true, beacon: true });
        }
      } catch (_) { /* fall through to fetch */ }
    }

    const fetchP = fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body,
      keepalive: true,
    }).then((r) => r.json().catch(() => ({ ok: !!r.ok }))).catch(() => null);

    if (!awaitResult) {
      fetchP.catch(() => {});
      return fetchP;
    }
    return Promise.race([
      fetchP,
      new Promise((resolve) => setTimeout(() => resolve({ ok: false, timedOut: true }), timeoutMs)),
    ]);
  }
  function requestAutoJudgeOnLeave() {
    if (leaveJudgeSent) return;
    const sid = (typeof PlatformTraceAdapter.getSessionId === 'function'
      ? PlatformTraceAdapter.getSessionId()
      : null) || traceSessionId;
    if (!sid) return;
    leaveJudgeSent = true;
    requestAutoJudgeForSession(sid, 'leave');
  }

  /**
   * One terminal round = one session file. After exhausted retry / craft「再玩一次」,
   * flush terminal tip on the old id → auto-judge → rotate sessionId.
   */
  let rotatingRound = false;
  async function beginPlatformTraceNewRound(detail) {
    if (rotatingRound) return null;
    rotatingRound = true;
    const reason = (detail && detail.reason) || 'retry';
    const judgeReason = reason === 'craft_win_replay' ? 'new_round_pass' : 'new_round';
    const terminalOutcome = reason === 'craft_win_replay'
      ? 'pass'
      : (reason === 'exhausted_retry' ? 'exhausted_fail' : null);
    try {
      const oldSid = (typeof PlatformTraceAdapter.getSessionId === 'function'
        ? PlatformTraceAdapter.getSessionId()
        : null) || null;

      // 1) Ensure old-session terminal signal is on disk before judge / rotate.
      // Game emits live on the iframe adapter; shell phase events on the parent — flush both.
      if (oldSid) {
        try {
          let child = null;
          try { child = frame.contentWindow && frame.contentWindow.PlatformTraceAdapter; } catch (_) { child = null; }
          if (child && typeof child.flushPending === 'function') {
            await child.flushPending(NEW_ROUND_FLUSH_MS);
          }
          if (typeof PlatformTraceAdapter.markTerminalAndFlush === 'function' && terminalOutcome) {
            await PlatformTraceAdapter.markTerminalAndFlush({
              outcome: terminalOutcome,
              reason,
              timeoutMs: NEW_ROUND_FLUSH_MS,
              // Safety tip if the game's attempts_exhausted ingest was lost; duplicates are OK.
              emitEvents: terminalOutcome === 'exhausted_fail',
            });
          } else if (typeof PlatformTraceAdapter.flushPending === 'function') {
            await PlatformTraceAdapter.flushPending(NEW_ROUND_FLUSH_MS);
          }
          // Tip on child too (same sessionId) without re-emitting events.
          if (child && typeof child.markTerminalAndFlush === 'function' && terminalOutcome) {
            await child.markTerminalAndFlush({
              outcome: terminalOutcome,
              reason,
              timeoutMs: NEW_ROUND_FLUSH_MS,
              emitEvents: false,
            });
          }
        } catch (_) { /* rotate anyway after short wait */ }
      }

      // 2) Auto-judge old session (prefer after flush; short await, do not set leaveJudgeSent).
      if (oldSid) {
        try {
          await requestAutoJudgeForSession(oldSid, judgeReason, {
            terminalOutcome: terminalOutcome || undefined,
            attemptsExhausted: terminalOutcome === 'exhausted_fail',
            awaitResult: true,
            timeoutMs: NEW_ROUND_FLUSH_MS,
          });
        } catch (_) { /* best-effort */ }
      }

      leaveJudgeSent = false;
      clearPathChips();
      craftSettleOpen = false;

      // 3) Rotate to a fresh sessionId.
      const newId = `sess-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
      if (typeof PlatformTraceAdapter.beginNewRound === 'function') {
        await PlatformTraceAdapter.beginNewRound({
          ...traceCfg,
          sessionId: newId,
          reason,
          skipBindControls: true,
        });
      } else {
        await PlatformTraceAdapter.start({
          ...traceCfg,
          sessionId: newId,
          skipBindControls: true,
        });
      }

      try {
        const cw = frame.contentWindow;
        const child = cw && cw.PlatformTraceAdapter;
        if (child && typeof child.start === 'function') {
          await child.start({
            ...traceCfg,
            sessionId: newId,
            skipPuzzleOpen: true,
            skipBindControls: true,
          });
          if (currentPhase) notePhaseFromGame(currentPhase);
        }
      } catch (_) { /* iframe may be mid-reload */ }

      if (statusEl) {
        statusEl.textContent = '新一局 · 轨迹已切换会话';
      }
      return { oldSessionId: oldSid, sessionId: newId, reason };
    } finally {
      rotatingRound = false;
    }
  }
  window.__platformTraceNewRound = (detail) => {
    beginPlatformTraceNewRound(detail).catch(() => {});
  };

  window.addEventListener('message', (ev) => {
    const data = ev && ev.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'platform-navigate' && data.to === 'student-list') {
      requestAutoJudgeOnLeave();
      location.href = '/student.html';
      return;
    }
    if (data.type === 'platform-trace-new-round') {
      beginPlatformTraceNewRound(data).catch(() => {});
      return;
    }
    // Mid-level advance / replay: chips are post-session only
    if (data.type === 'platform-level-continue' || data.type === 'platform-path-chips-clear') {
      clearPathChips();
      return;
    }
    if (data.type === 'craft-settle') {
      craftSettleOpen = !!data.open;
      // Closing a non-terminal settle must not leave sticky chips
      if (!data.open && (data.final === false || data.interim === true)) {
        clearPathChips();
      } else {
        applyPathChipVisibility();
      }
    }
  });

  function noteInteraction(type, payload) {
    if (type === 'win' || type === 'explore_success' || type === 'action' || type === 'tuning' || type === 'snapshot') {
      sawInteraction = true;
      if (idleHintEl) idleHintEl.hidden = true;
    }
    if (type === 'explore_success') sawExploreSuccess = true;
    if (currentPhase !== 'challenge' && (type === 'action' || type === 'tuning' || type === 'snapshot')) {
      exploreActionCount += 1;
    }
    if (type === 'win' || type === 'attempts_exhausted'
        || (type === 'snapshot' && payload && payload.attemptsExhausted)) {
      bumpTerminalLocalCount();
    }
    if (type === 'win' && showPathType) {
      if (isInterimWin(payload)) {
        clearPathChips();
        return;
      }
      const pkgGuess = (item.graphId || item.playUrl || '').match(/packages\/([^/]+)/)?.[1]
        || item.graphId
        || null;
      const sid = PlatformTraceAdapter.getSessionId?.() || traceSessionId;
      const fetchGen = ++pathChipFetchGen;
      // Prefer real session events; fall back to synthetic demo only if session score fails
      fetch('/api/platform/strategy-path-summary', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sessionId: sid,
          graphId: item.graphId,
          packageId: pkgGuess,
          mode: currentPhase === 'challenge' ? 'compete' : 'explore',
          // 提示偏好；服务端仍按 phase_change 过滤事件，不单信 mode
          phaseScope: currentPhase === 'challenge' ? 'challenge' : undefined,
          showScore: false,
          audience: 'student',
        }),
      })
        .then(r => r.json())
        .then(data => {
          if (fetchGen !== pathChipFetchGen || !showPathType || !pathChip) return;
          if (data.ok && data.summary?.text) {
            pathChip.textContent = data.summary.text;
            pathChipWantVisible = true;
            if (adviceChip && data.summary.advice) {
              adviceChip.textContent = '建议：' + data.summary.advice;
              adviceChipWantVisible = true;
            } else {
              adviceChipWantVisible = false;
            }
            applyPathChipVisibility();
            return;
          }
          return fetch('/api/demo/strategy-path-summary', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              packageId: pkgGuess || 'capacitor-confound-ui',
              showScore: false,
              audience: 'student',
            }),
          }).then(r => r.json()).then(demo => {
            if (fetchGen !== pathChipFetchGen || !showPathType || !pathChip) return;
            if (demo.ok && demo.summary?.text) {
              pathChip.textContent = demo.summary.text + ' · 演示';
              pathChipWantVisible = true;
              if (adviceChip && demo.summary.advice) {
                adviceChip.textContent = '建议：' + demo.summary.advice;
                adviceChipWantVisible = true;
              } else {
                adviceChipWantVisible = false;
              }
              applyPathChipVisibility();
            }
          });
        })
        .catch(() => {});
    }
  }

  function notePhaseFromGame(phase) {
    const next = phase === 'challenge' ? 'challenge' : 'explore';
    if (next === 'challenge' && currentPhase !== 'challenge') {
      maybeWarnChallengeGate();
    }
    currentPhase = next;
    document.body.dataset.playPhase = currentPhase;
    PlatformTraceAdapter.setPhase(currentPhase);
  }

  // Default explore until game modeSelect syncs
  PlatformTraceAdapter.setPhase('explore');
  document.body.dataset.playPhase = 'explore';

  const shellOrigRecord = PlatformTraceAdapter.record.bind(PlatformTraceAdapter);
  PlatformTraceAdapter.record = (type, payload) => {
    noteInteraction(type, payload);
    if (type === 'phase_change' && payload?.phase) {
      const next = payload.phase === 'challenge' ? 'challenge' : 'explore';
      if (next === 'challenge' && currentPhase !== 'challenge') maybeWarnChallengeGate();
      currentPhase = next;
      document.body.dataset.playPhase = currentPhase;
    }
    return shellOrigRecord(type, payload);
  };

  window.PlatformTraceOnFlush = (data) => {
    const ready = window.__gameTraceReady ? '轨迹采集中 · ' : '';
    const phaseLabel = currentPhase === 'challenge' ? '竞赛' : '探究';
    statusEl.textContent = `${ready}${phaseLabel} · 操作已记录 · ${data.eventCount || '—'} 条`;
  };

  function gateShellIdleHint(doc) {
    if (!doc) return;
    const hasNative = doc.querySelector('.top-hint, .observe-msg, #observeMsg, [class*="op-hint"], #modeSelect')
      || /调节参数|点击.*发射|点击.*测试/.test((doc.body?.innerText || '').slice(0, 800));
    if (hasNative) {
      clearTimeout(idleHintTimer);
      if (idleHintEl) idleHintEl.hidden = true;
    }
  }

  function injectGameTrace() {
    if (item.description && idleHintEl) {
      idleHintEl.title = item.description;
    }
    try {
      const doc = frame.contentDocument;
      if (!doc) {
        statusEl.textContent = '无法注入轨迹采集（iframe 不可访问）';
        return;
      }
      gateShellIdleHint(doc);
      if (frame.contentWindow?.__gameTraceInjected) return;
      const script = doc.createElement('script');
      script.src = '/static/ui/trace-adapter-platform.js';
      script.onload = () => {
        frame.contentWindow.__gameTraceInjected = true;
        const childAdapter = frame.contentWindow.PlatformTraceAdapter;
        const childRecord = childAdapter.record.bind(childAdapter);
        childAdapter.record = (type, payload) => {
          noteInteraction(type, payload);
          return childRecord(type, payload);
        };
        frame.contentWindow.__platformTraceSetPhase = (phase) => {
          notePhaseFromGame(phase);
        };
        childAdapter.setPhase = (phase) => notePhaseFromGame(phase);
        childAdapter.start({
          ...traceCfg,
          sessionId: PlatformTraceAdapter.getSessionId() || traceSessionId,
          skipPuzzleOpen: true,
        }).then(() => {
          window.__gameTraceReady = true;
          statusEl.textContent = '轨迹采集中 · 操作已记录 · 1 条';
          // Ask game to sync its current modeSelect if present
          try {
            const sel = doc.getElementById('modeSelect');
            if (sel) notePhaseFromGame(sel.value);
          } catch { /* ignore */ }
        });
      };
      script.onerror = () => {
        statusEl.textContent = '无法加载轨迹采集脚本';
      };
      (doc.head || doc.documentElement).appendChild(script);
    } catch {
      statusEl.textContent = '无法注入轨迹采集（跨域限制）';
    }
  }

  const enterOverlay = document.getElementById('playEnterOverlay');
  function dismissEnterOverlay() {
    if (!enterOverlay || enterOverlay.dataset.done) return;
    enterOverlay.dataset.done = '1';
    enterOverlay.classList.add('is-done');
    setTimeout(() => enterOverlay.remove(), 380);
  }

  frame.addEventListener('load', () => {
    injectGameTrace();
    dismissEnterOverlay();
  });
  frame.src = item.playUrl;
  maybeWarnSoftTerminalLimit();
  if (frame.contentDocument?.readyState === 'complete') {
    injectGameTrace();
    dismissEnterOverlay();
  }
  // Failsafe: never leave overlay stuck over iframe
  setTimeout(dismissEnterOverlay, 1200);

  document.getElementById('exportTraceBtn')?.addEventListener('click', () => {
    const iframeAdapter = frame.contentWindow?.PlatformTraceAdapter;
    const meta = iframeAdapter?.exportSessionJson?.() || {};
    const blob = new Blob([JSON.stringify(meta, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `trace-${catalogId}-${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    statusEl.textContent = '已导出会话信息（完整轨迹已由平台自动记录，教师可在学情中心查看）';
  });

  document.querySelector('a.play-fab-item[href="/student.html"]')?.addEventListener('click', () => {
    requestAutoJudgeOnLeave();
  });

  setFabMenuOpen(false);
  window.addEventListener('pagehide', () => requestAutoJudgeOnLeave());
  window.addEventListener('beforeunload', () => {
    clearTimeout(idleHintTimer);
    requestAutoJudgeOnLeave();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') requestAutoJudgeOnLeave();
  });
}

boot();
</script>
</body>
</html>
